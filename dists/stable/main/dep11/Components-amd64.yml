Releases:
  - version: "1.0.3-6"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>Fixed the CPU temperature in the build panel, which could show a fixed board value instead of the processor. The CPU sensor (k10temp on AMD, coretemp on Intel) is now always preferred over the board's ACPI zone.</p>"
      de: "<p>Die CPU-Temperatur im Build-Panel wurde korrigiert; sie konnte einen festen Wert des Mainboards statt des Prozessors anzeigen. Der CPU-Sensor (k10temp bei AMD, coretemp bei Intel) wird jetzt immer der ACPI-Zone des Mainboards vorgezogen.</p>"
      es: "<p>Corregida la temperatura de la CPU en el panel de compilación, que podía mostrar un valor fijo de la placa en lugar del procesador. Ahora se prefiere siempre el sensor de la CPU (k10temp en AMD, coretemp en Intel) a la zona ACPI de la placa.</p>"
      fr: "<p>Correction de la température du processeur dans le panneau de compilation, qui pouvait afficher une valeur fixe de la carte mère au lieu du processeur. Le capteur du processeur (k10temp sur AMD, coretemp sur Intel) est désormais toujours préféré à la zone ACPI de la carte.</p>"
      it: "<p>Corretta la temperatura della CPU nel pannello di compilazione, che poteva mostrare un valore fisso della scheda madre invece del processore. Il sensore della CPU (k10temp su AMD, coretemp su Intel) è ora sempre preferito alla zona ACPI della scheda.</p>"
      pt: "<p>Corrigida a temperatura do processador no painel de compilação, que podia mostrar um valor fixo da placa em vez do processador. O sensor do processador (k10temp em AMD, coretemp em Intel) passa a ser sempre preferido à zona ACPI da placa.</p>"
      ro: "<p>Corectată temperatura procesorului din panoul de compilare, care putea afișa o valoare fixă a plăcii de bază în locul procesorului. Senzorul procesorului (k10temp pe AMD, coretemp pe Intel) este acum preferat întotdeauna zonei ACPI a plăcii.</p>"
      ru: "<p>Исправлена температура процессора на панели сборки: вместо процессора она могла показывать фиксированное значение материнской платы. Теперь датчик процессора (k10temp на AMD, coretemp на Intel) всегда предпочитается ACPI-зоне платы.</p>"
  - version: "1.0.3-5"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>Every kernel now has Binder for Waydroid: a kernel without it stops the build. The C driver is used while the kernel has it, and the Rust driver once it is removed upstream, so the Rust toolchain is now a build dependency. The X3D VCache patch uses the new files for 6.12 and 7.2, with fixed CCD load counters.</p>"
      de: "<p>Jeder Kernel hat jetzt Binder für Waydroid: Ein Kernel ohne ihn stoppt den Build. Der C-Treiber wird verwendet, solange der Kernel ihn hat, danach der Rust-Treiber, wenn er upstream entfernt wird; die Rust-Toolchain ist daher jetzt eine Build-Abhängigkeit. Der X3D-VCache-Patch nutzt die neuen Dateien für 6.12 und 7.2 mit korrigierten CCD-Lastzählern.</p>"
      es: "<p>Todos los kernels llevan ahora Binder para Waydroid: un kernel sin él detiene la compilación. Se usa el driver en C mientras el kernel lo tenga y el de Rust cuando se retire en upstream, así que el toolchain de Rust pasa a ser una dependencia de compilación. El parche X3D VCache usa los nuevos archivos para 6.12 y 7.2, con los contadores de carga de los CCD corregidos.</p>"
      fr: "<p>Tous les noyaux ont désormais Binder pour Waydroid : un noyau sans lui arrête la compilation. Le pilote en C est utilisé tant que le noyau l'a, puis celui en Rust quand il est retiré en amont ; la chaîne d'outils Rust devient donc une dépendance de compilation. Le correctif X3D VCache utilise les nouveaux fichiers pour 6.12 et 7.2, avec les compteurs de charge des CCD corrigés.</p>"
      it: "<p>Ogni kernel ora ha Binder per Waydroid: un kernel senza di esso ferma la compilazione. Si usa il driver in C finché il kernel lo ha e quello in Rust quando viene rimosso upstream, quindi la toolchain Rust diventa una dipendenza di compilazione. La patch X3D VCache usa i nuovi file per 6.12 e 7.2, con i contatori di carico dei CCD corretti.</p>"
      pt: "<p>Todos os kernels têm agora Binder para o Waydroid: um kernel sem ele pára a compilação. Usa-se o driver em C enquanto o kernel o tiver e o de Rust quando for retirado upstream, pelo que o toolchain de Rust passa a ser uma dependência de compilação. O patch X3D VCache usa os novos ficheiros para 6.12 e 7.2, com os contadores de carga dos CCD corrigidos.</p>"
      ro: "<p>Fiecare kernel are acum Binder pentru Waydroid: un kernel fără el oprește compilarea. Se folosește driverul în C cât timp kernelul îl are și cel în Rust după ce este eliminat upstream, așa că toolchain-ul Rust devine o dependență de compilare. Patch-ul X3D VCache folosește noile fișiere pentru 6.12 și 7.2, cu contoarele de încărcare ale CCD-urilor corectate.</p>"
      ru: "<p>Теперь каждое ядро содержит Binder для Waydroid: ядро без него останавливает сборку. Используется драйвер на C, пока он есть в ядре, а после его удаления в upstream — драйвер на Rust, поэтому инструментарий Rust стал зависимостью сборки. Патч X3D VCache использует новые файлы для 6.12 и 7.2 с исправленными счётчиками нагрузки CCD.</p>"
  - version: "1.0.3-4"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>A kernel is no longer built without a selected patch: a missing BORE, Zen or X3D patch, or a scheduler left disabled, now stops the build. Kernels built without a Secure Boot key no longer taint the kernel on module load. Removing a kernel no longer runs apt autoremove, every grubx64.efi is signed, and BORE comes from Soplos' own patches first.</p>"
      de: "<p>Ein Kernel wird nicht mehr ohne einen ausgewählten Patch gebaut: Fehlt der BORE-, Zen- oder X3D-Patch oder bleibt der Scheduler deaktiviert, stoppt der Build. Ohne Secure-Boot-Schlüssel gebaute Kernel markieren den Kernel beim Laden von Modulen nicht mehr als verunreinigt. Das Entfernen eines Kernels führt kein apt autoremove mehr aus, alle grubx64.efi werden signiert und BORE kommt zuerst aus den eigenen Soplos-Patches.</p>"
      es: "<p>Ya no se compila un kernel sin un parche seleccionado: si falta el parche BORE, Zen o X3D, o el planificador queda desactivado, la compilación se detiene. Los kernels compilados sin clave de Secure Boot ya no marcan el kernel como contaminado al cargar módulos. Quitar un kernel ya no ejecuta apt autoremove, se firman todos los grubx64.efi y BORE se descarga primero de los parches propios de Soplos.</p>"
      fr: "<p>Un noyau n'est plus compilé sans un correctif sélectionné : s'il manque le correctif BORE, Zen ou X3D, ou si l'ordonnanceur reste désactivé, la compilation s'arrête. Les noyaux compilés sans clé Secure Boot ne marquent plus le noyau comme corrompu au chargement des modules. Supprimer un noyau n'exécute plus apt autoremove, tous les grubx64.efi sont signés et BORE vient d'abord des correctifs de Soplos.</p>"
      it: "<p>Un kernel non viene più compilato senza una patch selezionata: se manca la patch BORE, Zen o X3D, o lo scheduler resta disattivato, la compilazione si ferma. I kernel compilati senza chiave Secure Boot non contaminano più il kernel al caricamento dei moduli. Rimuovere un kernel non esegue più apt autoremove, tutti i grubx64.efi vengono firmati e BORE arriva prima dalle patch di Soplos.</p>"
      pt: "<p>Um kernel já não é compilado sem um patch selecionado: se faltar o patch BORE, Zen ou X3D, ou o escalonador ficar desativado, a compilação pára. Os kernels compilados sem chave de Secure Boot já não marcam o kernel como contaminado ao carregar módulos. Remover um kernel já não executa apt autoremove, todos os grubx64.efi são assinados e o BORE vem primeiro dos patches da Soplos.</p>"
      ro: "<p>Un kernel nu mai este compilat fără un patch selectat: dacă lipsește patch-ul BORE, Zen sau X3D, ori planificatorul rămâne dezactivat, compilarea se oprește. Kernelurile compilate fără cheie Secure Boot nu mai marchează kernelul ca afectat la încărcarea modulelor. Eliminarea unui kernel nu mai rulează apt autoremove, toate fișierele grubx64.efi sunt semnate, iar BORE vine mai întâi din patch-urile Soplos.</p>"
      ru: "<p>Ядро больше не собирается без выбранного патча: если нет патча BORE, Zen или X3D либо планировщик остаётся отключён, сборка останавливается. Ядра, собранные без ключа Secure Boot, больше не помечают ядро как испорченное при загрузке модулей. Удаление ядра больше не запускает apt autoremove, подписываются все grubx64.efi, а BORE сначала берётся из собственных патчей Soplos.</p>"
  - version: "1.0.3-3"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>Fixed a build that started without its dependencies: the installer ignored a failed dependency check, so a missing libelf-dev only showed up deep in the compilation. It now stops with a message, reinstalls libelf-dev when it lacks gelf.h, and a failing apt-get update no longer stops the install of the missing packages.</p>"
      de: "<p>Behoben: Ein Build startete ohne seine Abhängigkeiten. Der Installer ignorierte eine fehlgeschlagene Abhängigkeitsprüfung, sodass ein fehlendes libelf-dev erst mitten in der Kompilierung auffiel. Er stoppt jetzt mit einer Meldung, installiert libelf-dev neu, wenn gelf.h fehlt, und ein fehlgeschlagenes apt-get update verhindert die Installation der fehlenden Pakete nicht mehr.</p>"
      es: "<p>Corregida una compilación que empezaba sin sus dependencias: el instalador ignoraba que la comprobación de dependencias fallara, así que la falta de libelf-dev solo se veía a mitad de la compilación. Ahora se detiene con un mensaje, reinstala libelf-dev cuando le falta gelf.h, y un apt-get update que falle ya no impide instalar los paquetes que faltan.</p>"
      fr: "<p>Correction d'une compilation qui démarrait sans ses dépendances : l'installateur ignorait l'échec de la vérification des dépendances, si bien que l'absence de libelf-dev n'apparaissait qu'en pleine compilation. Il s'arrête maintenant avec un message, réinstalle libelf-dev quand gelf.h lui manque, et un apt-get update qui échoue n'empêche plus d'installer les paquets manquants.</p>"
      it: "<p>Corretta una compilazione che partiva senza le sue dipendenze: l'installer ignorava il fallimento del controllo delle dipendenze, quindi la mancanza di libelf-dev emergeva solo a metà compilazione. Ora si ferma con un messaggio, reinstalla libelf-dev quando manca gelf.h, e un apt-get update che fallisce non impedisce più l'installazione dei pacchetti mancanti.</p>"
      pt: "<p>Corrigida uma compilação que começava sem as suas dependências: o instalador ignorava a falha da verificação de dependências, pelo que a falta do libelf-dev só se via a meio da compilação. Agora pára com uma mensagem, reinstala o libelf-dev quando lhe falta o gelf.h, e um apt-get update que falhe já não impede a instalação dos pacotes em falta.</p>"
      ro: "<p>Corectată o compilare care pornea fără dependențele ei: instalatorul ignora eșecul verificării dependențelor, așa că lipsa libelf-dev apărea abia în mijlocul compilării. Acum se oprește cu un mesaj, reinstalează libelf-dev când îi lipsește gelf.h, iar un apt-get update care eșuează nu mai împiedică instalarea pachetelor lipsă.</p>"
      ru: "<p>Исправлена сборка, которая начиналась без нужных зависимостей: установщик игнорировал сбой проверки зависимостей, и нехватка libelf-dev обнаруживалась лишь посреди компиляции. Теперь он останавливается с сообщением, переустанавливает libelf-dev, если нет gelf.h, а неудачный apt-get update больше не мешает установить недостающие пакеты.</p>"
  - version: "1.0.3-2"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>Added the NVIDIA DKMS patches for kernels 7.2+: Fix 6 for the Debian 550 driver and Fix 7 for the 590 open modules. They are applied to the installed NVIDIA sources before a kernel is installed or updated.</p>"
      de: "<p>NVIDIA-DKMS-Patches für Kernel 7.2+ hinzugefügt: Fix 6 für den Debian-Treiber 550 und Fix 7 für die offenen 590-Module. Sie werden auf die installierten NVIDIA-Quellen angewendet, bevor ein Kernel installiert oder aktualisiert wird.</p>"
      es: "<p>Añadidos los parches NVIDIA DKMS para kernels 7.2+: Fix 6 para el driver 550 de Debian y Fix 7 para los módulos abiertos 590. Se aplican a las fuentes NVIDIA instaladas antes de instalar o actualizar un kernel.</p>"
      fr: "<p>Ajout des correctifs NVIDIA DKMS pour les noyaux 7.2+ : Fix 6 pour le pilote 550 de Debian et Fix 7 pour les modules ouverts 590. Ils sont appliqués aux sources NVIDIA installées avant l'installation ou la mise à jour d'un noyau.</p>"
      it: "<p>Aggiunte le patch NVIDIA DKMS per i kernel 7.2+: Fix 6 per il driver 550 di Debian e Fix 7 per i moduli aperti 590. Vengono applicate ai sorgenti NVIDIA installati prima di installare o aggiornare un kernel.</p>"
      pt: "<p>Adicionados os patches NVIDIA DKMS para kernels 7.2+: Fix 6 para o driver 550 do Debian e Fix 7 para os módulos abertos 590. São aplicados às fontes NVIDIA instaladas antes de instalar ou atualizar um kernel.</p>"
      ro: "<p>Au fost adăugate patch-urile NVIDIA DKMS pentru kernel 7.2+: Fix 6 pentru driverul 550 din Debian și Fix 7 pentru modulele deschise 590. Sunt aplicate surselor NVIDIA instalate înainte de instalarea sau actualizarea unui kernel.</p>"
      ru: "<p>Добавлены патчи NVIDIA DKMS для ядер 7.2+: Fix 6 для драйвера 550 из Debian и Fix 7 для открытых модулей 590. Они применяются к установленным исходным кодам NVIDIA перед установкой или обновлением ядра.</p>"
  - version: "1.0.3-1"
    type: stable
    unix-timestamp: 1792540800
    description:
      C: "<p>Fixed the NVIDIA DKMS patch for the dmem cgroup API change in Linux 7.3+ (Fix 5): a wrong hunk header made patch reject it, so it was never applied. NVIDIA 610 modules now build on Linux 7.3.</p>"
      de: "<p>NVIDIA-DKMS-Patch für die dmem-cgroup-API-Änderung in Linux 7.3+ korrigiert (Fix 5): Ein falscher Hunk-Header führte dazu, dass patch ihn ablehnte und er nie angewendet wurde. NVIDIA-610-Module lassen sich nun unter Linux 7.3 kompilieren.</p>"
      es: "<p>Corregido el parche NVIDIA DKMS para el cambio de API de dmem cgroup en Linux 7.3+ (Fix 5): una cabecera de bloque incorrecta hacía que patch lo rechazara y nunca se aplicaba. Los módulos NVIDIA 610 ya compilan en Linux 7.3.</p>"
      fr: "<p>Correction du patch NVIDIA DKMS pour le changement d'API dmem cgroup de Linux 7.3+ (Fix 5) : un en-tête de bloc incorrect faisait rejeter le patch par patch, qui n'était donc jamais appliqué. Les modules NVIDIA 610 se compilent désormais sous Linux 7.3.</p>"
      it: "<p>Corretta la patch NVIDIA DKMS per la modifica dell'API dmem cgroup in Linux 7.3+ (Fix 5): un'intestazione di blocco errata faceva rifiutare la patch, che non veniva mai applicata. I moduli NVIDIA 610 ora si compilano su Linux 7.3.</p>"
      pt: "<p>Corrigido o patch NVIDIA DKMS para a alteração da API dmem cgroup no Linux 7.3+ (Fix 5): um cabeçalho de bloco incorreto fazia o patch ser rejeitado e nunca era aplicado. Os módulos NVIDIA 610 já compilam no Linux 7.3.</p>"
      ro: "<p>S-a corectat patch-ul NVIDIA DKMS pentru modificarea API-ului dmem cgroup din Linux 7.3+ (Fix 5): un antet de bloc greșit făcea ca patch să îl respingă, deci nu era aplicat niciodată. Modulele NVIDIA 610 se compilează acum pe Linux 7.3.</p>"
      ru: "<p>Исправлен патч NVIDIA DKMS для изменения API dmem cgroup в Linux 7.3+ (Fix 5): неверный заголовок блока приводил к тому, что patch отклонял его, и он никогда не применялся. Модули NVIDIA 610 теперь собираются в Linux 7.3.</p>"
  - version: "1.0.3"
    type: stable
    unix-timestamp: 1792454400
    description:
      C: "<p>Added NVIDIA DKMS compatibility patch for Linux 7.3+ (Fix 5: dmem_cgroup_register_region API change in os-interface.c).</p>"
      de: "<p>NVIDIA DKMS-Kompatibilitätspatch für Linux 7.3+ hinzugefügt (Fix 5: dmem_cgroup_register_region API-Änderung in os-interface.c).</p>"
      es: "<p>Añadido parche de compatibilidad NVIDIA DKMS para Linux 7.3+ (Fix 5: cambio de API en dmem_cgroup_register_region en os-interface.c).</p>"
      fr: "<p>Ajout du patch de compatibilité NVIDIA DKMS pour Linux 7.3+ (Fix 5 : changement d'API dmem_cgroup_register_region dans os-interface.c).</p>"
      it: "<p>Aggiunta patch di compatibilità NVIDIA DKMS per Linux 7.3+ (Fix 5: modifica dell'API dmem_cgroup_register_region in os-interface.c).</p>"
      pt: "<p>Adicionado patch de compatibilidade NVIDIA DKMS para Linux 7.3+ (Fix 5: alteração da API dmem_cgroup_register_region em os-interface.c).</p>"
      ro: "<p>S-a adăugat patch-ul de compatibilitate NVIDIA DKMS pentru Linux 7.3+ (Fix 5: modificare API dmem_cgroup_register_region în os-interface.c).</p>"
      ru: "<p>Добавлен патч совместимости NVIDIA DKMS для Linux 7.3+ (Fix 5: изменение API dmem_cgroup_register_region в os-interface.c).</p>"
  - version: "1.0.2-9"
    type: stable
    unix-timestamp: 1791072000
    description:
      C: "<p>Added support for Linux 7.2.9 Zen patch (0001-zen-7.2.9.patch) in _download_zen_soplos(), checking exact kernel version patches before falling back to major_minor line patches.</p>"
      de: "<p>Unterstuetzung fuer den Linux 7.2.9 Zen-Patch (0001-zen-7.2.9.patch) in _download_zen_soplos() hinzugefuegt, wobei exakte Kernelversionen vor dem Fallback auf major_minor-Patches geprueft werden.</p>"
      es: "<p>Anadido soporte para el parche Zen de Linux 7.2.9 (0001-zen-7.2.9.patch) en _download_zen_soplos(), comprobando parches por version exacta de kernel antes de recurrir a parches por linea major_minor.</p>"
      fr: "<p>Ajout du support pour le patch Zen Linux 7.2.9 (0001-zen-7.2.9.patch) dans _download_zen_soplos(), en verifiant les patchs par version exacte avant de basculer sur les patchs de ligne major_minor.</p>"
      it: "<p>Aggiunto il supporto per la patch Zen di Linux 7.2.9 (0001-zen-7.2.9.patch) in _download_zen_soplos(), verificando le patch per versione esatta prima di ricorrere a quelle di linea major_minor.</p>"
      pt: "<p>Adicionado suporte para o patch Zen do Linux 7.2.9 (0001-zen-7.2.9.patch) em _download_zen_soplos(), verificando patches por versao exata antes de recorrer a patches de linha major_minor.</p>"
      ro: "<p>S-a adaugat suport pentru patch-ul Zen Linux 7.2.9 (0001-zen-7.2.9.patch) in _download_zen_soplos(), verificand mai intai patch-urile pentru versiunea exacta.</p>"
      ru: "<p>Добавлена поддержка патча Zen для Linux 7.2.9 (0001-zen-7.2.9.patch) в _download_zen_soplos() с проверкой точных версий ядер перед переходом на патчи линейки major_minor.</p>"
  - version: "1.0.2-8"
    type: stable
    unix-timestamp: 1790985600
    description:
      C: "<p>Zen patch source priority was backwards: the installer tried zen-kernel/zen-kernel's own upstream releases first and only fell back to the Soplos-maintained zen-soplos rebase if no matching release existed. Kernel 7.2.9 V3/V4 builds failed because the official zen-kernel release for that version carries its own march mechanism in arch/x86/Makefile, which conflicts with Soplos' own x86-64 ISA-level patch applied afterward. zen-soplos is now tried first; zen-kernel/zen-kernel is only a fallback when zen-soplos has no patch for the line yet or it doesn't apply.</p>"
      de: "<p>Die Prioritaet der Zen-Patch-Quellen war umgekehrt: der Installer versuchte zuerst die offiziellen Veroeffentlichungen von zen-kernel/zen-kernel und griff nur dann auf den von Soplos gepflegten zen-soplos-Rebase zurueck, wenn keine passende Version existierte. Builds von Kernel 7.2.9 V3/V4 schlugen fehl, weil die offizielle zen-kernel-Veroeffentlichung fuer diese Version einen eigenen march-Mechanismus in arch/x86/Makefile enthaelt, der mit Soplos' eigenem x86-64-ISA-Level-Patch kollidiert, der danach angewendet wird. zen-soplos wird jetzt zuerst versucht; zen-kernel/zen-kernel dient nur als Fallback, wenn zen-soplos keinen Patch fuer diese Linie hat oder er nicht anwendbar ist.</p>"
      es: "<p>La prioridad de fuentes del parche Zen estaba invertida: el instalador probaba primero las publicaciones de zen-kernel/zen-kernel y solo recurria al rebase zen-soplos mantenido por Soplos si no existia una version que coincidiera. Los builds V3/V4 del kernel 7.2.9 fallaban porque la publicacion oficial de zen-kernel para esa version incluye su propio mecanismo de march en arch/x86/Makefile, que entra en conflicto con el parche de nivel ISA x86-64 de Soplos aplicado despues. Ahora se prueba primero zen-soplos; zen-kernel/zen-kernel solo se usa como respaldo si zen-soplos no tiene parche para esa linea o no aplica.</p>"
      fr: "<p>La priorite des sources du patch Zen etait inversee : l'installateur essayait d'abord les versions officielles de zen-kernel/zen-kernel et ne recourait au rebase zen-soplos maintenu par Soplos que si aucune version correspondante n'existait. Les builds V3/V4 du noyau 7.2.9 echouaient car la version officielle de zen-kernel pour cette version comporte son propre mecanisme de march dans arch/x86/Makefile, qui entre en conflit avec le patch de niveau ISA x86-64 de Soplos applique ensuite. zen-soplos est desormais essaye en premier ; zen-kernel/zen-kernel n'est utilise qu'en secours si zen-soplos n'a pas de patch pour cette ligne ou s'il ne s'applique pas.</p>"
      it: "<p>La priorita delle fonti della patch Zen era invertita: l'installer provava prima le release ufficiali di zen-kernel/zen-kernel e ricorreva al rebase zen-soplos mantenuto da Soplos solo se non esisteva una release corrispondente. Le build V3/V4 del kernel 7.2.9 fallivano perche la release ufficiale di zen-kernel per quella versione include un proprio meccanismo di march in arch/x86/Makefile, che entra in conflitto con la patch del livello ISA x86-64 di Soplos applicata successivamente. Ora si prova prima zen-soplos; zen-kernel/zen-kernel viene usato solo come ripiego se zen-soplos non ha una patch per quella linea o non si applica.</p>"
      pt: "<p>A prioridade das fontes do patch Zen estava invertida: o instalador tentava primeiro as versoes oficiais do zen-kernel/zen-kernel e so recorria ao rebase zen-soplos mantido pela Soplos se nao existisse uma versao correspondente. As compilacoes V3/V4 do kernel 7.2.9 falhavam porque a versao oficial do zen-kernel para essa versao inclui o seu proprio mecanismo de march em arch/x86/Makefile, que entra em conflito com o patch de nivel ISA x86-64 da Soplos aplicado depois. Agora tenta-se primeiro o zen-soplos; o zen-kernel/zen-kernel so e usado como alternativa se o zen-soplos nao tiver patch para essa linha ou nao se aplicar.</p>"
      ro: "<p>Prioritatea surselor pentru patch-ul Zen era inversata: instalatorul incerca mai intai versiunile oficiale de pe zen-kernel/zen-kernel si recurgea la rebase-ul zen-soplos intretinut de Soplos doar daca nu exista o versiune corespunzatoare. Build-urile V3/V4 ale kernelului 7.2.9 esuau deoarece versiunea oficiala zen-kernel pentru acea versiune include propriul mecanism de march in arch/x86/Makefile, care intra in conflict cu patch-ul de nivel ISA x86-64 al Soplos aplicat ulterior. Acum se incearca mai intai zen-soplos; zen-kernel/zen-kernel este folosit doar ca rezerva daca zen-soplos nu are patch pentru acea linie sau nu se aplica.</p>"
      ru: "<p>Приоритет источников патча Zen был перепутан: установщик сначала пробовал официальные релизы zen-kernel/zen-kernel и обращался к поддерживаемому Soplos форку zen-soplos только если подходящего релиза не было. Сборки ядра 7.2.9 V3/V4 завершались ошибкой, потому что официальный релиз zen-kernel для этой версии содержит собственный механизм march в arch/x86/Makefile, конфликтующий с патчем уровня ISA x86-64 от Soplos, применяемым позже. Теперь сначала пробуется zen-soplos; zen-kernel/zen-kernel используется только как резерв, если у zen-soplos нет патча для этой линейки или он не применяется.</p>"
  - version: "1.0.2-7"
    type: stable
    unix-timestamp: 1789862400
    description:
      C: "<p>RT kernels shipped without the Intel graphics driver because mainline marks i915 as depending on !PREEMPT_RT, so any machine with an Intel iGPU booted to a black screen. RT builds now always apply the Soplos rt-i915 patch and stop if the driver is missing instead of producing a kernel that cannot boot on Intel.</p><ul><li>RT builds now always download and apply the patch from SoplosLinux/rt-i915-soplos, checked with a dry-run apply first. The old third-party rt-i915 download, which only ran when the build machine had an Intel GPU, was removed</li><li>After olddefconfig, an RT build aborts if DRM_I915 did not survive. Only a 7.2 patch exists so far, so RT builds of other kernel lines stop there until a patch for that line is added; the patch is compile-tested but not boot-tested yet</li></ul>"
      de: "<p>RT-Kernel wurden ohne den Intel-Grafiktreiber veroeffentlicht, weil Mainline i915 als von !PREEMPT_RT abhaengig markiert, sodass jeder Rechner mit Intel-iGPU mit schwarzem Bildschirm startete. RT-Builds wenden jetzt immer den Soplos-Patch rt-i915 an und brechen ab, wenn der Treiber fehlt, statt einen Kernel zu erzeugen, der auf Intel nicht startet.</p><ul><li>RT-Builds laden und wenden jetzt immer den Patch aus SoplosLinux/rt-i915-soplos an, zuvor per Probelauf geprueft. Der fruehere Download eines Drittanbieter-Patches, der nur lief, wenn der Build-Rechner eine Intel-GPU hatte, wurde entfernt</li><li>Nach olddefconfig bricht ein RT-Build ab, wenn DRM_I915 nicht erhalten geblieben ist. Bisher gibt es nur einen Patch fuer 7.2, daher stoppen RT-Builds anderer Kernel-Linien dort, bis ein Patch fuer diese Linie existiert; der Patch ist kompiliert, aber noch nicht im Boot getestet</li></ul>"
      es: "<p>Los kernels RT se publicaban sin el driver grafico de Intel porque mainline marca i915 como dependiente de !PREEMPT_RT, asi que cualquier equipo con iGPU de Intel arrancaba a pantalla negra. Ahora los builds RT aplican siempre el parche rt-i915 de Soplos y se detienen si falta el driver, en vez de generar un kernel que no arranca en Intel.</p><ul><li>Los builds RT descargan y aplican ahora siempre el parche de SoplosLinux/rt-i915-soplos, comprobado antes con una aplicacion en seco. Se elimino la descarga anterior de un parche de terceros, que solo se ejecutaba si la maquina de compilacion tenia GPU Intel</li><li>Tras olddefconfig, un build RT se aborta si DRM_I915 no ha sobrevivido. Por ahora solo existe un parche para 7.2, asi que los builds RT de otras lineas de kernel se detienen ahi hasta que exista uno para esa linea; el parche esta compilado pero aun no probado en arranque</li></ul>"
      fr: "<p>Les noyaux RT etaient publies sans le pilote graphique Intel car mainline marque i915 comme dependant de !PREEMPT_RT, si bien tout ordinateur avec un iGPU Intel demarrait sur un ecran noir. Les builds RT appliquent desormais toujours le patch rt-i915 de Soplos et s'arretent si le pilote est absent, au lieu de produire un noyau qui ne demarre pas sur Intel.</p><ul><li>Les builds RT telechargent et appliquent desormais toujours le patch de SoplosLinux/rt-i915-soplos, verifie au prealable par une application a blanc. L'ancien telechargement d'un patch tiers, qui ne s'executait que si la machine de compilation avait un GPU Intel, a ete supprime</li><li>Apres olddefconfig, un build RT s'interrompt si DRM_I915 n'a pas survecu. Il n'existe pour l'instant qu'un patch pour 7.2, donc les builds RT des autres lignes de noyau s'arretent la jusqu'a ce qu'un patch existe pour cette ligne ; le patch est compile mais pas encore teste au demarrage</li></ul>"
      it: "<p>I kernel RT venivano pubblicati senza il driver grafico Intel perche mainline segna i915 come dipendente da !PREEMPT_RT, quindi qualsiasi computer con iGPU Intel si avviava con lo schermo nero. Le build RT applicano ora sempre la patch rt-i915 di Soplos e si fermano se il driver manca, invece di produrre un kernel che non si avvia su Intel.</p><ul><li>Le build RT scaricano e applicano ora sempre la patch di SoplosLinux/rt-i915-soplos, verificata prima con un'applicazione a secco. Il vecchio download di una patch di terze parti, eseguito solo se la macchina di compilazione aveva una GPU Intel, e stato rimosso</li><li>Dopo olddefconfig, una build RT viene interrotta se DRM_I915 non e sopravvissuto. Per ora esiste solo una patch per 7.2, quindi le build RT di altre linee di kernel si fermano li finche non ne esiste una per quella linea; la patch e compilata ma non ancora testata all'avvio</li></ul>"
      pt: "<p>Os kernels RT eram publicados sem o driver grafico da Intel porque o mainline marca o i915 como dependente de !PREEMPT_RT, pelo que qualquer computador com iGPU Intel arrancava com ecra preto. As compilacoes RT aplicam agora sempre o patch rt-i915 do Soplos e param se o driver estiver em falta, em vez de gerar um kernel que nao arranca em Intel.</p><ul><li>As compilacoes RT descarregam e aplicam agora sempre o patch de SoplosLinux/rt-i915-soplos, verificado antes com uma aplicacao em seco. Foi removido o antigo download de um patch de terceiros, que so corria se a maquina de compilacao tivesse GPU Intel</li><li>Depois do olddefconfig, uma compilacao RT e abortada se o DRM_I915 nao sobreviveu. Por agora so existe um patch para 7.2, pelo que as compilacoes RT de outras linhas de kernel param ai ate existir um para essa linha; o patch esta compilado mas ainda nao testado no arranque</li></ul>"
      ro: "<p>Kernelurile RT erau publicate fara driverul grafic Intel deoarece mainline marcheaza i915 ca depinzand de !PREEMPT_RT, astfel incat orice calculator cu iGPU Intel pornea cu ecran negru. Build-urile RT aplica acum intotdeauna patch-ul rt-i915 Soplos si se opresc daca driverul lipseste, in loc sa produca un kernel care nu porneste pe Intel.</p><ul><li>Build-urile RT descarca si aplica acum intotdeauna patch-ul din SoplosLinux/rt-i915-soplos, verificat in prealabil cu o aplicare de proba. Vechea descarcare a unui patch de la terti, care rula doar daca masina de compilare avea GPU Intel, a fost eliminata</li><li>Dupa olddefconfig, un build RT se opreste daca DRM_I915 nu a supravietuit. Deocamdata exista doar un patch pentru 7.2, deci build-urile RT ale altor linii de kernel se opresc aici pana exista unul pentru acea linie; patch-ul este compilat dar inca netestat la pornire</li></ul>"
      ru: "<p>Ядра RT публиковались без графического драйвера Intel, потому что mainline помечает i915 как зависящий от !PREEMPT_RT, поэтому любой компьютер с iGPU Intel загружался с чёрным экраном. Теперь сборки RT всегда применяют патч rt-i915 от Soplos и останавливаются, если драйвера нет, вместо создания ядра, которое не загружается на Intel.</p><ul><li>Сборки RT теперь всегда загружают и применяют патч из SoplosLinux/rt-i915-soplos, предварительно проверенный пробным применением. Прежняя загрузка стороннего патча, которая выполнялась только если у машины сборки была GPU Intel, удалена</li><li>После olddefconfig сборка RT прерывается, если DRM_I915 не сохранился. Пока существует только патч для 7.2, поэтому RT-сборки других линеек ядра останавливаются здесь, пока для них не появится патч; патч скомпилирован, но ещё не проверен при загрузке</li></ul>"
  - version: "1.0.2-6"
    type: stable
    unix-timestamp: 1789344000
    description:
      C: "<p>RC, LTS and EOL kernels shared the exact same Stock package name as the regular stable line, only the kernel version differing — unsafe two ways: an RC build could silently replace a stable kernel on a plain apt upgrade, and LTS/EOL versions compare as lower than the current stable, so reprepro refused to publish them.</p><ul><li>Stock builds and the batch release queue now insert a channel marker into the package name (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) based on the selected kernel's real channel from kernel.org, so each channel gets its own package identity instead of colliding with stable</li></ul>"
      de: "<p>RC-, LTS- und EOL-Kernel teilten sich genau denselben Stock-Paketnamen wie die normale stabile Linie, nur die Kernel-Version unterschied sich — auf zwei Arten unsicher: ein RC-Build konnte einen stabilen Kernel bei einem einfachen apt upgrade stillschweigend ersetzen, und LTS/EOL-Versionen werden als niedriger als die aktuelle stabile Version verglichen, sodass reprepro sich weigerte, sie zu veroeffentlichen.</p><ul><li>Stock-Builds und die Batch-Release-Warteschlange fuegen jetzt einen Kanal-Marker in den Paketnamen ein (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1), basierend auf dem tatsaechlichen Kanal des gewaehlten Kernels von kernel.org, sodass jeder Kanal seine eigene Paketidentitaet erhaelt, statt mit stable zu kollidieren</li></ul>"
      es: "<p>Los kernels RC, LTS y EOL compartian el mismo nombre de paquete Stock que la linea estable normal, solo cambiaba la version del kernel — inseguro por dos motivos: un build RC podia sustituir en silencio un kernel estable en un simple apt upgrade, y las versiones LTS/EOL comparan como inferiores a la estable actual, asi que reprepro se negaba a publicarlas.</p><ul><li>Los builds de Stock y la cola de release por lotes ahora insertan un marcador de canal en el nombre del paquete (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) segun el canal real del kernel elegido en kernel.org, asi cada canal tiene su propia identidad de paquete en vez de chocar con el estable</li></ul>"
      fr: "<p>Les noyaux RC, LTS et EOL partageaient exactement le meme nom de paquet Stock que la ligne stable habituelle, seule la version du noyau differait — dangereux de deux facons : un build RC pouvait remplacer silencieusement un noyau stable lors d'un simple apt upgrade, et les versions LTS/EOL sont comparees comme inferieures a la version stable actuelle, donc reprepro refusait de les publier.</p><ul><li>Les builds Stock et la file de release par lots inserent desormais un marqueur de canal dans le nom du paquet (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) selon le canal reel du noyau choisi sur kernel.org, afin que chaque canal ait sa propre identite de paquet au lieu d'entrer en collision avec le stable</li></ul>"
      it: "<p>I kernel RC, LTS ed EOL condividevano lo stesso nome di pacchetto Stock della normale linea stabile, cambiava solo la versione del kernel — pericoloso in due modi: una build RC poteva sostituire silenziosamente un kernel stabile con un semplice apt upgrade, e le versioni LTS/EOL vengono confrontate come inferiori rispetto alla stabile attuale, quindi reprepro rifiutava di pubblicarle.</p><ul><li>Le build di Stock e la coda di release in batch ora inseriscono un marcatore di canale nel nome del pacchetto (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) in base al canale reale del kernel scelto su kernel.org, cosi ogni canale ha una propria identita di pacchetto invece di scontrarsi con lo stabile</li></ul>"
      pt: "<p>Os kernels RC, LTS e EOL partilhavam exatamente o mesmo nome de pacote Stock que a linha estavel normal, apenas a versao do kernel diferia — inseguro de duas formas: um build RC podia substituir silenciosamente um kernel estavel num simples apt upgrade, e as versoes LTS/EOL comparam como inferiores a estavel atual, entao o reprepro recusava-se a publica-las.</p><ul><li>Os builds do Stock e a fila de release em lote agora inserem um marcador de canal no nome do pacote (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) com base no canal real do kernel escolhido no kernel.org, para que cada canal tenha a sua propria identidade de pacote em vez de colidir com o estavel</li></ul>"
      ro: "<p>Kernelurile RC, LTS si EOL foloseau exact acelasi nume de pachet Stock ca linia stabila obisnuita, doar versiunea kernelului difera — nesigur in doua moduri: un build RC putea inlocui in tacere un kernel stabil la un simplu apt upgrade, iar versiunile LTS/EOL sunt comparate ca fiind inferioare stabilei curente, asa ca reprepro refuza sa le publice.</p><ul><li>Build-urile Stock si coada de release in lot insereaza acum un marcaj de canal in numele pachetului (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) pe baza canalului real al kernelului ales de pe kernel.org, astfel incat fiecare canal are propria identitate de pachet in loc sa se ciocneasca cu stabilul</li></ul>"
      ru: "<p>Ядра RC, LTS и EOL использовали то же самое имя пакета Stock, что и обычная стабильная линия, отличалась только версия ядра — это небезопасно по двум причинам: RC-сборка могла незаметно заменить стабильное ядро при обычном apt upgrade, а версии LTS/EOL сравниваются как более низкие, чем текущая стабильная, поэтому reprepro отказывался их публиковать.</p><ul><li>Сборки Stock и очередь пакетной сборки релиза теперь добавляют маркер канала в имя пакета (linux-soplos-rc-v1, linux-soplos-lts-v1, linux-soplos-eol-v1) на основе реального канала выбранного ядра с kernel.org, так что у каждого канала теперь своя идентичность пакета вместо конфликта со стабильной веткой</li></ul>"
  - version: "1.0.2-5"
    type: stable
    unix-timestamp: 1788998400
    description:
      C: "<p>Fixed CONFIG_ANDROID_BINDER_IPC (it is a bool, not a tristate, so it could not be built as a module) and added a revision counter to the Stock batch build so recompiling the same kernel version is seen by apt as a real upgrade.</p><ul><li>CONFIG_ANDROID_BINDER_IPC is a plain bool in drivers/android/Kconfig, not a tristate — the 1.0.2-4 attempt to build it as a module (--module) was an invalid value, silently normalized back to n by make olddefconfig. Every 7.2.4 kernel already published with that build never actually had Waydroid support. Now enabled with --enable, the only valid form, plus a post-olddefconfig check that warns instead of failing silently if it is ever dropped again</li><li>Stock batch build gained a revision counter: 0 (default) means a brand new kernel version, unchanged from before. 1, 2, 3... mean the 1st, 2nd, 3rd recompile of the same version with different patches, offset internally so entering 1 always produces a genuinely new, working package that apt/reprepro see as a real upgrade</li></ul>"
      de: "<p>CONFIG_ANDROID_BINDER_IPC korrigiert (es ist ein Bool, kein Tristate, konnte nicht als Modul kompiliert werden) und ein Revisionszaehler zum Stock-Stapelbau hinzugefuegt, damit das Neukompilieren derselben Kernel-Version von apt als echtes Upgrade erkannt wird.</p><ul><li>CONFIG_ANDROID_BINDER_IPC ist ein Bool in drivers/android/Kconfig, kein Tristate — der Versuch in 1.0.2-4, es als Modul zu kompilieren (--module), war ein ungueltiger Wert und wurde von make olddefconfig stillschweigend auf n zurueckgesetzt. Alle bereits veroeffentlichten 7.2.4-Kernel mit diesem Build hatten nie echte Waydroid-Unterstuetzung. Jetzt mit --enable aktiviert, der einzig gueltigen Form, plus eine Pruefung nach olddefconfig, die warnt statt stillschweigend zu scheitern, falls es erneut verworfen wird</li><li>Der Stock-Stapelbau erhielt einen Revisionszaehler: 0 (Standard) bedeutet eine brandneue Kernel-Version, unveraendert gegenueber vorher. 1, 2, 3... bedeuten die 1., 2., 3. Neukompilierung derselben Version mit anderen Patches, intern versetzt, sodass die Eingabe von 1 immer ein wirklich neues, funktionierendes Paket erzeugt, das apt/reprepro als echtes Upgrade erkennen</li></ul>"
      es: "<p>Corregido CONFIG_ANDROID_BINDER_IPC (es un bool, no un tristate, no se podia compilar como modulo) y anadido un contador de revision al build por lotes de Stock para que recompilar la misma version de kernel se vea por apt como una actualizacion real.</p><ul><li>CONFIG_ANDROID_BINDER_IPC es un bool en drivers/android/Kconfig, no un tristate — el intento de 1.0.2-4 de compilarlo como modulo (--module) era un valor invalido, normalizado en silencio a n por make olddefconfig. Todos los kernels 7.2.4 ya publicados con ese build nunca tuvieron soporte real de Waydroid. Ahora se activa con --enable, la unica forma valida, mas una comprobacion tras olddefconfig que avisa en vez de fallar en silencio si se cae otra vez</li><li>El build por lotes de Stock incorpora un contador de revision: 0 (por defecto) significa una version de kernel nueva, sin cambios respecto a antes. 1, 2, 3... significan la 1a, 2a, 3a recompilacion de la misma version con distintos parches, desplazado internamente para que poner 1 produzca siempre un paquete nuevo y funcional que apt/reprepro vean como una actualizacion real</li></ul>"
      fr: "<p>Correction de CONFIG_ANDROID_BINDER_IPC (c'est un bool, pas un tristate, il ne pouvait pas etre compile en module) et ajout d'un compteur de revision a la compilation par lots Stock pour que recompiler la meme version de noyau soit vue par apt comme une veritable mise a jour.</p><ul><li>CONFIG_ANDROID_BINDER_IPC est un bool dans drivers/android/Kconfig, pas un tristate — la tentative de 1.0.2-4 de le compiler en module (--module) etait une valeur invalide, normalisee silencieusement en n par make olddefconfig. Tous les noyaux 7.2.4 deja publies avec cette build n'ont jamais eu de veritable support Waydroid. Desormais active avec --enable, la seule forme valide, plus une verification apres olddefconfig qui avertit au lieu d'echouer silencieusement s'il est a nouveau abandonne</li><li>La compilation par lots Stock a gagne un compteur de revision : 0 (par defaut) signifie une nouvelle version de noyau, inchange par rapport a avant. 1, 2, 3... signifient la 1re, 2e, 3e recompilation de la meme version avec des correctifs differents, decale en interne pour qu'entrer 1 produise toujours un paquet reellement nouveau et fonctionnel que apt/reprepro voient comme une veritable mise a jour</li></ul>"
      it: "<p>Corretto CONFIG_ANDROID_BINDER_IPC (e un bool, non un tristate, non poteva essere compilato come modulo) e aggiunto un contatore di revisione alla build in batch di Stock in modo che ricompilare la stessa versione del kernel sia vista da apt come un vero aggiornamento.</p><ul><li>CONFIG_ANDROID_BINDER_IPC e un bool in drivers/android/Kconfig, non un tristate — il tentativo di 1.0.2-4 di compilarlo come modulo (--module) era un valore non valido, normalizzato silenziosamente a n da make olddefconfig. Tutti i kernel 7.2.4 gia pubblicati con quella build non hanno mai avuto un reale supporto a Waydroid. Ora abilitato con --enable, l'unica forma valida, piu un controllo dopo olddefconfig che avvisa invece di fallire silenziosamente se viene nuovamente scartato</li><li>La build in batch di Stock ha guadagnato un contatore di revisione: 0 (predefinito) significa una versione del kernel completamente nuova, invariata rispetto a prima. 1, 2, 3... significano la 1a, 2a, 3a ricompilazione della stessa versione con patch diverse, sfalsato internamente in modo che inserire 1 produca sempre un pacchetto realmente nuovo e funzionante che apt/reprepro vedono come un vero aggiornamento</li></ul>"
      pt: "<p>Corrigido o CONFIG_ANDROID_BINDER_IPC (e um bool, nao um tristate, nao podia ser compilado como modulo) e adicionado um contador de revisao a compilacao em lote do Stock para que recompilar a mesma versao de kernel seja vista pelo apt como uma atualizacao real.</p><ul><li>O CONFIG_ANDROID_BINDER_IPC e um bool em drivers/android/Kconfig, nao um tristate — a tentativa da 1.0.2-4 de compila-lo como modulo (--module) era um valor invalido, normalizado silenciosamente para n pelo make olddefconfig. Todos os kernels 7.2.4 ja publicados com essa compilacao nunca tiveram suporte real ao Waydroid. Agora ativado com --enable, a unica forma valida, mais uma verificacao apos o olddefconfig que avisa em vez de falhar silenciosamente se for descartado novamente</li><li>A compilacao em lote do Stock ganhou um contador de revisao: 0 (padrao) significa uma versao de kernel totalmente nova, sem alteracoes em relacao a antes. 1, 2, 3... significam a 1a, 2a, 3a recompilacao da mesma versao com patches diferentes, deslocado internamente para que colocar 1 produza sempre um pacote realmente novo e funcional que o apt/reprepro veem como uma atualizacao real</li></ul>"
      ro: "<p>Corectat CONFIG_ANDROID_BINDER_IPC (este un bool, nu un tristate, nu putea fi compilat ca modul) si adaugat un contor de revizie la build-ul in lot Stock, astfel incat recompilarea aceleiasi versiuni de kernel sa fie vazuta de apt ca o actualizare reala.</p><ul><li>CONFIG_ANDROID_BINDER_IPC este un bool in drivers/android/Kconfig, nu un tristate — incercarea din 1.0.2-4 de a-l compila ca modul (--module) era o valoare invalida, normalizata in tacere la n de make olddefconfig. Toate kernelurile 7.2.4 deja publicate cu acel build nu au avut niciodata suport real pentru Waydroid. Acum activat cu --enable, singura forma valida, plus o verificare dupa olddefconfig care avertizeaza in loc sa esueze in tacere daca este eliminat din nou</li><li>Build-ul in lot Stock a primit un contor de revizie: 0 (implicit) inseamna o versiune de kernel complet noua, neschimbata fata de inainte. 1, 2, 3... inseamna a 1-a, a 2-a, a 3-a recompilare a aceleiasi versiuni cu patch-uri diferite, decalat intern astfel incat introducerea lui 1 sa produca intotdeauna un pachet cu adevarat nou si functional pe care apt/reprepro il vad ca o actualizare reala</li></ul>"
      ru: "<p>Исправлен CONFIG_ANDROID_BINDER_IPC (это bool, а не tristate, его нельзя было собрать как модуль), и добавлен счётчик редакции в пакетную сборку Stock, чтобы пересборка той же версии ядра воспринималась apt как настоящее обновление.</p><ul><li>CONFIG_ANDROID_BINDER_IPC — обычный bool в drivers/android/Kconfig, а не tristate — попытка в 1.0.2-4 собрать его как модуль (--module) была недопустимым значением, молча нормализованным в n через make olddefconfig. Все уже опубликованные ядра 7.2.4 с этой сборкой никогда не имели реальной поддержки Waydroid. Теперь включается через --enable, единственную допустимую форму, плюс проверка после olddefconfig, которая предупреждает вместо молчаливого отказа, если он снова будет отброшен</li><li>Пакетная сборка Stock получила счётчик редакции: 0 (по умолчанию) означает совершенно новую версию ядра, без изменений по сравнению с прежним. 1, 2, 3... означают 1-ю, 2-ю, 3-ю пересборку той же версии с другими патчами, со смещением внутри, чтобы ввод 1 всегда давал по-настоящему новый, рабочий пакет, который apt/reprepro видят как настоящее обновление</li></ul>"
  - version: "1.0.2-4"
    type: stable
    unix-timestamp: 1788912000
    description:
      C: "<p>CONFIG_ANDROID_BINDER_IPC is now enabled as a module on every build, giving Waydroid support with no kernel patch needed.</p><ul><li>Enabled CONFIG_ANDROID_BINDER_IPC as a module (=m) in core/installer.py, on purpose: users who never use Waydroid never load it, at no cost. Device names (binder,hwbinder,vndbinder) are left for whoever loads the module (modprobe options), not fixed at compile time</li></ul>"
      de: "<p>CONFIG_ANDROID_BINDER_IPC wird jetzt bei jedem Build als Modul aktiviert und bietet Waydroid-Unterstuetzung ohne jeglichen Kernel-Patch.</p><ul><li>CONFIG_ANDROID_BINDER_IPC absichtlich als Modul (=m) in core/installer.py aktiviert: wer Waydroid nie nutzt, laedt es nie, ohne jegliche Kosten. Geraetenamen (binder,hwbinder,vndbinder) bleiben demjenigen ueberlassen, der das Modul laedt (modprobe-Optionen), nicht zur Kompilierzeit festgelegt</li></ul>"
      es: "<p>CONFIG_ANDROID_BINDER_IPC ya se activa como modulo en cada build, dando soporte a Waydroid sin necesitar ningun parche de kernel.</p><ul><li>Activado CONFIG_ANDROID_BINDER_IPC como modulo (=m) en core/installer.py, a proposito: quien nunca use Waydroid nunca lo carga, sin ningun coste. Los nombres de dispositivo (binder,hwbinder,vndbinder) se dejan para quien cargue el modulo (opciones de modprobe), no fijados en compilacion</li></ul>"
      fr: "<p>CONFIG_ANDROID_BINDER_IPC est desormais active en tant que module sur chaque build, apportant le support de Waydroid sans aucun patch de noyau.</p><ul><li>CONFIG_ANDROID_BINDER_IPC active en tant que module (=m) dans core/installer.py, volontairement : ceux qui n'utilisent jamais Waydroid ne le chargent jamais, sans aucun cout. Les noms de peripheriques (binder,hwbinder,vndbinder) sont laisses a qui charge le module (options modprobe), non fixes a la compilation</li></ul>"
      it: "<p>CONFIG_ANDROID_BINDER_IPC viene ora abilitato come modulo in ogni build, offrendo il supporto a Waydroid senza alcuna patch del kernel.</p><ul><li>Abilitato CONFIG_ANDROID_BINDER_IPC come modulo (=m) in core/installer.py, di proposito: chi non usa mai Waydroid non lo carica mai, senza alcun costo. I nomi dei dispositivi (binder,hwbinder,vndbinder) sono lasciati a chi carica il modulo (opzioni modprobe), non fissati in compilazione</li></ul>"
      pt: "<p>O CONFIG_ANDROID_BINDER_IPC ja e ativado como modulo em cada compilacao, dando suporte ao Waydroid sem qualquer patch de kernel.</p><ul><li>Ativado o CONFIG_ANDROID_BINDER_IPC como modulo (=m) em core/installer.py, de proposito: quem nunca usar o Waydroid nunca o carrega, sem qualquer custo. Os nomes dos dispositivos (binder,hwbinder,vndbinder) ficam a cargo de quem carregar o modulo (opcoes do modprobe), nao fixados na compilacao</li></ul>"
      ro: "<p>CONFIG_ANDROID_BINDER_IPC este acum activat ca modul la fiecare build, oferind suport pentru Waydroid fara niciun patch de kernel.</p><ul><li>Activat CONFIG_ANDROID_BINDER_IPC ca modul (=m) in core/installer.py, intentionat: cine nu foloseste niciodata Waydroid nu il incarca niciodata, fara niciun cost. Numele dispozitivelor (binder,hwbinder,vndbinder) raman in seama celui care incarca modulul (optiuni modprobe), nefixate la compilare</li></ul>"
      ru: "<p>CONFIG_ANDROID_BINDER_IPC теперь включается как модуль в каждой сборке, обеспечивая поддержку Waydroid без каких-либо патчей ядра.</p><ul><li>Включён CONFIG_ANDROID_BINDER_IPC как модуль (=m) в core/installer.py, намеренно: те, кто никогда не использует Waydroid, никогда его не загружают, без каких-либо затрат. Имена устройств (binder,hwbinder,vndbinder) оставлены на усмотрение того, кто загружает модуль (параметры modprobe), а не фиксированы при компиляции</li></ul>"
  - version: "1.0.2-3"
    type: stable
    unix-timestamp: 1787875200
    description:
      C: "<p>CONFIG_CGROUP_DMEM is now enabled unconditionally on every build, ahead of the future gaming daemon needing it.</p><ul><li>Enabled CONFIG_CGROUP_DMEM (device/VRAM memory accounting cgroup) unconditionally in core/installer.py, disabled by default in the Debian base config — avoids a forced recompile-and-republish cycle once soplos-game-daemon needs it</li><li>A dropped symbol after olddefconfig only warns instead of aborting the build, since nothing depends on it yet</li></ul>"
      de: "<p>CONFIG_CGROUP_DMEM wird jetzt bei jedem Build bedingungslos aktiviert, bevor der zukuenftige Gaming-Daemon es benoetigt.</p><ul><li>CONFIG_CGROUP_DMEM (Cgroup fuer Geraete-/VRAM-Speicherabrechnung) bedingungslos in core/installer.py aktiviert, in der Debian-Basiskonfiguration standardmaessig deaktiviert — vermeidet einen erzwungenen Neukompilierungs- und Neuveroeffentlichungszyklus, sobald soplos-game-daemon es benoetigt</li><li>Ein nach olddefconfig verworfenes Symbol fuehrt nur zu einer Warnung statt den Build abzubrechen, da noch nichts davon abhaengt</li></ul>"
      es: "<p>CONFIG_CGROUP_DMEM ya se activa de forma incondicional en cada build, antes de que el futuro daemon de gaming lo necesite.</p><ul><li>Activado CONFIG_CGROUP_DMEM (cgroup de contabilidad de memoria de dispositivo/VRAM) de forma incondicional en core/installer.py, desactivado por defecto en la config base de Debian — evita un ciclo forzado de recompilar y republicar cuando soplos-game-daemon lo necesite</li><li>Un simbolo descartado tras olddefconfig solo avisa en vez de abortar el build, ya que nada depende de el todavia</li></ul>"
      fr: "<p>CONFIG_CGROUP_DMEM est desormais active de maniere inconditionnelle sur chaque build, avant que le futur daemon de gaming n'en ait besoin.</p><ul><li>CONFIG_CGROUP_DMEM (cgroup de comptabilite de memoire de peripherique/VRAM) active de maniere inconditionnelle dans core/installer.py, desactive par defaut dans la config de base Debian — evite un cycle force de recompilation et republication quand soplos-game-daemon en aura besoin</li><li>Un symbole abandonne apres olddefconfig se contente d'avertir au lieu d'interrompre la compilation, car rien n'en depend encore</li></ul>"
      it: "<p>CONFIG_CGROUP_DMEM viene ora abilitato incondizionatamente in ogni build, prima che il futuro daemon di gaming ne abbia bisogno.</p><ul><li>Abilitato CONFIG_CGROUP_DMEM (cgroup di contabilizzazione della memoria del dispositivo/VRAM) incondizionatamente in core/installer.py, disabilitato per impostazione predefinita nella config di base Debian — evita un ciclo forzato di ricompilazione e ripubblicazione quando soplos-game-daemon ne avra bisogno</li><li>Un simbolo scartato dopo olddefconfig si limita ad avvisare invece di interrompere la build, poiche nulla ne dipende ancora</li></ul>"
      pt: "<p>O CONFIG_CGROUP_DMEM ja e ativado de forma incondicional em cada compilacao, antes de o futuro daemon de gaming precisar dele.</p><ul><li>Ativado o CONFIG_CGROUP_DMEM (cgroup de contabilizacao de memoria de dispositivo/VRAM) de forma incondicional em core/installer.py, desativado por omissao na configuracao base do Debian — evita um ciclo forcado de recompilacao e nova publicacao quando o soplos-game-daemon precisar dele</li><li>Um simbolo descartado apos o olddefconfig apenas avisa em vez de abortar a compilacao, pois nada depende dele ainda</li></ul>"
      ro: "<p>CONFIG_CGROUP_DMEM este acum activat neconditionat la fiecare build, inainte ca viitorul daemon de gaming sa aiba nevoie de el.</p><ul><li>Activat CONFIG_CGROUP_DMEM (cgroup de contabilizare a memoriei dispozitivului/VRAM) neconditionat in core/installer.py, dezactivat implicit in configuratia de baza Debian — evita un ciclu fortat de recompilare si republicare cand soplos-game-daemon va avea nevoie de el</li><li>Un simbol eliminat dupa olddefconfig doar avertizeaza in loc sa opreasca build-ul, deoarece nimic nu depinde inca de el</li></ul>"
      ru: "<p>CONFIG_CGROUP_DMEM теперь безусловно включается в каждой сборке — заранее, до того как он понадобится будущему игровому демону.</p><ul><li>Включён CONFIG_CGROUP_DMEM (cgroup учёта памяти устройства/VRAM) безусловно в core/installer.py, по умолчанию отключён в базовой конфигурации Debian — избегает вынужденного цикла пересборки и повторной публикации, когда он понадобится soplos-game-daemon</li><li>Отброшенный после olddefconfig символ только выводит предупреждение, а не прерывает сборку, так как пока ничего от него не зависит</li></ul>"
  - version: "1.0.2-2"
    type: stable
    unix-timestamp: 1787011200
    description:
      C: "<p>The march (x86-64 psABI) selector is now available for every profile, not just Stock, and the Stock batch build gained kernel selection and resume.</p><ul><li>Added the march selector for every profile, kernel selection (checkboxes) for the Stock batch build, and a resume checkbox that skips kernels already built in the destination folder</li><li>Fixed the march selector and other profile-dependent UI never initializing for the default profile at launch (ProfileSelector's first radio button starts pre-active, so its own set_active never emitted 'toggled')</li><li>Fixed a V3/V4 build outside Stock mode never being reflected in the kernel's name</li><li>Fixed the batch \"Build all 26 kernels\" button keeping its label after narrowing the selection</li></ul>"
      de: "<p>Der March-Level-Selector (x86-64 psABI) ist jetzt fuer jedes Profil verfuegbar, nicht nur fuer Stock, und der Stock-Stapelbau erhielt eine Kernauswahl und Fortsetzung.</p><ul><li>March-Selector fuer jedes Profil, Kernauswahl (Kontrollkaestchen) fuer den Stock-Stapelbau und ein Fortsetzen-Kontrollkaestchen hinzugefuegt, das bereits im Zielordner erstellte Kernel ueberspringt</li><li>Behoben, dass der March-Selector und andere profilabhaengige UI beim Start nie fuer das Standardprofil initialisiert wurden</li><li>Behoben, dass ein V3/V4-Build ausserhalb des Stock-Modus nie im Kernelnamen widergespiegelt wurde</li><li>Behoben, dass die Schaltflaeche \"Alle 26 Kernel kompilieren\" ihre Beschriftung nach Einschraenkung der Auswahl beibehielt</li></ul>"
      es: "<p>El selector de nivel march (x86-64 psABI) ya esta disponible en cualquier perfil, no solo en Stock, y el build por lotes de Stock incorpora seleccion de kernels y reanudar.</p><ul><li>Añadido el selector de march para cualquier perfil, seleccion de kernels (casillas) para el build por lotes de Stock, y una casilla de reanudar que salta los kernels ya compilados en la carpeta de destino</li><li>Corregido que el selector de march y otra UI dependiente del perfil nunca se inicializaran para el perfil por defecto al arrancar (el primer boton de radio de ProfileSelector nace activo, asi que su propio set_active nunca emitia 'toggled')</li><li>Corregido que un build V3/V4 fuera del modo Stock nunca se reflejara en el nombre del kernel</li><li>Corregido que el boton \"Compilar los 26 kernels\" del lote mantuviera su etiqueta tras acotar la seleccion</li></ul>"
      fr: "<p>Le selecteur de niveau march (x86-64 psABI) est desormais disponible pour tous les profils, pas seulement Stock, et la compilation par lots Stock a gagne la selection des noyaux et la reprise.</p><ul><li>Ajout du selecteur de march pour tout profil, de la selection des noyaux (cases a cocher) pour la compilation par lots Stock, et d'une case de reprise qui ignore les noyaux deja compiles dans le dossier de destination</li><li>Correction du selecteur de march et d'autres elements d'interface dependant du profil qui ne s'initialisaient jamais pour le profil par defaut au demarrage</li><li>Correction d'une compilation V3/V4 hors du mode Stock jamais reflete dans le nom du noyau</li><li>Correction du bouton \"Compiler les 26 noyaux\" du lot qui gardait son libelle apres restriction de la selection</li></ul>"
      it: "<p>Il selettore di livello march (x86-64 psABI) e ora disponibile per qualsiasi profilo, non solo Stock, e la build in batch di Stock ha guadagnato la selezione dei kernel e la ripresa.</p><ul><li>Aggiunto il selettore march per qualsiasi profilo, la selezione dei kernel (caselle di controllo) per la build in batch di Stock e una casella di ripresa che salta i kernel gia compilati nella cartella di destinazione</li><li>Corretto il selettore march e altra UI dipendente dal profilo che non si inizializzava mai per il profilo predefinito all'avvio</li><li>Corretto una build V3/V4 fuori dalla modalita Stock mai riflessa nel nome del kernel</li><li>Corretto il pulsante \"Compila tutti i 26 kernel\" del batch che manteneva l'etichetta dopo aver ristretto la selezione</li></ul>"
      pt: "<p>O seletor de nivel march (x86-64 psABI) esta agora disponivel em qualquer perfil, nao apenas no Stock, e a compilacao em lote do Stock ganhou selecao de kernels e retomada.</p><ul><li>Adicionado o seletor de march para qualquer perfil, selecao de kernels (caixas de verificacao) para a compilacao em lote do Stock, e uma caixa de retomar que ignora os kernels ja compilados na pasta de destino</li><li>Corrigido o seletor de march e outra UI dependente do perfil nunca se inicializarem para o perfil padrao ao iniciar</li><li>Corrigido uma compilacao V3/V4 fora do modo Stock nunca ser refletida no nome do kernel</li><li>Corrigido o botao \"Compilar os 26 kernels\" do lote manter o seu rotulo apos restringir a selecao</li></ul>"
      ro: "<p>Selectorul de nivel march (x86-64 psABI) este acum disponibil pentru orice profil, nu doar Stock, iar build-ul in lot Stock a primit selectarea kernelurilor si reluarea.</p><ul><li>Adaugat selectorul de march pentru orice profil, selectarea kernelurilor (casete de bifat) pentru build-ul in lot Stock si o caseta de reluare care omite kernelurile deja compilate in folderul de destinatie</li><li>Corectat faptul ca selectorul de march si alte elemente UI dependente de profil nu se initializau niciodata pentru profilul implicit la pornire</li><li>Corectat faptul ca un build V3/V4 in afara modului Stock nu se reflecta niciodata in numele kernelului</li><li>Corectat butonul \"Compileaza toate cele 26 de kernel-uri\" din lot care isi pastra eticheta dupa restrangerea selectiei</li></ul>"
      ru: "<p>Селектор уровня march (x86-64 psABI) теперь доступен для любого профиля, а не только Stock, а пакетная сборка Stock получила выбор ядер и возобновление.</p><ul><li>Добавлен селектор march для любого профиля, выбор ядер (флажки) для пакетной сборки Stock и флажок возобновления, пропускающий ядра, уже собранные в папке назначения</li><li>Исправлено: селектор march и другой UI, зависящий от профиля, никогда не инициализировался для профиля по умолчанию при запуске</li><li>Исправлено: сборка V3/V4 вне режима Stock никогда не отражалась в имени ядра</li><li>Исправлена кнопка «Собрать все 26 ядер» в пакете, сохранявшая надпись после сужения выбора</li></ul>"
  - version: "1.0.2-1"
    type: stable
    unix-timestamp: 1786924800
    description:
      C: "<p>Fixed NVIDIA DKMS builds failing on kernel 7.2+ with an implicit declaration of 'strncpy' in os-interface.c.</p><ul><li>`nvidia/os-interface.c` calls `strncpy()` without including `&lt;linux/string.h&gt;`, relying on some other kernel header (reached transitively through nv-linux.h) to provide the declaration. That transitive include disappeared starting with kernel 7.2, and GCC treats an implicit function declaration as a hard error, so DKMS builds failed outright</li><li>Added a new embedded compatibility patch (NV_STRING_H_PATCH) in core/nvidia_dkms_patch.py that adds the missing include, applied automatically alongside the existing VMA-locking fix — same mechanism, same idempotency guard, unrelated issue</li><li>Mirrored in the standalone nvidia-patches repo as Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      de: "<p>Behoben, dass NVIDIA-DKMS-Builds auf Kernel 7.2+ wegen einer impliziten Deklaration von 'strncpy' in os-interface.c fehlschlugen.</p><ul><li>`nvidia/os-interface.c` ruft `strncpy()` auf, ohne `&lt;linux/string.h&gt;` einzubinden, und verlaesst sich darauf, dass ein anderer Kernel-Header (transitiv ueber nv-linux.h erreicht) die Deklaration bereitstellt. Dieser transitive Include verschwand ab Kernel 7.2, und GCC behandelt eine implizite Funktionsdeklaration als harten Fehler, sodass DKMS-Builds komplett fehlschlugen</li><li>Ein neuer eingebetteter Kompatibilitatspatch (NV_STRING_H_PATCH) in core/nvidia_dkms_patch.py wurde hinzugefuegt, der den fehlenden Include ergaenzt, automatisch zusammen mit dem bestehenden VMA-Locking-Fix angewendet — gleicher Mechanismus, gleiche Idempotenz-Absicherung, unabhaengiges Problem</li><li>Im eigenstaendigen Repository nvidia-patches als Fix 4 gespiegelt (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      es: "<p>Corregido que las compilaciones DKMS de NVIDIA fallaran en el kernel 7.2+ por una declaracion implicita de 'strncpy' en os-interface.c.</p><ul><li>`nvidia/os-interface.c` llama a `strncpy()` sin incluir `&lt;linux/string.h&gt;`, dependiendo de que otro header del kernel (alcanzado de forma transitiva a traves de nv-linux.h) proporcionara la declaracion. Ese include transitivo desaparecio a partir del kernel 7.2, y GCC trata una declaracion implicita de funcion como un error grave, asi que las compilaciones DKMS fallaban directamente</li><li>Añadido un nuevo parche de compatibilidad embebido (NV_STRING_H_PATCH) en core/nvidia_dkms_patch.py que agrega el include que falta, aplicado automaticamente junto al parche de VMA locking ya existente — mismo mecanismo, misma proteccion de idempotencia, problema no relacionado</li><li>Reflejado en el repositorio independiente nvidia-patches como Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      fr: "<p>Correction de l'echec des compilations DKMS NVIDIA sur le noyau 7.2+ du a une declaration implicite de 'strncpy' dans os-interface.c.</p><ul><li>`nvidia/os-interface.c` appelle `strncpy()` sans inclure `&lt;linux/string.h&gt;`, en comptant sur un autre en-tete du noyau (atteint de maniere transitive via nv-linux.h) pour fournir la declaration. Cette inclusion transitive a disparu a partir du noyau 7.2, et GCC traite une declaration implicite de fonction comme une erreur bloquante, donc les compilations DKMS echouaient directement</li><li>Ajout d'un nouveau patch de compatibilite integre (NV_STRING_H_PATCH) dans core/nvidia_dkms_patch.py qui ajoute l'inclusion manquante, applique automatiquement avec le correctif VMA existant — meme mecanisme, meme protection d'idempotence, probleme non lie</li><li>Repercute dans le depot independant nvidia-patches en tant que Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      it: "<p>Corretto il fallimento delle build DKMS NVIDIA sul kernel 7.2+ causato da una dichiarazione implicita di 'strncpy' in os-interface.c.</p><ul><li>`nvidia/os-interface.c` chiama `strncpy()` senza includere `&lt;linux/string.h&gt;`, affidandosi a un altro header del kernel (raggiunto in modo transitivo tramite nv-linux.h) per fornire la dichiarazione. Tale inclusione transitiva e scomparsa a partire dal kernel 7.2, e GCC tratta una dichiarazione implicita di funzione come un errore bloccante, quindi le build DKMS fallivano direttamente</li><li>Aggiunta una nuova patch di compatibilita incorporata (NV_STRING_H_PATCH) in core/nvidia_dkms_patch.py che aggiunge l'inclusione mancante, applicata automaticamente insieme alla patch VMA gia esistente — stesso meccanismo, stessa protezione di idempotenza, problema non correlato</li><li>Rispecchiato nel repository indipendente nvidia-patches come Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      pt: "<p>Corrigido o facto de as compilacoes DKMS da NVIDIA falharem no kernel 7.2+ devido a uma declaracao implicita de 'strncpy' em os-interface.c.</p><ul><li>`nvidia/os-interface.c` chama `strncpy()` sem incluir `&lt;linux/string.h&gt;`, dependendo de outro cabecalho do kernel (alcancado de forma transitiva atraves de nv-linux.h) para fornecer a declaracao. Essa inclusao transitiva desapareceu a partir do kernel 7.2, e o GCC trata uma declaracao implicita de funcao como um erro grave, pelo que as compilacoes DKMS falhavam diretamente</li><li>Adicionado um novo patch de compatibilidade incorporado (NV_STRING_H_PATCH) em core/nvidia_dkms_patch.py que acrescenta a inclusao em falta, aplicado automaticamente juntamente com a correcao de VMA locking ja existente — mesmo mecanismo, mesma protecao de idempotencia, problema nao relacionado</li><li>Refletido no repositorio independente nvidia-patches como Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      ro: "<p>Corectat faptul ca build-urile DKMS NVIDIA esuau pe kernelul 7.2+ din cauza unei declaratii implicite a 'strncpy' in os-interface.c.</p><ul><li>`nvidia/os-interface.c` apeleaza `strncpy()` fara a include `&lt;linux/string.h&gt;`, bazandu-se pe un alt header al kernelului (atins tranzitiv prin nv-linux.h) pentru a furniza declaratia. Acea includere tranzitiva a disparut incepand cu kernelul 7.2, iar GCC trateaza o declaratie implicita de functie ca o eroare grava, asa ca build-urile DKMS esuau direct</li><li>Adaugat un nou patch de compatibilitate incorporat (NV_STRING_H_PATCH) in core/nvidia_dkms_patch.py care adauga includerea lipsa, aplicat automat alaturi de patch-ul VMA existent — acelasi mecanism, aceeasi protectie de idempotenta, problema neinrudita</li><li>Reflectat in repository-ul independent nvidia-patches ca Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
      ru: "<p>Исправлен сбой сборок NVIDIA DKMS на ядре 7.2+ из-за неявного объявления функции 'strncpy' в os-interface.c.</p><ul><li>`nvidia/os-interface.c` вызывает `strncpy()` без подключения `&lt;linux/string.h&gt;`, полагаясь на то, что другой заголовок ядра (достигаемый транзитивно через nv-linux.h) предоставит объявление. Этот транзитивный инклюд исчез начиная с ядра 7.2, и GCC считает неявное объявление функции серьёзной ошибкой, поэтому сборки DKMS сразу завершались неудачей</li><li>Добавлен новый встроенный патч совместимости (NV_STRING_H_PATCH) в core/nvidia_dkms_patch.py, добавляющий недостающий инклюд, применяется автоматически вместе с уже существующим исправлением VMA-locking — тот же механизм, та же защита идемпотентности, не связанная проблема</li><li>Отражено в отдельном репозитории nvidia-patches как Fix 4 (patches/nvidia-string-h-kernel7.2.patch)</li></ul>"
  - version: "1.0.2"
    type: stable
    unix-timestamp: 1786924800
    description:
      C: "<p>Fixed the x86-64 ISA level (march) patch silently never applying on any kernel other than exactly 7.1.x, first surfaced by the release of kernel 7.2.</p><ul><li>`_download_march()` requested a `7.x`-tagged fallback file for any kernel other than exactly 7.1.x, but that file never existed in soplos-cpu-kernel-patch — the download 404'd, and the build proceeded without the patch. Builds requesting v2/v3/v4 silently fell back to v1 with no visible error</li><li>Simplified the tag logic to always request the `7.x` file, which now exists and is verified to apply unchanged across 7.1.x and 7.2</li><li>BORE, X3D and Zen also needed their own rebases to build again on kernel 7.2 (in bore-soplos, x3d-soplos and zen-soplos) — no further code changes were needed here, the existing fallback chains already routed correctly</li></ul>"
      de: "<p>Behoben, dass der x86-64-ISA-Level-Patch (march) auf keinem anderen Kernel als genau 7.1.x jemals angewendet wurde, aufgedeckt durch die Veröffentlichung von Kernel 7.2.</p><ul><li>`_download_march()` forderte für jeden Kernel außer genau 7.1.x eine mit `7.x` getaggte Fallback-Datei an, die es in soplos-cpu-kernel-patch nie gab — der Download schlug mit 404 fehl, und der Build lief ohne den Patch weiter. Builds, die v2/v3/v4 anforderten, fielen still auf v1 zurück, ohne sichtbaren Fehler</li><li>Tag-Logik vereinfacht, sodass immer die `7.x`-Datei angefordert wird, die jetzt existiert und nachweislich unverändert auf 7.1.x und 7.2 angewendet wird</li><li>BORE, X3D und Zen benötigten ebenfalls ein eigenes Rebase, um auf Kernel 7.2 wieder zu bauen (in bore-soplos, x3d-soplos und zen-soplos) — hier war kein weiterer Code nötig, die bestehenden Fallback-Ketten leiteten bereits korrekt weiter</li></ul>"
      es: "<p>Corregido que el parche de nivel ISA x86-64 (march) nunca llegaba a aplicarse en ningún kernel salvo exactamente 7.1.x, detectado al publicarse el kernel 7.2.</p><ul><li>`_download_march()` pedía un fichero de respaldo con etiqueta `7.x` para cualquier kernel que no fuera exactamente 7.1.x, pero ese fichero nunca existió en soplos-cpu-kernel-patch — la descarga daba 404 y el build seguía adelante sin el parche. Los builds que pedían v2/v3/v4 caían en silencio a v1 sin ningún error visible</li><li>Simplificada la lógica de etiquetas para pedir siempre el fichero `7.x`, que ahora existe y está verificado que aplica sin cambios en 7.1.x y 7.2</li><li>BORE, X3D y Zen también necesitaron su propio rebase para volver a compilar en el kernel 7.2 (en bore-soplos, x3d-soplos y zen-soplos) — no hizo falta tocar más código aquí, las cadenas de respaldo existentes ya enrutaban correctamente</li></ul>"
      fr: "<p>Correction du patch de niveau ISA x86-64 (march) qui ne s'appliquait jamais sur aucun noyau autre qu'exactement 7.1.x, révélée par la sortie du noyau 7.2.</p><ul><li>`_download_march()` demandait un fichier de secours étiqueté `7.x` pour tout noyau autre qu'exactement 7.1.x, mais ce fichier n'a jamais existé dans soplos-cpu-kernel-patch — le téléchargement échouait en 404 et la compilation se poursuivait sans le patch. Les builds demandant v2/v3/v4 retombaient silencieusement sur v1 sans erreur visible</li><li>Logique d'étiquetage simplifiée pour toujours demander le fichier `7.x`, qui existe désormais et est vérifié comme s'appliquant sans changement sur 7.1.x et 7.2</li><li>BORE, X3D et Zen ont également nécessité leur propre rebase pour recompiler sur le noyau 7.2 (dans bore-soplos, x3d-soplos et zen-soplos) — aucun changement de code supplémentaire n'a été nécessaire ici, les chaînes de secours existantes acheminaient déjà correctement</li></ul>"
      it: "<p>Corretto il fatto che la patch del livello ISA x86-64 (march) non si applicasse mai su nessun kernel diverso esattamente da 7.1.x, emerso con il rilascio del kernel 7.2.</p><ul><li>`_download_march()` richiedeva un file di riserva con tag `7.x` per qualsiasi kernel diverso esattamente da 7.1.x, ma quel file non è mai esistito in soplos-cpu-kernel-patch — il download falliva con 404 e la build proseguiva senza la patch. Le build che richiedevano v2/v3/v4 ricadevano silenziosamente su v1 senza alcun errore visibile</li><li>Semplificata la logica dei tag per richiedere sempre il file `7.x`, che ora esiste ed è verificato applicarsi invariato su 7.1.x e 7.2</li><li>Anche BORE, X3D e Zen hanno richiesto un proprio rebase per tornare a compilare sul kernel 7.2 (in bore-soplos, x3d-soplos e zen-soplos) — qui non è stato necessario alcun ulteriore codice, le catene di riserva esistenti instradavano già correttamente</li></ul>"
      pt: "<p>Corrigido o facto de o patch de nível ISA x86-64 (march) nunca chegar a aplicar-se em nenhum kernel que não fosse exatamente 7.1.x, detetado com o lançamento do kernel 7.2.</p><ul><li>`_download_march()` pedia um ficheiro de reserva com etiqueta `7.x` para qualquer kernel que não fosse exatamente 7.1.x, mas esse ficheiro nunca existiu em soplos-cpu-kernel-patch — a transferência falhava com 404 e a compilação continuava sem o patch. As compilações que pediam v2/v3/v4 caíam silenciosamente para v1 sem qualquer erro visível</li><li>Simplificada a lógica de etiquetas para pedir sempre o ficheiro `7.x`, que agora existe e está verificado que se aplica sem alterações em 7.1.x e 7.2</li><li>O BORE, o X3D e o Zen também precisaram do seu próprio rebase para voltar a compilar no kernel 7.2 (em bore-soplos, x3d-soplos e zen-soplos) — não foi preciso mexer em mais código aqui, as cadeias de reserva existentes já encaminhavam corretamente</li></ul>"
      ro: "<p>Corectat faptul ca patch-ul nivelului ISA x86-64 (march) nu se aplica niciodata pe niciun kernel altul decat exact 7.1.x, descoperit odata cu lansarea kernelului 7.2.</p><ul><li>`_download_march()` solicita un fisier de rezerva etichetat `7.x` pentru orice kernel altul decat exact 7.1.x, dar acel fisier nu a existat niciodata in soplos-cpu-kernel-patch — descarcarea esua cu 404 si compilarea continua fara patch. Compilarile care solicitau v2/v3/v4 reveneau in tacere la v1 fara nicio eroare vizibila</li><li>Simplificata logica etichetelor pentru a solicita mereu fisierul `7.x`, care acum exista si este verificat ca se aplica neschimbat pe 7.1.x si 7.2</li><li>BORE, X3D si Zen au necesitat de asemenea propriul rebase pentru a compila din nou pe kernelul 7.2 (in bore-soplos, x3d-soplos si zen-soplos) — nu a fost nevoie de alt cod aici, lanturile de rezerva existente directionau deja corect</li></ul>"
      ru: "<p>Исправлено то, что патч уровня ISA x86-64 (march) никогда не применялся ни на одном ядре, кроме точно 7.1.x, — обнаружено при выходе ядра 7.2.</p><ul><li>`_download_march()` запрашивал резервный файл с тегом `7.x` для любого ядра, кроме точно 7.1.x, но такого файла никогда не существовало в soplos-cpu-kernel-patch — загрузка возвращала 404, и сборка продолжалась без патча. Сборки, запрашивающие v2/v3/v4, незаметно откатывались к v1 без видимой ошибки</li><li>Упрощена логика тегов: теперь всегда запрашивается файл `7.x`, который теперь существует и проверен на неизменное применение к 7.1.x и 7.2</li><li>BORE, X3D и Zen также потребовали собственного ребейза для повторной сборки на ядре 7.2 (в bore-soplos, x3d-soplos и zen-soplos) — здесь дополнительный код не потребовался, существующие резервные цепочки уже маршрутизировали корректно</li></ul>"
  - version: "1.0.1-9"
    type: stable
    unix-timestamp: 1786579200
    description:
      C: "<p>Added unattended compilation of a whole kernel release, and fixed the x86-64 architecture level never being applied: kernels named v2, v3 and v4 were built at the v1 baseline.</p><ul><li>Stock mode can now build an entire release unattended: every variant and architecture level one after another, each from a clean build directory, saving the packages into per-version and per-level folders</li><li>The queue stops at the first failure and keeps that build directory, so the log and sources survive for inspection</li><li>Fixed the architecture level: it set `CONFIG_GENERIC_CPU{2,3,4}`, symbols that do not exist in mainline, so `olddefconfig` dropped them and every kernel was built at the v1 baseline</li><li>The level now comes from the Soplos x86-64 ISA level patch, and the build aborts if the symbol does not survive configuration instead of producing a mislabelled kernel</li><li>Translated the batch interface and six older strings that were still untranslated, across all eight languages</li></ul>"
      de: "<p>Unbeaufsichtigtes Bauen eines kompletten Kernel-Releases hinzugefügt und behoben, dass die x86-64-Architekturebene nie angewendet wurde: Kernel mit den Namen v2, v3 und v4 wurden auf der v1-Basislinie gebaut.</p>"
      es: "<p>Añadida la compilación desatendida de una release completa de kernels, y corregido que el nivel de arquitectura x86-64 no se aplicara nunca: los kernels llamados v2, v3 y v4 se compilaban en la línea base v1.</p>"
      fr: "<p>Ajout de la compilation sans surveillance d'une version complète de noyaux, et correction du niveau d'architecture x86-64 qui n'était jamais appliqué : les noyaux nommés v2, v3 et v4 étaient compilés au niveau de base v1.</p>"
      it: "<p>Aggiunta la compilazione non presidiata di un'intera release di kernel e corretto il livello di architettura x86-64 che non veniva mai applicato: i kernel chiamati v2, v3 e v4 venivano compilati sulla linea base v1.</p>"
      pt: "<p>Adicionada a compilação sem supervisão de uma versão completa de kernels, e corrigido o nível de arquitetura x86-64 que nunca era aplicado: os kernels chamados v2, v3 e v4 eram compilados na linha base v1.</p>"
      ro: "<p>Adaugata compilarea nesupravegheata a unei versiuni complete de nuclee si corectat nivelul de arhitectura x86-64 care nu se aplica niciodata: nucleele numite v2, v3 si v4 erau compilate pe linia de baza v1.</p>"
      ru: "<p>Добавлена автоматическая сборка целого выпуска ядер и исправлено то, что уровень архитектуры x86-64 никогда не применялся: ядра с именами v2, v3 и v4 собирались на базовом уровне v1.</p>"
  - version: "1.0.1-8"
    type: stable
    unix-timestamp: 1785196800
    description:
      C: "<p>Fixed the NVIDIA DKMS patch being silently skipped on the open kernel modules, the ones used by Turing and newer GPUs. It is now applied to both source layouts and only when the driver actually needs it.</p><ul><li>The patch walks both `/usr/src/nvidia-*/nvidia/` and `/usr/src/nvidia-*/kernel-open/nvidia/`, instead of only the first, which silently skipped every nvidia-open install</li><li>The patch is applied only when the source contains `VMA_LOCK_OFFSET`, removing the failed-patch warning on drivers that no longer use that API</li><li>Removed the unused constants `DRACUT_CONF_DIR` and `DRACUT_SOPLOS_CONF`</li></ul>"
      de: "<p>Behoben: Der NVIDIA-DKMS-Patch wurde bei den offenen Kernel-Modulen stillschweigend übersprungen, also genau bei Turing-GPUs und neuer. Er wird nun auf beide Quellstrukturen angewendet und nur dann, wenn der Treiber ihn benötigt.</p>"
      es: "<p>Corregido que el parche DKMS de NVIDIA se saltara en silencio los módulos de kernel abiertos, que son los que usan las GPU Turing y posteriores. Ahora se aplica a las dos disposiciones de fuentes y solo cuando el driver lo necesita.</p>"
      fr: "<p>Correction du correctif DKMS NVIDIA ignoré silencieusement sur les modules de noyau ouverts, ceux utilisés par les GPU Turing et plus récents. Il est désormais appliqué aux deux arborescences de sources et uniquement lorsque le pilote en a besoin.</p>"
      it: "<p>Corretto il fatto che la patch DKMS di NVIDIA venisse saltata in silenzio sui moduli del kernel aperti, quelli usati dalle GPU Turing e successive. Ora viene applicata a entrambe le strutture dei sorgenti e solo quando il driver ne ha bisogno.</p>"
      pt: "<p>Corrigido o patch DKMS da NVIDIA ser ignorado em silêncio nos módulos de kernel abertos, que são os usados pelas GPU Turing e posteriores. Passa a ser aplicado às duas disposições de código e apenas quando o controlador precisa dele.</p>"
      ro: "<p>Corectat faptul ca patch-ul DKMS NVIDIA era omis in tacere pentru modulele de kernel deschise, cele folosite de placile Turing si mai noi. Acum se aplica ambelor structuri de surse si doar cand driverul are nevoie de el.</p>"
      ru: "<p>Исправлено: патч DKMS для NVIDIA молча пропускался для открытых модулей ядра, которые используются на Turing и новее. Теперь он применяется к обеим структурам исходников и только когда драйверу это действительно нужно.</p>"
  - version: "1.0.1-7"
    type: stable
    unix-timestamp: 1785024000
    description:
      C: "<p>Added a core count selector for compilation and profile/version filters in the Soplos Kernels tab, plus two related UI fixes.</p><ul><li>Added a core count selector (\"Cores to use for compilation\") next to the cleanup option, defaulting to all logical cores — available in both regular profiles and Stock/developer mode, threaded through to `make -j`</li><li>Added Profile and Version (V1–V4) filter dropdowns in the Soplos Kernels tab, populated dynamically from the packages actually present in the repository</li><li>Fixed kernel list filters leaving the Install/Remove buttons blank until a manual refresh</li><li>Fixed the filters row being visually stuck to the kernel list with no clear boundary — now its own card</li></ul>"
      de: "<p>Kernauswahl für die Kompilierung sowie Profil-/Versionsfilter im Tab Soplos-Kernel hinzugefügt, plus zwei zugehörige Oberflächenkorrekturen.</p><ul><li>Kernauswahl („Kerne für die Kompilierung“) neben der Bereinigungsoption hinzugefügt, standardmäßig alle logischen Kerne — verfügbar sowohl in regulären Profilen als auch im Stock-/Entwicklermodus, bis zu `make -j` durchgereicht</li><li>Dropdown-Filter für Profil und Version (V1–V4) im Tab Soplos-Kernel hinzugefügt, dynamisch befüllt aus den tatsächlich im Repository vorhandenen Paketen</li><li>Behoben, dass Kernel-Listenfilter die Schaltflächen Installieren/Entfernen bis zur manuellen Aktualisierung leer ließen</li><li>Behoben, dass die Filterzeile visuell ohne klare Abgrenzung an der Kernel-Liste klebte — jetzt eigene Karte</li></ul>"
      es: "<p>Añadido un selector de núcleos para la compilación y filtros de perfil/versión en la pestaña Kernels Soplos, más dos correcciones de interfaz relacionadas.</p><ul><li>Añadido un selector de número de núcleos («Núcleos a usar para compilar») junto a la opción de limpieza, con todos los núcleos lógicos por defecto — disponible tanto en perfiles normales como en modo Stock/desarrollador, aplicado hasta `make -j`</li><li>Añadidos desplegables de filtro por Perfil y Versión (V1–V4) en la pestaña Kernels Soplos, rellenados dinámicamente según los paquetes realmente presentes en el repositorio</li><li>Corregido que los filtros de la lista de kernels dejaban los botones Instalar/Eliminar en blanco hasta refrescar manualmente</li><li>Corregido que la fila de filtros quedaba pegada visualmente a la lista de kernels sin ningún límite claro — ahora es su propia tarjeta</li></ul>"
      fr: "<p>Ajout d'un sélecteur de cœurs pour la compilation et de filtres profil/version dans l'onglet Noyaux Soplos, plus deux corrections d'interface associées.</p><ul><li>Ajout d'un sélecteur de nombre de cœurs (« Cœurs à utiliser pour la compilation ») à côté de l'option de nettoyage, tous les cœurs logiques par défaut — disponible en profils normaux comme en mode Stock/développeur, répercuté jusqu'à `make -j`</li><li>Ajout de listes déroulantes de filtre Profil et Version (V1–V4) dans l'onglet Noyaux Soplos, remplies dynamiquement à partir des paquets réellement présents dans le dépôt</li><li>Correction des filtres de la liste des noyaux qui laissaient les boutons Installer/Supprimer vides jusqu'à une actualisation manuelle</li><li>Correction de la ligne de filtres collée visuellement à la liste des noyaux sans limite claire — désormais sa propre carte</li></ul>"
      it: "<p>Aggiunto un selettore di core per la compilazione e filtri profilo/versione nella scheda Kernel Soplos, più due correzioni dell'interfaccia correlate.</p><ul><li>Aggiunto un selettore del numero di core (\"Core da usare per la compilazione\") accanto all'opzione di pulizia, con tutti i core logici come predefinito — disponibile sia nei profili normali sia in modalità Stock/sviluppatore, applicato fino a `make -j`</li><li>Aggiunti menu a tendina di filtro per Profilo e Versione (V1–V4) nella scheda Kernel Soplos, popolati dinamicamente in base ai pacchetti effettivamente presenti nel repository</li><li>Corretto il fatto che i filtri dell'elenco kernel lasciavano i pulsanti Installa/Rimuovi vuoti fino a un aggiornamento manuale</li><li>Corretto il fatto che la riga dei filtri restava visivamente attaccata all'elenco kernel senza un confine chiaro — ora è una scheda propria</li></ul>"
      pt: "<p>Adicionado um seletor de núcleos para a compilação e filtros de perfil/versão no separador Kernels Soplos, mais duas correções de interface relacionadas.</p><ul><li>Adicionado um seletor de número de núcleos («Núcleos a usar para a compilação») junto à opção de limpeza, com todos os núcleos lógicos por predefinição — disponível tanto em perfis normais como no modo Stock/programador, aplicado até ao `make -j`</li><li>Adicionados menus pendentes de filtro por Perfil e Versão (V1–V4) no separador Kernels Soplos, preenchidos dinamicamente a partir dos pacotes realmente presentes no repositório</li><li>Corrigido o facto de os filtros da lista de kernels deixarem os botões Instalar/Remover em branco até uma atualização manual</li><li>Corrigido o facto de a linha de filtros ficar visualmente colada à lista de kernels sem limite claro — agora é o seu próprio cartão</li></ul>"
      ro: "<p>Adaugat un selector de nuclee pentru compilare si filtre de profil/versiune in tab-ul Kernels Soplos, plus doua corectii de interfata asociate.</p><ul><li>Adaugat un selector al numarului de nuclee („Nuclee de folosit pentru compilare\") langa optiunea de curatare, cu toate nucleele logice implicit — disponibil atat in profiluri normale cat si in modul Stock/dezvoltator, aplicat pana la `make -j`</li><li>Adaugate liste derulante de filtrare dupa Profil si Versiune (V1–V4) in tab-ul Kernels Soplos, populate dinamic din pachetele prezente efectiv in depozit</li><li>Corectat faptul ca filtrele listei de kernel-uri lasau butoanele Instalare/Eliminare goale pana la o reactualizare manuala</li><li>Corectat faptul ca randul de filtre ramanea lipit vizual de lista de kernel-uri fara o limita clara — acum este propriul sau card</li></ul>"
      ru: "<p>Добавлен выбор количества ядер для компиляции и фильтры профиля/версии на вкладке Ядра Soplos, а также два связанных исправления интерфейса.</p><ul><li>Добавлен выбор количества ядер («Ядра для компиляции») рядом с опцией очистки, по умолчанию все логические ядра — доступно как в обычных профилях, так и в режиме Stock/разработчика, передаётся вплоть до `make -j`</li><li>Добавлены выпадающие фильтры по Профилю и Версии (V1–V4) на вкладке Ядра Soplos, заполняются динамически на основе реально присутствующих в репозитории пакетов</li><li>Исправлено то, что фильтры списка ядер оставляли кнопки «Установить»/«Удалить» пустыми до ручного обновления</li><li>Исправлено то, что строка фильтров визуально прилипала к списку ядер без чёткой границы — теперь это отдельная карточка</li></ul>"
  - version: "1.0.1-6"
    type: stable
    unix-timestamp: 1785024000
    description:
      C: "<p>Fixed BORE/Zen patch source fallback, fixed Zen's alternate scheduler never actually building, and added Soplos-maintained fallback patches for point releases upstream hasn't caught up with yet.</p><ul><li>Fixed patch source selection: a BORE/Zen source could download successfully and still fail to apply against the current kernel point release, only surfacing the failure too late to try another source — sources are now verified with a dry-run apply before being accepted, falling through automatically otherwise</li><li>Fixed Zen's alternate scheduler (BMQ/PDS) never actually being built: CONFIG_SCHED_ALT defaults to \"n\" in Zen's own Kconfig (unlike BORE's CONFIG_SCHED_BORE, which defaults to \"y\"), so selecting \"zen\" silently produced a kernel still running mainline CFS/EEVDF — CONFIG_SCHED_ALT and CONFIG_SCHED_PDS are now forced on when \"zen\" is selected. Confirmed on real hardware: PDS is genuinely active at boot, not just compiled in</li><li>Added SoplosLinux/bore-soplos as a third BORE fallback source, used only when neither firelzrd nor CachyOS have a working patch yet</li><li>Added SoplosLinux/zen-soplos as a Zen fallback source, used when zen-kernel/zen-kernel hasn't published a matching release yet</li></ul>"
      de: "<p>Fallback-System für BORE/Zen-Patch-Quellen behoben, behoben dass Zens alternativer Scheduler nie tatsächlich gebaut wurde, und von Soplos gepflegte Fallback-Patches für Point-Releases hinzugefügt, die Upstream noch nicht unterstützt.</p><ul><li>Patch-Quellenauswahl behoben: Eine BORE/Zen-Quelle konnte erfolgreich heruntergeladen werden und trotzdem beim Anwenden auf die aktuelle Kernel-Version fehlschlagen — der Fehler zeigte sich zu spät, um eine andere Quelle zu versuchen. Quellen werden jetzt vor der Annahme per Probelauf geprüft, sonst wird automatisch die nächste versucht</li><li>Behoben, dass Zens alternativer Scheduler (BMQ/PDS) nie tatsächlich gebaut wurde: CONFIG_SCHED_ALT hat in Zens eigenem Kconfig „default n“ (anders als CONFIG_SCHED_BORE mit „default y“), sodass die Auswahl von „zen“ still einen Kernel erzeugte, der weiterhin mainline CFS/EEVDF nutzte — CONFIG_SCHED_ALT und CONFIG_SCHED_PDS werden jetzt bei Auswahl von „zen“ erzwungen. Auf echter Hardware bestätigt: PDS ist beim Booten wirklich aktiv, nicht nur einkompiliert</li><li>SoplosLinux/bore-soplos als dritte Fallback-Quelle für BORE hinzugefügt, nur genutzt wenn weder firelzrd noch CachyOS einen funktionierenden Patch haben</li><li>SoplosLinux/zen-soplos als Fallback-Quelle für Zen hinzugefügt, genutzt wenn zen-kernel/zen-kernel noch kein passendes Release veröffentlicht hat</li></ul>"
      es: "<p>Corregido el sistema de fuentes alternativas de parches BORE/Zen, corregido que el scheduler alternativo de Zen nunca llegaba a compilarse, y añadidos parches de respaldo mantenidos por Soplos para versiones que upstream aún no soporta.</p><ul><li>Corregida la selección de fuente de parche: una fuente de BORE/Zen podía descargarse bien y aun así fallar al aplicarse contra la versión de kernel actual, mostrando el fallo demasiado tarde para probar otra fuente — ahora se verifican con una aplicación de prueba antes de aceptarse, pasando automáticamente a la siguiente si no</li><li>Corregido que el scheduler alternativo de Zen (BMQ/PDS) nunca llegaba a compilarse: CONFIG_SCHED_ALT tiene «default n» en el propio Kconfig de Zen (a diferencia de CONFIG_SCHED_BORE, que tiene «default y»), así que seleccionar «zen» producía en silencio un kernel que seguía usando CFS/EEVDF de mainline — ahora se fuerzan CONFIG_SCHED_ALT y CONFIG_SCHED_PDS al seleccionar «zen». Confirmado en hardware real: PDS está realmente activo al arrancar, no solo compilado</li><li>Añadido SoplosLinux/bore-soplos como tercera fuente de respaldo para BORE, usada solo cuando ni firelzrd ni CachyOS tienen todavía un parche funcional</li><li>Añadido SoplosLinux/zen-soplos como fuente de respaldo para Zen, usada cuando zen-kernel/zen-kernel aún no ha publicado una versión compatible</li></ul>"
      fr: "<p>Correction du système de sources de secours pour les patchs BORE/Zen, correction du planificateur alternatif de Zen qui n'était en fait jamais compilé, et ajout de patchs de secours maintenus par Soplos pour les versions que l'amont n'a pas encore rattrapées.</p><ul><li>Correction de la sélection de source de patch : une source BORE/Zen pouvait se télécharger correctement puis échouer à l'application sur la version actuelle du noyau, révélant l'échec trop tard pour essayer une autre source — les sources sont désormais vérifiées par une application à blanc avant d'être acceptées, avec repli automatique sinon</li><li>Correction du planificateur alternatif de Zen (BMQ/PDS) qui n'était en fait jamais compilé : CONFIG_SCHED_ALT a « default n » dans le Kconfig propre à Zen (contrairement à CONFIG_SCHED_BORE, qui a « default y »), donc sélectionner « zen » produisait silencieusement un noyau utilisant toujours CFS/EEVDF mainline — CONFIG_SCHED_ALT et CONFIG_SCHED_PDS sont désormais forcés lors de la sélection de « zen ». Confirmé sur matériel réel : PDS est réellement actif au démarrage, pas seulement compilé</li><li>Ajout de SoplosLinux/bore-soplos comme troisième source de secours pour BORE, utilisée uniquement si ni firelzrd ni CachyOS n'ont de patch fonctionnel</li><li>Ajout de SoplosLinux/zen-soplos comme source de secours pour Zen, utilisée si zen-kernel/zen-kernel n'a pas encore publié de version correspondante</li></ul>"
      it: "<p>Corretto il sistema di fonti alternative per le patch BORE/Zen, corretto il fatto che lo scheduler alternativo di Zen non veniva mai effettivamente compilato, e aggiunte patch di riserva mantenute da Soplos per le versioni non ancora supportate dall'upstream.</p><ul><li>Corretta la selezione della fonte della patch: una fonte BORE/Zen poteva essere scaricata correttamente e comunque non applicarsi alla versione corrente del kernel, rivelando il fallimento troppo tardi per provare un'altra fonte — le fonti ora vengono verificate con un'applicazione di prova prima di essere accettate, passando automaticamente alla successiva in caso contrario</li><li>Corretto il fatto che lo scheduler alternativo di Zen (BMQ/PDS) non veniva mai effettivamente compilato: CONFIG_SCHED_ALT ha «default n» nel Kconfig proprio di Zen (a differenza di CONFIG_SCHED_BORE, che ha «default y»), quindi selezionare «zen» produceva silenziosamente un kernel che continuava a usare CFS/EEVDF mainline — CONFIG_SCHED_ALT e CONFIG_SCHED_PDS vengono ora forzati selezionando «zen». Confermato su hardware reale: PDS è realmente attivo all'avvio, non solo compilato</li><li>Aggiunto SoplosLinux/bore-soplos come terza fonte di riserva per BORE, usata solo quando né firelzrd né CachyOS hanno una patch funzionante</li><li>Aggiunto SoplosLinux/zen-soplos come fonte di riserva per Zen, usata quando zen-kernel/zen-kernel non ha ancora pubblicato una versione corrispondente</li></ul>"
      pt: "<p>Corrigido o sistema de fontes alternativas de patches BORE/Zen, corrigido o facto de o escalonador alternativo do Zen nunca chegar a ser compilado, e adicionados patches de reserva mantidos pela Soplos para versões que o upstream ainda não suporta.</p><ul><li>Corrigida a seleção de fonte de patch: uma fonte BORE/Zen podia ser descarregada com sucesso e ainda assim falhar ao aplicar-se à versão atual do kernel, revelando a falha tarde demais para tentar outra fonte — as fontes agora são verificadas com uma aplicação de teste antes de serem aceites, passando automaticamente para a seguinte caso contrário</li><li>Corrigido o facto de o escalonador alternativo do Zen (BMQ/PDS) nunca chegar a ser compilado: CONFIG_SCHED_ALT tem «default n» no próprio Kconfig do Zen (ao contrário de CONFIG_SCHED_BORE, que tem «default y»), pelo que selecionar «zen» produzia silenciosamente um kernel que continuava a usar CFS/EEVDF do mainline — CONFIG_SCHED_ALT e CONFIG_SCHED_PDS são agora forçados ao selecionar «zen». Confirmado em hardware real: o PDS está genuinamente ativo no arranque, não apenas compilado</li><li>Adicionado o SoplosLinux/bore-soplos como terceira fonte de reserva para o BORE, usada apenas quando nem o firelzrd nem o CachyOS têm um patch funcional</li><li>Adicionado o SoplosLinux/zen-soplos como fonte de reserva para o Zen, usada quando o zen-kernel/zen-kernel ainda não publicou uma versão correspondente</li></ul>"
      ro: "<p>Corectat sistemul de surse alternative pentru patch-urile BORE/Zen, corectat faptul ca schedulerul alternativ al Zen nu se compila niciodata cu adevarat, si adaugate patch-uri de rezerva mentinute de Soplos pentru versiunile pe care upstream nu le suporta inca.</p><ul><li>Corectata selectia sursei de patch: o sursa BORE/Zen putea fi descarcata cu succes si totusi sa esueze la aplicare pe versiunea curenta de kernel, dezvaluind esecul prea tarziu pentru a incerca o alta sursa — sursele sunt acum verificate cu o aplicare de proba inainte de a fi acceptate, trecand automat la urmatoarea in caz contrar</li><li>Corectat faptul ca schedulerul alternativ al Zen (BMQ/PDS) nu se compila niciodata cu adevarat: CONFIG_SCHED_ALT are „default n\" in Kconfig-ul propriu al Zen (spre deosebire de CONFIG_SCHED_BORE, care are „default y\"), deci selectarea „zen\" producea in tacere un kernel care folosea in continuare CFS/EEVDF mainline — CONFIG_SCHED_ALT si CONFIG_SCHED_PDS sunt acum fortate la selectarea „zen\". Confirmat pe hardware real: PDS este cu adevarat activ la pornire, nu doar compilat</li><li>Adaugat SoplosLinux/bore-soplos ca a treia sursa de rezerva pentru BORE, folosita doar cand nici firelzrd, nici CachyOS nu au un patch functional</li><li>Adaugat SoplosLinux/zen-soplos ca sursa de rezerva pentru Zen, folosita cand zen-kernel/zen-kernel nu a publicat inca o versiune corespunzatoare</li></ul>"
      ru: "<p>Исправлена система резервных источников патчей BORE/Zen, исправлено то, что альтернативный планировщик Zen на деле никогда не собирался, и добавлены резервные патчи, поддерживаемые Soplos, для версий, которые апстрим пока не поддерживает.</p><ul><li>Исправлен выбор источника патча: источник BORE/Zen мог успешно скачаться, но не примениться к текущей версии ядра, а ошибка проявлялась слишком поздно, чтобы попробовать другой источник — теперь источники проверяются пробным применением перед принятием, иначе автоматически используется следующий</li><li>Исправлено то, что альтернативный планировщик Zen (BMQ/PDS) на деле никогда не собирался: CONFIG_SCHED_ALT в собственном Kconfig Zen имеет значение по умолчанию «n» (в отличие от CONFIG_SCHED_BORE, у которого «y»), поэтому выбор «zen» незаметно давал ядро, всё ещё работающее на mainline CFS/EEVDF — теперь CONFIG_SCHED_ALT и CONFIG_SCHED_PDS принудительно включаются при выборе «zen». Подтверждено на реальном оборудовании: PDS действительно активен при загрузке, а не просто скомпилирован</li><li>Добавлен SoplosLinux/bore-soplos как третий резервный источник для BORE, используется только если ни firelzrd, ни CachyOS не имеют рабочего патча</li><li>Добавлен SoplosLinux/zen-soplos как резервный источник для Zen, используется если zen-kernel/zen-kernel ещё не опубликовал подходящий релиз</li></ul>"
  - version: "1.0.1-5"
    type: stable
    unix-timestamp: 1784678400
    description:
      C: "<p>Changed the \"Which kernel is right for my hardware?\" popup: it now also shows the detected CPU model, GPU, and total RAM alongside the supported x86-64 architecture level.</p>"
      de: "<p>Fenster „Welcher Kernel ist der richtige für meine Hardware?“ geändert: Es zeigt jetzt zusätzlich zum unterstützten x86-64-Architekturlevel auch das erkannte CPU-Modell, die GPU und den gesamten RAM an.</p>"
      es: "<p>Cambiada la ventana «¿Qué kernel es el adecuado para mi hardware?»: ahora también muestra el modelo de CPU detectado, la GPU y la RAM total junto al nivel de arquitectura x86-64 soportado.</p>"
      fr: "<p>Modification de la fenêtre « Quel noyau convient à mon matériel ? » : elle affiche désormais aussi le modèle de CPU détecté, le GPU et la RAM totale en plus du niveau d'architecture x86-64 pris en charge.</p>"
      it: "<p>Modificata la finestra «Quale kernel è adatto al mio hardware?»: ora mostra anche il modello di CPU rilevato, la GPU e la RAM totale insieme al livello di architettura x86-64 supportato.</p>"
      pt: "<p>Alterada a janela «Qual kernel é adequado para o meu hardware?»: agora também mostra o modelo de CPU detetado, a GPU e a RAM total, além do nível de arquitetura x86-64 suportado.</p>"
      ro: "<p>Modificată fereastra „Ce kernel este potrivit pentru hardware-ul meu?”: acum afișează și modelul de CPU detectat, GPU-ul și RAM-ul total, pe lângă nivelul de arhitectură x86-64 acceptat.</p>"
      ru: "<p>Изменено окно «Какое ядро подходит для моего оборудования?»: теперь оно также показывает определённую модель процессора, видеокарту и общий объём ОЗУ наряду с поддерживаемым уровнем архитектуры x86-64.</p>"
  - version: "1.0.1-4"
    type: stable
    unix-timestamp: 1784505600
    description:
      C: "<p>Changed the \"Which kernel is right for my hardware?\" button: it no longer opens the wiki — it now detects the highest x86-64 architecture level (v1–v4) your CPU actually supports and shows it directly in the app.</p>"
      de: "<p>Schaltfläche „Welcher Kernel ist der richtige für meine Hardware?“ geändert: Sie öffnet nicht mehr das Wiki — sie erkennt jetzt die höchste x86-64-Architekturstufe (v1–v4), die deine CPU tatsächlich unterstützt, und zeigt sie direkt in der App an.</p>"
      es: "<p>Cambiado el botón «¿Qué kernel es el adecuado para mi hardware?»: ya no abre la wiki — ahora detecta el nivel de arquitectura x86-64 más alto (v1–v4) que soporta realmente tu CPU y lo muestra directamente en la aplicación.</p>"
      fr: "<p>Modification du bouton « Quel noyau convient à mon matériel ? » : il n'ouvre plus le wiki — il détecte désormais le niveau d'architecture x86-64 le plus élevé (v1–v4) réellement pris en charge par votre CPU et l'affiche directement dans l'application.</p>"
      it: "<p>Modificato il pulsante «Quale kernel è adatto al mio hardware?»: non apre più la wiki — ora rileva il livello di architettura x86-64 più alto (v1–v4) effettivamente supportato dalla tua CPU e lo mostra direttamente nell'app.</p>"
      pt: "<p>Alterado o botão «Qual kernel é adequado para o meu hardware?»: já não abre a wiki — agora deteta o nível de arquitetura x86-64 mais alto (v1–v4) que o seu CPU realmente suporta e mostra-o diretamente na aplicação.</p>"
      ro: "<p>Modificat butonul „Ce kernel este potrivit pentru hardware-ul meu?”: nu mai deschide wiki-ul — acum detectează cel mai înalt nivel de arhitectură x86-64 (v1–v4) acceptat efectiv de CPU-ul tău și îl afișează direct în aplicație.</p>"
      ru: "<p>Изменена кнопка «Какое ядро подходит для моего оборудования?»: она больше не открывает вики — теперь она определяет максимальный уровень архитектуры x86-64 (v1–v4), реально поддерживаемый вашим процессором, и показывает его прямо в приложении.</p>"
  - version: "1.0.1-3"
    type: stable
    unix-timestamp: 1784505600
    description:
      C: "<p>Fixed selecting X3D possibly leaving an incompatible patch checked, breaking the build.</p><ul><li>Selecting X3D force-enables BORE, but since that happened while patch-toggle signals were blocked, BORE's own \"uncheck Zen (incompatible)\" logic never ran — Zen could stay checked alongside BORE+X3D if it was already active</li><li>Now X3D's auto-select also clears whatever is incompatible with BORE</li></ul>"
      de: "<p>Behoben: Die Auswahl von X3D konnte einen inkompatiblen Patch aktiviert lassen und den Build beschädigen.</p><ul><li>Die Auswahl von X3D aktiviert automatisch BORE, aber da dies bei blockierten Checkbox-Signalen geschah, wurde BOREs eigene Logik zum „Zen deaktivieren (inkompatibel)“ nie ausgeführt — Zen konnte zusammen mit BORE+X3D aktiviert bleiben, falls es bereits aktiv war</li><li>Die automatische Auswahl von X3D deaktiviert jetzt auch alles, was mit BORE inkompatibel ist</li></ul>"
      es: "<p>Corregido que al seleccionar X3D pudiera quedar marcado un parche incompatible, rompiendo la compilación.</p><ul><li>Seleccionar X3D activa BORE automáticamente, pero como eso ocurría con las señales de los checkboxes bloqueadas, la propia lógica de BORE de \"desmarcar Zen (incompatible)\" nunca se ejecutaba — Zen podía quedar marcado junto a BORE+X3D si ya estaba activo</li><li>Ahora la selección automática de X3D también desmarca lo incompatible con BORE</li></ul>"
      fr: "<p>Correction : sélectionner X3D pouvait laisser un patch incompatible coché, cassant la compilation.</p><ul><li>Sélectionner X3D active automatiquement BORE, mais comme cela se produisait pendant que les signaux des cases à cocher étaient bloqués, la logique propre de BORE « décocher Zen (incompatible) » ne s'exécutait jamais — Zen pouvait rester coché avec BORE+X3D s'il était déjà actif</li><li>La sélection automatique de X3D décoche désormais aussi tout ce qui est incompatible avec BORE</li></ul>"
      it: "<p>Corretto: selezionare X3D poteva lasciare selezionata una patch incompatibile, rompendo la build.</p><ul><li>Selezionare X3D attiva automaticamente BORE, ma poiché ciò avveniva con i segnali delle checkbox bloccati, la logica propria di BORE per \"deselezionare Zen (incompatibile)\" non veniva mai eseguita — Zen poteva restare selezionato insieme a BORE+X3D se era già attivo</li><li>Ora la selezione automatica di X3D deseleziona anche tutto ciò che è incompatibile con BORE</li></ul>"
      pt: "<p>Corrigido: selecionar X3D podia deixar um patch incompatível marcado, quebrando a compilação.</p><ul><li>Selecionar X3D ativa automaticamente o BORE, mas como isso acontecia com os sinais das caixas de seleção bloqueados, a própria lógica do BORE de \"desmarcar Zen (incompatível)\" nunca era executada — o Zen podia continuar marcado junto com BORE+X3D se já estivesse ativo</li><li>Agora a seleção automática do X3D também desmarca o que for incompatível com o BORE</li></ul>"
      ro: "<p>Corectat: selectarea X3D putea lasa bifat un patch incompatibil, stricand compilarea.</p><ul><li>Selectarea X3D activeaza automat BORE, dar deoarece acest lucru se intampla in timp ce semnalele checkbox-urilor erau blocate, logica proprie a BORE de a \"debifa Zen (incompatibil)\" nu se executa niciodata — Zen putea ramane bifat alaturi de BORE+X3D daca era deja activ</li><li>Acum selectia automata a X3D debifeaza si tot ce este incompatibil cu BORE</li></ul>"
      ru: "<p>Исправлено: при выборе X3D мог оставаться отмеченным несовместимый патч, что ломало сборку.</p><ul><li>Выбор X3D автоматически включает BORE, но поскольку это происходило при заблокированных сигналах чекбоксов, собственная логика BORE «снять отметку с Zen (несовместимо)» никогда не выполнялась — Zen мог оставаться отмеченным вместе с BORE+X3D, если уже был активен</li><li>Теперь автоматический выбор X3D также снимает отметку со всего, что несовместимо с BORE</li></ul>"
  - version: "1.0.1-2"
    type: stable
    unix-timestamp: 1784332800
    description:
      C: "<p>Fixed a build-breaking configuration bug and improved gaming hardware support.</p><ul><li>Fixed the X3D VCache patch download to use per-kernel-version URLs instead of a single stale link</li><li>The base kernel configuration is now fetched fresh from Debian sid on every build instead of reusing a previously installed kernel's config, avoiding accumulated drift and missing support for recent hardware</li><li>Fixed a build failure caused by an inherited module signing key path that only existed inside Debian's own build system</li><li>Fixed patch tooltips (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache) never being translated — now properly localized in all 8 languages</li><li>Added ASUS ROG Ally and OneXPlayer/AYANEO embedded controller drivers (ASUS_ARMOURY, OXP_EC) to every build</li><li>The CPU architecture level selector now disables v1/v2 automatically when the X3D patch is selected, since X3D hardware requires at least x86-64-v3</li></ul>"
      de: "<p>Ein build-blockierender Konfigurationsfehler wurde behoben und die Unterstützung für Gaming-Hardware verbessert.</p><ul><li>Behoben: Download des X3D-VCache-Patches verwendet jetzt URLs pro Kernel-Version statt eines einzelnen veralteten Links</li><li>Die Basis-Kernelkonfiguration wird jetzt bei jedem Build aktuell von Debian sid geladen, statt die eines zuvor installierten Kernels wiederzuverwenden — verhindert angesammelte Abweichungen und fehlende Unterstützung neuer Hardware</li><li>Behoben: Build-Fehler durch einen geerbten Modul-Signaturschlüsselpfad, der nur innerhalb von Debians eigenem Build-System existierte</li><li>Behoben: Patch-Tooltips (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache) wurden nie übersetzt — jetzt korrekt in allen 8 Sprachen lokalisiert</li><li>ASUS ROG Ally und OneXPlayer/AYANEO Embedded-Controller-Treiber (ASUS_ARMOURY, OXP_EC) zu jedem Build hinzugefügt</li><li>Die CPU-Architekturstufen-Auswahl deaktiviert jetzt automatisch v1/v2, wenn der X3D-Patch ausgewählt ist, da X3D-Hardware mindestens x86-64-v3 benötigt</li></ul>"
      es: "<p>Corregido un fallo de compilación en la configuración base y mejorado el soporte de hardware gaming.</p><ul><li>Corregida la descarga del parche X3D VCache: ahora usa URLs por versión de kernel en vez de un único enlace desactualizado</li><li>La configuración base del kernel ahora se descarga siempre actualizada desde Debian sid en cada compilación, en vez de reutilizar la de un kernel instalado anteriormente, evitando degradación acumulada y falta de soporte de hardware reciente</li><li>Corregido un fallo de compilación causado por una ruta de clave de firma de módulos heredada que solo existía dentro del propio sistema de compilación de Debian</li><li>Corregidos los tooltips de los parches (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), que nunca se traducían — ahora correctamente localizados en los 8 idiomas</li><li>Añadidos los drivers de controladora embebida de ASUS ROG Ally y OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) a todas las compilaciones</li><li>El selector de nivel de arquitectura de CPU ahora desactiva v1/v2 automáticamente al seleccionar el parche X3D, ya que el hardware X3D requiere como mínimo x86-64-v3</li></ul>"
      fr: "<p>Correction d'un bug de configuration bloquant la compilation et amélioration du support matériel gaming.</p><ul><li>Correction du téléchargement du patch X3D VCache : utilise désormais des URL par version de noyau au lieu d'un lien unique obsolète</li><li>La configuration de base du noyau est désormais téléchargée à jour depuis Debian sid à chaque compilation, au lieu de réutiliser celle d'un noyau installé précédemment, évitant une dérive accumulée et un manque de support matériel récent</li><li>Correction d'un échec de compilation causé par un chemin de clé de signature de module hérité qui n'existait qu'au sein du système de compilation de Debian</li><li>Correction des infobulles des patchs (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), jamais traduites — désormais correctement localisées dans les 8 langues</li><li>Ajout des pilotes du contrôleur embarqué ASUS ROG Ally et OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) à chaque compilation</li><li>Le sélecteur de niveau d'architecture CPU désactive désormais automatiquement v1/v2 lorsque le patch X3D est sélectionné, le matériel X3D nécessitant au minimum x86-64-v3</li></ul>"
      it: "<p>Corretto un bug di configurazione che bloccava la build e migliorato il supporto hardware gaming.</p><ul><li>Corretto il download della patch X3D VCache: ora usa URL per versione del kernel invece di un unico link obsoleto</li><li>La configurazione base del kernel viene ora scaricata aggiornata da Debian sid ad ogni build, invece di riutilizzare quella di un kernel installato in precedenza, evitando degrado accumulato e mancanza di supporto per hardware recente</li><li>Corretto un errore di build causato da un percorso di chiave di firma dei moduli ereditato che esisteva solo all'interno del sistema di build di Debian</li><li>Corretti i tooltip delle patch (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), mai tradotti — ora correttamente localizzati in tutte le 8 lingue</li><li>Aggiunti i driver del controller embedded di ASUS ROG Ally e OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) a ogni build</li><li>Il selettore del livello di architettura CPU ora disabilita automaticamente v1/v2 quando è selezionata la patch X3D, poiché l'hardware X3D richiede almeno x86-64-v3</li></ul>"
      pt: "<p>Corrigido um erro de configuração que bloqueava a compilação e melhorado o suporte a hardware gaming.</p><ul><li>Corrigida a descarga do patch X3D VCache: agora usa URLs por versão de kernel em vez de um único link desatualizado</li><li>A configuração base do kernel agora é sempre descarregada atualizada a partir do Debian sid em cada compilação, em vez de reutilizar a de um kernel instalado anteriormente, evitando desvio acumulado e falta de suporte a hardware recente</li><li>Corrigida uma falha de compilação causada por um caminho de chave de assinatura de módulo herdado que só existia dentro do próprio sistema de compilação do Debian</li><li>Corrigidas as dicas dos patches (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), que nunca eram traduzidas — agora corretamente localizadas nos 8 idiomas</li><li>Adicionados os drivers de controlador incorporado da ASUS ROG Ally e OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) a todas as compilações</li><li>O seletor de nível de arquitetura de CPU agora desativa automaticamente v1/v2 ao selecionar o patch X3D, já que o hardware X3D requer no mínimo x86-64-v3</li></ul>"
      ro: "<p>Corectata o eroare de configurare care bloca compilarea si imbunatatit suportul pentru hardware de gaming.</p><ul><li>Corectata descarcarea patch-ului X3D VCache: foloseste acum URL-uri per versiune de kernel in loc de un singur link invechit</li><li>Configuratia de baza a kernelului este acum descarcata actualizata de pe Debian sid la fiecare compilare, in loc sa refoloseasca cea a unui kernel instalat anterior, evitand degradarea acumulata si lipsa suportului pentru hardware recent</li><li>Corectata o eroare de compilare cauzata de o cale de cheie de semnare a modulelor mostenita care exista doar in propriul sistem de compilare Debian</li><li>Corectate indiciile parch-urilor (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), niciodata traduse — acum corect localizate in toate cele 8 limbi</li><li>Adaugati driverele controllerului integrat ASUS ROG Ally si OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) la fiecare compilare</li><li>Selectorul nivelului de arhitectura CPU dezactiveaza acum automat v1/v2 cand este selectat patch-ul X3D, deoarece hardware-ul X3D necesita cel putin x86-64-v3</li></ul>"
      ru: "<p>Исправлена ошибка конфигурации, блокировавшая сборку, и улучшена поддержка игрового оборудования.</p><ul><li>Исправлена загрузка патча X3D VCache: теперь используются URL для каждой версии ядра вместо одной устаревшей ссылки</li><li>Базовая конфигурация ядра теперь всегда загружается свежей из Debian sid при каждой сборке, вместо повторного использования конфигурации ранее установленного ядра — это предотвращает накопление устареваний и отсутствие поддержки нового оборудования</li><li>Исправлена ошибка сборки, вызванная унаследованным путём к ключу подписи модулей, существовавшим только внутри собственной системы сборки Debian</li><li>Исправлены всплывающие подсказки патчей (BORE, PREEMPT_RT, Zen, NTSYNC, X3D VCache), которые никогда не переводились — теперь корректно локализованы на всех 8 языках</li><li>Добавлены драйверы встроенного контроллера ASUS ROG Ally и OneXPlayer/AYANEO (ASUS_ARMOURY, OXP_EC) в каждую сборку</li><li>Переключатель уровня архитектуры CPU теперь автоматически отключает v1/v2 при выборе патча X3D, так как оборудование X3D требует минимум x86-64-v3</li></ul>"
  - version: "1.0.1-1"
    type: stable
    unix-timestamp: 1784160000
    description:
      C: "<p>Fixed Soplos Kernels tab not detecting march-level package variants and showing incorrect display names for them.</p><ul><li>Fixed package filter regex to accept march-level suffixes (v1–v4)</li><li>Fixed display name for march-level packages: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      de: "<p>Behoben: Tab Soplos-Kernel erkannte March-Level-Paketvarianten nicht und zeigte falsche Anzeigenamen.</p><ul><li>Behoben: Paketfilter-Regex akzeptiert jetzt March-Level-Suffixe (v1–v4)</li><li>Behoben: Anzeigename für March-Level-Pakete: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      es: "<p>Corregida la pestaña Kernels Soplos que no detectaba las variantes de paquete por nivel march y mostraba nombres incorrectos.</p><ul><li>Corregido regex del filtro de paquetes para aceptar sufijos de nivel march (v1–v4)</li><li>Corregido nombre de paquetes con nivel march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      fr: "<p>Correction de l'onglet Noyaux Soplos qui ne détectait pas les variantes de paquets par niveau march et affichait des noms incorrects.</p><ul><li>Correction du regex du filtre de paquets pour accepter les suffixes de niveau march (v1–v4)</li><li>Correction du nom des paquets avec niveau march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      it: "<p>Corretto il tab Kernel Soplos che non rilevava le varianti di pacchetto per livello march e mostrava nomi errati.</p><ul><li>Corretto regex del filtro pacchetti per accettare suffissi di livello march (v1–v4)</li><li>Corretto nome dei pacchetti con livello march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      pt: "<p>Corrigido o separador Kernels Soplos que não detetava as variantes de pacote por nível march e mostrava nomes incorretos.</p><ul><li>Corrigido regex do filtro de pacotes para aceitar sufixos de nível march (v1–v4)</li><li>Corrigido nome de pacotes com nível march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      ro: "<p>Corectat fila Kerneluri Soplos care nu detecta variantele de pachete dupa nivelul march si afisa nume incorecte.</p><ul><li>Corectat regex filtru pachete pentru a accepta sufixe de nivel march (v1–v4)</li><li>Corectat numele pachetelor cu nivel march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
      ru: "<p>Исправлена вкладка «Ядра Soplos»: теперь корректно определяет варианты пакетов по уровню march и отображает правильные названия.</p><ul><li>Исправлен regex фильтра пакетов для поддержки суффиксов уровня march (v1–v4)</li><li>Исправлены отображаемые имена пакетов с уровнем march: linux-soplos-v3 → \"Stock V3\", linux-soplos-bore-v3 → \"BORE V3\"</li></ul>"
  - version: "1.0.1"
    type: stable
    unix-timestamp: 1784160000
    description:
      C: "<p>Added x86-64 microarchitecture level selector in Stock mode, original X3D VCache scheduler patch for AMD Ryzen X3D processors, auto-generated kernel name in Stock mode, and a wiki info button in the Soplos Kernels tab.</p><ul><li>Added x86-64 march level selector in Stock mode (v1 Generic / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Added X3D VCache scheduler patch for AMD Ryzen X3D dual-CCD processors (Stock mode only)</li><li>Added auto-generated kernel name in Stock mode based on patches and march level</li><li>Added wiki info button in Soplos Kernels tab linking to CPU Compatibility guide</li></ul>"
      de: "<p>Hinzugefügt: x86-64-Architekturebene-Auswahl im Stock-Modus, originaler X3D-VCache-Scheduler-Patch für AMD-Ryzen-X3D-Prozessoren, automatisch generierter Kernel-Name im Stock-Modus und Wiki-Informationsschaltfläche im Tab Soplos-Kernel.</p><ul><li>Hinzugefügt: x86-64-March-Ebene-Auswahl im Stock-Modus (v1 Generisch / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Hinzugefügt: X3D-VCache-Scheduler-Patch für AMD-Ryzen-X3D-Dual-CCD-Prozessoren (nur Stock-Modus)</li><li>Hinzugefügt: Automatisch generierter Kernel-Name im Stock-Modus nach Patches und March-Ebene</li><li>Hinzugefügt: Wiki-Informationsschaltfläche im Tab Soplos-Kernel mit Link zur CPU-Kompatibilitätsanleitung</li></ul>"
      es: "<p>Añadido selector de nivel de arquitectura x86-64 en modo Stock, parche original del planificador X3D VCache para procesadores AMD Ryzen X3D, nombre de kernel autogenerado en modo Stock y botón de información wiki en la pestaña Kernels Soplos.</p><ul><li>Añadido selector de nivel march x86-64 en modo Stock (v1 Genérico / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Añadido parche del planificador X3D VCache para procesadores AMD Ryzen X3D de doble CCD (solo modo Stock)</li><li>Añadido nombre de kernel autogenerado en modo Stock según parches y nivel march</li><li>Añadido botón de información wiki en la pestaña Kernels Soplos con enlace a la guía de compatibilidad de CPU</li></ul>"
      fr: "<p>Ajout d'un sélecteur de niveau d'architecture x86-64 en mode Stock, d'un patch planificateur X3D VCache original pour les processeurs AMD Ryzen X3D, d'un nom de noyau généré automatiquement en mode Stock et d'un bouton d'information wiki dans l'onglet Noyaux Soplos.</p><ul><li>Ajout du sélecteur de niveau march x86-64 en mode Stock (v1 Générique / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Ajout du patch planificateur X3D VCache pour processeurs AMD Ryzen X3D double CCD (mode Stock uniquement)</li><li>Ajout du nom de noyau généré automatiquement en mode Stock selon les patches et le niveau march</li><li>Ajout du bouton d'information wiki dans l'onglet Noyaux Soplos avec lien vers le guide de compatibilité CPU</li></ul>"
      it: "<p>Aggiunto selettore del livello di architettura x86-64 in modalità Stock, patch originale dello scheduler X3D VCache per processori AMD Ryzen X3D, nome del kernel generato automaticamente in modalità Stock e pulsante informazioni wiki nella scheda Kernel Soplos.</p><ul><li>Aggiunto selettore del livello march x86-64 in modalità Stock (v1 Generico / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Aggiunto patch dello scheduler X3D VCache per processori AMD Ryzen X3D dual CCD (solo modalità Stock)</li><li>Aggiunto nome del kernel generato automaticamente in modalità Stock in base a patch e livello march</li><li>Aggiunto pulsante informazioni wiki nella scheda Kernel Soplos con collegamento alla guida di compatibilità CPU</li></ul>"
      pt: "<p>Adicionado seletor de nível de arquitetura x86-64 no modo Stock, patch original do escalonador X3D VCache para processadores AMD Ryzen X3D, nome de kernel gerado automaticamente no modo Stock e botão de informação wiki no separador Kernels Soplos.</p><ul><li>Adicionado seletor de nível march x86-64 no modo Stock (v1 Genérico / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Adicionado patch do escalonador X3D VCache para processadores AMD Ryzen X3D de CCD duplo (apenas modo Stock)</li><li>Adicionado nome de kernel gerado automaticamente no modo Stock conforme patches e nível march</li><li>Adicionado botão de informação wiki no separador Kernels Soplos com ligação ao guia de compatibilidade de CPU</li></ul>"
      ro: "<p>Adaugat selector de nivel de arhitectura x86-64 in modul Stock, patch original de planificator X3D VCache pentru procesoare AMD Ryzen X3D, nume de kernel generat automat in modul Stock si buton de informatii wiki in fila Kerneluri Soplos.</p><ul><li>Adaugat selector de nivel march x86-64 in modul Stock (v1 Generic / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Adaugat patch de planificator X3D VCache pentru procesoare AMD Ryzen X3D cu CCD dual (numai modul Stock)</li><li>Adaugat nume de kernel generat automat in modul Stock in functie de patch-uri si nivelul march</li><li>Adaugat buton de informatii wiki in fila Kerneluri Soplos cu link catre ghidul de compatibilitate CPU</li></ul>"
      ru: "<p>Добавлены: выбор уровня архитектуры x86-64 в режиме Stock, оригинальный патч планировщика X3D VCache для процессоров AMD Ryzen X3D, автогенерация имени ядра в режиме Stock и кнопка информации о вики во вкладке «Ядра Soplos».</p><ul><li>Добавлен выбор уровня march x86-64 в режиме Stock (v1 Универсальный / v2 SSE4.2+ / v3 AVX2+ / v4 AVX-512)</li><li>Добавлен патч планировщика X3D VCache для процессоров AMD Ryzen X3D с двумя CCD (только режим Stock)</li><li>Добавлена автогенерация имени ядра в режиме Stock на основе патчей и уровня march</li><li>Добавлена кнопка информации о вики во вкладке «Ядра Soplos» со ссылкой на руководство по совместимости CPU</li></ul>"
  - version: "1.0.0-4"
    type: stable
    unix-timestamp: 1780358400
    description:
      C: "<p>Fixed NVIDIA DKMS build failures when installing pre-built Soplos kernels on systems with NVIDIA drivers. The VMA compatibility patch is now applied before installation in the Soplos Kernels tab.</p><ul><li>Fixed NVIDIA DKMS patch not applied when installing pre-built Soplos kernels from repository tab</li><li>Fixed NVIDIA VMA patch using --fuzz=5 to cover 580 and 590 driver versions</li></ul>"
      de: "<p>Behoben: NVIDIA DKMS-Build-Fehler beim Installieren vorkompilierter Soplos-Kernel auf Systemen mit NVIDIA-Treibern. Der VMA-Kompatibilitätspatch wird jetzt vor der Installation im Tab Soplos-Kernel angewendet.</p><ul><li>Behoben: NVIDIA DKMS-Patch nicht angewendet beim Installieren vorkompilierter Soplos-Kernel aus dem Repository-Tab</li><li>Behoben: NVIDIA VMA-Patch mit --fuzz=5 fur 580- und 590-Treiberversionen</li></ul>"
      es: "<p>Corregidos los fallos de compilación DKMS de NVIDIA al instalar kernels Soplos precompilados en sistemas con controladores NVIDIA. El parche de compatibilidad VMA ahora se aplica antes de la instalación en la pestaña Kernels Soplos.</p><ul><li>Corregido parche DKMS NVIDIA no aplicado al instalar kernels Soplos precompilados desde la pestana del repositorio</li><li>Corregido parche VMA NVIDIA usando --fuzz=5 para cubrir versiones de driver 580 y 590</li></ul>"
      fr: "<p>Correction des échecs de compilation DKMS NVIDIA lors de l'installation de noyaux Soplos précompilés sur des systèmes avec des pilotes NVIDIA. Le patch de compatibilité VMA est maintenant appliqué avant l'installation dans l'onglet Noyaux Soplos.</p><ul><li>Correction du patch DKMS NVIDIA non applique lors de l'installation de noyaux Soplos precompiles depuis l'onglet depot</li><li>Correction du patch VMA NVIDIA avec --fuzz=5 pour couvrir les versions de pilote 580 et 590</li></ul>"
      it: "<p>Corretti i guasti di compilazione DKMS NVIDIA durante l'installazione di kernel Soplos precompilati su sistemi con driver NVIDIA. Il patch di compatibilità VMA viene ora applicato prima dell'installazione nella scheda Kernel Soplos.</p><ul><li>Corretto patch DKMS NVIDIA non applicato durante l'installazione di kernel Soplos precompilati dalla scheda repository</li><li>Corretto patch VMA NVIDIA con --fuzz=5 per le versioni driver 580 e 590</li></ul>"
      pt: "<p>Corrigidas falhas de compilação DKMS da NVIDIA ao instalar kernels Soplos pré-compilados em sistemas com controladores NVIDIA. O patch de compatibilidade VMA agora é aplicado antes da instalação no separador Kernels Soplos.</p><ul><li>Corrigido patch DKMS NVIDIA nao aplicado ao instalar kernels Soplos precompilados do separador repositorio</li><li>Corrigido patch VMA NVIDIA com --fuzz=5 para versoes de driver 580 e 590</li></ul>"
      ro: "<p>Corectate erorile de compilare DKMS NVIDIA la instalarea kernelurilor Soplos precompilate pe sisteme cu drivere NVIDIA. Patch-ul de compatibilitate VMA este acum aplicat inainte de instalare in fila Kerneluri Soplos.</p><ul><li>Corectat patch DKMS NVIDIA neaplicat la instalarea kernelurilor Soplos precompilate din fila depozit</li><li>Corectat patch VMA NVIDIA cu --fuzz=5 pentru versiunile de driver 580 si 590</li></ul>"
      ru: "<p>Исправлены сбои компиляции DKMS NVIDIA при установке предсобранных ядер Soplos на системах с драйверами NVIDIA. Патч совместимости VMA теперь применяется перед установкой во вкладке Ядра Soplos.</p><ul><li>Исправлен патч DKMS NVIDIA, не применявшийся при установке предсобранных ядер Soplos из вкладки репозитория</li><li>Исправлен патч VMA NVIDIA с --fuzz=5 для версий драйвера 580 и 590</li></ul>"
  - version: "1.0.0-3"
    type: stable
    unix-timestamp: 1780358400
    description:
      C: "<p>Fixed the Update button appearing incorrectly after updating a kernel, when the old vmlinuz was still present in /boot before reboot.</p><ul><li>Fixed Update button shown incorrectly after updating a kernel before reboot</li></ul>"
      de: "<p>Behoben: Schaltfläche Aktualisieren erschien nach einem Kernel-Update fälschlicherweise, wenn der alte vmlinuz noch vor dem Neustart in /boot vorhanden war.</p><ul><li>Behoben: Schaltflache Aktualisieren nach Kernel-Update vor Neustart falschlich angezeigt</li></ul>"
      es: "<p>Corregido el botón Actualizar que aparecía incorrectamente tras actualizar un kernel, cuando el vmlinuz antiguo aún estaba en /boot antes de reiniciar.</p><ul><li>Corregido boton Actualizar mostrado incorrectamente tras actualizar un kernel antes de reiniciar</li></ul>"
      fr: "<p>Correction du bouton Mettre à jour qui apparaissait incorrectement après la mise à jour d'un noyau, lorsque l'ancien vmlinuz était encore présent dans /boot avant le redémarrage.</p><ul><li>Correction du bouton Mettre a jour affiche incorrectement apres mise a jour avant redemarrage</li></ul>"
      it: "<p>Corretto il pulsante Aggiorna che appariva erroneamente dopo l'aggiornamento di un kernel, quando il vecchio vmlinuz era ancora presente in /boot prima del riavvio.</p><ul><li>Corretto pulsante Aggiorna mostrato erroneamente dopo aggiornamento kernel prima del riavvio</li></ul>"
      pt: "<p>Corrigido o botão Atualizar que aparecia incorretamente após atualizar um kernel, quando o vmlinuz antigo ainda estava presente em /boot antes de reiniciar.</p><ul><li>Corrigido botao Atualizar exibido incorretamente apos atualizar kernel antes de reiniciar</li></ul>"
      ro: "<p>Corectat butonul Actualizare care aparea incorect dupa actualizarea unui kernel, cand vechiul vmlinuz era inca prezent in /boot inainte de repornire.</p><ul><li>Corectat butonul Actualizare afisat incorect dupa actualizarea kernelului inainte de repornire</li></ul>"
      ru: "<p>Исправлена кнопка «Обновить», появлявшаяся ошибочно после обновления ядра, когда старый vmlinuz ещё присутствовал в /boot до перезагрузки.</p><ul><li>Исправлена кнопка Обновить, ошибочно отображавшаяся после обновления ядра до перезагрузки</li></ul>"
  - version: "1.0.0-2"
    type: stable
    unix-timestamp: 1780358400
    description:
      C: "<p>Fixed the Update button not appearing in the Soplos Kernels tab when a newer version was available, fixed stale package data after actions, and fixed apt-cache output parsing on non-English systems.</p><ul><li>Fixed Update button not appearing when a newer kernel version was available in the repository</li><li>Fixed stale package list after install, update or remove actions in Soplos Kernels tab</li><li>Fixed apt-cache policy and show output parsing on non-English systems by forcing LC_ALL=C</li></ul>"
      de: "<p>Behoben: Schaltfläche Aktualisieren fehlte im Tab Soplos-Kernel; veraltete Paketdaten nach Aktionen; apt-cache-Ausgabe auf nicht-englischen Systemen wurde nicht korrekt ausgewertet.</p><ul><li>Behoben: Schaltflache Aktualisieren fehlte bei verfugbarer neuerer Version</li><li>Behoben: Veraltete Paketliste nach Aktionen im Tab Soplos-Kernel</li><li>Behoben: apt-cache-Ausgabe auf nicht-englischen Systemen durch Erzwingen von LC_ALL=C</li></ul>"
      es: "<p>Corregido el botón Actualizar que no aparecía en la pestaña Kernels Soplos cuando había una versión más reciente disponible, corregidos los datos desactualizados tras acciones, y corregido el análisis de la salida de apt-cache en sistemas no ingleses.</p><ul><li>Corregido el boton Actualizar que no aparecia cuando habia una version mas reciente en el repositorio</li><li>Corregida la lista de paquetes desactualizada tras acciones de instalar, actualizar o eliminar</li><li>Corregido el analisis de la salida de apt-cache en sistemas en espanol forzando LC_ALL=C</li></ul>"
      fr: "<p>Correction du bouton Mettre à jour absent dans l'onglet Noyaux Soplos, correction des données obsolètes après actions, et correction de l'analyse de la sortie apt-cache sur les systèmes non anglophones.</p><ul><li>Correction du bouton Mettre a jour absent quand une version plus recente etait disponible</li><li>Correction de la liste de paquets obsolete apres installation, mise a jour ou suppression</li><li>Correction de l'analyse de la sortie apt-cache sur les systemes non anglophones via LC_ALL=C</li></ul>"
      it: "<p>Corretto il pulsante Aggiorna assente nella scheda Kernel Soplos, corretti dati non aggiornati dopo le azioni, e corretta l'analisi dell'output di apt-cache su sistemi non in inglese.</p><ul><li>Corretto pulsante Aggiorna assente quando disponibile versione piu recente</li><li>Corretta lista pacchetti non aggiornata dopo azioni nella scheda Kernel Soplos</li><li>Corretta analisi output apt-cache su sistemi non inglesi tramite LC_ALL=C</li></ul>"
      pt: "<p>Corrigido o botão Atualizar ausente na aba Kernels Soplos, corrigidos dados desatualizados após ações, e corrigida a análise da saída do apt-cache em sistemas não ingleses.</p><ul><li>Corrigido botao Atualizar ausente quando havia versao mais recente disponivel</li><li>Corrigida lista de pacotes desatualizada apos acoes de instalar, atualizar ou remover</li><li>Corrigida analise da saida apt-cache em sistemas nao ingleses com LC_ALL=C</li></ul>"
      ro: "<p>Corectat butonul Actualizare absent in fila Kerneluri Soplos, corectate datele expirate dupa actiuni si corectata analiza rezultatelor apt-cache pe sisteme non-engleze.</p><ul><li>Corectat butonul Actualizare absent cand era disponibila o versiune mai noua</li><li>Corectata lista de pachete expirata dupa actiuni in fila Kerneluri Soplos</li><li>Corectata analiza rezultatelor apt-cache pe sisteme non-engleze prin LC_ALL=C</li></ul>"
      ru: "<p>Исправлена отсутствующая кнопка «Обновить» во вкладке Ядра Soplos, устаревшие данные после действий и разбор вывода apt-cache на не-английских системах.</p><ul><li>Исправлена кнопка Обновить, отсутствовавшая при наличии более новой версии</li><li>Исправлен устаревший список пакетов после действий во вкладке Ядра Soplos</li><li>Исправлен разбор вывода apt-cache на не-английских системах через LC_ALL=C</li></ul>"
  - version: "1.0.0-1"
    type: stable
    unix-timestamp: 1780358400
    description:
      C: "<p>Added a \"Remove repository\" button in the Soplos Kernels tab to remove the repository source and its GPG key without affecting already installed kernels.</p><ul><li>Added \"Remove repository\" button in Soplos Kernels tab</li></ul>"
      de: "<p>Schaltfläche „Repository entfernen\" im Tab Soplos Kernels hinzugefügt — entfernt die Repository-Quelle und den GPG-Schlüssel, ohne bereits installierte Kernel zu beeinflussen.</p><ul><li>Schaltfläche „Repository entfernen\" im Tab Soplos Kernels hinzugefügt</li></ul>"
      es: "<p>Se ha añadido un botón \"Eliminar repositorio\" en la pestaña Soplos Kernels para eliminar la fuente del repositorio y su clave GPG sin afectar a los kernels ya instalados.</p><ul><li>Añadido botón \"Eliminar repositorio\" en la pestaña Soplos Kernels</li></ul>"
      fr: "<p>Ajout d'un bouton « Supprimer le dépôt » dans l'onglet Soplos Kernels pour supprimer la source du dépôt et sa clé GPG sans affecter les noyaux déjà installés.</p><ul><li>Ajout du bouton « Supprimer le dépôt » dans l'onglet Soplos Kernels</li></ul>"
      it: "<p>Aggiunto il pulsante \"Rimuovi repository\" nella scheda Soplos Kernels per rimuovere la sorgente del repository e la sua chiave GPG senza influire sui kernel già installati.</p><ul><li>Aggiunto pulsante \"Rimuovi repository\" nella scheda Soplos Kernels</li></ul>"
      pt: "<p>Adicionado um botão \"Remover repositório\" no separador Soplos Kernels para remover a fonte do repositório e a sua chave GPG sem afetar os kernels já instalados.</p><ul><li>Adicionado botão \"Remover repositório\" no separador Soplos Kernels</li></ul>"
      ro: "<p>Adăugat butonul „Elimină depozitul\" în fila Soplos Kernels pentru a elimina sursa depozitului și cheia GPG fără a afecta kernelurile deja instalate.</p><ul><li>Adăugat butonul „Elimină depozitul\" în fila Soplos Kernels</li></ul>"
      ru: "<p>Добавлена кнопка «Удалить репозиторий» во вкладке Soplos Kernels для удаления источника репозитория и его GPG-ключа без затрагивания уже установленных ядер.</p><ul><li>Добавлена кнопка «Удалить репозиторий» во вкладке Soplos Kernels</li></ul>"
  - version: "1.0.0"
    type: stable
    unix-timestamp: 1775347200
    description:
      C: "<p>Initial release of Soplos Kernel Installer with comprehensive kernel management features including PREEMPT_RT integration, source reuse, and Secure Boot support.</p><ul><li>Download kernels from stable, LTS, RC and Soplos featured channels</li><li>BORE, PREEMPT_RT, Zen and NTSYNC patch support from original sources</li><li>Gaming, Audio/Video, Minimal and Hardware Optimized profiles</li><li>Source reuse for faster recompilation with patch conflict detection</li><li>Expandable installation history with automatic kernel tagging</li><li>Secure Boot MOK signing with NVIDIA DKMS support</li><li>Automatic NVIDIA VMA API patch for kernel 7.0+ compatibility</li><li>DKMS MOK key enrollment prompt after installation when NVIDIA GPU detected — fixes NVENC and CUDA with Secure Boot</li><li>Option to save compiled .deb packages before build directory cleanup</li><li>MOK key storage path shown in key management dialog</li><li>Fixed all kernel profile compilation bugs (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Fixed GPU detection to avoid false positives from AMD CPU lines</li><li>Build directory cleanup checkbox now works correctly</li><li>EOL kernels from kernel.org now shown as \"(EOL)\" with a warning — previously hidden from the list</li><li>Mainline kernels (e.g. 7.0) no longer incorrectly shown as \"(latest)\"</li><li>Complete internationalization for 8 languages</li><li>Fixed MOK password shell injection — password safely escaped with shlex.quote()</li><li>Fixed install button allowing duplicate builds — now disabled on first click</li><li>Custom kernel name validated against allowed characters before install</li><li>remove_kernel() validates release string before building shell commands</li><li>Hidden \"Soplos Stock\" profile (Ctrl+Shift+D) for distributing vanilla kernels across all Soplos distributions</li><li>MOK dialog now explains the DKMS automatic rebuild cycle on each new kernel install</li><li>Second make olddefconfig pass after profile options — prevents interactive config prompts mid-build</li><li>9 missing i18n strings completed in all 8 languages</li><li>Soplos Kernels tab — install pre-built Stock, Gaming (BORE+NTSYNC) and Real-Time (PREEMPT_RT) kernels from the official repository without compilation</li><li>Tabbed interface with Build Kernel and Soplos Kernels tabs</li><li>Persistent build history in ~/.local/share/soplos-kernel-installer/ — survives build directory cleanup</li><li>Clean compiled package naming — version no longer duplicated in filename</li><li>Fixed MOK signed kernel detection — now also physically verifies vmlinuz files</li><li>Fixed STOCK profile package naming — trailing dash removed when suffix is empty</li><li>Fixed Soplos Kernels detection via /boot filesystem check — works regardless of removal method</li><li>Fixed kernel history list refresh after Soplos Kernels tab actions</li><li>Dynamic Kernel List: Soplos Kernels tab reads available packages from apt-cache at runtime — new packages in the repository appear automatically</li><li>Refresh button in Soplos Kernels tab forces apt-get update and reloads the kernel list</li><li>Stock profile post-build: creates metapackage .deb and prompts to save all packages (image + headers + metapackage) to a folder — does not install the kernel</li><li>New pre-built kernel variants: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming renamed to linux-soplos-bore)</li><li>Fixed: kernel release now read from include/config/kernel.release in the source tree — correctly handles patch-injected version suffixes (e.g. zen1 from the Zen patch)</li><li>Ctrl+Tab / Ctrl+Shift+Tab keyboard shortcuts to switch between tabs</li><li>Version number displayed next to each kernel name in the Soplos Kernels tab</li><li>Update button in Soplos Kernels tab — appears when a newer version is available in the repository, upgrades the metapackage and purges old kernel image and headers automatically</li><li>Fixed: Stock post-build package discovery now correctly handles patch-injected version suffixes (e.g. zen1 from the Zen patch) — image and headers are found reliably</li><li>Fixed: After updating a Soplos kernel, old image and headers packages for the same variant are purged without manual intervention</li></ul>"
      de: "<p>Erstveröffentlichung des Soplos Kernel-Installers mit umfassenden Kernel-Verwaltungsfunktionen, einschließlich PREEMPT_RT-Integration, Quellcode-Wiederverwendung und Secure Boot-Unterstützung.</p><ul><li>Kernel von stabilen, LTS, RC und Soplos Featured-Kanälen herunterladen</li><li>BORE-, PREEMPT_RT-, Zen- und NTSYNC-Patch-Unterstützung von Originalquellen</li><li>Gaming-, Audio/Video-, Minimal- und Hardware-optimierte Profile</li><li>Quellcode-Wiederverwendung für schnellere Rekompilierung mit Patch-Konflikterkennung</li><li>Erweiterbarer Installationsverlauf mit automatischer Kernel-Kennzeichnung</li><li>Secure Boot MOK-Signierung mit NVIDIA DKMS-Unterstützung</li><li>Automatischer NVIDIA VMA-Patch für Kernel 7.0+-Kompatibilität</li><li>Automatische DKMS MOK-Schlüsselregistrierung nach der Installation mit NVIDIA GPU — behebt NVENC und CUDA mit Secure Boot</li><li>Option zum Speichern kompilierter .deb-Pakete vor der Build-Verzeichnisbereinigung</li><li>MOK-Schlüssel-Speicherpfad im Schlüsselverwaltungsdialog sichtbar</li><li>Alle Kernel-Profil-Kompilierungsfehler behoben (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>GPU-Erkennung korrigiert, um Falschmeldungen durch AMD-CPU-Zeilen zu vermeiden</li><li>Kontrollkästchen zur Build-Verzeichnisbereinigung funktioniert jetzt korrekt</li><li>EOL-Kernel von kernel.org werden jetzt als \"(EOL)\" mit Warnung angezeigt — vorher ausgeblendet</li><li>Mainline-Kernel (z.B. 7.0) werden nicht mehr fälschlicherweise als \"(neueste)\" angezeigt</li><li>Vollständige Internationalisierung für 8 Sprachen</li><li>MOK-Passwort-Injektion behoben — Passwort wird sicher maskiert</li><li>Installationsschaltfläche beim ersten Klick deaktiviert, um doppelte Builds zu verhindern</li><li>Kernel-Name wird vor der Installation validiert</li><li>Verstecktes \"Soplos Stock\"-Profil (Strg+Umsch+D) zur Verteilung von Vanilla-Kerneln auf allen Soplos-Distributionen</li><li>MOK-Dialog erklärt jetzt den automatischen DKMS-Neuerstellungszyklus bei jedem neuen Kernel</li><li>Zweiter make olddefconfig-Durchlauf nach Profiloptionen — verhindert interaktive Eingabeaufforderungen während des Builds</li><li>9 fehlende i18n-Strings in allen 8 Sprachen vervollständigt</li><li>Soplos Kernels-Tab — installiert vorkompilierte Stock-, Gaming- (BORE+NTSYNC) und Real-Time-Kernel (PREEMPT_RT) aus dem offiziellen Repository ohne Kompilierung</li><li>Tab-Oberfläche: Build Kernel und Soplos Kernels</li><li>Persistenter Verlauf in ~/.local/share/soplos-kernel-installer/ — übersteht die Build-Verzeichnisbereinigung</li><li>Saubere Paketnamen — die Version wird im Dateinamen nicht mehr dupliziert</li><li>Korrektur der MOK-signierten Kernel-Erkennung — prüft jetzt physisch die vmlinuz-Dateien</li><li>Korrektur des STOCK-Profils — überflüssiger Bindestrich bei leerem Suffix entfernt</li><li>Soplos-Kernel-Erkennung über /boot — funktioniert unabhängig von der Deinstallationsmethode</li><li>Kernel-Verlauf wird nach Aktionen im Soplos Kernels-Tab aktualisiert</li><li>Dynamische Kernel-Liste: Der Soplos Kernels-Tab liest verfügbare Pakete zur Laufzeit aus apt-cache — neue Pakete im Repository erscheinen automatisch</li><li>Die Schaltfläche Aktualisieren im Soplos Kernels-Tab erzwingt apt-get update und lädt die Kernel-Liste neu</li><li>Post-Build mit Stock-Profil: erstellt das Metapaket .deb und bietet an, alle Pakete (Image + Headers + Metapaket) in einem Ordner zu speichern — ohne den Kernel zu installieren</li><li>Neue vorkompilierte Kernel-Varianten: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming in linux-soplos-bore umbenannt)</li><li>Behoben: Kernel-Release-Name wird jetzt aus include/config/kernel.release gelesen — verarbeitet korrekt durch Patches injizierte Versionssuffixe (z.B. zen1 vom Zen-Patch)</li><li>Tastenkürzel Ctrl+Tab / Ctrl+Shift+Tab zum Wechseln zwischen Tabs</li><li>Verfügbare Version neben dem Namen jedes Kernels im Soplos Kernels-Tab angezeigt</li><li>Update-Schaltfläche im Soplos Kernels-Tab — erscheint, wenn eine neuere Version im Repository verfügbar ist; aktualisiert das Metapaket und entfernt automatisch alte Kernel-Image und -Header</li><li>Behoben: Die Paketsuche nach einem Stock-Build verarbeitet jetzt korrekt durch Patches injizierte Versionssuffixe (z.B. zen1 vom Zen-Patch)</li><li>Behoben: Nach der Aktualisierung eines Soplos-Kernels werden alte Image- und Header-Pakete desselben Typs ohne manuelle Eingriffe bereinigt</li></ul>"
      es: "<p>Lanzamiento inicial del Instalador de Kernel Soplos con funciones completas de gestión de kernels, incluyendo integración de PREEMPT_RT, reutilización de código fuente y soporte para Secure Boot.</p><ul><li>Descarga kernels de canales stable, LTS, RC y Soplos featured</li><li>Soporte de parches BORE, PREEMPT_RT, Zen y NTSYNC desde fuentes originales</li><li>Perfiles optimizados para Gaming, Audio/Video, Oficina y Hardware</li><li>Reutilización de fuentes para compilación rápida con detección de conflictos</li><li>Historial de instalación expandible con etiquetado automático de kernels</li><li>Firma MOK de Secure Boot con soporte para NVIDIA DKMS</li><li>Parche VMA automático de NVIDIA para compatibilidad con kernel 7.0+</li><li>Enroll automático de clave DKMS MOK tras instalación con GPU NVIDIA — soluciona NVENC y CUDA con Secure Boot</li><li>Opción para guardar los paquetes .deb compilados antes de limpiar el directorio de build</li><li>Ruta de almacenamiento de claves MOK visible en el diálogo de gestión</li><li>Corregidos todos los bugs de compilación de perfiles de kernel (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Corregida la detección de GPU para evitar falsos positivos por líneas de CPU AMD</li><li>El checkbox de limpieza del directorio de build ahora funciona correctamente</li><li>Los kernels EOL de kernel.org ahora aparecen como \"(EOL)\" con aviso — antes no se mostraban</li><li>Los kernels mainline (p.ej. 7.0) ya no se muestran incorrectamente como \"(último)\"</li><li>Internacionalización completa para 8 idiomas</li><li>Inyección de contraseña MOK corregida — contraseña escapada de forma segura</li><li>El botón de instalación se desactiva al primer clic para evitar builds duplicados</li><li>El nombre del kernel se valida antes de instalar</li><li>Perfil oculto \"Soplos Stock\" (Ctrl+Mayús+D) para distribuir kernels vanilla en todas las distribuciones Soplos</li><li>El diálogo MOK explica ahora el ciclo de reconstrucción automática de DKMS en cada nuevo kernel</li><li>Segunda pasada de make olddefconfig tras aplicar opciones de perfil — evita prompts interactivos durante el build</li><li>9 cadenas i18n faltantes completadas en los 8 idiomas</li><li>Pestaña Soplos Kernels — instala kernels Stock, Gaming (BORE+NTSYNC) y Real-Time (PREEMPT_RT) desde el repositorio oficial sin compilar</li><li>Interfaz con pestañas: Build Kernel y Soplos Kernels</li><li>Historial persistente en ~/.local/share/soplos-kernel-installer/ — sobrevive a la limpieza del directorio de build</li><li>Nombres de paquetes compilados limpios — la versión ya no aparece duplicada en el nombre de archivo</li><li>Corrección en la detección de kernels firmados MOK — ahora verifica físicamente los archivos vmlinuz</li><li>Corrección en el perfil STOCK — eliminado guion sobrante cuando el sufijo está vacío</li><li>Detección de kernels Soplos mediante comprobación en /boot — funciona independientemente del método de desinstalación</li><li>El historial de kernels se actualiza tras las acciones en la pestaña Soplos Kernels</li><li>Lista dinámica de kernels: la pestaña Soplos Kernels lee los paquetes disponibles de apt-cache en tiempo de ejecución — los nuevos paquetes del repositorio aparecen automáticamente</li><li>El botón Actualizar de la pestaña Soplos Kernels fuerza apt-get update y recarga la lista de kernels</li><li>Post-compilación con perfil Stock: crea el metapaquete .deb y ofrece guardar todos los paquetes (imagen + cabeceras + metapaquete) sin instalar el kernel</li><li>Nuevas variantes de kernel precompilado: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming renombrado a linux-soplos-bore)</li><li>Corregido: el nombre de release del kernel se lee ahora de include/config/kernel.release — maneja correctamente los sufijos de versión inyectados por parches (p.ej. zen1 del parche Zen)</li><li>Atajos de teclado Ctrl+Tab / Ctrl+Shift+Tab para cambiar de pestaña</li><li>Versión disponible visible junto al nombre de cada kernel en la pestaña Soplos Kernels</li><li>Botón Update en la pestaña Soplos Kernels — aparece cuando hay una versión más nueva en el repositorio, actualiza el metapaquete y purga automáticamente la imagen y cabeceras antiguas</li><li>Corregido: la búsqueda de paquetes post-compilación Stock ahora maneja correctamente los sufijos de versión inyectados por parches (p.ej. zen1 del parche Zen)</li><li>Corregido: tras actualizar un kernel Soplos, los paquetes de imagen y cabeceras del kernel anterior se purgan sin intervención manual</li></ul>"
      fr: "<p>Sortie initiale de l'Installateur de Kernel Soplos avec des fonctionnalités complètes de gestion des noyaux, y compris l'intégration de PREEMPT_RT, la réutilisation du code source et le support Secure Boot.</p><ul><li>Téléchargez des noyaux à partir des canaux stable, LTS, RC et Soplos</li><li>Support des patchs BORE, PREEMPT_RT, Zen et NTSYNC à partir des sources originales</li><li>Profils optimisés pour le jeu, l'audio/vidéo, le bureau et le matériel</li><li>Réutilisation des sources pour une recompilation plus rapide avec détection des conflits</li><li>Historique d'installation extensible avec étiquetage automatique des noyaux</li><li>Signature Secure Boot MOK avec support NVIDIA DKMS</li><li>Patch VMA automatique NVIDIA pour la compatibilité avec le noyau 7.0+</li><li>Enrôlement automatique de la clé DKMS MOK après installation avec GPU NVIDIA — corrige NVENC et CUDA avec Secure Boot</li><li>Option pour sauvegarder les paquets .deb compilés avant la suppression du répertoire de build</li><li>Chemin de stockage des clés MOK visible dans le dialogue de gestion</li><li>Correction de tous les bugs de compilation des profils noyau (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Détection GPU corrigée pour éviter les faux positifs des lignes CPU AMD</li><li>La case à cocher de nettoyage du répertoire de build fonctionne désormais correctement</li><li>Les noyaux EOL de kernel.org s'affichent désormais en \"(EOL)\" avec un avertissement — auparavant masqués</li><li>Les noyaux mainline (ex. 7.0) ne s'affichent plus incorrectement comme \"(dernier)\"</li><li>Internationalisation complète pour 8 langues</li><li>Injection de mot de passe MOK corrigée — mot de passe échappé de manière sécurisée</li><li>Le bouton d'installation est désactivé au premier clic pour éviter les builds en double</li><li>Le nom du noyau est validé avant l'installation</li><li>Profil caché \"Soplos Stock\" (Ctrl+Maj+D) pour distribuer des noyaux vanilla sur toutes les distributions Soplos</li><li>Le dialogue MOK explique désormais le cycle de reconstruction automatique DKMS à chaque nouveau noyau</li><li>Deuxième passe make olddefconfig après les options de profil — évite les prompts interactifs pendant le build</li><li>9 chaînes i18n manquantes complétées dans les 8 langues</li><li>Onglet Soplos Kernels — installe des noyaux Stock, Gaming (BORE+NTSYNC) et Real-Time (PREEMPT_RT) depuis le dépôt officiel sans compilation</li><li>Interface avec onglets : Build Kernel et Soplos Kernels</li><li>Historique persistant dans ~/.local/share/soplos-kernel-installer/ — survit au nettoyage du répertoire de build</li><li>Noms de paquets compilés propres — la version n'est plus dupliquée dans le nom de fichier</li><li>Correction de la détection des noyaux signés MOK — vérifie désormais physiquement les fichiers vmlinuz</li><li>Correction du profil STOCK — tiret superflu supprimé quand le suffixe est vide</li><li>Détection des noyaux Soplos via /boot — fonctionne quelle que soit la méthode de désinstallation</li><li>La liste de l'historique se rafraîchit après les actions dans l'onglet Soplos Kernels</li><li>Liste dynamique des noyaux: l'onglet Soplos Kernels lit les paquets disponibles depuis apt-cache à l'exécution — les nouveaux paquets du dépôt apparaissent automatiquement</li><li>Le bouton Actualiser de l'onglet Soplos Kernels force apt-get update et recharge la liste des noyaux</li><li>Post-compilation avec le profil Stock: crée le métapaquet .deb et propose de sauvegarder tous les paquets (image + en-têtes + métapaquet) sans installer le noyau</li><li>Nouvelles variantes de noyau précompilé: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming renommé en linux-soplos-bore)</li><li>Corrigé: le nom de release du noyau est maintenant lu depuis include/config/kernel.release — gère correctement les suffixes de version injectés par les patchs (ex. zen1 du patch Zen)</li><li>Raccourcis clavier Ctrl+Tab / Ctrl+Shift+Tab pour changer d'onglet</li><li>Version disponible affichée à côté du nom de chaque noyau dans l'onglet Soplos Kernels</li><li>Bouton Update dans l'onglet Soplos Kernels — apparaît quand une version plus récente est disponible dans le dépôt, met à jour le métapaquet et purge automatiquement l'ancienne image et les en-têtes</li><li>Corrigé: la recherche de paquets post-compilation Stock gère correctement les suffixes de version injectés par les patchs (ex. zen1 du patch Zen)</li><li>Corrigé: après la mise à jour d'un noyau Soplos, les anciens paquets image et en-têtes du même variant sont purgés sans intervention manuelle</li></ul>"
      it: "<p>Rilascio iniziale dell'Installatore Kernel Soplos con funzionalità complete di gestione del kernel, inclusa l'integrazione PREEMPT_RT, il riutilizzo del sorgente e il supporto Secure Boot.</p><ul><li>Scarica i kernel dai canali stable, LTS, RC e Soplos</li><li>Supporto patch BORE, PREEMPT_RT, Zen e NTSYNC dalle fonti originali</li><li>Profili Gaming, Audio/Video, Minimal e Hardware Optimized</li><li>Riutilizzo dei sorgenti per una ricompilazione più veloce con rilevamento dei conflitti</li><li>Cronologia di installazione espandibile con tagging automatico del kernel</li><li>Firma MOK di Secure Boot con supporto NVIDIA DKMS</li><li>Patch VMA automatica NVIDIA per la compatibilità con kernel 7.0+</li><li>Registrazione automatica della chiave DKMS MOK dopo l'installazione con GPU NVIDIA — risolve NVENC e CUDA con Secure Boot</li><li>Opzione per salvare i pacchetti .deb compilati prima della pulizia della directory di build</li><li>Percorso di archiviazione delle chiavi MOK visibile nella finestra di gestione</li><li>Corretti tutti i bug di compilazione dei profili kernel (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Rilevamento GPU corretto per evitare falsi positivi dalle righe CPU AMD</li><li>La casella di controllo per la pulizia della directory di build ora funziona correttamente</li><li>I kernel EOL di kernel.org ora mostrano \"(EOL)\" con avviso — prima erano nascosti</li><li>I kernel mainline (es. 7.0) non vengono più visualizzati erroneamente come \"(ultimo)\"</li><li>Internazionalizzazione completa per 8 lingue</li><li>Iniezione password MOK corretta — password mascherata in modo sicuro</li><li>Il pulsante di installazione è disabilitato al primo clic per evitare build duplicate</li><li>Il nome del kernel viene validato prima dell'installazione</li><li>Profilo nascosto \"Soplos Stock\" (Ctrl+Maiusc+D) per distribuire kernel vanilla su tutte le distribuzioni Soplos</li><li>Il dialogo MOK spiega ora il ciclo di ricostruzione automatica DKMS ad ogni nuovo kernel</li><li>Seconda passata make olddefconfig dopo le opzioni di profilo — evita prompt interattivi durante il build</li><li>9 stringhe i18n mancanti completate in tutti gli 8 idiomi</li><li>Scheda Soplos Kernels — installa kernel Stock, Gaming (BORE+NTSYNC) e Real-Time (PREEMPT_RT) dal repository ufficiale senza compilazione</li><li>Interfaccia a schede: Build Kernel e Soplos Kernels</li><li>Cronologia persistente in ~/.local/share/soplos-kernel-installer/ — sopravvive alla pulizia della directory di build</li><li>Nomi dei pacchetti compilati puliti — la versione non viene più duplicata nel nome del file</li><li>Correzione del rilevamento dei kernel firmati MOK — ora verifica fisicamente i file vmlinuz</li><li>Correzione del profilo STOCK — trattino superfluo rimosso quando il suffisso è vuoto</li><li>Rilevamento dei kernel Soplos tramite /boot — funziona indipendentemente dal metodo di rimozione</li><li>La cronologia dei kernel si aggiorna dopo le azioni nella scheda Soplos Kernels</li><li>Lista dinamica dei kernel: la scheda Soplos Kernels legge i pacchetti disponibili da apt-cache in fase di esecuzione — i nuovi pacchetti nel repository appaiono automaticamente</li><li>Il pulsante Aggiorna nella scheda Soplos Kernels forza apt-get update e ricarica la lista dei kernel</li><li>Post-build con il profilo Stock: crea il metapacchetto .deb e offre di salvare tutti i pacchetti (immagine + headers + metapacchetto) senza installare il kernel</li><li>Nuove varianti di kernel precompilato: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming rinominato in linux-soplos-bore)</li><li>Corretto: il nome di release del kernel viene ora letto da include/config/kernel.release — gestisce correttamente i suffissi di versione iniettati dai patch (es. zen1 dal patch Zen)</li><li>Scorciatoie da tastiera Ctrl+Tab / Ctrl+Shift+Tab per passare tra le schede</li><li>Versione disponibile visualizzata accanto al nome di ogni kernel nella scheda Soplos Kernels</li><li>Pulsante Update nella scheda Soplos Kernels — appare quando è disponibile una versione più recente nel repository, aggiorna il metapacchetto e rimuove automaticamente immagine e header precedenti</li><li>Corretto: la ricerca di pacchetti post-compilazione Stock ora gestisce correttamente i suffissi di versione iniettati dai patch (es. zen1 dal patch Zen)</li><li>Corretto: dopo l'aggiornamento di un kernel Soplos, i vecchi pacchetti immagine e header dello stesso tipo vengono purgati senza intervento manuale</li></ul>"
      pt: "<p>Lançamento inicial do Instalador de Kernel Soplos com recursos abrangentes de gerenciamento de kernel, incluindo integração PREEMPT_RT, reutilização de código-fonte e suporte a Secure Boot.</p><ul><li>Baixe kernels de canais estáveis, LTS, RC e destaques Soplos</li><li>Suporte a patches BORE, PREEMPT_RT, Zen e NTSYNC de fontes originais</li><li>Perfis para Gaming, Áudio/Vídeo, Escritório e Otimizado para Hardware</li><li>Reutilização de fontes para recompilação rápida com detecção de conflitos</li><li>Histórico de instalação expansível com marcação automática de kernel</li><li>Assinatura Secure Boot MOK com suporte NVIDIA DKMS</li><li>Patch VMA automático da NVIDIA para compatibilidade com kernel 7.0+</li><li>Enroll automático da chave DKMS MOK após instalação com GPU NVIDIA — corrige NVENC e CUDA com Secure Boot</li><li>Opção para salvar pacotes .deb compilados antes de limpar o diretório de build</li><li>Caminho de armazenamento das chaves MOK visível no diálogo de gestão</li><li>Corrigidos todos os bugs de compilação de perfis de kernel (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Detecção de GPU corrigida para evitar falsos positivos de linhas de CPU AMD</li><li>A caixa de seleção de limpeza do diretório de build agora funciona corretamente</li><li>Kernels EOL do kernel.org agora aparecem como \"(EOL)\" com aviso — antes estavam ocultos</li><li>Kernels mainline (ex. 7.0) não são mais exibidos incorretamente como \"(mais recente)\"</li><li>Internacionalização completa para 8 idiomas</li><li>Injeção de senha MOK corrigida — senha escapada de forma segura</li><li>Botão de instalação desativado no primeiro clique para evitar builds duplicados</li><li>Nome do kernel validado antes de instalar</li><li>Perfil oculto \"Soplos Stock\" (Ctrl+Shift+D) para distribuir kernels vanilla em todas as distribuições Soplos</li><li>Diálogo MOK agora explica o ciclo de reconstrução automática do DKMS a cada novo kernel</li><li>Segunda passagem de make olddefconfig após opções de perfil — evita prompts interativos durante o build</li><li>9 strings i18n ausentes completadas nos 8 idiomas</li><li>Aba Soplos Kernels — instala kernels Stock, Gaming (BORE+NTSYNC) e Real-Time (PREEMPT_RT) do repositório oficial sem compilação</li><li>Interface com abas: Build Kernel e Soplos Kernels</li><li>Histórico persistente em ~/.local/share/soplos-kernel-installer/ — sobrevive à limpeza do diretório de build</li><li>Nomes de pacotes compilados limpos — a versão não aparece mais duplicada no nome do arquivo</li><li>Correção na detecção de kernels assinados MOK — agora verifica fisicamente os arquivos vmlinuz</li><li>Correção no perfil STOCK — hífen desnecessário removido quando o sufixo está vazio</li><li>Detecção de kernels Soplos via /boot — funciona independentemente do método de remoção</li><li>O histórico de kernels é atualizado após ações na aba Soplos Kernels</li><li>Lista dinâmica de kernels: a aba Soplos Kernels lê os pacotes disponíveis do apt-cache em tempo de execução — novos pacotes no repositório aparecem automaticamente</li><li>O botão Atualizar da aba Soplos Kernels força apt-get update e recarrega a lista de kernels</li><li>Pós-build com o perfil Stock: cria o metapacote .deb e oferece salvar todos os pacotes (imagem + headers + metapacote) sem instalar o kernel</li><li>Novas variantes de kernel pré-compilado: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming renomeado para linux-soplos-bore)</li><li>Corrigido: o nome de release do kernel agora é lido de include/config/kernel.release — trata corretamente os sufixos de versão injetados por patches (ex. zen1 do patch Zen)</li><li>Atalhos de teclado Ctrl+Tab / Ctrl+Shift+Tab para alternar entre abas</li><li>Versão disponível exibida ao lado do nome de cada kernel na aba Soplos Kernels</li><li>Botão Update na aba Soplos Kernels — aparece quando uma versão mais recente está disponível no repositório, atualiza o metapacote e purga automaticamente a imagem e headers antigos</li><li>Corrigido: a busca de pacotes pós-compilação Stock agora lida corretamente com sufixos de versão injetados por patches (ex. zen1 do patch Zen)</li><li>Corrigido: após atualizar um kernel Soplos, os pacotes de imagem e headers antigos do mesmo tipo são purgados sem intervenção manual</li></ul>"
      ro: "<p>Versiunea inițială a Instalatorului de Kernel Soplos cu funcții complete de gestionare a nucleelor, inclusiv integrarea PREEMPT_RT, reutilizarea sursei și suportul Secure Boot.</p><ul><li>Descărcați nuclee de pe canalele stable, LTS, RC și Soplos</li><li>Suport de patch-uri BORE, PREEMPT_RT, Zen și NTSYNC din surse originale</li><li>Profiluri pentru Jocuri, Audio/Video, Minimal și Optimizat pentru Hardware</li><li>Reutilizarea sursei pentru recompilare mai rapidă cu detectarea conflictelor</li><li>Istoric de instalare extensibil cu etichetare automată a nucleului</li><li>Semnătura Secure Boot MOK cu suport NVIDIA DKMS</li><li>Patch VMA automat NVIDIA pentru compatibilitate cu nucleul 7.0+</li><li>Înregistrare automată a cheii DKMS MOK după instalare cu GPU NVIDIA — rezolvă NVENC și CUDA cu Secure Boot</li><li>Opțiune pentru salvarea pachetelor .deb compilate înainte de ștergerea directorului de build</li><li>Calea de stocare a cheilor MOK vizibilă în dialogul de gestionare</li><li>Corectate toate erorile de compilare a profilurilor de nucleu (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Detectarea GPU corectată pentru a evita fals pozitivele din liniile CPU AMD</li><li>Bifa de curățare a directorului de build funcționează acum corect</li><li>Nucleele EOL de pe kernel.org apar acum ca \"(EOL)\" cu avertisment — anterior erau ascunse</li><li>Nucleele mainline (ex. 7.0) nu mai sunt afișate incorect ca \"(cele mai recente)\"</li><li>Internaționalizare completă pentru 8 limbi</li><li>Injecția parolei MOK corectată — parola mascată în siguranță</li><li>Butonul de instalare dezactivat la primul clic pentru a evita build-uri duplicate</li><li>Numele nucleului validat înainte de instalare</li><li>Profil ascuns \"Soplos Stock\" (Ctrl+Shift+D) pentru distribuirea nucleelor vanilla pe toate distribuțiile Soplos</li><li>Dialogul MOK explică acum ciclul de reconstruire automată DKMS la fiecare nucleu nou</li><li>A doua trecere make olddefconfig după opțiunile de profil — previne prompt-urile interactive în timpul build-ului</li><li>9 șiruri i18n lipsă completate în toate cele 8 limbi</li><li>Fila Soplos Kernels — instalează nuclee Stock, Gaming (BORE+NTSYNC) și Real-Time (PREEMPT_RT) din depozitul oficial fără compilare</li><li>Interfață cu file: Build Kernel și Soplos Kernels</li><li>Istoric persistent în ~/.local/share/soplos-kernel-installer/ — supraviețuiește curățării directorului de build</li><li>Nume de pachete compilate curate — versiunea nu mai apare duplicată în numele fișierului</li><li>Corectarea detectării nucleelor semnate MOK — verifică acum fizic fișierele vmlinuz</li><li>Corectarea profilului STOCK — linia de unire inutilă eliminată când sufixul este gol</li><li>Detectarea nucleelor Soplos prin /boot — funcționează indiferent de metoda de dezinstalare</li><li>Lista istoricului de nuclee se actualizează după acțiunile din fila Soplos Kernels</li><li>Listă dinamică de nuclee: fila Soplos Kernels citește pachetele disponibile din apt-cache la execuție — pachetele noi din depozit apar automat</li><li>Butonul Actualizare din fila Soplos Kernels forțează apt-get update și reîncarcă lista de nuclee</li><li>Post-compilare cu profilul Stock: creează metapachetul .deb și oferă salvarea tuturor pachetelor (imagine + antete + metapaket) fără a instala nucleul</li><li>Noi variante de nuclee precompilate: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming redenumit în linux-soplos-bore)</li><li>Corectat: numele de release al nucleului se citește acum din include/config/kernel.release — gestionează corect sufixele de versiune injectate de patch-uri (ex. zen1 de la patch-ul Zen)</li><li>Scurtături de tastatură Ctrl+Tab / Ctrl+Shift+Tab pentru a comuta între file</li><li>Versiunea disponibilă afișată lângă numele fiecărui nucleu în fila Soplos Kernels</li><li>Buton Update în fila Soplos Kernels — apare când o versiune mai nouă este disponibilă în depozit, actualizează metapachetul și purgează automat imaginea și antetele vechi</li><li>Corectat: căutarea pachetelor post-compilare Stock gestionează acum corect sufixele de versiune injectate de patch-uri (ex. zen1 de la patch-ul Zen)</li><li>Corectat: după actualizarea unui nucleu Soplos, pachetele vechi de imagine și antete ale aceluiași tip sunt șterse fără intervenție manuală</li></ul>"
      ru: "<p>Первоначальный выпуск Установщика ядра Soplos с комплексными функциями управления ядрами, включая интеграцию PREEMPT_RT, повторное использование исходного кода и поддержку Secure Boot.</p><ul><li>Загрузка ядер из стабильных, LTS, RC и избранных каналов Soplos</li><li>Поддержка патчей BORE, PREEMPT_RT, Zen и NTSYNC из оригинальных источников</li><li>Профили для игр, Аудио/Видео, Минимальный и Оптимизированный для оборудования</li><li>Повторное использование исходников для быстрой компиляции с обнаружением конфликтов</li><li>Расширяемая история установки с автоматической маркировкой ядер</li><li>Подпись Secure Boot MOK с поддержкой NVIDIA DKMS</li><li>Автоматический патч VMA NVIDIA для совместимости с ядром 7.0+</li><li>Автоматическая регистрация ключа DKMS MOK после установки с GPU NVIDIA — исправляет NVENC и CUDA с Secure Boot</li><li>Возможность сохранить скомпилированные пакеты .deb перед очисткой директории сборки</li><li>Путь хранения ключей MOK отображается в диалоге управления ключами</li><li>Исправлены все ошибки компиляции профилей ядра (PREEMPT_DYNAMIC, THP, DEBUG_INFO)</li><li>Исправлено определение GPU для устранения ложных срабатываний от строк CPU AMD</li><li>Флажок очистки директории сборки теперь работает корректно</li><li>Ядра EOL с kernel.org теперь отображаются как \"(EOL)\" с предупреждением — ранее были скрыты</li><li>Ядра mainline (напр. 7.0) больше не отображаются ошибочно как \"(последнее)\"</li><li>Полная интернационализация на 8 языков</li><li>Исправлена инъекция пароля MOK — пароль безопасно экранируется</li><li>Кнопка установки отключается при первом нажатии во избежание дублирующих сборок</li><li>Имя ядра проверяется перед установкой</li><li>Скрытый профиль \"Soplos Stock\" (Ctrl+Shift+D) для распространения ванильных ядер во всех дистрибутивах Soplos</li><li>Диалог MOK теперь объясняет цикл автоматической пересборки DKMS при каждом новом ядре</li><li>Второй проход make olddefconfig после применения опций профиля — предотвращает интерактивные запросы во время сборки</li><li>9 недостающих строк i18n дополнены во всех 8 языках</li><li>Вкладка Soplos Kernels — установка готовых ядер Stock, Gaming (BORE+NTSYNC) и Real-Time (PREEMPT_RT) из официального репозитория без компиляции</li><li>Интерфейс с вкладками: Build Kernel и Soplos Kernels</li><li>Постоянная история в ~/.local/share/soplos-kernel-installer/ — сохраняется после очистки директории сборки</li><li>Чистые имена скомпилированных пакетов — версия больше не дублируется в имени файла</li><li>Исправлено определение ядер с подписью MOK — теперь физически проверяет файлы vmlinuz</li><li>Исправлен профиль STOCK — лишний дефис убран при пустом суффиксе</li><li>Определение ядер Soplos через /boot — работает независимо от способа удаления</li><li>Список истории ядер обновляется после действий во вкладке Soplos Kernels</li><li>Динамический список ядер: вкладка Soplos Kernels читает доступные пакеты из apt-cache в режиме реального времени — новые пакеты в репозитории появляются автоматически</li><li>Кнопка Обновить во вкладке Soplos Kernels запускает apt-get update и перезагружает список ядер</li><li>Пост-сборка с профилем Stock: создаёт метапакет .deb и предлагает сохранить все пакеты (образ + заголовки + метапакет) без установки ядра</li><li>Новые варианты готовых ядер: linux-soplos-bore, linux-soplos-bore-ntsync, linux-soplos-zen, linux-soplos-ntsync (linux-soplos-gaming переименован в linux-soplos-bore)</li><li>Исправлено: имя релиза ядра теперь читается из include/config/kernel.release — корректно обрабатывает суффиксы версий, добавленные патчами (напр. zen1 от патча Zen)</li><li>Горячие клавиши Ctrl+Tab / Ctrl+Shift+Tab для переключения между вкладками</li><li>Доступная версия отображается рядом с названием каждого ядра во вкладке Soplos Kernels</li><li>Кнопка Update во вкладке Soplos Kernels — появляется, когда в репозитории доступна более новая версия; обновляет метапакет и автоматически удаляет старые образ и заголовки ядра</li><li>Исправлено: поиск пакетов после сборки Stock теперь корректно обрабатывает суффиксы версий, добавленные патчами (напр. zen1 от патча Zen)</li><li>Исправлено: после обновления ядра Soplos старые пакеты образа и заголовков того же типа удаляются без ручного вмешательства</li></ul>"
