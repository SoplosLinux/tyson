Summary:
  C: "Software store for Soplos Linux"
  de: "Software-Center für Soplos Linux"
  en: "Software store for Soplos Linux"
  es: "Tienda de software para Soplos Linux"
  fr: "Boutique de logiciels pour Soplos Linux"
  it: "Gestore di software per Soplos Linux"
  pt: "Loja de aplicações para o Soplos Linux"
  ro: "Magazin de aplicații pentru Soplos Linux"
  ru: "Центр приложений для Soplos Linux"
Description:
  C: "<p>Soplos Store finds, installs, updates and removes applications from APT, Flatpak, Snap and AppImages in one place. Featured apps, popular apps and categories come from public databases (Debian AppStream, Flathub and the Snap Store), with ratings from ODRS, and an app available from several sources appears once with a choice of where to install it.</p><p>It also shows a tray icon when updates are available, and it opens .deb, .flatpak, .flatpakref, .snap and .AppImage files.</p>"
  de: "<p>Soplos Store findet, installiert, aktualisiert und entfernt Anwendungen aus APT, Flatpak, Snap und AppImages an einem zentralen Ort. Empfohlene Apps, beliebte Apps und Kategorien stammen aus öffentlichen Datenbanken mit ODRS-Bewertungen.</p>"
  es: "<p>Soplos Store busca, instala, actualiza y desinstala aplicaciones de APT, Flatpak, Snap y AppImages en un solo lugar. Las aplicaciones destacadas, populares y categorías provienen de bases de datos públicas (Debian AppStream, Flathub y Snap Store), con valoraciones de ODRS.</p><p>También incluye un notificador en la bandeja del sistema cuando hay actualizaciones disponibles y permite instalar directamente paquetes .deb, .flatpak, .flatpakref, .snap y .AppImage.</p>"
  fr: "<p>Soplos Store recherche, installe, met à jour et supprime des applications provenant d'APT, Flatpak, Snap et AppImage en un seul endroit. Les applications en vedette, populaires et les catégories proviennent de bases de données publiques avec les évaluations ODRS.</p>"
  it: "<p>Soplos Store cerca, installa, aggiorna e rimuove applicazioni da APT, Flatpak, Snap e AppImage in un unico posto. Le applicazioni in evidenza, popolari e categorie provengono da database pubblici con valutazioni ODRS.</p>"
  pt: "<p>O Soplos Store pesquisa, instala, atualiza e remove aplicações do APT, Flatpak, Snap e AppImages num único local. Aplicações em destaque, populares e categorias provêm de bases de dados públicas com classificações ODRS.</p>"
  ro: "<p>Soplos Store găsește, instalează, actualizează și elimină aplicații din APT, Flatpak, Snap și AppImage într-un singur loc. Aplicațiile recomandate, populare și categoriile provin din baze de date publice cu evaluări ODRS.</p>"
  ru: "<p>Soplos Store находит, устанавливает, обновляет и удаляет приложения из APT, Flatpak, Snap и AppImage в одном месте. Популярные приложения, рекомендации и категории загружаются из публичных баз данных с оценками ODRS.</p>"
