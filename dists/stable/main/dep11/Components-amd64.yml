Releases:
  - version: "3.0.0-1"
    type: stable
    unix-timestamp: 1795737600
    description:
      C: "<p>The descriptions of the schedulers follow scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal and scx_rvtime are new and marked as experimental, scx_tickless is experimental now, and scx_rustland and scx_rlfifo are gone.</p><p>The corner of the window no longer shows the Debian revision of the version.</p>"
      de: "<p>Die Beschreibungen der Scheduler folgen scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal und scx_rvtime sind neu und als experimentell markiert, scx_tickless ist jetzt experimentell, und scx_rustland und scx_rlfifo entfallen.</p><p>Die Ecke des Fensters zeigt die Debian-Revision der Version nicht mehr an.</p>"
      es: "<p>Las descripciones de los planificadores siguen a scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal y scx_rvtime son nuevos y están marcados como experimentales, scx_tickless pasa a ser experimental y desaparecen scx_rustland y scx_rlfifo.</p><p>La esquina de la ventana ya no muestra la revisión Debian de la versión.</p>"
      fr: "<p>Les descriptions des ordonnanceurs suivent scx 1.1.5 : scx_rburst, scx_reevdf, scx_rlocal et scx_rvtime sont nouveaux et signalés comme expérimentaux, scx_tickless devient expérimental, et scx_rustland et scx_rlfifo disparaissent.</p><p>Le coin de la fenêtre n’affiche plus la révision Debian de la version.</p>"
      it: "<p>Le descrizioni degli scheduler seguono scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal e scx_rvtime sono nuovi e segnati come sperimentali, scx_tickless ora è sperimentale, e scx_rustland e scx_rlfifo non ci sono più.</p><p>L’angolo della finestra non mostra più la revisione Debian della versione.</p>"
      pt: "<p>As descrições dos escalonadores seguem o scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal e scx_rvtime são novos e estão marcados como experimentais, scx_tickless passa a ser experimental e saem scx_rustland e scx_rlfifo.</p><p>O canto da janela já não mostra a revisão Debian da versão.</p>"
      ro: "<p>Descrierile planificatoarelor urmează scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal și scx_rvtime sunt noi și marcate ca experimentale, scx_tickless devine experimental, iar scx_rustland și scx_rlfifo dispar.</p><p>Colțul ferestrei nu mai afișează revizia Debian a versiunii.</p>"
      ru: "<p>Описания планировщиков соответствуют scx 1.1.5: scx_rburst, scx_reevdf, scx_rlocal и scx_rvtime новые и отмечены как экспериментальные, scx_tickless теперь экспериментальный, а scx_rustland и scx_rlfifo убраны.</p><p>В углу окна больше не показывается ревизия Debian версии.</p>"
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794960000
    description:
      C: "<p>First stable release, in the 3.0 stack of Soplos Linux.</p><p>Control of GameMode and of the sched_ext schedulers, one profile and one scheduler per game, the levers of the kernel with their value while a game runs, and the history of the games played.</p><p>Monitor of the machine with the temperatures, the fans, the voltages and the watts of every sensor, the processes with the most load and a chart of the last hour.</p><p>Overlay whose cells the user ticks, and MangoHud configuration with the keys of its file as boxes, a key added by hand and the log the panel reads the frames per second from.</p><p>Library of the installed games, taken from the desktop menu and from the manifests of Steam, with the cover of each one.</p>"
      de: "<p>Erste stabile Version, im 3.0-Stack von Soplos Linux.</p><p>Steuerung von GameMode und den sched_ext-Schedulern, ein Profil und ein Scheduler pro Spiel, die Stellschrauben des Kernels mit ihrem Wert während eines Spiels und der Verlauf der gespielten Spiele.</p><p>Systemmonitor mit Temperaturen, Lüftern, Spannungen und Watt jedes Sensors, den Prozessen mit der höchsten Last und einem Diagramm der letzten Stunde.</p><p>Overlay, dessen Zellen der Benutzer ankreuzt, und MangoHud-Konfiguration mit den Schlüsseln der Datei als Kästchen, einem von Hand ergänzten Schlüssel und dem Protokoll, aus dem das Panel die Bilder pro Sekunde liest.</p><p>Bibliothek der installierten Spiele aus dem Anwendungsmenü und den Steam-Manifesten, mit dem Cover jedes Spiels.</p>"
      es: "<p>Primera versión estable, en el stack 3.0 de Soplos Linux.</p><p>Control de GameMode y de los planificadores sched_ext, un perfil y un planificador por juego, los ajustes del kernel con su valor mientras se ejecuta un juego y el historial de partidas.</p><p>Monitor del equipo con las temperaturas, los ventiladores, los voltajes y los vatios de cada sensor, los procesos con más carga y una gráfica de la última hora.</p><p>Overlay con las celdas que marque el usuario, y configuración de MangoHud con las claves de su archivo como casillas, claves añadidas a mano y el registro del que el panel lee los fotogramas por segundo.</p><p>Biblioteca de los juegos instalados, tomada del menú del escritorio y de los manifiestos de Steam, con la carátula de cada uno.</p>"
      fr: "<p>Première version stable, dans la pile 3.0 de Soplos Linux.</p><p>Contrôle de GameMode et des ordonnanceurs sched_ext, un profil et un ordonnanceur par jeu, les réglages du noyau avec leur valeur pendant qu’un jeu tourne, et l’historique des parties.</p><p>Moniteur de la machine avec les températures, les ventilateurs, les tensions et les watts de chaque capteur, les processus les plus chargés et un graphique de la dernière heure.</p><p>Overlay dont l’utilisateur coche les cases, et configuration de MangoHud avec les clés de son fichier sous forme de cases, une clé ajoutée à la main et le journal d’où le panneau lit les images par seconde.</p><p>Bibliothèque des jeux installés, tirée du menu du bureau et des manifestes de Steam, avec la jaquette de chacun.</p>"
      it: "<p>Prima versione stabile, nello stack 3.0 di Soplos Linux.</p><p>Controllo di GameMode e degli scheduler sched_ext, un profilo e uno scheduler per gioco, le leve del kernel con il loro valore mentre un gioco è in esecuzione e la cronologia delle partite.</p><p>Monitor del computer con le temperature, le ventole, le tensioni e i watt di ogni sensore, i processi con più carico e un grafico dell’ultima ora.</p><p>Overlay con le celle spuntate dall’utente, e configurazione di MangoHud con le chiavi del suo file come caselle, una chiave aggiunta a mano e il log da cui il pannello legge i fotogrammi al secondo.</p><p>Libreria dei giochi installati, presa dal menu del desktop e dai manifest di Steam, con la copertina di ognuno.</p>"
      pt: "<p>Primeira versão estável, no stack 3.0 do Soplos Linux.</p><p>Controlo do GameMode e dos escalonadores sched_ext, um perfil e um escalonador por jogo, os ajustes do kernel com o seu valor enquanto um jogo corre e o histórico dos jogos jogados.</p><p>Monitor da máquina com as temperaturas, as ventoinhas, as tensões e os watts de cada sensor, os processos com mais carga e um gráfico da última hora.</p><p>Overlay com as células que o utilizador marcar, e configuração do MangoHud com as chaves do seu ficheiro em caixas, uma chave acrescentada à mão e o registo de onde o painel lê os fotogramas por segundo.</p><p>Biblioteca dos jogos instalados, tirada do menu do ambiente de trabalho e dos manifestos do Steam, com a capa de cada um.</p>"
      ro: "<p>Prima versiune stabilă, în stiva 3.0 a Soplos Linux.</p><p>Controlul GameMode și al planificatoarelor sched_ext, un profil și un planificator pentru fiecare joc, reglajele kernelului cu valoarea lor cât rulează un joc și istoricul jocurilor jucate.</p><p>Monitor al calculatorului cu temperaturile, ventilatoarele, tensiunile și wații fiecărui senzor, procesele cu cea mai mare încărcare și un grafic al ultimei ore.</p><p>Overlay cu celulele bifate de utilizator și configurarea MangoHud cu cheile fișierului ca bife, o cheie adăugată de mână și jurnalul din care panoul citește cadrele pe secundă.</p><p>Biblioteca jocurilor instalate, preluată din meniul desktopului și din manifestele Steam, cu coperta fiecăruia.</p>"
      ru: "<p>Первая стабильная версия в стеке 3.0 Soplos Linux.</p><p>Управление GameMode и планировщиками sched_ext, свой профиль и планировщик для каждой игры, параметры ядра с их значениями во время игры и история сыгранного.</p><p>Монитор компьютера с температурами, вентиляторами, напряжениями и ваттами каждого датчика, самыми нагружающими процессами и графиком за последний час.</p><p>Оверлей с ячейками, отмеченными пользователем, и настройка MangoHud: ключи его файла в виде флажков, добавление ключа вручную и журнал, из которого панель читает кадры в секунду.</p><p>Библиотека установленных игр из меню рабочего стола и манифестов Steam, с обложкой каждой.</p>"
ContentRating:
  oars-1.1: {}
