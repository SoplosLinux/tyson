Releases:
  - version: "2.0.2-8"
    type: stable
    unix-timestamp: 1785542400
    description:
      de: "<p>Die neue Auswahl „Standard-Boot-Modus“ erlaubt die Wahl zwischen einem festen Eintrag, dem zuletzt installierten Kernel oder dem zuletzt gestarteten Kernel. Das Anwenden von Änderungen in den allgemeinen Einstellungen legt den Boot-Eintrag nicht mehr auf den aktuellen Kernel fest, wodurch ein neu installierter Kernel nie gestartet wurde.</p>"
      en: "<p>New \"Default Boot Mode\" selector lets you choose between a fixed entry, the last installed kernel or the last booted kernel. Applying changes in General settings no longer pins the boot entry to the current kernel, which prevented newly installed kernels from ever being booted.</p>"
      es: "<p>El nuevo selector \"Modo de arranque predeterminado\" permite elegir entre una entrada fija, el último kernel instalado o el último kernel arrancado. Aplicar cambios en la configuración general ya no fija la entrada de arranque al kernel actual, lo que impedía que se arrancara nunca un kernel recién instalado.</p>"
      fr: "<p>Le nouveau sélecteur « Mode de démarrage par défaut » permet de choisir entre une entrée fixe, le dernier noyau installé ou le dernier noyau démarré. L'application des modifications dans les paramètres généraux ne fige plus l'entrée de démarrage sur le noyau actuel, ce qui empêchait tout noyau nouvellement installé d'être démarré.</p>"
      it: "<p>Il nuovo selettore \"Modalità di avvio predefinita\" permette di scegliere tra una voce fissa, l'ultimo kernel installato o l'ultimo kernel avviato. Applicare le modifiche nelle impostazioni generali non fissa più la voce di avvio sul kernel attuale, il che impediva l'avvio di qualsiasi kernel appena installato.</p>"
      pt: "<p>O novo seletor \"Modo de Arranque Padrão\" permite escolher entre uma entrada fixa, o último kernel instalado ou o último kernel arrancado. Aplicar alterações nas definições gerais já não fixa a entrada de arranque no kernel atual, o que impedia que um kernel recém-instalado fosse arrancado.</p>"
      ro: "<p>Noul selector „Mod de boot implicit” permite alegerea între o intrare fixă, ultimul kernel instalat sau ultimul kernel pornit. Aplicarea modificărilor în setările generale nu mai fixează intrarea de pornire pe kernelul curent, ceea ce împiedica pornirea oricărui kernel nou instalat.</p>"
      ru: "<p>Новый селектор «Режим загрузки по умолчанию» позволяет выбрать фиксированную запись, последнее установленное ядро или последнее загруженное ядро. Применение изменений в общих настройках больше не закрепляет загрузочную запись за текущим ядром, из-за чего только что установленное ядро никогда не загружалось.</p>"
  - version: "2.0.2-7"
    type: stable
    unix-timestamp: 1785283200
    description:
      de: "<p>Die Bildschirmauflösung wird nicht mehr mit ihrer übersetzten Bezeichnung gespeichert, benutzerdefinierte Boot-Einträge können jetzt aktiviert, deaktiviert und gelöscht werden, und der Starter registriert das Fenster unter derselben Kennung wie die Desktop-Datei.</p>"
      en: "<p>Screen resolution is no longer saved using its translated label, custom boot entries can now be enabled, disabled and deleted, and the launcher wrapper registers the window under the same identifier as the desktop file.</p>"
      es: "<p>La resolución de pantalla ya no se guarda con su etiqueta traducida, las entradas de arranque personalizadas ahora se pueden activar, desactivar y eliminar, y el lanzador registra la ventana con el mismo identificador que el archivo de escritorio.</p>"
      fr: "<p>La résolution d'écran n'est plus enregistrée avec son libellé traduit, les entrées de démarrage personnalisées peuvent maintenant être activées, désactivées et supprimées, et le lanceur enregistre la fenêtre sous le même identifiant que le fichier de bureau.</p>"
      it: "<p>La risoluzione dello schermo non viene più salvata con la sua etichetta tradotta, le voci di avvio personalizzate ora possono essere attivate, disattivate ed eliminate, e il lanciatore registra la finestra con lo stesso identificatore del file desktop.</p>"
      pt: "<p>A resolução de ecrã já não é guardada com o seu rótulo traduzido, as entradas de arranque personalizadas podem agora ser ativadas, desativadas e eliminadas, e o lançador regista a janela com o mesmo identificador do ficheiro de ambiente de trabalho.</p>"
      ro: "<p>Rezoluția ecranului nu mai este salvată cu eticheta sa tradusă, intrările de pornire personalizate pot fi acum activate, dezactivate și șterse, iar lansatorul înregistrează fereastra cu același identificator ca fișierul desktop.</p>"
      ru: "<p>Разрешение экрана больше не сохраняется с переведённой подписью, пользовательские загрузочные записи теперь можно включать, отключать и удалять, а лаунчер регистрирует окно с тем же идентификатором, что и файл рабочего стола.</p>"
  - version: "2.0.2-6"
    type: stable
    unix-timestamp: 1784764800
    description:
      de: "<p>Der Tab „Boot-Einträge\" funktioniert jetzt wirklich: Memtest-Einträge können deaktiviert oder entfernt werden, benutzerdefinierte Einträge können hinzugefügt werden, und doppelte oder falsch beschriftete Einträge wurden behoben.</p>"
      en: "<p>Boot Entries tab now works for real: memtest entries can be disabled or removed, custom entries can be added, and duplicate/mislabeled entries were fixed.</p>"
      es: "<p>La pestaña de Entradas de arranque ahora funciona de verdad: las entradas de memtest se pueden desactivar o eliminar, se pueden añadir entradas personalizadas, y se corrigieron entradas duplicadas o mal etiquetadas.</p>"
      fr: "<p>L'onglet Entrées de démarrage fonctionne enfin réellement : les entrées memtest peuvent être désactivées ou supprimées, des entrées personnalisées peuvent être ajoutées, et les entrées dupliquées ou mal étiquetées ont été corrigées.</p>"
      it: "<p>La scheda Voci di avvio ora funziona davvero: le voci memtest possono essere disattivate o rimosse, si possono aggiungere voci personalizzate, e sono state corrette voci duplicate o etichettate male.</p>"
      pt: "<p>A aba Entradas de arranque agora funciona de verdade: as entradas de memtest podem ser desativadas ou removidas, entradas personalizadas podem ser adicionadas, e entradas duplicadas ou mal rotuladas foram corrigidas.</p>"
      ro: "<p>Fila Intrări de pornire funcționează acum cu adevărat: intrările memtest pot fi dezactivate sau eliminate, se pot adăuga intrări personalizate, iar intrările duplicate sau etichetate greșit au fost corectate.</p>"
      ru: "<p>Вкладка загрузочных записей теперь действительно работает: записи memtest можно отключать или удалять, можно добавлять пользовательские записи, исправлены дублирующиеся или неверно подписанные записи.</p>"
  - version: "2.0.2-5"
    type: stable
    unix-timestamp: 1783382400
    description:
      de: "<p>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</p>"
      en: "<p>Build dependency python3-all replaced with python3.</p>"
      es: "<p>Se ha sustituido la dependencia de compilación python3-all por python3.</p>"
      fr: "<p>La dépendance de compilation python3-all a été remplacée par python3.</p>"
      it: "<p>La dipendenza di compilazione python3-all è stata sostituita con python3.</p>"
      pt: "<p>A dependência de compilação python3-all foi substituída por python3.</p>"
      ro: "<p>Dependența de compilare python3-all a fost înlocuită cu python3.</p>"
      ru: "<p>Зависимость сборки python3-all заменена на python3.</p>"
  - version: "2.0.2-4"
    type: stable
    unix-timestamp: 1779408000
    description:
      de: "<p>Tyson Legacy 1.x Veröffentlichungs-Zeitachse an korrekte Juli 2025 Zeitstempel angepasst und veraltete Metadaten-Tags in metainfo.xml bereinigt.</p>"
      en: "<p>Aligned Tyson legacy 1.x release timeline to correct July 2025 timestamps and cleaned up obsolete metadata tags in metainfo.xml.</p>"
      es: "<p>Se ha alineado el cronograma de la rama legacy Tyson 1.x a las fechas correctas de julio de 2025 y se han eliminado elementos obsoletos de metainfo.xml.</p>"
      fr: "<p>Alignement de la chronologie des versions Tyson legacy 1.x sur les horodatages corrects de juillet 2025 et nettoyage des balises de métadonnées obsolètes dans metainfo.xml.</p>"
      it: "<p>Allineata la cronologia di rilascio legacy Tyson 1.x alle date corrette di luglio 2025 e ripuliti i tag di metadati obsoleti in metainfo.xml.</p>"
      pt: "<p>Alinhamento do cronograma de lançamento legacy Tyson 1.x para corrigir datas de julho de 2025 e limpeza de tags metainfo obsoletas em metainfo.xml.</p>"
      ro: "<p>S-a aliniat cronologia de lansare legacy Tyson 1.x la marcajele temporale corecte din iulie 2025 și s-au curățat etichetele de metadate învechite în metainfo.xml.</p>"
      ru: "<p>Выровнена временная шкала релизов Tyson legacy 1.x до правильных меток июля 2025 года и очищены устаревшие теги метаданных в metainfo.xml.</p>"
  - version: "2.0.2-3"
    type: stable
    unix-timestamp: 1779062400
    description:
      C: "<p>Historical correction of Tyron legacy versioning: the August 2025 package mislabelled as 1.0.4 is now correctly documented as 1.0.9; the original Tyron 1.0.4 from May 2025 has been restored to the changelog.</p>"
      de: "<p>Historische Korrektur der Legacy-Versionierung von Tyron: Das August-2025-Paket, das fälschlicherweise als 1.0.4 gekennzeichnet war, ist nun korrekt als 1.0.9 dokumentiert; das ursprüngliche Tyron 1.0.4 vom Mai 2025 wurde im Changelog wiederhergestellt.</p>"
      en: "<p>Historical correction of Tyron legacy versioning: the August 2025 package mislabelled as 1.0.4 is now correctly documented as 1.0.9; the original Tyron 1.0.4 from May 2025 has been restored to the changelog.</p>"
      es: "<p>Corrección histórica del versionado legacy de Tyron: el paquete de agosto 2025 etiquetado incorrectamente como 1.0.4 queda documentado como 1.0.9; la 1.0.4 original de mayo 2025 ha sido restaurada en el changelog.</p>"
      fr: "<p>Correction historique du versionnage legacy de Tyron : le paquet d'août 2025 mal étiqueté 1.0.4 est maintenant correctement documenté comme 1.0.9 ; le 1.0.4 original de mai 2025 a été restauré dans le changelog.</p>"
      it: "<p>Correzione storica del versioning legacy di Tyron: il pacchetto di agosto 2025 etichettato erroneamente come 1.0.4 è ora correttamente documentato come 1.0.9; il 1.0.4 originale di maggio 2025 è stato ripristinato nel changelog.</p>"
      pt: "<p>Correção histórica do versionamento legacy do Tyron: o pacote de agosto 2025 erroneamente etiquetado como 1.0.4 está agora corretamente documentado como 1.0.9; o 1.0.4 original de maio 2025 foi restaurado no changelog.</p>"
      ro: "<p>Corecție istorică a versionării legacy Tyron: pachetul din august 2025 etichetat greșit ca 1.0.4 este acum documentat corect ca 1.0.9; versiunea originală 1.0.4 din mai 2025 a fost restaurată în changelog.</p>"
      ru: "<p>Историческая коррекция устаревшей нумерации версий Tyron: пакет августа 2025 года, ошибочно обозначенный как 1.0.4, теперь правильно задокументирован как 1.0.9; оригинальная версия 1.0.4 от мая 2025 года восстановлена в changelog.</p>"
  - version: "2.0.2-2"
    type: stable
    unix-timestamp: 1777507200
    description:
      C: "<p>Simplified the footer UI text to match the modern Soplos standard layout.</p>"
      de: "<p>Der Text der Statusleiste wurde vereinfacht, um dem modernen Soplos-Standardlayout zu entsprechen.</p>"
      en: "<p>Simplified the footer UI text to match the modern Soplos standard layout.</p>"
      es: "<p>Se ha simplificado el texto de la barra de estado para coincidir con el diseño estándar de Soplos.</p>"
      fr: "<p>Le texte de la barre d'état a été simplifié pour correspondre à la disposition standard moderne de Soplos.</p>"
      it: "<p>Il testo della barra di stato è stato semplificato per corrispondere al layout standard moderno di Soplos.</p>"
      pt: "<p>O texto da barra de status foi simplificado para corresponder ao layout padrão moderno do Soplos.</p>"
      ro: "<p>Textul barei de stare a fost simplificat pentru a se potrivi cu aspectul standard modern Soplos.</p>"
      ru: "<p>Текст строки состояния был упрощен, чтобы соответствовать современному стандартному макету Soplos.</p>"
  - version: "2.0.2-1"
    type: stable
    unix-timestamp: 1774051200
    description:
      C: "<p>About dialog, F1 shortcut, CSS architecture refactor, icon renaming and minor fixes.</p><ul><li>F1 shortcut and GNOME menu About action open the About dialog</li><li>Ctrl+Shift+Tab to navigate to previous tab</li><li>Notebook tab labels no longer appear orange in inactive tabs</li><li>CSS split into base.css (structural) and dark/light.css (color variables only)</li><li>Icon files renamed from com.soplos to org.soplos for naming consistency</li></ul>"
      de: "<p>Über-Dialog, F1-Tastenkürzel, CSS-Refactoring, Umbenennung von Icons und kleinere Korrekturen.</p><ul><li>F1-Tastenkürzel und GNOME-Menü-Aktion „Über\" öffnen den Über-Dialog</li><li>Strg+Umschalt+Tab zum Navigieren zur vorherigen Registerkarte</li><li>Notebook-Tab-Labels erscheinen nicht mehr orange in inaktiven Tabs</li><li>CSS aufgeteilt in base.css (strukturell) und dark/light.css (nur Farbvariablen)</li><li>Icon-Dateien von com.soplos in org.soplos umbenannt für Namenskonsistenz</li></ul>"
      es: "<p>Diálogo Acerca de, atajo F1, refactorización CSS, renombrado de iconos y correcciones menores.</p><ul><li>El atajo F1 y la acción Acerca de del menú GNOME abren el diálogo Acerca de</li><li>Ctrl+Mayús+Tab para navegar a la pestaña anterior</li><li>Las etiquetas de las pestañas del notebook ya no aparecen en naranja en pestañas inactivas</li><li>CSS dividido en base.css (estructural) y dark/light.css (solo variables de color)</li><li>Archivos de iconos renombrados de com.soplos a org.soplos para coherencia de nomenclatura</li></ul>"
      fr: "<p>Dialogue À propos, raccourci F1, refactorisation CSS, renommage des icônes et corrections mineures.</p><ul><li>Le raccourci F1 et l'action À propos du menu GNOME ouvrent le dialogue À propos</li><li>Ctrl+Maj+Tab pour naviguer vers l'onglet précédent</li><li>Les étiquettes des onglets du notebook n'apparaissent plus en orange dans les onglets inactifs</li><li>CSS divisé en base.css (structurel) et dark/light.css (variables de couleur uniquement)</li><li>Fichiers d'icônes renommés de com.soplos à org.soplos pour la cohérence des noms</li></ul>"
      it: "<p>Finestra di dialogo Informazioni, scorciatoia F1, refactoring CSS, rinominazione icone e correzioni minori.</p><ul><li>La scorciatoia F1 e l'azione Informazioni del menu GNOME aprono il dialogo Informazioni</li><li>Ctrl+Maiusc+Tab per navigare alla scheda precedente</li><li>Le etichette delle schede del notebook non appaiono più arancioni nelle schede inattive</li><li>CSS diviso in base.css (strutturale) e dark/light.css (solo variabili colore)</li><li>File icone rinominati da com.soplos a org.soplos per coerenza di denominazione</li></ul>"
      pt: "<p>Diálogo Sobre, atalho F1, refatoração CSS, renomeação de ícones e pequenas correções.</p><ul><li>O atalho F1 e a ação Sobre do menu GNOME abrem o diálogo Sobre</li><li>Ctrl+Shift+Tab para navegar para a aba anterior</li><li>Os rótulos das abas do notebook não aparecem mais em laranja nas abas inativas</li><li>CSS dividido em base.css (estrutural) e dark/light.css (apenas variáveis de cor)</li><li>Arquivos de ícones renomeados de com.soplos para org.soplos para consistência de nomenclatura</li></ul>"
      ro: "<p>Dialog Despre, scurtătură F1, refactorizare CSS, redenumire icoane și corecții minore.</p><ul><li>Scurtătura F1 și acțiunea Despre din meniul GNOME deschid dialogul Despre</li><li>Ctrl+Shift+Tab pentru navigarea la tab-ul anterior</li><li>Etichetele tab-urilor notebook nu mai apar portocalii în tab-urile inactive</li><li>CSS împărțit în base.css (structural) și dark/light.css (doar variabile de culoare)</li><li>Fișierele de icoane redenumite de la com.soplos la org.soplos pentru coerența denumirii</li></ul>"
      ru: "<p>Диалог «О программе», горячая клавиша F1, рефакторинг CSS, переименование иконок и незначительные исправления.</p><ul><li>Горячая клавиша F1 и действие «О программе» в меню GNOME открывают диалог «О программе»</li><li>Ctrl+Shift+Tab для перехода к предыдущей вкладке</li><li>Метки вкладок notebook больше не отображаются оранжевыми в неактивных вкладках</li><li>CSS разделён на base.css (структурный) и dark/light.css (только переменные цвета)</li><li>Файлы иконок переименованы с com.soplos на org.soplos для единообразия именования</li></ul>"
  - version: "2.0.2"
    type: stable
    unix-timestamp: 1773187200
    description:
      C: "<p>Support for hierarchical submenus, option to enable/disable them (GRUB_DISABLE_SUBMENU), silent update on startup and visual optimizations.</p><ul><li>Full parsing of GRUB submenus</li><li>Option to enable/disable submenus (GRUB_DISABLE_SUBMENU)</li><li>Silent update-grub on application launch</li><li>Compact UI for boot entries table</li><li>Hierarchical path display in selectors</li></ul>"
      de: "<p>Unterstützung für hierarchische Untermenüs, Option zum Aktivieren/Deaktivieren (GRUB_DISABLE_SUBMENU), stille Aktualisierung beim Start und visuelle Optimierungen.</p><ul><li>Vollständige Analyse von GRUB-Untermenüs</li><li>Option zum Aktivieren/Deaktivieren von Untermenüs (GRUB_DISABLE_SUBMENU)</li><li>Stille Ausführung von update-grub beim Start</li><li>Kompakte Benutzeroberfläche für die Boot-Eintragstabelle</li><li>Hierarchische Pfadanzeige in Selektoren</li></ul>"
      es: "<p>Soporte para submenús jerárquicos, opción para activarlos/desactivarlos (GRUB_DISABLE_SUBMENU), actualización silenciosa al inicio y optimizaciones visuales.</p><ul><li>Análisis completo de submenús de GRUB</li><li>Opción para activar/desactivar submenús (GRUB_DISABLE_SUBMENU)</li><li>Ejecución silenciosa de update-grub al inicio</li><li>Interfaz compacta para la tabla de entradas de arranque</li><li>Visualización de rutas jerárquicas en los selectores</li></ul>"
      fr: "<p>Support des sous-menus hiérarchiques, option pour les activer/désactiver (GRUB_DISABLE_SUBMENU), mise à jour silencieuse au démarrage et optimisations visuelles.</p><ul><li>Analyse complète des sous-menus GRUB</li><li>Option pour activer/désactiver les sous-menus (GRUB_DISABLE_SUBMENU)</li><li>Mise à jour silencieuse de update-grub au démarrage</li><li>Interface compacte pour le tableau des entrées de démarrage</li><li>Affichage des chemins hiérarchiques dans les sélecteurs</li></ul>"
      it: "<p>Supporto per sottomenu gerarchici, opzione per abilitarli/disabilitarli (GRUB_DISABLE_SUBMENU), aggiornamento silenzioso all'avvio e ottimizzazioni visuali.</p><ul><li>Analisi completa dei sottomenu GRUB</li><li>Opzione per abilitare/disabilitare i sottomenu (GRUB_DISABLE_SUBMENU)</li><li>Esecuzione silenziosa di update-grub all'avvio</li><li>Interfaccia compatta per la tabella delle voci di avvio</li><li>Visualizzazione gerarchica dei percorsi nei selettori</li></ul>"
      pt: "<p>Suporte para submenus hierárquicos, opção para ativá-los/desativá-los (GRUB_DISABLE_SUBMENU), atualização silenciosa na inicialização e otimizações visuais.</p><ul><li>Análise completa de submenus do GRUB</li><li>Opção para ativar/desativar submenus (GRUB_DISABLE_SUBMENU)</li><li>Execução silenciosa do update-grub na inicialização</li><li>Interface compacta para a tabela de entradas de inicialização</li><li>Exibição de caminhos hierárquicos nos seletores</li></ul>"
      ro: "<p>Suport pentru submeniuri ierarhice, opțiune pentru activarea/dezactivarea acestora (GRUB_DISABLE_SUBMENU), actualizare silențioasă la pornire și optimizări vizuale.</p><ul><li>Analiză completă a submeniurilor GRUB</li><li>Opțiune pentru activarea/dezactivarea submeniurilor (GRUB_DISABLE_SUBMENU)</li><li>Actualizare silențioasă update-grub la pornire</li><li>Interfață compactă pentru tabelul intrărilor de pornire</li><li>Afișare ierarhică a căilor în selectoare</li></ul>"
      ru: "<p>Поддержка иерархических подменю, возможность их включения/отключения (GRUB_DISABLE_SUBMENU), тихое обновление при запуске и визуальные оптимизации.</p><ul><li>Полный анализ подменю GRUB</li><li>Возможность включения/отключения подменю (GRUB_DISABLE_SUBMENU)</li><li>Тихое обновление update-grub при запуске</li><li>Компактный интерфейс для таблицы записей загрузки</li><li>Иерархическое отображение путей в селекторах</li></ul>"
  - version: "2.0.1"
    type: stable
    unix-timestamp: 1772841600
    description:
      C: "<p>Fixes for GRUB boot failures, cache conflicts, and UX improvements for timeout settings.</p><ul><li>Robust Theme Management: Reliably disables Debian and Soplos script defaults.</li><li>Cache Cleanup: Prevents \"invalid argument\" crashes deleting stale `.background_cache` files.</li><li>Smart UI: Auto-disables \"Show boot menu\" when Timeout is 0.</li></ul>"
      de: "<p>Korrekturen für GRUB-Startfehler, Cache-Konflikte und UX-Verbesserungen für Timeout-Einstellungen.</p><ul><li>Robuste Themenverwaltung: Deaktiviert zuverlässig die Standard-Skripte von Debian und Soplos.</li><li>Cache-Bereinigung: Verhindert Abstürze durch \"ungültiges Argument\" beim Löschen veralteter `.background_cache`-Dateien.</li><li>Intelligente Benutzeroberfläche: Deaktiviert automatisch \"Boot-Menü anzeigen\", wenn der Timeout 0 ist.</li></ul>"
      es: "<p>Correcciones para fallos de arranque de GRUB, conflictos de caché y mejoras de experiencia de usuario para el tiempo de espera (timeout).</p><ul><li>Gestión de temas robusta: Desactiva de forma fiable los scripts predeterminados de Debian y Soplos.</li><li>Limpieza de caché: Evita cierres por \"invalid argument\" eliminando archivos `.background_cache` obsoletos.</li><li>Interfaz inteligente: Desactiva automáticamente \"Mostrar menú de arranque\" cuando el tiempo de espera es 0.</li></ul>"
      fr: "<p>Corrections de pannes de démarrage GRUB, de conflits de cache et améliorations de l'expérience utilisateur pour les paramètres de délai.</p><ul><li>Gestion robuste des thèmes: Désactive de manière fiable les scripts par défaut de Debian et Soplos.</li><li>Nettoyage du cache: Prévient les plantages \"argument invalide\" lors de la suppression des fichiers `.background_cache` obsolètes.</li><li>Interface intelligente: Désactive automatiquement \"Afficher le menu de démarrage\" lorsque le délai est de 0.</li></ul>"
      it: "<p>Correzioni per errori di avvio di GRUB, conflitti di cache e miglioramenti dell'esperienza utente per le impostazioni di timeout.</p><ul><li>Gestione robusta dei temi: Disabilita in modo affidabile i valori predefiniti degli script Debian e Soplos.</li><li>Pulizia della cache: Previene i crash \"argomento non valido\" eliminando i file `.background_cache` obsoleti.</li><li>Interfaccia intelligente: Disabilita automaticamente \"Mostra menu di avvio\" quando il Timeout è 0.</li></ul>"
      pt: "<p>Correções para falhas de inicialização do GRUB, conflitos de cache e melhorias de UX para configurações de tempo limite.</p><ul><li>Gerenciamento robusto de temas: Desativa de forma confiável os padrões de script Debian e Soplos.</li><li>Limpeza de cache: Evita falhas de \"argumento inválido\" ao excluir arquivos `.background_cache` obsoletos.</li><li>Interface inteligente: Desativa automaticamente \"Mostrar menu de inicialização\" quando o tempo limite é 0.</li></ul>"
      ro: "<p>Remedieri pentru erorile de pornire GRUB, conflictele cache și îmbunătățiri UX pentru setările timeout.</p><ul><li>Gestionare robustă a temelor: Dezactivează în mod fiabil scripturile implicite Debian și Soplos.</li><li>Curățare cache: Previne erorile de tip \"argument invalid\" la ștergerea fișierelor `.background_cache` vechi.</li><li>Interfață inteligentă: Dezactivează automat \"Afișare meniu de pornire\" când Timeout este 0.</li></ul>"
      ru: "<p>Исправления сбоев загрузки GRUB, конфликтов кэша и улучшения UX для настроек времени ожидания.</p><ul><li>Надежное управление темами: Надежно отключает скрипты Debian и Soplos по умолчанию.</li><li>Очистка кэша: Предотвращает сбои \"неверный аргумент\" при удалении устаревших файлов `.background_cache`.</li><li>Умный интерфейс: Автоматически отключает \"Показать меню загрузки\", когда таймаут равен 0.</li></ul>"
  - version: "2.0.0"
    type: stable
    unix-timestamp: 1768003200
    description:
      C: "<p>Major Release - Complete Rewrite. Complete Internationalization (8 languages). Smart theme detection, GRUB theme manager, new resolutions, refined UI and improved desktop detection.</p><ul><li>Smart light/dark theme detection (GNOME, KDE, XFCE)</li><li>Improved desktop &amp; environment detection</li><li>Refined UI layout with compact view</li><li>GRUB theme installer and remover</li><li>Expanded resolution support (16:9, 16:10, 4:3, 4K)</li><li>UUID control option</li></ul>"
      de: "<p>Hauptversion - Komplette Neuschreibung. Vollständige Internationalisierung (8 Sprachen). Intelligente Themenerkennung, GRUB-Themenmanager, neue Auflösungen, verfeinerte Benutzeroberfläche und verbesserte Desktoperkennung.</p><ul><li>Intelligente Erkennung von hellen/dunklen Themen (GNOME, KDE, XFCE)</li><li>Verbesserte Desktop- und Umgebungserkennung</li><li>Verfeinertes UI-Layout mit kompakter Ansicht</li><li>GRUB-Themen-Installer und -Entferner</li><li>Erweiterte Auflösungsunterstützung (16:9, 16:10, 4:3, 4K)</li><li>UUID-Kontrolloption</li></ul>"
      en: "<p>Major Release - Complete Rewrite. Complete Internationalization (8 languages). Smart theme detection, GRUB theme manager, new resolutions, refined UI and improved desktop detection.</p>"
      es: "<p>Versión Mayor - Reescritura Completa. Internacionalización Completa (8 idiomas). Detección inteligente de temas, gestor de temas GRUB, nuevas resoluciones, interfaz refinada y detección de escritorio mejorada.</p><ul><li>Detección inteligente de temas claros/oscuros (GNOME, KDE, XFCE)</li><li>Detección mejorada de escritorio y entorno</li><li>Diseño de interfaz de usuario refinado con vista compacta</li><li>Instalador y desinstalador de temas GRUB</li><li>Soporte de resolución expandido (16:9, 16:10, 4:3, 4K)</li><li>Opción de control UUID</li></ul>"
      fr: "<p>Version Majeure - Réécriture Complète. Internationalisation Complète (8 langues). Détection intelligente de thème, gestionnaire de thèmes GRUB, nouvelles résolutions, interface raffinée et détection de bureau améliorée.</p><ul><li>Détection intelligente des thèmes clairs/sombres (GNOME, KDE, XFCE)</li><li>Détection améliorée du bureau et de l'environnement</li><li>Disposition de l'interface utilisateur raffinée avec vue compacte</li><li>Installateur et désinstallateur de thèmes GRUB</li><li>Prise en charge étendue des résolutions (16:9, 16:10, 4:3, 4K)</li><li>Option de contrôle UUID</li></ul>"
      it: "<p>Versione Principale - Riscrittura Completa. Internazionalizzazione Completa (8 lingue). Rilevamento intelligente del tema, gestore temi GRUB, nuove risoluzioni, interfaccia raffinata e rilevamento desktop migliorato.</p><ul><li>Rilevamento intelligente del tema chiaro/scuro (GNOME, KDE, XFCE)</li><li>Rilevamento migliorato di desktop e ambiente</li><li>Layout UI raffinato con vista compatta</li><li>Installatore e rimozione di temi GRUB</li><li>Supporto risoluzione esteso (16:9, 16:10, 4:3, 4K)</li><li>Opzione di controllo UUID</li></ul>"
      pt: "<p>Versão Maior - Reescrita Completa. Internacionalização Completa (8 idiomas). Detecção inteligente de temas, gerenciador de temas GRUB, novas resoluções, interface refinada e detecção de desktop aprimorada.</p><ul><li>Detecção inteligente de temas claros/escuros (GNOME, KDE, XFCE)</li><li>Detecção aprimorada de desktop e ambiente</li><li>Layout de UI refinado com visualização compacta</li><li>Instalador e removedor de temas GRUB</li><li>Suporte de resolução expandido (16:9, 16:10, 4:3, 4K)</li><li>Opção de controle UUID</li></ul>"
      ro: "<p>Versiune Majoră - Rescriere Completă. Internaționalizare Completă (8 limbi). Detectare inteligentă a temei, manager de teme GRUB, rezoluții noi, interfață rafinată și detectare desktop îmbunătățită.</p><ul><li>Detectare inteligentă a temelor deschise/întunecate (GNOME, KDE, XFCE)</li><li>Detectare îmbunătățită a desktopului și a mediului</li><li>Aspect UI rafinat cu vizualizare compactă</li><li>Instalator și eliminator de teme GRUB</li><li>Suport extins pentru rezoluții (16:9, 16:10, 4:3, 4K)</li><li>Opțiune de control UUID</li></ul>"
      ru: "<p>Основная версия - Полная переработка. Полная интернационализация (8 языков). Умное определение темы, менеджер тем GRUB, новые разрешения, улучшенный интерфейс и определение рабочего стола.</p><ul><li>Интеллектуальное определение светлых/темных тем (GNOME, KDE, XFCE)</li><li>Улучшенное определение рабочего стола и среды</li><li>Улучшенный макет пользовательского интерфейса с компактным видом</li><li>Установщик и удаление тем GRUB</li><li>Расширенная поддержка разрешений (16:9, 16:10, 4:3, 4K)</li><li>Опция управления UUID</li></ul>"
