Type: desktop-application
ID: "org.soplos.syscleaner"
Package: "soplos-sys-cleaner"
Name:
  C: "Soplos Sys Cleaner"
  de: "Soplos Systembereinigung"
  en: "Soplos Sys Cleaner"
  es: "Limpiador del Sistema de Soplos"
  fr: "Nettoyeur du Système de Soplos"
  it: "Pulitore di Sistema di Soplos"
  pt: "Limpeza do Sistema do Soplos"
  ro: "Curățare Sistem Soplos"
  ru: "Очистка системы Soplos"
Summary:
  C: "System cleaner and maintenance tool for Soplos Linux"
  de: "Systembereinigungs- und Wartungswerkzeug für Soplos Linux"
  en: "System cleaner and maintenance tool for Soplos Linux"
  es: "Herramienta de limpieza y mantenimiento del sistema para Soplos Linux"
  fr: "Outil de nettoyage et de maintenance du système pour Soplos Linux"
  it: "Strumento di pulizia e manutenzione del sistema per Soplos Linux"
  pt: "Ferramenta de limpeza e manutenção do sistema para o Soplos Linux"
  ro: "Instrument de curățare și întreținere a sistemului pentru Soplos Linux"
  ru: "Инструмент очистки и обслуживания системы для Soplos Linux"
Description:
  C: "<p>Soplos Sys Cleaner scans the system for reclaimable disk space — APT cache, old kernels, unused drivers and firmware, unused languages and documentation, orphaned packages, system logs, temporary files, and Flatpak/Snap leftovers — and shows a clear preview of everything it found before removing anything. A basic program offers one standard cleanup, and an advanced one gives access to every page.</p>"
  de: "<p>Die Soplos Systembereinigung analysiert das System auf freigebbaren Speicherplatz: APT-Cache, alte Kernel, ungenutzte Treiber und Firmware, nicht benötigte Sprachen, verwaiste Pakete, Protokolle, temporäre Dateien und Flatpak/Snap-Reste mit einer präzisen Vorschau vor jeder Bereinigung. Beinhaltet ein Standard-Programm sowie einen erweiterten Modus mit allen Detailseiten.</p>"
  es: "<p>El Limpiador del Sistema de Soplos analiza el sistema en busca de espacio recuperable: caché de APT, núcleos antiguos, controladores y firmware sin usar, idiomas y manuales no utilizados, paquetes huérfanos, registros del sistema, archivos temporales y restos de Flatpak/Snap, mostrando una vista previa detallada antes de borrar nada. Incluye un modo básico con limpieza estándar en un clic y un modo avanzado con control total.</p>"
  fr: "<p>Le nettoyeur du système de Soplos recherche l'espace disque récupérable : cache APT, anciens noyaux, pilotes et microprogrammes inutilisés, langues et documentations inutilisées, paquets orphelins, journaux, fichiers temporaires et résidus Flatpak/Snap. Un programme simple propose un nettoyage standard et un mode avancé offre un contrôle total.</p>"
  it: "<p>Il Pulitore di Sistema di Soplos esamina il sistema per liberare spazio su disco: cache APT, vecchi kernel, driver e firmware inutilizzati, lingue non utilizzate, pacchetti orfani, log, file temporanei e residui Flatpak/Snap. Include un programma base per una pulizia rapida e uno avanzato per un controllo totale.</p>"
  pt: "<p>O utilitário de Limpeza do Sistema do Soplos analisa o sistema em busca de espaço recuperável: cache APT, kernels antigos, controladores e firmware não utilizados, idiomas e manuais secundários, pacotes órfãos, registos do sistema, ficheiros temporários e resíduos de Flatpak/Snap. Disponibiliza um modo básico com limpeza padrão e um modo avançado para cada secção.</p>"
  ro: "<p>Curățare Sistem Soplos scanează sistemul pentru recuperarea spațiului pe disc: cache APT, kerneluri vechi, drivere și firmware nefolosite, pachete orfane, jurnale, fișiere temporare și reziduuri Flatpak/Snap. Include un mod de bază cu o curățare standard și un mod avansat complet.</p>"
  ru: "<p>Очистка системы Soplos сканирует систему для освобождения места на диске: кэш APT, старые ядра, неиспользуемые драйверы и прошивки, неиспользуемые языки, потерянные пакеты, журналы, временные файлы и остатки Flatpak/Snap с предварительным просмотром. Включает базовый режим для очистки в один клик и расширенный режим.</p>"
