Type: desktop-application
ID: "org.soplos.plymouthmanager"
Package: "soplos-plymouth-manager"
Name:
  C: "Soplos Plymouth Manager"
  de: "Soplos Plymouth-Manager"
  es: "Gestor Plymouth Soplos"
  fr: "Gestionnaire Plymouth Soplos"
  it: "Gestore Plymouth Soplos"
  pt: "Gestor Plymouth Soplos"
  ro: "Manager Plymouth Soplos"
  ru: "Менеджер Plymouth Soplos"
Summary:
  C: "Plymouth boot splash theme manager for Soplos Linux"
  de: "Plymouth-Manager für die Startbildschirm-Themes von Soplos Linux"
  es: "Gestor de temas de arranque Plymouth para Soplos Linux"
  fr: "Gestionnaire de thèmes de démarrage Plymouth pour Soplos Linux"
  it: "Gestore dei temi di avvio Plymouth per Soplos Linux"
  pt: "Gestor de temas de arranque Plymouth para o Soplos Linux"
  ro: "Manager de teme de pornire Plymouth pentru Soplos Linux"
  ru: "Менеджер тем загрузочного экрана Plymouth для Soplos Linux"
Description:
  C: "<p>Soplos Plymouth Manager chooses, previews, installs and removes the Plymouth boot splash themes of Soplos Linux. It works on Xfce, Plasma and GNOME, with X11 or Wayland, and rebuilds the initramfs with dracut or with initramfs-tools, whichever the system uses. Every change to the system goes through a Polkit-authenticated helper and the window never runs as root.</p>"
  de: "<p>Der Soplos Plymouth-Manager wählt die Plymouth-Themes des Startbildschirms von Soplos Linux aus, zeigt sie in der Vorschau, installiert und entfernt sie. Er läuft unter Xfce, Plasma und GNOME, mit X11 oder Wayland, und erzeugt das Initramfs mit dracut oder initramfs-tools neu, je nachdem, was das System verwendet. Jede Änderung am System läuft über einen per Polkit authentifizierten Helfer, und das Fenster läuft nie als root.</p>"
  es: "<p>El Gestor Plymouth Soplos elige, previsualiza, instala y quita los temas de arranque Plymouth de Soplos Linux. Funciona en Xfce, Plasma y GNOME, con X11 o Wayland, y reconstruye el initramfs con dracut o con initramfs-tools, el que use el sistema. Cada cambio en el sistema pasa por un ayudante autenticado con Polkit y la ventana nunca se ejecuta como root.</p>"
  fr: "<p>Le Gestionnaire Plymouth Soplos choisit, prévisualise, installe et supprime les thèmes de démarrage Plymouth de Soplos Linux. Il fonctionne sur Xfce, Plasma et GNOME, avec X11 ou Wayland, et reconstruit l'initramfs avec dracut ou initramfs-tools, selon le système. Chaque modification du système passe par un assistant authentifié par Polkit et la fenêtre ne s'exécute jamais en root.</p>"
  it: "<p>Il Gestore Plymouth Soplos sceglie, visualizza in anteprima, installa e rimuove i temi di avvio Plymouth di Soplos Linux. Funziona su Xfce, Plasma e GNOME, con X11 o Wayland, e ricostruisce l'initramfs con dracut o con initramfs-tools, a seconda di ciò che usa il sistema. Ogni modifica al sistema passa da un helper autenticato con Polkit e la finestra non gira mai come root.</p>"
  pt: "<p>O Gestor Plymouth Soplos escolhe, pré-visualiza, instala e remove os temas de arranque Plymouth do Soplos Linux. Funciona no Xfce, Plasma e GNOME, com X11 ou Wayland, e reconstrói o initramfs com o dracut ou com o initramfs-tools, consoante o que o sistema usa. Cada alteração ao sistema passa por um auxiliar autenticado com o Polkit e a janela nunca corre como root.</p>"
  ro: "<p>Managerul Plymouth Soplos alege, previzualizează, instalează și elimină temele de pornire Plymouth ale Soplos Linux. Funcționează pe Xfce, Plasma și GNOME, cu X11 sau Wayland, și reconstruiește initramfs cu dracut sau cu initramfs-tools, după cum folosește sistemul. Fiecare modificare a sistemului trece printr-un ajutor autentificat cu Polkit, iar fereastra nu rulează niciodată ca root.</p>"
  ru: "<p>Менеджер Plymouth Soplos выбирает, показывает в предпросмотре, устанавливает и удаляет темы загрузочного экрана Plymouth в Soplos Linux. Он работает в Xfce, Plasma и GNOME с X11 или Wayland и пересобирает initramfs с помощью dracut или initramfs-tools, в зависимости от системы. Каждое изменение системы проходит через помощник с аутентификацией Polkit, а окно никогда не работает от root.</p>"
