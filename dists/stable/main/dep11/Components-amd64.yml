Releases:
  - version: "1.0.1-2"
    type: stable
    unix-timestamp: 1784505600
    description:
      de: "<p>Option hinzugefügt, die Originaldatei zu behalten und beim Hinzufügen eines AppImage über die Dateiauswahl oder per Drag-and-Drop zu kopieren statt zu verschieben.</p>"
      en: "<p>Added the option to keep the original file and copy it instead of moving it when adding an AppImage, via the file chooser or drag and drop.</p>"
      es: "<p>Añadida la opción de conservar el archivo original y copiarlo en vez de moverlo al añadir un AppImage, mediante el selector de archivos o arrastrar y soltar.</p>"
      fr: "<p>Ajout de l'option permettant de conserver le fichier original et de le copier au lieu de le déplacer lors de l'ajout d'un AppImage, via le sélecteur de fichiers ou le glisser-déposer.</p>"
      it: "<p>Aggiunta l'opzione di mantenere il file originale e copiarlo invece di spostarlo durante l'aggiunta di un AppImage, tramite il selettore file o il trascinamento.</p>"
      pt: "<p>Adicionada a opção de manter o ficheiro original e copiá-lo em vez de o mover ao adicionar um AppImage, através do seletor de ficheiros ou de arrastar e largar.</p>"
      ro: "<p>Adăugată opțiunea de a păstra fișierul original și de a-l copia în loc să-l muți la adăugarea unui AppImage, prin selectorul de fișiere sau prin glisare și plasare.</p>"
      ru: "<p>Добавлена возможность сохранить исходный файл и скопировать его вместо перемещения при добавлении AppImage через диалог выбора файла или перетаскивание.</p>"
  - version: "1.0.1-1"
    type: stable
    unix-timestamp: 1783382400
    description:
      de: "<p>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</p>"
      en: "<p>Build dependency python3-all replaced with python3.</p>"
      es: "<p>Se ha sustituido la dependencia de compilación python3-all por python3.</p>"
      fr: "<p>La dépendance de compilation python3-all a été remplacée par python3.</p>"
      it: "<p>La dipendenza di compilazione python3-all è stata sostituita con python3.</p>"
      pt: "<p>A dependência de compilação python3-all foi substituída por python3.</p>"
      ro: "<p>Dependența de compilare python3-all a fost înlocuită cu python3.</p>"
      ru: "<p>Зависимость сборки python3-all заменена на python3.</p>"
  - version: "1.0.1"
    type: stable
    unix-timestamp: 1774828800
    description:
      C: "<p>Added Properties dialog to view and edit each AppImage's name, version, description, categories and update URL. New Run as root toggle in Properties launches any AppImage with pkexec, showing a PolicyKit authentication dialog on launch. Automatic update checking via GitHub, GitLab and Codeberg release APIs, direct URL comparison, or embedded appimageupdatetool info. New Check All Updates button in the header bar replaces Refresh and lets you inspect and update all AppImages at once. Improved icon extraction and full translation coverage across all 8 languages. The application now seamlessly respects the system's light or dark GTK theme preference.</p>"
      de: "<p>Eigenschaften-Dialog hinzugefügt, um Name, Version, Beschreibung, Kategorien und Update-URL jedes AppImage anzuzeigen und zu bearbeiten. Neue Umschaltoption Als Root ausführen in den Eigenschaften startet jeden AppImage mit pkexec und zeigt beim Start einen PolicyKit-Authentifizierungsdialog an. Automatische Update-Prüfung über GitHub-, GitLab- und Codeberg-Release-APIs, direkte URL-Vergleich oder eingebettete appimageupdatetool-Informationen. Neue Schaltfläche Alle Updates prüfen in der Kopfleiste ersetzt Aktualisieren und ermöglicht die Prüfung und Aktualisierung aller AppImages auf einmal. Verbesserte Icon-Extraktion und vollständige Übersetzungsabdeckung in allen 8 Sprachen. Die Anwendung respektiert nun nahtlos die Einstellung für das helle oder dunkle GTK-Design des Systems.</p>"
      es: "<p>Añadido diálogo de Propiedades para ver y editar nombre, versión, descripción, categorías y URL de actualización de cada AppImage. Nuevo interruptor Ejecutar como root en Propiedades lanza cualquier AppImage con pkexec mostrando un diálogo de autenticación de PolicyKit al iniciarlo. Comprobación automática de actualizaciones mediante las APIs de GitHub, GitLab y Codeberg, comparación de URL directa o información de appimageupdatetool integrada. Nuevo botón Comprobar todas las actualizaciones en la barra de cabecera que sustituye a Actualizar y permite revisar y actualizar todos los AppImages a la vez. Mejora en la extracción de iconos y cobertura de traducción completa en los 8 idiomas. La aplicación ahora respeta perfectamente la preferencia de tema GTK claro u oscuro del sistema.</p>"
      fr: "<p>Ajout de la boîte de dialogue Propriétés pour afficher et modifier le nom, la version, la description, les catégories et l'URL de mise à jour de chaque AppImage. Nouveau bouton Exécuter en tant que root dans Propriétés pour lancer n'importe quel AppImage avec pkexec, affichant une boîte de dialogue d'authentification PolicyKit au lancement. Vérification automatique des mises à jour via les API GitHub, GitLab et Codeberg, comparaison d'URL directe ou informations appimageupdatetool intégrées. Nouveau bouton Vérifier toutes les mises à jour dans la barre d'en-tête, remplaçant Actualiser, pour inspecter et mettre à jour tous les AppImages en une fois. Extraction d'icônes améliorée et couverture de traduction complète dans les 8 langues. L'application respecte désormais parfaitement la préférence de thème GTK clair ou sombre du système.</p>"
      it: "<p>Aggiunta la finestra Proprietà per visualizzare e modificare nome, versione, descrizione, categorie e URL di aggiornamento di ogni AppImage. Nuovo interruttore Esegui come root in Proprietà per avviare qualsiasi AppImage con pkexec, mostrando una finestra di autenticazione PolicyKit all'avvio. Verifica automatica degli aggiornamenti tramite le API di GitHub, GitLab e Codeberg, confronto URL diretto o informazioni appimageupdatetool integrate. Nuovo pulsante Controlla tutti gli aggiornamenti nella barra dell'intestazione che sostituisce Aggiorna e consente di ispezionare e aggiornare tutti gli AppImages in una volta. Estrazione icone migliorata e copertura di traduzione completa in tutte e 8 le lingue. L'applicazione rispetta ora perfettamente la preferenza per il tema GTK chiaro o scuro del sistema.</p>"
      pt: "<p>Adicionado diálogo de Propriedades para ver e editar o nome, versão, descrição, categorias e URL de atualização de cada AppImage. Novo interruptor Executar como root em Propriedades para lançar qualquer AppImage com pkexec, mostrando um diálogo de autenticação PolicyKit ao iniciar. Verificação automática de atualizações através das APIs do GitHub, GitLab e Codeberg, comparação de URL direta ou informações appimageupdatetool integradas. Novo botão Verificar todas as atualizações na barra de cabeçalho substitui Atualizar e permite inspecionar e atualizar todos os AppImages de uma vez. Extração de ícones melhorada e cobertura de tradução completa em todos os 8 idiomas. A aplicação agora respeita perfeitamente a preferência do tema GTK claro ou escuro do sistema.</p>"
      ro: "<p>Adăugat dialogul Proprietăți pentru a vizualiza și edita numele, versiunea, descrierea, categoriile și URL-ul de actualizare al fiecărui AppImage. Noul comutator Rulează ca root din Proprietăți lansează orice AppImage cu pkexec, afișând un dialog de autentificare PolicyKit la pornire. Verificare automată a actualizărilor prin API-urile GitHub, GitLab și Codeberg, compararea URL-urilor directe sau informații appimageupdatetool integrate. Noul buton Verificare toate actualizările din bara de antet înlocuiește Reîmprospătare și permite inspectarea și actualizarea tuturor AppImages dintr-o dată. Extracție îmbunătățită a pictogramelor și acoperire completă a traducerilor în toate cele 8 limbi. Aplicația respectă acum perfect preferința de temă GTK deschisă sau închisă a sistemului.</p>"
      ru: "<p>Добавлен диалог Свойства для просмотра и редактирования имени, версии, описания, категорий и URL обновления каждого AppImage. Новый переключатель Запустить от имени root в Свойствах запускает любой AppImage через pkexec, отображая диалог аутентификации PolicyKit при запуске. Автоматическая проверка обновлений через API GitHub, GitLab и Codeberg, сравнение прямых URL или встроенную информацию appimageupdatetool. Новая кнопка Проверить все обновления в заголовке заменяет Обновить и позволяет проверять и обновлять все AppImages сразу. Улучшено извлечение иконок и обеспечено полное покрытие перевода на все 8 языков. Теперь приложение полностью учитывает системные настройки светлой или темной темы GTK.</p>"
  - version: "1.0.0-1"
    type: stable
    unix-timestamp: 1774137600
    description:
      C: "<p>Fixed background color inconsistency in the main window.</p>"
      de: "<p>Inkonsistenz der Hintergrundfarbe im Hauptfenster behoben.</p>"
      es: "<p>Corregida la inconsistencia del color de fondo en la ventana principal.</p>"
      fr: "<p>Correction de l'incohérence de couleur de fond dans la fenêtre principale.</p>"
      it: "<p>Corretta l'incongruenza del colore di sfondo nella finestra principale.</p>"
      pt: "<p>Corrigida a inconsistência da cor de fundo na janela principal.</p>"
      ro: "<p>Corectată inconsistența culorii de fundal în fereastra principală.</p>"
      ru: "<p>Исправлена несоответствие цвета фона в главном окне.</p>"
  - version: "1.0.0"
    type: stable
    unix-timestamp: 1774137600
    description:
      C: "<p>Initial release of Soplos AppImage Manager. Add AppImages via file chooser or drag and drop, integrate manually placed AppImages with one click, auto-refresh via file monitor, update URL detection from embedded AppImage binary, and full internationalisation in 8 languages.</p>"
      de: "<p>Erstveröffentlichung des Soplos AppImage-Managers. AppImages per Dateiauswahl oder Drag-and-Drop hinzufügen, manuell platzierte AppImages mit einem Klick integrieren, automatische Aktualisierung über den Dateimonitor, Update-URL-Erkennung aus dem AppImage-Binary und vollständige Internationalisierung in 8 Sprachen.</p>"
      es: "<p>Lanzamiento inicial del Gestor de AppImage de Soplos. Añade AppImages mediante selector de archivos o arrastrar y soltar, integra AppImages colocados manualmente con un clic, refresco automático mediante monitor de archivos, detección de URL de actualización desde el binario AppImage, e internacionalización completa en 8 idiomas.</p>"
      fr: "<p>Version initiale du Gestionnaire AppImage Soplos. Ajoutez des AppImages via le sélecteur de fichiers ou le glisser-déposer, intégrez les AppImages placés manuellement en un clic, actualisation automatique via le moniteur de fichiers, détection d'URL de mise à jour depuis le binaire AppImage, et internationalisation complète en 8 langues.</p>"
      it: "<p>Versione iniziale del Gestore AppImage Soplos. Aggiungi AppImages tramite selettore file o trascinamento, integra AppImages posizionati manualmente con un clic, aggiornamento automatico tramite monitor file, rilevamento URL di aggiornamento dal binario AppImage e internazionalizzazione completa in 8 lingue.</p>"
      pt: "<p>Lançamento inicial do Gestor de AppImage Soplos. Adicione AppImages através do seletor de ficheiros ou arrastar e largar, integre AppImages colocados manualmente com um clique, atualização automática via monitor de ficheiros, deteção de URL de atualização a partir do binário AppImage e internacionalização completa em 8 idiomas.</p>"
      ro: "<p>Lansarea inițială a Managerului AppImage Soplos. Adăugați AppImages prin selectorul de fișiere sau prin glisare și plasare, integrați AppImages plasate manual cu un singur clic, reîmprospătare automată prin monitorul de fișiere, detectarea URL-ului de actualizare din binarul AppImage și internaționalizare completă în 8 limbi.</p>"
      ru: "<p>Первый выпуск Менеджера AppImage Soplos. Добавляйте AppImages через диалог выбора файлов или перетаскивание, интегрируйте вручную размещённые AppImages одним кликом, автообновление через файловый монитор, определение URL обновления из бинарного файла AppImage и полная интернационализация на 8 языках.</p>"
ContentRating:
  oars-1.1: {}
---
Type: desktop-application
ID: "org.soplos.grubeditor"
Package: "soplos-grub-editor"
Name:
  C: "Soplos GRUB Editor"
  de: "Soplos GRUB Editor"
  es: "Editor GRUB de Soplos"
  fr: "Éditeur GRUB Soplos"
  it: "Editor GRUB Soplos"
  pt: "Editor GRUB Soplos"
  ro: "Editor GRUB Soplos"
  ru: "Редактор GRUB Soplos"
Summary:
  C: "Advanced GRUB configuration editor with complete internationalization"
  de: "Erweiterte GRUB-Konfigurationseditor mit vollständiger Internationalisierung"
  es: "Editor avanzado de configuración GRUB con internacionalización completa"
  fr: "Éditeur de configuration GRUB avancé avec internationalisation complète"
  it: "Editor avanzato di configurazione GRUB con internazionalizzazione completa"
  pt: "Editor avançado de configuração GRUB com internacionalização completa"
  ro: "Editor avansat de configurare GRUB cu internaționalizare completă"
  ru: "Расширенный редактор конфигурации GRUB с полной интернационализацией"
Description:
  C: "<p>Soplos GRUB Editor is a comprehensive graphical tool for configuring and customizing the GRUB2 bootloader. With complete internationalization support for 8 languages, it provides an intuitive interface for managing boot settings, themes, fonts, and custom entries.</p><p>Key Features:</p><ul><li>Complete internationalization - 8 languages supported</li><li>Intuitive GTK3 interface with keyboard shortcuts</li><li>Theme management and installation</li><li>Custom font conversion and application</li><li>Background image configuration</li><li>Custom boot entry management</li><li>Advanced kernel parameter configuration</li><li>Automatic backup and restore functionality</li><li>Safe update-grub integration</li><li>Multi-OS detection support</li></ul>"
  de: "<p>Soplos GRUB Editor ist ein umfassendes grafisches Tool zur Konfiguration und Anpassung des GRUB2-Bootloaders. Mit vollständiger Internationalisierungsunterstützung für 8 Sprachen bietet es eine intuitive Benutzeroberfläche zur Verwaltung von Boot-Einstellungen, Themes, Schriftarten und benutzerdefinierten Einträgen.</p>"
  es: "<p>Soplos GRUB Editor es una herramienta gráfica integral para configurar y personalizar el gestor de arranque GRUB2. Con soporte completo de internacionalización para 8 idiomas, proporciona una interfaz intuitiva para gestionar configuraciones de arranque, temas, fuentes y entradas personalizadas.</p>"
  fr: "<p>Soplos GRUB Editor est un outil graphique complet pour configurer et personnaliser le chargeur de démarrage GRUB2. Avec un support complet d'internationalisation pour 8 langues, il fournit une interface intuitive pour gérer les paramètres de démarrage, les thèmes, les polices et les entrées personnalisées.</p>"
  it: "<p>Soplos GRUB Editor è uno strumento grafico completo per configurare e personalizzare il bootloader GRUB2. Con supporto completo per l'internazionalizzazione in 8 lingue, fornisce un'interfaccia intuitiva per gestire impostazioni di avvio, temi, font ed entrate personalizzate.</p>"
  pt: "<p>Soplos GRUB Editor é uma ferramenta gráfica abrangente para configurar e personalizar o gerenciador de inicialização GRUB2. Com suporte completo de internacionalização para 8 idiomas, fornece uma interface intuitiva para gerenciar configurações de inicialização, temas, fontes e entradas personalizadas.</p>"
  ro: "<p>Soplos GRUB Editor este un instrument grafic cuprinzător pentru configurarea și personalizarea încărcătorului de sistem GRUB2. Cu suport complet de internaționalizare pentru 8 limbi, oferă o interfață intuitivă pentru gestionarea setărilor de pornire, temelor, fonturilor și intrărilor personalizate.</p>"
  ru: "<p>Soplos GRUB Editor - это комплексный графический инструмент для настройки и персонализации загрузчика GRUB2. С полной поддержкой интернационализации для 8 языков, он предоставляет интуитивный интерфейс для управления настройками загрузки, темами, шрифтами и пользовательскими записями.</p>"
