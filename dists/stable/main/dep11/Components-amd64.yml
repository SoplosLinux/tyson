Releases:
  - version: "1.0.3-4"
    type: stable
    unix-timestamp: 1785628800
    description:
      C: "<p>Theming release: light/dark detection routed per desktop environment (XFCE, Plasma, GNOME), light theme completed to full parity with the dark one.</p><ul><li>Changed: light/dark theme detection is now routed per desktop environment — XFCE reads the active GTK theme name from xfconf-query, Plasma reads ColorScheme from kdeglobals with a window-background luminance fallback, GNOME reads color-scheme. Ported from soplos-welcome</li><li>Fixed: the light theme was incomplete compared to the dark one, so uncovered widgets fell back to the system theme and clashed — light.css is now at full parity with dark.css</li><li>Note: the theme is detected once at startup; switching the desktop between light and dark with the application open does not restyle the running window</li></ul>"
      de: "<p>Themen-Version: Hell-/Dunkel-Erkennung je Desktop-Umgebung geroutet (XFCE, Plasma, GNOME), helles Thema auf volle Parität mit dem dunklen gebracht.</p><ul><li>Geändert: die Hell-/Dunkel-Erkennung wird nun je Desktop-Umgebung geroutet — XFCE liest den aktiven GTK-Themennamen über xfconf-query, Plasma liest ColorScheme aus kdeglobals mit Rückfall auf die Luminanz des Fensterhintergrunds, GNOME liest color-scheme. Portiert von soplos-welcome</li><li>Behoben: das helle Thema war gegenüber dem dunklen unvollständig, nicht abgedeckte Widgets fielen auf das Systemthema zurück und passten nicht — light.css ist nun auf voller Parität mit dark.css</li><li>Hinweis: das Thema wird einmalig beim Start erkannt; ein Wechsel des Desktops zwischen hell und dunkel bei geöffneter Anwendung gestaltet das laufende Fenster nicht neu</li></ul>"
      es: "<p>Versión de temas: detección de claro/oscuro enrutada por escritorio (XFCE, Plasma, GNOME), tema claro completado a paridad total con el oscuro.</p><ul><li>Cambiado: la detección de tema claro/oscuro ahora se enruta por escritorio — XFCE lee el nombre del tema GTK activo con xfconf-query, Plasma lee ColorScheme de kdeglobals con respaldo por luminancia del fondo de ventana, GNOME lee color-scheme. Portado desde soplos-welcome</li><li>Corregido: el tema claro estaba incompleto frente al oscuro, por lo que los widgets no cubiertos caían al tema del sistema y desentonaban — light.css ahora está a paridad total con dark.css</li><li>Nota: el tema se detecta una sola vez al arrancar; cambiar el escritorio entre claro y oscuro con la aplicación abierta no reestiliza la ventana en ejecución</li></ul>"
      fr: "<p>Version thématique : détection clair/sombre routée par environnement de bureau (XFCE, Plasma, GNOME), thème clair complété à parité totale avec le sombre.</p><ul><li>Modifié : la détection du thème clair/sombre est désormais routée par environnement de bureau — XFCE lit le nom du thème GTK actif via xfconf-query, Plasma lit ColorScheme depuis kdeglobals avec un repli sur la luminance du fond de fenêtre, GNOME lit color-scheme. Porté depuis soplos-welcome</li><li>Corrigé : le thème clair était incomplet par rapport au sombre, les widgets non couverts retombaient sur le thème du système et juraient — light.css est désormais à parité totale avec dark.css</li><li>Note : le thème est détecté une seule fois au démarrage ; basculer le bureau entre clair et sombre avec l'application ouverte ne restyle pas la fenêtre en cours</li></ul>"
      it: "<p>Versione dei temi: rilevamento chiaro/scuro instradato per ambiente desktop (XFCE, Plasma, GNOME), tema chiaro completato alla piena parità con quello scuro.</p><ul><li>Modificato: il rilevamento del tema chiaro/scuro è ora instradato per ambiente desktop — XFCE legge il nome del tema GTK attivo tramite xfconf-query, Plasma legge ColorScheme da kdeglobals con ripiego sulla luminanza dello sfondo della finestra, GNOME legge color-scheme. Portato da soplos-welcome</li><li>Corretto: il tema chiaro era incompleto rispetto a quello scuro, quindi i widget non coperti ripiegavano sul tema di sistema e stonavano — light.css è ora in piena parità con dark.css</li><li>Nota: il tema viene rilevato una sola volta all'avvio; cambiare il desktop tra chiaro e scuro con l'applicazione aperta non ridisegna la finestra in esecuzione</li></ul>"
      pt: "<p>Versão de temas: deteção de claro/escuro encaminhada por ambiente de trabalho (XFCE, Plasma, GNOME), tema claro completado até à paridade total com o escuro.</p><ul><li>Alterado: a deteção de tema claro/escuro é agora encaminhada por ambiente de trabalho — o XFCE lê o nome do tema GTK ativo com xfconf-query, o Plasma lê ColorScheme de kdeglobals com recurso à luminância do fundo da janela, o GNOME lê color-scheme. Portado do soplos-welcome</li><li>Corrigido: o tema claro estava incompleto face ao escuro, pelo que os widgets não cobertos recorriam ao tema do sistema e destoavam — light.css está agora em paridade total com dark.css</li><li>Nota: o tema é detetado uma única vez ao arrancar; alternar o ambiente de trabalho entre claro e escuro com a aplicação aberta não reestiliza a janela em execução</li></ul>"
      ro: "<p>Versiune de teme: detectarea luminos/întunecat rutată pe mediu desktop (XFCE, Plasma, GNOME), tema luminoasă completată la paritate totală cu cea întunecată.</p><ul><li>Modificat: detectarea temei luminoase/întunecate este acum rutată pe mediu desktop — XFCE citește numele temei GTK active prin xfconf-query, Plasma citește ColorScheme din kdeglobals cu revenire la luminanța fundalului ferestrei, GNOME citește color-scheme. Portat din soplos-welcome</li><li>Remediat: tema luminoasă era incompletă față de cea întunecată, astfel încât widgeturile neacoperite reveneau la tema sistemului și nu se potriveau — light.css este acum la paritate totală cu dark.css</li><li>Notă: tema este detectată o singură dată la pornire; schimbarea desktopului între luminos și întunecat cu aplicația deschisă nu restilizează fereastra în execuție</li></ul>"
      ru: "<p>Версия оформления: определение светлой/тёмной темы направляется по среде рабочего стола (XFCE, Plasma, GNOME), светлая тема доведена до полного соответствия тёмной.</p><ul><li>Изменено: определение светлой/тёмной темы теперь направляется по среде рабочего стола — XFCE читает имя активной темы GTK через xfconf-query, Plasma читает ColorScheme из kdeglobals с запасным вариантом по яркости фона окна, GNOME читает color-scheme. Портировано из soplos-welcome</li><li>Исправлено: светлая тема была неполной по сравнению с тёмной, поэтому неохваченные виджеты возвращались к системной теме и выбивались из оформления — light.css теперь полностью соответствует dark.css</li><li>Примечание: тема определяется один раз при запуске; переключение рабочего стола между светлым и тёмным при открытом приложении не меняет оформление текущего окна</li></ul>"
  - version: "1.0.3-3"
    type: stable
    unix-timestamp: 1784678400
    description:
      C: "<p>Bugfix release: reverted the --root Administrator launcher (D-Bus instance conflict), fixed false firmware locks for intel/iwlwifi/nvidia, fixed VirtualBox uninstall feedback.</p><ul><li>Removed: --root launch flag and Administrator .desktop launcher — caused a D-Bus instance conflict that opened user mode instead of Administrator mode; the leftover launcher file is now cleaned up automatically the next time a root session starts</li><li>Fixed: intel/iwlwifi/nvidia firmware falsely locked as required with no matching real hardware — a loaded-but-unused kernel module (e.g. nouveau/iwlwifi on a VM) was trusted for its full theoretical firmware list instead of what the system actually needs</li><li>Fixed: intel firmware family was still locked by an emulated Intel chipset/audio device — now requires a genuine Intel network-class device, same as iwlwifi</li><li>Fixed: VirtualBox Guest Additions uninstall result was silently discarded when triggered from \"Remove orphaned packages\" — its error, if any, is now shown</li></ul>"
      de: "<p>Fehlerbehebungsversion: --root-Administrator-Starter zurückgenommen (D-Bus-Instanzkonflikt), fälschliche Firmware-Sperren für intel/iwlwifi/nvidia behoben, Rückmeldung zur VirtualBox-Deinstallation behoben.</p><ul><li>Entfernt: --root-Startoption und Administrator-.desktop-Starter — verursachte einen D-Bus-Instanzkonflikt, der den Benutzermodus statt des Administratormodus öffnete; die verbleibende Starter-Datei wird nun beim nächsten Start einer Root-Sitzung automatisch entfernt</li><li>Behoben: intel/iwlwifi/nvidia-Firmware wurde ohne passende echte Hardware fälschlich als benötigt gesperrt — ein geladenes, aber ungenutztes Kernelmodul (z. B. nouveau/iwlwifi in einer VM) wurde mit seiner vollständigen theoretischen Firmware-Liste akzeptiert statt mit dem, was das System tatsächlich braucht</li><li>Behoben: die Firmware-Familie intel wurde weiterhin durch ein emuliertes Intel-Chipsatz-/Audiogerät gesperrt — erfordert nun ein echtes Intel-Netzwerkgerät, genau wie iwlwifi</li><li>Behoben: das Ergebnis der VirtualBox-Guest-Additions-Deinstallation wurde beim Auslösen über \"Verwaiste Pakete entfernen\" stillschweigend verworfen — ein etwaiger Fehler wird nun angezeigt</li></ul>"
      es: "<p>Versión de corrección: revertido el lanzador --root de Administrador (conflicto de instancia D-Bus), corregidos los bloqueos falsos de firmware intel/iwlwifi/nvidia, corregido el aviso de desinstalación de VirtualBox.</p><ul><li>Eliminado: flag de arranque --root y lanzador .desktop de Administrador — causaba un conflicto de instancia D-Bus que abría el modo usuario en vez del modo Administrador; el archivo residual del lanzador ahora se limpia automáticamente la próxima vez que se inicia una sesión root</li><li>Corregido: el firmware intel/iwlwifi/nvidia se bloqueaba como necesario sin hardware real correspondiente — un módulo del kernel cargado pero sin usar (ej. nouveau/iwlwifi en una VM) se aceptaba con toda su lista teórica de firmware en vez de lo que el sistema realmente necesita</li><li>Corregido: la familia de firmware intel seguía bloqueada por un chipset/audio Intel emulado — ahora requiere un dispositivo de red Intel real, igual que iwlwifi</li><li>Corregido: el resultado de la desinstalación de VirtualBox Guest Additions se descartaba en silencio al activarse desde \"Eliminar paquetes huérfanos\" — su error, si lo hay, ahora se muestra</li></ul>"
      fr: "<p>Version corrective : lanceur Administrateur --root annulé (conflit d'instance D-Bus), verrouillages erronés du firmware intel/iwlwifi/nvidia corrigés, retour d'information de désinstallation de VirtualBox corrigé.</p><ul><li>Supprimé : option de lancement --root et lanceur .desktop Administrateur — provoquait un conflit d'instance D-Bus qui ouvrait le mode utilisateur au lieu du mode Administrateur ; le fichier de lanceur résiduel est désormais nettoyé automatiquement au prochain démarrage d'une session root</li><li>Corrigé : le firmware intel/iwlwifi/nvidia était verrouillé comme nécessaire sans matériel réel correspondant — un module noyau chargé mais inutilisé (ex. nouveau/iwlwifi sur une VM) était accepté avec toute sa liste théorique de firmware au lieu de ce dont le système a réellement besoin</li><li>Corrigé : la famille de firmware intel restait verrouillée par un chipset/périphérique audio Intel émulé — nécessite désormais un véritable périphérique réseau Intel, comme iwlwifi</li><li>Corrigé : le résultat de la désinstallation de VirtualBox Guest Additions était silencieusement ignoré lorsqu'il était déclenché depuis \"Supprimer les paquets orphelins\" — son erreur, le cas échéant, est désormais affichée</li></ul>"
      it: "<p>Versione correttiva: launcher Amministratore --root annullato (conflitto di istanza D-Bus), blocchi falsi del firmware intel/iwlwifi/nvidia corretti, feedback di disinstallazione di VirtualBox corretto.</p><ul><li>Rimosso: opzione di avvio --root e launcher .desktop Amministratore — causava un conflitto di istanza D-Bus che apriva la modalità utente invece della modalità Amministratore; il file del launcher residuo viene ora rimosso automaticamente al prossimo avvio di una sessione root</li><li>Corretto: il firmware intel/iwlwifi/nvidia veniva bloccato come necessario senza hardware reale corrispondente — un modulo del kernel caricato ma inutilizzato (es. nouveau/iwlwifi su una VM) veniva accettato con l'intera lista teorica di firmware invece di ciò che il sistema necessita realmente</li><li>Corretto: la famiglia di firmware intel rimaneva bloccata da un chipset/dispositivo audio Intel emulato — ora richiede un vero dispositivo di rete Intel, come iwlwifi</li><li>Corretto: il risultato della disinstallazione di VirtualBox Guest Additions veniva scartato silenziosamente quando attivato da \"Rimuovi pacchetti orfani\" — il suo errore, se presente, viene ora mostrato</li></ul>"
      pt: "<p>Versão de correção: lançador --root de Administrador revertido (conflito de instância D-Bus), bloqueios falsos de firmware intel/iwlwifi/nvidia corrigidos, feedback de desinstalação do VirtualBox corrigido.</p><ul><li>Removido: opção de arranque --root e lançador .desktop de Administrador — causava um conflito de instância D-Bus que abria o modo utilizador em vez do modo Administrador; o arquivo residual do lançador agora é limpo automaticamente na próxima vez que uma sessão root é iniciada</li><li>Corrigido: o firmware intel/iwlwifi/nvidia era bloqueado como necessário sem hardware real correspondente — um módulo do kernel carregado mas não utilizado (ex. nouveau/iwlwifi numa VM) era aceite com toda a sua lista teórica de firmware em vez do que o sistema realmente precisa</li><li>Corrigido: a família de firmware intel continuava bloqueada por um chipset/dispositivo de áudio Intel emulado — agora exige um dispositivo de rede Intel real, tal como o iwlwifi</li><li>Corrigido: o resultado da desinstalação do VirtualBox Guest Additions era descartado silenciosamente ao ser acionado a partir de \"Remover pacotes órfãos\" — o seu erro, se houver, agora é mostrado</li></ul>"
      ro: "<p>Versiune de corectare: lansatorul Administrator --root anulat (conflict de instanță D-Bus), blocările false ale firmware-ului intel/iwlwifi/nvidia remediate, feedback-ul de dezinstalare VirtualBox remediat.</p><ul><li>Eliminat: opțiunea de pornire --root și lansatorul .desktop Administrator — provoca un conflict de instanță D-Bus care deschidea modul utilizator în loc de modul Administrator; fișierul rezidual al lansatorului este acum curățat automat la următoarea pornire a unei sesiuni root</li><li>Remediat: firmware-ul intel/iwlwifi/nvidia era blocat fals ca necesar fără hardware real corespunzător — un modul de kernel încărcat dar neutilizat (ex. nouveau/iwlwifi pe o VM) era acceptat cu întreaga listă teoretică de firmware în loc de ceea ce sistemul are cu adevărat nevoie</li><li>Remediat: familia de firmware intel rămânea blocată de un chipset/dispozitiv audio Intel emulat — necesită acum un dispozitiv de rețea Intel real, la fel ca iwlwifi</li><li>Remediat: rezultatul dezinstalării VirtualBox Guest Additions era ignorat silențios când era declanșat din \"Elimină pachetele orfane\" — eroarea sa, dacă există, este acum afișată</li></ul>"
      ru: "<p>Версия с исправлениями: отменён запуск администратора --root (конфликт экземпляров D-Bus), исправлены ложные блокировки прошивки intel/iwlwifi/nvidia, исправлена обратная связь при удалении VirtualBox.</p><ul><li>Удалено: флаг запуска --root и ярлык .desktop администратора — вызывал конфликт экземпляров D-Bus, из-за которого открывался пользовательский режим вместо режима администратора; оставшийся файл ярлыка теперь автоматически удаляется при следующем запуске root-сессии</li><li>Исправлено: прошивка intel/iwlwifi/nvidia ложно блокировалась как необходимая при отсутствии соответствующего реального оборудования — загруженный, но неиспользуемый модуль ядра (напр. nouveau/iwlwifi в VM) принимался со всем своим теоретическим списком прошивок вместо того, что системе реально нужно</li><li>Исправлено: семейство прошивок intel по-прежнему блокировалось эмулированным чипсетом/аудиоустройством Intel — теперь требуется настоящее сетевое устройство Intel, как и для iwlwifi</li><li>Исправлено: результат удаления VirtualBox Guest Additions незаметно отбрасывался при запуске из \"Удалить неиспользуемые пакеты\" — теперь его ошибка, если есть, отображается</li></ul>"
  - version: "1.0.3-2"
    type: stable
    unix-timestamp: 1784592000
    description:
      C: "<p>Feature release: --root launch flag with Administrator .desktop launcher, duplicate VM guest package fix, Intel GPU firmware false-positive lock fix.</p><ul><li>Added: --root launch flag and new Administrator .desktop launcher — opens the app directly in Administrator mode via pkexec, auto-created the first time a root session is established</li><li>Fixed: spice-vdagent/spice-webdavd appeared twice in the Drivers tab on non-KVM/QEMU guests (e.g. VMware), also breaking \"Select all\" for one of the duplicate rows</li><li>Fixed: Intel GPU firmware (i915) was locked as required even without a real Intel GPU, when a VM exposes an emulated Intel-vendor chipset device</li></ul>"
      de: "<p>Version mit Neuerungen: --root-Startoption mit Administrator-.desktop-Starter, Korrektur doppelter VM-Gastpakete, Korrektur der fälschlichen Intel-GPU-Firmware-Sperre.</p><ul><li>Hinzugefügt: --root-Startoption und neuer Administrator-.desktop-Starter — öffnet die App direkt im Administratormodus über pkexec, automatisch erstellt beim ersten Aufbau einer Root-Sitzung</li><li>Behoben: spice-vdagent/spice-webdavd erschienen doppelt im Treiber-Tab bei Nicht-KVM/QEMU-Gästen (z. B. VMware), was auch \"Alle auswählen\" für eine der doppelten Zeilen kaputt machte</li><li>Behoben: Intel-GPU-Firmware (i915) wurde als benötigt gesperrt, auch ohne echte Intel-GPU, wenn eine VM einen emulierten Chipsatz mit Intel-Kennung zeigt</li></ul>"
      es: "<p>Versión con novedades: flag de arranque --root con lanzador .desktop de Administrador, corrección de paquetes de VM duplicados, corrección del bloqueo falso de firmware de GPU Intel.</p><ul><li>Añadido: flag de arranque --root y nuevo lanzador .desktop de Administrador — abre la app directamente en modo Administrador vía pkexec, creado automáticamente la primera vez que se establece una sesión root</li><li>Corregido: spice-vdagent/spice-webdavd aparecían duplicados en la pestaña Drivers en invitados que no son KVM/QEMU (ej. VMware), rompiendo también \"Seleccionar todo\" para una de las filas duplicadas</li><li>Corregido: el firmware de GPU Intel (i915) se bloqueaba como necesario aunque no hubiera GPU Intel real, cuando una VM expone un chipset con vendor Intel emulado</li></ul>"
      fr: "<p>Version avec nouveautés : option de lancement --root avec lanceur .desktop Administrateur, correction des paquets VM dupliqués, correction du verrouillage erroné du firmware GPU Intel.</p><ul><li>Ajouté : option de lancement --root et nouveau lanceur .desktop Administrateur — ouvre l'application directement en mode Administrateur via pkexec, créé automatiquement la première fois qu'une session root est établie</li><li>Corrigé : spice-vdagent/spice-webdavd apparaissaient en double dans l'onglet Pilotes sur les invités non KVM/QEMU (ex. VMware), cassant aussi \"Tout sélectionner\" pour l'une des lignes dupliquées</li><li>Corrigé : le firmware GPU Intel (i915) était verrouillé comme nécessaire même sans GPU Intel réel, lorsqu'une VM expose un chipset à identifiant Intel émulé</li></ul>"
      it: "<p>Versione con novità: opzione di avvio --root con launcher .desktop Amministratore, correzione dei pacchetti VM duplicati, correzione del blocco falso del firmware GPU Intel.</p><ul><li>Aggiunto: opzione di avvio --root e nuovo launcher .desktop Amministratore — apre l'app direttamente in modalità Amministratore tramite pkexec, creato automaticamente alla prima creazione di una sessione root</li><li>Corretto: spice-vdagent/spice-webdavd apparivano duplicati nella scheda Driver sui guest non KVM/QEMU (es. VMware), rompendo anche \"Seleziona tutto\" per una delle righe duplicate</li><li>Corretto: il firmware GPU Intel (i915) veniva bloccato come necessario anche senza una vera GPU Intel, quando una VM espone un chipset con ID vendor Intel emulato</li></ul>"
      pt: "<p>Versão com novidades: opção de arranque --root com lançador .desktop de Administrador, correção de pacotes de VM duplicados, correção do bloqueio falso do firmware da GPU Intel.</p><ul><li>Adicionado: opção de arranque --root e novo lançador .desktop de Administrador — abre a app diretamente em modo Administrador via pkexec, criado automaticamente na primeira vez que se estabelece uma sessão root</li><li>Corrigido: spice-vdagent/spice-webdavd apareciam duplicados na aba Drivers em convidados que não são KVM/QEMU (ex. VMware), quebrando também \"Selecionar tudo\" para uma das linhas duplicadas</li><li>Corrigido: o firmware da GPU Intel (i915) era bloqueado como necessário mesmo sem uma GPU Intel real, quando uma VM expõe um chipset com ID Intel emulado</li></ul>"
      ro: "<p>Versiune cu noutăți: opțiune de pornire --root cu lansator .desktop Administrator, remedierea pachetelor VM duplicate, remedierea blocării false a firmware-ului GPU Intel.</p><ul><li>Adăugat: opțiune de pornire --root și nou lansator .desktop Administrator — deschide aplicația direct în modul Administrator prin pkexec, creat automat prima dată când se stabilește o sesiune root</li><li>Remediat: spice-vdagent/spice-webdavd apăreau duplicate în fila Drivere pe oaspeți non-KVM/QEMU (ex. VMware), stricând și \"Selectează tot\" pentru unul dintre rândurile duplicate</li><li>Remediat: firmware-ul GPU Intel (i915) era blocat ca necesar chiar și fără o GPU Intel reală, când o VM expune un chipset cu ID Intel emulat</li></ul>"
      ru: "<p>Версия с нововведениями: флаг запуска --root с ярлыком .desktop администратора, исправление дублирующихся пакетов VM, исправление ложной блокировки прошивки Intel GPU.</p><ul><li>Добавлено: флаг запуска --root и новый ярлык .desktop администратора — открывает приложение сразу в режиме администратора через pkexec, создаётся автоматически при первом установлении root-сессии</li><li>Исправлено: spice-vdagent/spice-webdavd дублировались на вкладке Драйверы на гостевых системах, отличных от KVM/QEMU (напр. VMware), что также ломало «Выбрать всё» для одной из повторяющихся строк</li><li>Исправлено: прошивка GPU Intel (i915) блокировалась как необходимая даже без реального GPU Intel, когда VM показывает эмулированный чипсет с идентификатором Intel</li></ul>"
  - version: "1.0.3-1"
    type: stable
    unix-timestamp: 1784592000
    description:
      C: "<p>Bug fix release: NVIDIA firmware/driver purge, virt-viewer false positive, orphaned dracut.conf.d cleanup, full VirtualBox Guest Additions uninstall, temporary firmware warning, unified package/module mapping.</p><ul><li>Fixed: NVIDIA firmware deletion left the driver package fully installed if it wasn't the dedicated firmware-* package — now purges the full driver stack before touching files</li><li>Fixed: virt-viewer/virt-manager/libvirt-clients false positive — these are remote clients (e.g. Proxmox), not tied to local KVM support, no longer flagged as unused</li><li>Fixed: orphaned /etc/dracut.conf.d/*.conf from driver installers (nvidia.conf, blacklist-nouveau.conf) were never detected or cleaned. Now scanned and removed, with a hard exclusion for distro-policy files (soplos.conf, i18n.conf, local.conf)</li><li>Fixed: VirtualBox Guest Additions were never fully uninstalled — only leftover service/autostart files were removed. Now runs the official uninstall.sh/rcvboxadd cleanup first when present</li><li>Added: firmware families without a dedicated package (bundled in firmware-linux-nonfree/firmware-misc-nonfree) are now marked \"temporary\" via real dpkg -S ownership lookup — removing them only reclaims space until the next package update</li><li>Changed: unified the package-kernel-module mapping across hardware.py, cache.py and root_helper.py into a single source of truth — the two files had already drifted out of sync</li></ul>"
      de: "<p>Fehlerbehebungsversion: NVIDIA-Firmware/Treiber-Bereinigung, virt-viewer-Fehlalarm, Bereinigung verwaister dracut.conf.d, vollständige Deinstallation von VirtualBox Guest Additions, Warnung für temporäre Firmware, vereinheitlichtes Paket-Modul-Mapping.</p><ul><li>Behoben: Beim Löschen der NVIDIA-Firmware blieb das Treiberpaket vollständig installiert, wenn es nicht das dedizierte firmware-*-Paket war — jetzt wird der gesamte Treiber-Stack vor dem Löschen von Dateien entfernt</li><li>Behoben: Fehlalarm bei virt-viewer/virt-manager/libvirt-clients — dies sind entfernte Client-Tools (z. B. Proxmox), unabhängig von lokaler KVM-Unterstützung, werden nicht mehr als ungenutzt markiert</li><li>Behoben: verwaiste .conf-Dateien in /etc/dracut.conf.d/ von Treiberinstallern (nvidia.conf, blacklist-nouveau.conf) wurden nie erkannt oder bereinigt. Werden jetzt gescannt und entfernt, mit einer festen Ausschlussliste für Distro-Richtliniendateien (soplos.conf, i18n.conf, local.conf)</li><li>Behoben: VirtualBox Guest Additions wurden nie vollständig deinstalliert — nur verbleibende Dienst-/Autostart-Dateien wurden entfernt. Führt jetzt zuerst das offizielle uninstall.sh (oder rcvboxadd cleanup) aus, falls vorhanden</li><li>Hinzugefügt: Firmware-Familien ohne dediziertes Paket (gebündelt in firmware-linux-nonfree/firmware-misc-nonfree) werden jetzt über eine echte dpkg -S-Eigentümerabfrage als \"vorübergehend\" markiert — das Entfernen gibt nur bis zum nächsten Paket-Update Speicherplatz frei</li><li>Geändert: Paket-Kernelmodul-Zuordnung über hardware.py, cache.py und root_helper.py in einer einzigen Quelle der Wahrheit vereinheitlicht — die beiden Dateien waren bereits auseinandergedriftet</li></ul>"
      es: "<p>Versión de correcciones: purga de firmware/driver NVIDIA, falso positivo de virt-viewer, limpieza de dracut.conf.d huérfanos, desinstalación completa de VirtualBox Guest Additions, aviso de firmware temporal, mapeo de paquetes/módulos unificado.</p><ul><li>Corregido: al eliminar firmware de NVIDIA el paquete del driver quedaba totalmente instalado si no era el paquete firmware-* dedicado — ahora purga todo el stack del driver antes de tocar archivos</li><li>Corregido: falso positivo de virt-viewer/virt-manager/libvirt-clients — son clientes remotos (ej. Proxmox), no dependen de KVM local, ya no se marcan como no usados</li><li>Corregido: los .conf huérfanos de /etc/dracut.conf.d/ dejados por instaladores de drivers (nvidia.conf, blacklist-nouveau.conf) nunca se detectaban ni limpiaban. Ahora se escanean y eliminan, con exclusión estricta para archivos de política de la distro (soplos.conf, i18n.conf, local.conf)</li><li>Corregido: las VirtualBox Guest Additions nunca se desinstalaban del todo — solo se eliminaban los archivos de servicio/autostart sobrantes. Ahora ejecuta primero el uninstall.sh oficial (o rcvboxadd cleanup) cuando está presente</li><li>Añadido: las familias de firmware sin paquete dedicado (incluidas en firmware-linux-nonfree/firmware-misc-nonfree) ahora se marcan como \"temporales\" mediante una consulta real a dpkg -S — eliminarlas solo libera espacio hasta la próxima actualización del paquete</li><li>Cambiado: unificado el mapeo paquete-módulo del kernel entre hardware.py, cache.py y root_helper.py en una única fuente de verdad — los dos archivos ya se habían desincronizado</li></ul>"
      fr: "<p>Version de corrections : purge du firmware/pilote NVIDIA, faux positif de virt-viewer, nettoyage des dracut.conf.d orphelins, désinstallation complète de VirtualBox Guest Additions, avertissement de firmware temporaire, mapping paquet/module unifié.</p><ul><li>Corrigé : la suppression du firmware NVIDIA laissait le paquet du pilote entièrement installé s'il ne s'agissait pas du paquet firmware-* dédié — purge désormais l'ensemble de la pile du pilote avant de toucher aux fichiers</li><li>Corrigé : faux positif pour virt-viewer/virt-manager/libvirt-clients — ce sont des clients distants (ex. Proxmox), indépendants du support KVM local, ils ne sont plus signalés comme inutilisés</li><li>Corrigé : les fichiers .conf orphelins de /etc/dracut.conf.d/ laissés par les installateurs de pilotes (nvidia.conf, blacklist-nouveau.conf) n'étaient jamais détectés ni nettoyés. Désormais analysés et supprimés, avec une exclusion stricte pour les fichiers de politique de la distribution (soplos.conf, i18n.conf, local.conf)</li><li>Corrigé : les VirtualBox Guest Additions n'étaient jamais complètement désinstallées — seuls les fichiers de service/autostart restants étaient supprimés. Exécute désormais d'abord le uninstall.sh officiel (ou rcvboxadd cleanup) si présent</li><li>Ajouté : les familles de firmware sans paquet dédié (incluses dans firmware-linux-nonfree/firmware-misc-nonfree) sont désormais marquées \"temporaires\" via une recherche réelle du propriétaire avec dpkg -S — les supprimer ne libère de l'espace que jusqu'à la prochaine mise à jour du paquet</li><li>Modifié : mapping paquet-module du noyau unifié entre hardware.py, cache.py et root_helper.py en une seule source de vérité — les deux fichiers avaient déjà divergé</li></ul>"
      it: "<p>Versione di correzioni: pulizia firmware/driver NVIDIA, falso positivo di virt-viewer, pulizia dei dracut.conf.d orfani, disinstallazione completa delle VirtualBox Guest Additions, avviso di firmware temporaneo, mappatura pacchetto/modulo unificata.</p><ul><li>Corretto: l'eliminazione del firmware NVIDIA lasciava il pacchetto del driver completamente installato se non era il pacchetto firmware-* dedicato — ora elimina l'intero stack del driver prima di toccare i file</li><li>Corretto: falso positivo per virt-viewer/virt-manager/libvirt-clients — sono client remoti (es. Proxmox), non legati al supporto KVM locale, non più segnalati come inutilizzati</li><li>Corretto: i file .conf orfani in /etc/dracut.conf.d/ lasciati dagli installer dei driver (nvidia.conf, blacklist-nouveau.conf) non venivano mai rilevati né puliti. Ora vengono scansionati e rimossi, con un'esclusione rigida per i file di policy della distro (soplos.conf, i18n.conf, local.conf)</li><li>Corretto: le VirtualBox Guest Additions non venivano mai disinstallate completamente — venivano rimossi solo i file di servizio/autostart residui. Ora esegue prima il uninstall.sh ufficiale (o rcvboxadd cleanup) se presente</li><li>Aggiunto: le famiglie di firmware senza un pacchetto dedicato (incluse in firmware-linux-nonfree/firmware-misc-nonfree) sono ora contrassegnate come \"temporanee\" tramite una vera verifica del proprietario con dpkg -S — rimuoverle libera spazio solo fino al prossimo aggiornamento del pacchetto</li><li>Modificato: unificata la mappatura pacchetto-modulo del kernel tra hardware.py, cache.py e root_helper.py in un'unica fonte di verità — i due file erano già disallineati</li></ul>"
      pt: "<p>Versão de correções: purga de firmware/driver NVIDIA, falso positivo do virt-viewer, limpeza de dracut.conf.d órfãos, desinstalação completa das VirtualBox Guest Additions, aviso de firmware temporário, mapeamento de pacotes/módulos unificado.</p><ul><li>Corrigido: a remoção do firmware NVIDIA deixava o pacote do driver totalmente instalado se não fosse o pacote firmware-* dedicado — agora purga toda a pilha do driver antes de tocar nos arquivos</li><li>Corrigido: falso positivo de virt-viewer/virt-manager/libvirt-clients — são clientes remotos (ex. Proxmox), não dependem de suporte KVM local, não são mais marcados como não utilizados</li><li>Corrigido: arquivos .conf órfãos em /etc/dracut.conf.d/ deixados por instaladores de drivers (nvidia.conf, blacklist-nouveau.conf) nunca eram detetados ou limpos. Agora são verificados e removidos, com exclusão rígida para arquivos de política da distro (soplos.conf, i18n.conf, local.conf)</li><li>Corrigido: as VirtualBox Guest Additions nunca eram totalmente desinstaladas — só os arquivos de serviço/autostart remanescentes eram removidos. Agora executa primeiro o uninstall.sh oficial (ou rcvboxadd cleanup) quando presente</li><li>Adicionado: famílias de firmware sem pacote dedicado (incluídas em firmware-linux-nonfree/firmware-misc-nonfree) agora são marcadas como \"temporárias\" via consulta real a dpkg -S — removê-las só liberta espaço até a próxima atualização do pacote</li><li>Alterado: unificado o mapeamento pacote-módulo do kernel entre hardware.py, cache.py e root_helper.py numa única fonte de verdade — os dois arquivos já tinham divergido</li></ul>"
      ro: "<p>Versiune de remedieri: curățarea firmware-ului/driverului NVIDIA, fals pozitiv virt-viewer, curățarea fișierelor dracut.conf.d orfane, dezinstalarea completă a VirtualBox Guest Additions, avertisment de firmware temporar, mapare pachet/modul unificată.</p><ul><li>Remediat: ștergerea firmware-ului NVIDIA lăsa pachetul driverului complet instalat dacă nu era pachetul firmware-* dedicat — acum se elimină întregul set de pachete ale driverului înainte de a atinge fișierele</li><li>Remediat: fals pozitiv pentru virt-viewer/virt-manager/libvirt-clients — acestea sunt clienți la distanță (ex. Proxmox), independenți de suportul KVM local, nu mai sunt marcați ca nefolosiți</li><li>Remediat: fișierele .conf orfane din /etc/dracut.conf.d/ lăsate de instalatoarele de drivere (nvidia.conf, blacklist-nouveau.conf) nu erau niciodată detectate sau curățate. Acum sunt scanate și eliminate, cu o excludere strictă pentru fișierele de politică ale distribuției (soplos.conf, i18n.conf, local.conf)</li><li>Remediat: VirtualBox Guest Additions nu erau niciodată complet dezinstalate — erau eliminate doar fișierele rămase de serviciu/autostart. Acum rulează mai întâi uninstall.sh oficial (sau rcvboxadd cleanup) dacă este prezent</li><li>Adăugat: familiile de firmware fără un pachet dedicat (incluse în firmware-linux-nonfree/firmware-misc-nonfree) sunt acum marcate drept \"temporare\" printr-o verificare reală a proprietarului cu dpkg -S — eliminarea lor eliberează spațiu doar până la următoarea actualizare a pachetului</li><li>Modificat: unificată maparea pachet-modul de kernel din hardware.py, cache.py și root_helper.py într-o singură sursă de adevăr — cele două fișiere se desincronizaseră deja</li></ul>"
      ru: "<p>Версия исправлений: очистка прошивки/драйвера NVIDIA, ложное срабатывание virt-viewer, очистка осиротевших dracut.conf.d, полное удаление VirtualBox Guest Additions, предупреждение о временной прошивке, унифицированное сопоставление пакетов/модулей.</p><ul><li>Исправлено: удаление прошивки NVIDIA оставляло пакет драйвера полностью установленным, если это был не выделенный пакет firmware-* — теперь перед удалением файлов очищается весь стек драйвера</li><li>Исправлено: ложное срабатывание для virt-viewer/virt-manager/libvirt-clients — это удалённые клиенты (напр. Proxmox), не зависящие от локальной поддержки KVM, больше не помечаются как неиспользуемые</li><li>Исправлено: осиротевшие файлы .conf в /etc/dracut.conf.d/, оставленные установщиками драйверов (nvidia.conf, blacklist-nouveau.conf), никогда не обнаруживались и не удалялись. Теперь сканируются и удаляются, с жёстким исключением для файлов политики дистрибутива (soplos.conf, i18n.conf, local.conf)</li><li>Исправлено: VirtualBox Guest Additions никогда не удалялись полностью — удалялись только оставшиеся файлы служб/автозапуска. Теперь сначала запускается официальный uninstall.sh (или rcvboxadd cleanup), если он присутствует</li><li>Добавлено: семейства прошивок без выделенного пакета (входящие в firmware-linux-nonfree/firmware-misc-nonfree) теперь помечаются как «временные» через реальную проверку владельца через dpkg -S — их удаление освобождает место только до следующего обновления пакета</li><li>Изменено: объединено сопоставление пакет-модуль ядра между hardware.py, cache.py и root_helper.py в единый источник истины — эти два файла уже разошлись</li></ul>"
