Summary:
  C: Advanced GRUB configuration editor with complete internationalization
  es: Editor avanzado de configuración GRUB con internacionalización completa
  fr: Éditeur de configuration GRUB avancé avec internationalisation complète
  pt: Editor avançado de configuração GRUB com internacionalização completa
