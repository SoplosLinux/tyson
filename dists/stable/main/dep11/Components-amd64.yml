---
Type: desktop-application
ID: org.soplos.appimagemanager
ProjectLicense: GPL-3.0+
Package: soplos-appimage-manager
Name:
  C: Soplos AppImage Manager
  es: Gestor de AppImage de Soplos
  fr: Gestionnaire AppImage Soplos
  de: Soplos AppImage-Verwaltung
  it: Gestore AppImage Soplos
  pt: Gestor de AppImage Soplos
  ru: Менеджер AppImage Soplos
  ro: Manager AppImage Soplos
Summary:
  C: Manage AppImage applications on Soplos Linux
  es: Gestiona aplicaciones AppImage en Soplos Linux
  fr: Gérez les applications AppImage sur Soplos Linux
  de: Verwalten Sie AppImage-Anwendungen unter Soplos Linux
  it: Gestisci le applicazioni AppImage su Soplos Linux
  pt: Gerencie aplicativos AppImage no Soplos Linux
  ru: Управляйте приложениями AppImage в Soplos Linux
  ro: Gestionați aplicațiile AppImage pe Soplos Linux
Description:
  C: |-
    <p>Soplos AppImage Manager lets you easily integrate AppImage applications into your Soplos Linux desktop. Select any AppImage file, and the manager will move it to your ~/AppImages folder, extract its icon and metadata, and create a desktop entry so the app appears in your application menu.</p>
  es: |-
    <p>Soplos AppImage Manager le permite integrar fácilmente aplicaciones AppImage en su escritorio Soplos Linux. Seleccione cualquier archivo AppImage y el gestor lo moverá a su carpeta ~/AppImages, extraerá su icono y metadatos, y creará una entrada de escritorio para que la aplicación aparezca en su menú de aplicaciones.</p>
