  C: "Soplos Welcome"
  de: "Willkommen bei Soplos"
  en: "Soplos Welcome"
  es: "Bienvenida a Soplos"
  fr: "Bienvenue à Soplos"
  it: "Benvenuto in Soplos"
  pt: "Bem-vindo ao Soplos"
  ro: "Bun venit la Soplos"
  ru: "Добро пожаловать в Soplos"
Summary:
  C: "Welcome screen for Soplos Linux"
  de: "Willkommens- und Einrichtungsanwendung für Soplos Linux"
  en: "Welcome and system setup application for Soplos Linux"
  es: "Aplicación de bienvenida y configuración para Soplos Linux"
  fr: "Application d'accueil et de configuration pour Soplos Linux"
  it: "Applicazione di benvenuto e configurazione per Soplos Linux"
  pt: "Aplicação de boas-vindas e configuração para o Soplos Linux"
  ro: "Aplicație de bun venit și configurare pentru Soplos Linux"
  ru: "Приложение приветствия и настройки для Soplos Linux"
Description:
  C: "<p>A welcome application for new users of Soplos Linux. Provides easy access to common system configuration and software installation tasks: driver setup, recommended applications, kernel management, security tools, customization and gaming optimizations.</p>"
  de: "<p>Willkommensanwendung für neue Benutzer von Soplos Linux. Bietet einfachen Zugriff auf gängige Systemkonfigurationen und Softwareinstallationen: Treiber, empfohlene Anwendungen, Kernelverwaltung, Sicherheitswerkzeuge, Anpassungen und Gaming-Optimierungen.</p>"
  es: "<p>Aplicación de bienvenida para nuevos usuarios de Soplos Linux. Proporciona acceso rápido a la configuración del sistema y tareas de instalación: instalación de controladores, aplicaciones recomendadas, gestión de kernels, herramientas de seguridad, personalización y optimizaciones para juegos.</p>"
  fr: "<p>Application d'accueil pour les nouveaux utilisateurs de Soplos Linux. Fournit un accès facile à la configuration du système et à l'installation de logiciels : pilotes, applications recommandées, gestion des noyaux, outils de sécurité, personnalisation et optimisations pour les jeux.</p>"
  it: "<p>Applicazione di benvenuto per i nuovi utenti di Soplos Linux. Offre facile accesso alla configurazione del sistema e alle attività di installazione: driver, applicazioni consigliate, gestione dei kernel, strumenti di sicurezza, personalizzazione e ottimizzazioni per i giochi.</p>"
  pt: "<p>Aplicação de boas-vindas para novos utilizadores do Soplos Linux. Facilita o acesso à configuração do sistema e tarefas de instalação: controladores, aplicações recomendadas, gestão de kernels, ferramentas de segurança, personalização e otimizações para jogos.</p>"
  ro: "<p>Aplicație de bun venit pentru noii utilizatori de Soplos Linux. Oferă acces rapid la configurarea sistemului și instalarea software-ului: drivere, aplicații recomandate, gestionarea kernelurilor, securitate, personalizare și optimizări pentru jocuri.</p>"
  ru: "<p>Приложение приветствия для новых пользователей Soplos Linux. Обеспечивает быстрый доступ к настройке системы и установке программ: установка драйверов, рекомендуемые приложения, управление ядрами, безопасность, персонализация и оптимизация для игр.</p>"
