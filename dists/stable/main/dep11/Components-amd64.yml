  es: "<p>Soplos AppImage Manager le permite integrar fácilmente aplicaciones AppImage en su escritorio Soplos Linux. Seleccione cualquier archivo AppImage y el gestor lo moverá a su carpeta ~/AppImages, extraerá su icono y metadatos, y creará una entrada de escritorio para que la aplicación aparezca en su menú de aplicaciones.</p>"
