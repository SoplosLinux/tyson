    type: stable
    description:
      en: |-
        Fixed repository detection for mirrors and regional repositories. Fixed legacy parser to correctly detect commented-out repositories. Optimized pkexec calls to reduce password prompts.
      es: |-
        Corregida la detección de repositorios en mirrors y repositorios regionales. Corregido el parser legado para detectar correctamente repositorios comentados. Optimizadas las llamadas a pkexec para reducir solicitudes de contraseña.
      fr: |-
        Correction de la détection des dépôts pour les miroirs et dépôts régionaux. Correction du parseur hérité pour détecter correctement les dépôts commentés. Optimisation des appels pkexec pour réduire les demandes de mot de passe.
      pt: |-
        Corrigida a detecção de repositórios para espelhos e repositórios regionais. Corrigido o parser legado para detectar corretamente repositórios comentados. Otimizadas as chamadas pkexec para reduzir solicitações de senha.
      de: |-
        Repository-Erkennung für Spiegel und regionale Repositories korrigiert. Legacy-Parser korrigiert, um auskommentierte Repositories korrekt zu erkennen. pkexec-Aufrufe optimiert, um Passwortabfragen zu reduzieren.
      it: |-
        Corretta la rilevazione dei repository per mirror e repository regionali. Corretto il parser legacy per rilevare correttamente i repository commentati. Ottimizzate le chiamate pkexec per ridurre le richieste di password.
      ru: |-
        Исправлено обнаружение репозиториев для зеркал и региональных репозиториев. Исправлен устаревший парсер для корректного обнаружения закомментированных репозиториев. Оптимизированы вызовы pkexec для уменьшения запросов пароля.
      ro: |-
        Corectată detectarea depozitelor pentru oglinzi și depozite regionale. Corectat parserul legacy pentru detectarea corectă a depozitelor comentate. Optimizate apelurile pkexec pentru reducerea solicitărilor de parolă.
      C: |-
        Fixed repository detection for mirrors and regional repositories. Fixed legacy parser to correctly detect commented-out repositories. Optimized pkexec calls to reduce password prompts.
