    unix-timestamp: 1751673600
    description:
      C: "<p>Unified script for all systemd operations with single pkexec authentication, fixing multiple password prompts.</p><ul><li>Eliminación automática de archivos temporales después de crear servicios.</li><li>Mejoras en el manejo de errores y estabilidad general del sistema.</li></ul>"
      de: "<p>Vereinheitlichtes Skript für alle systemd-Operationen mit einmaliger pkexec-Authentifizierung, wodurch mehrere Passwortabfragen entfallen.</p>"
      en: "<p>Unified script for all systemd operations with single pkexec authentication, fixing multiple password prompts.</p>"
      es: "<p>Script unificado para todas las operaciones systemd con una sola autenticación pkexec, eliminando múltiples solicitudes de contraseña.</p>"
      fr: "<p>Script unifié pour toutes les opérations systemd avec une seule authentification pkexec, éliminant les multiples demandes de mot de passe.</p>"
      it: "<p>Script unificato per tutte le operazioni systemd con un'unica autenticazione pkexec, eliminando richieste multiple di password.</p>"
      pt: "<p>Script unificado para todas as operações systemd com uma única autenticação pkexec, eliminando múltiplos pedidos de senha.</p>"
      ro: "<p>Script unificat pentru toate operațiunile systemd cu o singură autentificare pkexec, eliminând solicitările multiple de parolă.</p>"
      ru: "<p>Унифицированный скрипт для всех операций systemd с одной аутентификацией pkexec, устраняя множественные запросы пароля.</p>"
  - version: "1.0.4"
    type: stable
    unix-timestamp: 1751673600
    description:
      C: "<p>Use pkexec for graphical authentication when creating systemd services, fixing permission issues in GUI.</p><ul><li>Mejor manejo de cancelación de autenticación por parte del usuario.</li><li>Correcciones menores y mejoras de estabilidad.</li></ul>"
