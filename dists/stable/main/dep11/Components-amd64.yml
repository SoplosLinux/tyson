  - version: "1.1.0"
    type: stable
    unix-timestamp: 1752796800
    description:
      C: "<p>Complete i18n refactor: translation dictionaries split into 8 separate language files. Metainfo finalized to AppStream/DEP-11 standard. Fixed all known BTRFS subvolume mounting issues in CHROOT.</p>"
      de: "<p>Vollständige i18n-Überarbeitung: Übersetzungswörterbücher in 8 separate Sprachdateien aufgeteilt. Metainfo nach AppStream/DEP-11-Standard finalisiert. Alle bekannten BTRFS-Subvolume-Einbindungsprobleme in CHROOT behoben.</p>"
      es: "<p>Refactorización completa de i18n: diccionarios de traducción divididos en 8 archivos de idioma separados. Metainfo finalizado al estándar AppStream/DEP-11. Corregidos todos los problemas conocidos de montaje de subvolúmenes BTRFS en CHROOT.</p>"
      fr: "<p>Refactorisation complète de l'i18n : dictionnaires de traduction divisés en 8 fichiers de langue distincts. Métainfo finalisé selon la norme AppStream/DEP-11. Tous les problèmes connus de montage des sous-volumes BTRFS dans CHROOT corrigés.</p>"
      it: "<p>Refactoring completo dell'i18n: dizionari di traduzione suddivisi in 8 file di lingua separati. Metainfo finalizzato secondo lo standard AppStream/DEP-11. Corretti tutti i problemi noti di montaggio dei subvolumi BTRFS in CHROOT.</p>"
      pt: "<p>Refatoração completa do i18n: dicionários de tradução divididos em 8 ficheiros de idioma separados. Metainfo finalizado segundo o padrão AppStream/DEP-11. Corrigidos todos os problemas conhecidos de montagem de subvolumes BTRFS em CHROOT.</p>"
      ro: "<p>Refactorizare completă i18n: dicționarele de traducere împărțite în 8 fișiere de limbă separate. Metainfo finalizat conform standardului AppStream/DEP-11. Toate problemele cunoscute de montare a subvolumelor BTRFS în CHROOT rezolvate.</p>"
      ru: "<p>Полный рефакторинг i18n: словари переводов разделены на 8 отдельных файлов. Метаинформация приведена в соответствие со стандартом AppStream/DEP-11. Исправлены все известные проблемы монтирования подтомов BTRFS в CHROOT.</p>"
