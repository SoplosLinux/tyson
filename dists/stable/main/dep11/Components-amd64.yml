Description:
  C: |-
    <p>Soplos GRUB Editor is a comprehensive graphical tool for configuring and customizing the GRUB2 bootloader.
    With complete internationalization support for 8 languages, it provides an intuitive interface for managing
    boot settings, themes, fonts, and custom entries.</p><p>Key Features:</p>
  es: |-
    <p>Soplos GRUB Editor es una herramienta gráfica integral para configurar y personalizar el gestor de arranque GRUB2.
    Con soporte completo de internacionalización para 8 idiomas, proporciona una interfaz intuitiva para gestionar
    configuraciones de arranque, temas, fuentes y entradas personalizadas.</p>
  fr: |-
    <p>Soplos GRUB Editor est un outil graphique complet pour configurer et personnaliser le chargeur de démarrage GRUB2.
    Avec un support complet d'internationalisation pour 8 langues, il fournit une interface intuitive pour gérer
    les paramètres de démarrage, les thèmes, les polices et les entrées personnalisées.</p>
  pt: |-
    <p>Soplos GRUB Editor é uma ferramenta gráfica abrangente para configurar e personalizar o gerenciador de inicialização GRUB2.
    Com suporte completo de internacionalização para 8 idiomas, fornece uma interface intuitiva para gerenciar
    configurações de inicialização, temas, fontes e entradas personalizadas.</p>
  de: |-
    <p>Soplos GRUB Editor ist ein umfassendes grafisches Tool zur Konfiguration und Anpassung des GRUB2-Bootloaders.
    Mit vollständiger Internationalisierungsunterstützung für 8 Sprachen bietet es eine intuitive Benutzeroberfläche
    zur Verwaltung von Boot-Einstellungen, Themes, Schriftarten und benutzerdefinierten Einträgen.</p>
  it: |-
    <p>Soplos GRUB Editor è uno strumento grafico completo per configurare e personalizzare il bootloader GRUB2.
    Con supporto completo per l'internazionalizzazione in 8 lingue, fornisce un'interfaccia intuitiva per gestire
    impostazioni di avvio, temi, font ed entrate personalizzate.</p>
  ru: |-
    <p>Soplos GRUB Editor - это комплексный графический инструмент для настройки и персонализации загрузчика GRUB2.
    С полной поддержкой интернационализации для 8 языков, он предоставляет интуитивный интерфейс для управления
    настройками загрузки, темами, шрифтами и пользовательскими записями.</p>
  ro: |-
    <p>Soplos GRUB Editor este un instrument grafic cuprinzător pentru configurarea și personalizarea încărcătorului de sistem GRUB2.
    Cu suport complet de internaționalizare pentru 8 limbi, oferă o interfață intuitivă pentru gestionarea
    setărilor de pornire, temelor, fonturilor și intrărilor personalizate.</p>
