      pt: |-
        Corrigido o painel de créditos do diálogo Sobre no KDE: a área de créditos agora é exibida com fundo escuro opaco em vez de ser transparente. Ícone padronizado para 48×48 pixels.
      de: |-
        Korrektur des Kredit-Panels im Über-Dialog unter KDE: Der Kredit-Bereich wird jetzt mit opakem dunklem Hintergrund dargestellt, anstatt transparent zu sein. App-Symbol auf 48×48 Pixel standardisiert.
      it: |-
        Corretto il pannello crediti della finestra Info su KDE: l'area dei crediti ora mostra uno sfondo scuro opaco invece di essere trasparente. Icona standardizzata a 48×48 pixel.
      ru: |-
