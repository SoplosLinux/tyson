Releases:
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794873600
    description:
      C: "<p>First stable release. The Language page comes right after Home in the sidebar.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>The language switcher at the bottom of the sidebar changes the language of the system, as the Language page does, after a confirmation, and not only the language of the window.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>Install launches Soplos Linux Installer, the new installer of Soplos, instead of Calamares. The rescue repairs the boot loader the system has, GRUB, Limine or systemd-boot, and rebuilds the start files so systemd-boot gets them too. Turning NumLock off in the tools works with the new installer.</p>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1794096000
    description:
      C: "<p>The Install page checks the connection to the Soplos servers and the clock of the computer before the installer starts, because a missing connection or a wrong clock make it stop with error 100, and offers to fix the time. The Language and keyboard page has regions (Spain and Latin America, Brazil, Belgium, Austria, Australia and more) and keyboards for them. The Rescue page has a Help button that explains each option, and every page has a banner.</p>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1793836800
    description:
      C: "<p>First beta. The system rescue, the password change and the repair of the initramfs and GRUB work in a live session of Soplos Linux Tyson.</p>"
  - version: "3.0.0-2-alpha"
    type: stable
    unix-timestamp: 1793836800
    description:
      C: "<p>System rescue mounts the /boot, /boot/efi and /home partitions of the installed system again, and stops instead of repairing the wrong folder when /boot is not mounted.</p>"
  - version: "3.0.0-1-alpha"
    type: stable
    unix-timestamp: 1793750400
    description:
      C: "<p>The application metadata points to the installed launcher, and the manual page is the same in the project and in the package.</p>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1793404800
    description:
      C: "<p>First alpha of the rewrite of Soplos Welcome Live, from Python 3 and GTK3 to Tauri 2 with a Rust backend and a Svelte frontend, with the layout of Soplos Welcome 3.0 and a simpler rescue. It has not yet been tested on real hardware.</p>"
