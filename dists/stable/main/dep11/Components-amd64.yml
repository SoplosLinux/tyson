  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794787200
    description:
      C: "<p>First stable release. Boot analysis can add the user to the systemd-journal group, so the history of the earlier boots is shown after restarting the session.</p>"
  - version: "3.0.0-8-beta"
    type: stable
    unix-timestamp: 1793750400
    description:
      C: "<p>The application metadata points to the installed launcher, and the manual page is the same in the project and in the package.</p>"
  - version: "3.0.0-7-beta"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>The window no longer has the frame of the system: it is a card with rounded corners and its own minimize, maximize and close buttons.</p>"
  - version: "3.0.0-6-beta"
    type: stable
    unix-timestamp: 1793145600
    description:
      C: "<p>New application icon, new hero image and new screenshots, taken with the interface in English.</p>"
  - version: "3.0.0-5-beta"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>The window follows the light or dark theme of the desktop (Xfce, Plasma and GNOME); the button of the sidebar still lets you choose.</p>"
  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>Documentation and packaging fixes.</p><ul><li>Four more screenshots (Diagnosis, Optimization, Boot analysis and History); the captions of the Timers and Logs screenshots corrected</li><li>AppStream categories and keywords in 8 languages; developer and project group identifiers now org.soplos</li><li>Manual page installed compressed; changelog installed to /usr/share/doc/soplos-system-service/</li><li>Debian copyright declares Lucide (ISC), used for the interface icons</li></ul>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Packaging and documentation standardisation.</p><ul><li>Unix manual page added (soplos-system-service(1))</li><li>Screenshots packaged in /usr/share/doc/soplos-system-service/</li><li>Desktop entry and AppStream metainfo translated to 8 languages</li><li>README updated with architecture, shortcuts and build instructions</li></ul>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1792108800
    description:
      C: "<p>Orphaned services can now be found and removed.</p><ul><li>A service made from an autostart entry whose program is gone (for example an uninstalled Flatpak) is found and can be deleted, from Diagnosis and from the Services page</li><li>Links of systemd that point to nothing are found and deleted</li><li>A graphical system without its display manager link is found and repaired</li><li>Diagnosis also looks at the user's failed services</li><li>Diagnosis no longer reports a package as damaged because its translations were removed</li></ul>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1792022400
    description:
      C: "<p>Applying a selection on the Optimization page works again.</p><ul><li>Services that come with a socket or a path (such as the print service) can be turned off together with it</li><li>The sockets of units the system needs are protected like the units themselves</li></ul>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1792022400
    description:
      C: "<p>The Diagnosis page was rebuilt from scratch: it starts from what systemd and the package system report, not from the text of the log.</p><ul><li>Diagnosis says the system is working when no service has failed and no package is half-installed or has broken dependencies</li><li>Errors in the log with nothing wrong behind them are only counted, in a folded block</li><li>What is broken is explained with data measured on the computer: unit state, whether the program it starts exists, and whether the package that owns it is damaged</li><li>Repairs use Debian's own tools: reinstall a package, finish configuring packages, fix broken dependencies, restart or disable a unit</li><li>Messages Debian's logcheck lists as normal are recognized when logcheck-database is installed</li></ul>"
ContentRating:
  oars-1.1: {}
