Type: desktop-application
ID: "org.soplos.webappmanager"
Package: "soplos-webapp-manager"
Name:
  C: "WebApp Manager"
Summary:
  C: "Create and manage isolated Web Applications"
  de: "Isolierte Webanwendungen erstellen und verwalten"
  es: "Crea y gestiona Aplicaciones Web aisladas"
  fr: "Créer et gérer des applications Web isolées"
  it: "Crea e gestisci applicazioni web isolate"
  pt: "Criar e gerir aplicações Web isoladas"
  ro: "Creați și gestionați aplicații Web izolate"
  ru: "Создание и управление изолированными веб-приложениями"
Description:
  C: "<p>Soplos WebApp Manager allows you to run websites as native desktop applications. It creates isolated browsing environments (SSBs) to ensure your webapps can't interact with the cookies or tabs from your main browsing sessions, increasing productivity and privacy.</p><p>Features:</p><ul><li>Supports multiple browsers out-of-the-box (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Full WebApp editing (Name, URL, Icon, Browser, and Navbar).</li><li>Extra browser parameters support (e.g. --start-maximized, --kiosk).</li><li>Improved Wayland/Plasma 6 icon mapping and window association.</li><li>Smart Flatpak compatibility tracking.</li><li>Auto-download of high quality 128px favicons natively.</li><li>Custom userChrome.css injection for pristine Firefox instances.</li></ul>"
  de: "<p>Soplos WebApp Manager ermöglicht es Ihnen, Websites als native Desktop-Anwendungen auszuführen. Er erstellt isolierte Browserumgebungen (SSBs), um sicherzustellen, dass Ihre Web-Apps nicht mit den Cookies oder Tabs Ihrer Haupt-Browsersitzungen interagieren können, was die Produktivität und den Datenschutz erhöht.</p><p>Funktionen:</p><ul><li>Unterstützt mehrere Browser (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Vollständige WebApp-Bearbeitung (Name, URL, Symbol, Browser und Leiste).</li><li>Zusätzliche Browser-Parameter (z.B. --start-maximized, --kiosk).</li><li>Verbesserte Symbol-Zuordnung für Wayland und Plasma 6.</li><li>Intelligentes Tracking der Flatpak-Kompatibilität.</li><li>Automatischer Download von hochwertigen 128px-Favicons auf native Weise.</li><li>Injektion von benutzerdefiniertem userChrome.css für saubere Firefox-Instanzen.</li></ul>"
  es: "<p>Soplos WebApp Manager le permite ejecutar sitios web como aplicaciones de escritorio nativas. Crea entornos de navegación aislados (SSBs) para asegurar que sus aplicaciones web no puedan interactuar con las cookies o pestañas de sus sesiones de navegación principales, aumentando la productividad y la privacidad.</p><p>Características:</p><ul><li>Soporta múltiples navegadores (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Edición completa de WebApps (Nombre, URL, Icono, Navegador y Barra).</li><li>Soporte para parámetros extra del navegador (ej. --start-maximized, --kiosk).</li><li>Mapeo de iconos mejorado para Wayland y Plasma 6.</li><li>Seguimiento inteligente de compatibilidad con Flatpak.</li><li>Descarga automática de favicons de alta calidad (128px) de forma nativa.</li><li>Inyección de userChrome.css personalizado para instancias de Firefox integradas.</li></ul>"
  fr: "<p>Soplos WebApp Manager vous permet d'exécuter des sites Web en tant qu'applications de bureau natives. Il crée des environnements de navigation isolés (SSB) pour garantir que vos applications Web ne puissent pas interagir avec les cookies ou les onglets de vos sessions de navigation principales, augmentant ainsi la productivité et la confidentialité.</p><p>Fonctionnalités :</p><ul><li>Prend en charge plusieurs navigateurs (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Édition complète des WebApps (Nom, URL, Icône, Navigateur et Barre).</li><li>Paramètres supplémentaires du navigateur (ex. --start-maximized, --kiosk).</li><li>Amélioration du mappage des icônes pour Wayland et Plasma 6.</li><li>Suivi intelligent de la compatibilité Flatpak.</li><li>Téléchargement automatique de favicons 128px de haute qualité en mode natif.</li><li>Injection de userChrome.css personnalisé pour des instances Firefox épurées.</li></ul>"
  it: "<p>Soplos WebApp Manager ti permette di eseguire siti web come applicazioni desktop native. Crea ambienti di navigazione isolati (SSB) per garantire que le tue webapp non possano interagire con i cookie o le schede delle tue sessioni di navigazione principali, aumentando la produttività e la privacy.</p><p>Caratteristiche:</p><ul><li>Supporta più browser (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Modifica completa delle WebApp (Nome, URL, Icona, Browser e Barra).</li><li>Supporto per parametri aggiuntivi del browser (es. --start-maximized, --kiosk).</li><li>Mappatura delle icone migliorata per Wayland e Plasma 6.</li><li>Monitoraggio intelligente della compatibilità Flatpak.</li><li>Download automatico di favicon a 128px di alta qualità in modo nativo.</li><li>Iniezione di userChrome.css personalizzato per istanze di Firefox pulite.</li></ul>"
  pt: "<p>O Soplos WebApp Manager permite executar sites como aplicações de desktop nativas. Cria ambientes de navegação isolados (SSBs) para garantir que as suas aplicações Web não possam interagir com os cookies ou separadores das suas sessões de navegação principais, aumentando a produtividade e a privacidade.</p><p>Características:</p><ul><li>Suporta vários navegadores (Firefox, Chrome, Brave, Epiphany, Vivaldi, etc).</li><li>Edição completa de WebApps (Nome, URL, Ícone, Navegador e Barra).</li><li>Suporte para parâmetros extras do navegador (ex. --start-maximized, --kiosk).</li><li>Mapeamento de ícones aprimorado para Wayland e Plasma 6.</li><li>Rastreamento inteligente de compatibilidade Flatpak.</li><li>Download automático de favicons de 128px de alta qualidade nativamente.</li><li>Injeção de userChrome.css personalizado para instâncias integradas do Firefox.</li></ul>"
  ro: "<p>Soplos WebApp Manager vă permite să rulați site-uri web ca aplicații desktop native. Acesta creează medii de navigare izolate (SSB) pentru a se asigura că aplicațiile dumneavoastră web nu pot interacționa cu modulele cookie sau filele din sesiunile principale de navigare, crescând productivitatea și confidențialitatea.</p><p>Caracteristici:</p><ul><li>Suportă mai multe browsere (Firefox, Chrome, Brave, Epiphany, Vivaldi etc).</li><li>Editare completă a aplicațiilor Web (Nume, URL, Pictogramă, Browser și Bară).</li><li>Suport pentru parametri suplimentari ai browserului (de ex. --start-maximized, --kiosk).</li><li>Mapare îmbunătățită a pictogramelor pentru Wayland și Plasma 6.</li><li>Urmărirea inteligentă a compatibilității Flatpak.</li><li>Descărcarea automată a faviconurilor de 128px de înaltă calitate în mod nativ.</li><li>Injectarea de userChrome.css personalizat pentru instanțe de Firefox integrate.</li></ul>"
  ru: "<p>Soplos WebApp Manager позволяет запускать веб-сайты как нативные настольные приложения. Он создает изолированные среды просмотра (SSB), чтобы ваши веб-приложения не могли взаимодействовать с файлами cookie или вкладками ваших основных сеансов просмотра, повышая производительность и конфиденциальность.</p><p>Возможности:</p><ul><li>Поддержка нескольких браузеров (Firefox, Chrome, Brave, Epiphany, Vivaldi и др.).</li><li>Полное редактирование веб-приложений (имя, URL, значок, браузер и панель).</li><li>Поддержка дополнительных параметров браузера (напр. --start-maximized, --kiosk).</li><li>Улучшенное сопоставление значков для Wayland и Plasma 6.</li><li>Интеллектуальное отслеживание совместимости с Flatpak.</li><li>Автоматическая загрузка высококачественных фавиконов (128px) нативным способом.</li><li>Внедрение пользовательского userChrome.css для чистых экземпляров Firefox.</li></ul>"
