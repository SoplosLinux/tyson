      pt: "Separador de registos com saida journalctl em tempo real para o servico selecionado"
      ro: "Fila jurnale cu iesire journalctl in timp real pentru serviciul selectat"
      ru: "Вкладка журналов с выводом journalctl в реальном времени для выбранной службы"
    source-image:
      url: "soplos-system-service/screenshots/screenshot03.png"
      width: 1002
      height: 729
Releases:
  - version: "1.0.0-6"
    type: stable
    unix-timestamp: 1788739200
    description:
      C: "<p>New Optimization tab: suggests systemd services to disable or enable to optimize RAM, boot time, power and disk.</p><ul><li>Detects virtualization guest tools, Bluetooth/Wi-Fi services with no matching hardware, and a redundant PulseAudio service when PipeWire is active</li><li>Detects dangling systemd enablement symlinks and orphaned services left behind by uninstalled packages, showing the exact symlink path being removed</li><li>Suggests enabling fstrim.timer on SSD/NVMe systems and disabling NetworkManager-wait-online.service to speed up boot</li><li>Informational panel listing the slowest-starting services/timers at boot and timers that wake the system frequently</li><li>Orphan/huerfano scan batched into a handful of subprocess calls instead of one per service, fixing a slow scan on systems with hundreds of services</li></ul>"
      de: "<p>Neuer Optimierungs-Tab: schlagt systemd-Dienste zum Deaktivieren oder Aktivieren vor, um RAM, Startzeit, Energie und Festplatte zu optimieren.</p>"
      es: "<p>Nueva pestana Optimizacion: sugiere servicios systemd para deshabilitar o activar y optimizar RAM, arranque, energia y disco.</p>"
      fr: "<p>Nouvel onglet Optimisation : suggere des services systemd a desactiver ou activer pour optimiser la RAM, le demarrage, l'energie et le disque.</p>"
      it: "<p>Nuova scheda Ottimizzazione: suggerisce servizi systemd da disabilitare o abilitare per ottimizzare RAM, avvio, energia e disco.</p>"
      pt: "<p>Novo separador Otimizacao: sugere servicos systemd para desativar ou ativar para otimizar RAM, arranque, energia e disco.</p>"
      ro: "<p>Fila noua Optimizare: sugereaza servicii systemd de dezactivat sau activat pentru a optimiza RAM, pornirea, energia si discul.</p>"
      ru: "<p>Новая вкладка «Оптимизация»: предлагает включить или отключить службы systemd для оптимизации ОЗУ, времени загрузки, энергии и диска.</p>"
  - version: "1.0.0-5"
    type: stable
    unix-timestamp: 1782000000
    description:
      C: "<p>GNOME crash fix (gdk-pixbuf SVG sandbox).</p><ul><li>Wrapper now passes HOME=/root to the root process; gdk-pixbuf's bubblewrap SVG sandbox fails when the parent is root but HOME points to a regular user directory</li></ul>"
      de: "<p>GNOME-Absturzkorrektur (gdk-pixbuf SVG-Sandbox).</p>"
      es: "<p>Correccion de fallo en GNOME (sandbox SVG de gdk-pixbuf).</p>"
      fr: "<p>Correction du crash GNOME (bac a sable SVG gdk-pixbuf).</p>"
      it: "<p>Correzione crash GNOME (sandbox SVG gdk-pixbuf).</p>"
      pt: "<p>Correcao de falha no GNOME (sandbox SVG do gdk-pixbuf).</p>"
      ro: "<p>Corectare eroare GNOME (sandbox SVG gdk-pixbuf).</p>"
      ru: "<p>Исправление сбоя в GNOME (песочница SVG gdk-pixbuf).</p>"
  - version: "1.0.0-4"
    type: stable
    unix-timestamp: 1781395200
    description:
      C: "<p>GNOME crash fix.</p><ul><li>Wrapper now specifies gi.require_version('Gdk', '3.0') before importing Gdk, preventing a crash in GNOME sessions where GTK4 is already loaded</li></ul>"
      de: "<p>GNOME-Absturzkorrektur.</p>"
      es: "<p>Correccion de fallo en GNOME.</p>"
      fr: "<p>Correction du crash sous GNOME.</p>"
      it: "<p>Correzione crash in GNOME.</p>"
      pt: "<p>Correcao de falha no GNOME.</p>"
      ro: "<p>Corectare eroare in GNOME.</p>"
      ru: "<p>Исправление сбоя в GNOME.</p>"
  - version: "1.0.0-3"
    type: stable
    unix-timestamp: 1781395200
    description:
      C: "<p>Titlebar fix for XFCE and KDE.</p><ul><li>Native window decorations used in XFCE and KDE/Plasma, matching the rest of the Soplos applications; CSD HeaderBar only in GNOME</li></ul>"
      de: "<p>Titelleistenkorrektur fur XFCE und KDE.</p>"
      es: "<p>Correccion de la barra de titulo en XFCE y KDE.</p>"
      fr: "<p>Correction de la barre de titre sous XFCE et KDE.</p>"
      it: "<p>Correzione della barra del titolo in XFCE e KDE.</p>"
      pt: "<p>Correcao da barra de titulo em XFCE e KDE.</p>"
      ro: "<p>Corectare bara de titlu in XFCE si KDE.</p>"
      ru: "<p>Исправление строки заголовка в XFCE и KDE.</p>"
  - version: "1.0.0-2"
    type: stable
    unix-timestamp: 1781395200
    description:
      C: "<p>Packaging and usability fixes.</p><ul><li>Wrapper renamed to match project name; follows the Soplos pkexec pattern (python3 -c inline, no recursive wrapper invocation)</li><li>Silent exit on launch fixed: Gtk.Application now uses HANDLES_COMMAND_LINE with a do_command_line handler</li><li>Package install failure fixed: postinst had a wrong path that caused set -e to abort the post-installation script</li><li>Duplicate GLib.set_application_name warning eliminated: names now set once in the wrapper before importing main</li><li>pkexec handling moved to the bash wrapper; removed from main.py</li><li>Details panel now scrollable using Gtk.TextView inside Gtk.ScrolledWindow</li><li>Smart action buttons adapting to current service state</li><li>Progress bar position and minimum display time fixed</li><li>Color-coded Loaded column (not-found in red)</li><li>Suppressed ibus warnings when running as root</li></ul>"
      de: "<p>Paketierungs- und Benutzbarkeitskorrekturen.</p>"
      es: "<p>Correcciones de empaquetado y usabilidad.</p>"
      fr: "<p>Corrections d'empaquetage et d'ergonomie.</p>"
      it: "<p>Correzioni di packaging e usabilita.</p>"
      pt: "<p>Correcoes de empacotamento e usabilidade.</p>"
      ro: "<p>Corectii de ambalare si utilizabilitate.</p>"
      ru: "<p>Исправления упаковки и удобства использования.</p>"
  - version: "1.0.0-1"
    type: stable
    unix-timestamp: 1781395200
    description:
      C: "<p>Complete rewrite of the application after almost a year on hold. Full GTK3 tabbed interface with service list, scrollable details panel, log viewer and smart service controls, with automatic dark/light theme detection and support for GNOME, XFCE and KDE.</p><ul><li>Gtk.Notebook tab interface: Services tab and Logs tab with Soplos orange active tab accent</li><li>Sortable service list with color-coded active state (green/red) and load state (not-found in red)</li><li>Smart action buttons: Start, Stop and Restart adapt to the current service state</li><li>Scrollable details panel using Gtk.TextView inside Gtk.ScrolledWindow</li><li>Log viewer with real-time journalctl output for the selected service</li><li>Progress bar with Gtk.Revealer and pulse animation during loading and service operations, with minimum display time</li><li>CSD HeaderBar always active with operation status in subtitle</li><li>Static Soplos footer showing DE, protocol and base version</li><li>Dark/light theme pre-detected as regular user before pkexec elevation via SOPLOS_COLOR_SCHEME</li><li>Two-provider CSS loading: dark.css or light.css plus base.css</li><li>Polkit policy, desktop launcher, bash wrapper and Debian packaging</li><li>Icons at 48x48, 64x64 and 128x128</li></ul>"
      de: "<p>Vollstandige Uberarbeitung der Anwendung nach fast einem Jahr Pause. Vollstandige GTK3-Registerkartenoberflache mit Dienstliste, scrollbarem Detailbereich, Protokollbetrachter und intelligenter Dienststeuerung, mit automatischer Dunkel-/Hell-Themenerkennung und Unterstutzung fur GNOME, XFCE und KDE.</p>"
      es: "<p>Reescritura completa de la aplicacion tras casi un ano en espera. Interfaz GTK3 completa con pestanas, lista de servicios, panel de detalles con scroll, visor de registros y controles inteligentes de servicios, con deteccion automatica de tema oscuro/claro y soporte para GNOME, XFCE y KDE.</p>"
      fr: "<p>Reecriture complete de l'application apres pres d'un an en attente. Interface GTK3 complete avec onglets, liste de services, panneau de details defilant, visualiseur de journaux et commandes intelligentes des services, avec detection automatique du theme sombre/clair et support pour GNOME, XFCE et KDE.</p>"
      it: "<p>Riscrittura completa dell'applicazione dopo quasi un anno in attesa. Interfaccia GTK3 completa a schede con elenco servizi, pannello dettagli scorrevole, visualizzatore log e controlli intelligenti dei servizi, con rilevamento automatico del tema scuro/chiaro e supporto per GNOME, XFCE e KDE.</p>"
      pt: "<p>Reescrita completa da aplicacao apos quase um ano em espera. Interface GTK3 completa com separadores, lista de servicos, painel de detalhes com scroll, visualizador de registos e controlos inteligentes de servicos, com detecao automatica do tema escuro/claro e suporte para GNOME, XFCE e KDE.</p>"
      ro: "<p>Rescriere completa a aplicatiei dupa aproape un an de pauza. Interfata GTK3 completa cu file, lista de servicii, panou de detalii derulabil, vizualizator de jurnale si controale inteligente ale serviciilor, cu detectie automata a temei inchise/deschise si suport pentru GNOME, XFCE si KDE.</p>"
      ru: "<p>Полная переработка приложения после почти года простоя. Полный интерфейс GTK3 с вкладками, списком служб, прокручиваемой панелью сведений, просмотрщиком журналов и умным управлением службами, с автоматическим определением тёмной/светлой темы и поддержкой GNOME, XFCE и KDE.</p>"
  - version: "1.0.0"
    type: stable
    unix-timestamp: 1753920000
    description:
      C: "<p>Initial project creation with base GTK3 structure, systemd service listing and basic service control functions.</p><ul><li>Initial GTK3 application skeleton with pkexec privilege elevation</li><li>systemd service listing via systemctl list-units</li><li>Basic service control: start, stop, restart, enable, disable</li><li>8-language string system with dict-based translations</li></ul>"
      de: "<p>Erste Projekterstellung mit grundlegender GTK3-Struktur, systemd-Dienstauflistung und grundlegenden Dienststeuerungsfunktionen.</p><ul><li>Initiales GTK3-Anwendungsgerippe mit pkexec-Rechteerweiterung</li><li>systemd-Dienstauflistung uber systemctl list-units</li><li>Grundlegende Dienststeuerung: Starten, Stoppen, Neustarten, Aktivieren, Deaktivieren</li><li>8-Sprachen-Stringystem mit worterbuchbasierten Ubersetzungen</li></ul>"
      es: "<p>Creacion inicial del proyecto con estructura GTK3 base, listado de servicios systemd y funciones basicas de control de servicios.</p><ul><li>Esqueleto de aplicacion GTK3 inicial con elevacion de privilegios pkexec</li><li>Listado de servicios systemd via systemctl list-units</li><li>Control basico de servicios: iniciar, detener, reiniciar, activar, desactivar</li><li>Sistema de cadenas en 8 idiomas con traducciones basadas en diccionarios</li></ul>"
      fr: "<p>Creation initiale du projet avec la structure GTK3 de base, la liste des services systemd et les fonctions de controle de base.</p><ul><li>Squelette d'application GTK3 initial avec elevation des privileges pkexec</li><li>Liste des services systemd via systemctl list-units</li><li>Controle de base des services: demarrer, arreter, redemarrer, activer, desactiver</li><li>Systeme de chaines en 8 langues avec traductions basees sur des dictionnaires</li></ul>"
      it: "<p>Creazione iniziale del progetto con struttura GTK3 di base, elenco dei servizi systemd e funzioni di controllo base.</p><ul><li>Scheletro di applicazione GTK3 iniziale con elevazione dei privilegi pkexec</li><li>Elenco dei servizi systemd tramite systemctl list-units</li><li>Controllo di base dei servizi: avvia, ferma, riavvia, abilita, disabilita</li><li>Sistema di stringhe in 8 lingue con traduzioni basate su dizionari</li></ul>"
      pt: "<p>Criacao inicial do projeto com estrutura GTK3 base, listagem de servicos systemd e funcoes de controlo basicas.</p><ul><li>Esqueleto de aplicacao GTK3 inicial com elevacao de privilegios pkexec</li><li>Listagem de servicos systemd via systemctl list-units</li><li>Controlo basico de servicos: iniciar, parar, reiniciar, ativar, desativar</li><li>Sistema de cadeias em 8 idiomas com traducoes baseadas em dicionarios</li></ul>"
      ro: "<p>Creare initiala a proiectului cu structura GTK3 de baza, listarea serviciilor systemd si functii de control de baza.</p><ul><li>Schelet de aplicatie GTK3 initial cu elevare privilegii pkexec</li><li>Listarea serviciilor systemd prin systemctl list-units</li><li>Control de baza al serviciilor: pornire, oprire, repornire, activare, dezactivare</li><li>Sistem de siruri in 8 limbi cu traduceri bazate pe dictionare</li></ul>"
      ru: "<p>Первоначальное создание проекта с базовой структурой GTK3, списком служб systemd и основными функциями управления службами.</p><ul><li>Начальный каркас приложения GTK3 с повышением привилегий через pkexec</li><li>Список служб systemd через systemctl list-units</li><li>Базовое управление службами: запуск, остановка, перезапуск, включение, отключение</li><li>Система строк на 8 языках с переводами на основе словарей</li></ul>"
ContentRating:
  oars-1.1: {}
