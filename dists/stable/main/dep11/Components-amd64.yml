Releases:
  - version: "2.0.2-8"
    type: stable
    unix-timestamp: 1784937600
    description:
      C: "<p>Donate link updated.</p><ul><li>Donate link now points to soplos.org/community/donate/ instead of PayPal.</li></ul><ul><li>El enlace de donación ahora apunta a soplos.org/community/donate/ en lugar de PayPal.</li></ul><ul><li>Le lien de don pointe désormais vers soplos.org/community/donate/ au lieu de PayPal.</li></ul><ul><li>O link de doação agora aponta para soplos.org/community/donate/ em vez do PayPal.</li></ul><ul><li>Der Spenden-Link verweist jetzt auf soplos.org/community/donate/ anstelle von PayPal.</li></ul><ul><li>Il link per le donazioni ora punta a soplos.org/community/donate/ invece di PayPal.</li></ul><ul><li>Ссылка для пожертвований теперь ведёт на soplos.org/community/donate/ вместо PayPal.</li></ul><ul><li>Linkul de donații indică acum către soplos.org/community/donate/ în loc de PayPal.</li></ul>"
      de: "<p>Spenden-Link aktualisiert.</p>"
      es: "<p>Enlace de donación actualizado.</p>"
      fr: "<p>Lien de don mis à jour.</p>"
      it: "<p>Link per le donazioni aggiornato.</p>"
      pt: "<p>Link de doação atualizado.</p>"
      ro: "<p>Link de donații actualizat.</p>"
      ru: "<p>Обновлена ссылка для пожертвований.</p>"
  - version: "2.0.2-7"
    type: stable
    unix-timestamp: 1783468800
    description:
      C: "<p>Qt6 migration: qdbus replaced with qdbus6.</p><ul><li>All qdbus calls replaced with qdbus6 following Qt5 removal from base system. Affects language changer and session manager on KDE.</li></ul><ul><li>Todas las llamadas a qdbus sustituidas por qdbus6 tras la eliminación de Qt5 del sistema base. Afecta al cambiador de idioma y al gestor de sesión en KDE.</li></ul><ul><li>Tous les appels qdbus remplacés par qdbus6 suite à la suppression de Qt5 du système de base. Concerne le changeur de langue et le gestionnaire de session sous KDE.</li></ul><ul><li>Todas as chamadas qdbus substituídas por qdbus6 após a remoção do Qt5 do sistema base. Afeta o trocador de idioma e o gestor de sessão no KDE.</li></ul><ul><li>Alle qdbus-Aufrufe wurden nach der Entfernung von Qt5 aus dem Basissystem durch qdbus6 ersetzt. Betrifft den Sprachumschalter und den Sitzungsmanager unter KDE.</li></ul><ul><li>Tutte le chiamate qdbus sostituite con qdbus6 dopo la rimozione di Qt5 dal sistema base. Riguarda il selettore di lingua e il gestore di sessione su KDE.</li></ul><ul><li>Все вызовы qdbus заменены на qdbus6 после удаления Qt5 из базовой системы. Затрагивает переключатель языка и менеджер сессий в KDE.</li></ul><ul><li>Toate apelurile qdbus înlocuite cu qdbus6 după eliminarea Qt5 din sistemul de bază. Afectează schimbătorul de limbă și managerul de sesiune pe KDE.</li></ul>"
      de: "<p>Qt6-Migration: qdbus durch qdbus6 ersetzt.</p>"
      es: "<p>Migración a Qt6: qdbus sustituido por qdbus6.</p>"
      fr: "<p>Migration Qt6 : qdbus remplacé par qdbus6.</p>"
      it: "<p>Migrazione Qt6: qdbus sostituito con qdbus6.</p>"
      pt: "<p>Migração Qt6: qdbus substituído por qdbus6.</p>"
      ro: "<p>Migrare Qt6: qdbus înlocuit cu qdbus6.</p>"
      ru: "<p>Миграция на Qt6: qdbus заменён на qdbus6.</p>"
  - version: "2.0.2-6"
    type: stable
    unix-timestamp: 1783382400
    description:
      C: "<p>Build dependency update.</p><ul><li>Build dependency python3-all replaced with python3.</li></ul><ul><li>Se ha sustituido la dependencia de compilación python3-all por python3.</li></ul><ul><li>La dépendance de compilation python3-all a été remplacée par python3.</li></ul><ul><li>A dependência de compilação python3-all foi substituída por python3.</li></ul><ul><li>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</li></ul><ul><li>La dipendenza di compilazione python3-all è stata sostituita con python3.</li></ul><ul><li>Зависимость сборки python3-all заменена на python3.</li></ul><ul><li>Dependența de compilare python3-all a fost înlocuită cu python3.</li></ul>"
      de: "<p>Aktualisierung der Build-Abhängigkeit.</p>"
      es: "<p>Actualización de dependencia de compilación.</p>"
      fr: "<p>Mise à jour de la dépendance de compilation.</p>"
      it: "<p>Aggiornamento della dipendenza di compilazione.</p>"
      pt: "<p>Atualização da dependência de compilação.</p>"
      ro: "<p>Actualizare a dependenței de compilare.</p>"
      ru: "<p>Обновление зависимости сборки.</p>"
  - version: "2.0.2-5"
    type: stable
    unix-timestamp: 1783296000
    description:
      C: "<p>Calamares launcher fix for KDE Plasma.</p><ul><li>Calamares is now launched with QT_STYLE_OVERRIDE=fusion on KDE Plasma to ensure correct rendering.</li></ul><ul><li>Calamares ahora se lanza con QT_STYLE_OVERRIDE=fusion en KDE Plasma para garantizar un renderizado correcto.</li></ul><ul><li>Calamares est maintenant lancé avec QT_STYLE_OVERRIDE=fusion sur KDE Plasma pour garantir un rendu correct.</li></ul><ul><li>O Calamares agora é lançado com QT_STYLE_OVERRIDE=fusion no KDE Plasma para garantir uma renderização correta.</li></ul><ul><li>Calamares wird jetzt mit QT_STYLE_OVERRIDE=fusion unter KDE Plasma gestartet, um eine korrekte Darstellung sicherzustellen.</li></ul><ul><li>Calamares viene ora avviato con QT_STYLE_OVERRIDE=fusion su KDE Plasma per garantire una resa corretta.</li></ul><ul><li>Calamares теперь запускается с QT_STYLE_OVERRIDE=fusion в KDE Plasma для корректного отображения.</li></ul><ul><li>Calamares este acum lansat cu QT_STYLE_OVERRIDE=fusion pe KDE Plasma pentru a asigura o randare corectă.</li></ul>"
      de: "<p>Korrektur des Calamares-Starters für KDE Plasma.</p>"
      es: "<p>Corrección del lanzador de Calamares en KDE Plasma.</p>"
      fr: "<p>Correction du lanceur Calamares pour KDE Plasma.</p>"
      it: "<p>Correzione del launcher di Calamares per KDE Plasma.</p>"
      pt: "<p>Correção do lançador do Calamares no KDE Plasma.</p>"
      ro: "<p>Corectarea lansatorului Calamares pentru KDE Plasma.</p>"
      ru: "<p>Исправление запуска Calamares для KDE Plasma.</p>"
  - version: "2.0.2-4"
    type: stable
    unix-timestamp: 1782259200
    description:
      C: "<p>Display manager detection fix for language changer on KDE.</p><ul><li>Language changer now detects the active display manager with systemctl is-active and restarts it directly: plasmalogin on Tyson RC1, sddm on beta ISOs, display-manager.service as last resort.</li><li>Resolves Breeze wallpaper shown on plasmalogin and ksplashqml crash cascade on VirtualBox after a hot language change.</li></ul><ul><li>El cambiador de idioma ahora detecta el gestor de pantalla activo con systemctl is-active y lo reinicia directamente: plasmalogin en Tyson RC1, sddm en ISOs beta, display-manager.service como último recurso.</li><li>Resuelve el wallpaper de Breeze en plasmalogin y el crash en cascada de ksplashqml en VirtualBox tras un cambio de idioma en caliente.</li></ul><ul><li>Le changeur de langue détecte maintenant le gestionnaire d'affichage actif avec systemctl is-active et le redémarre directement : plasmalogin sur Tyson RC1, sddm sur les ISO bêta, display-manager.service en dernier recours.</li><li>Résout le fond d'écran Breeze sur plasmalogin et le crash en cascade de ksplashqml sur VirtualBox après un changement de langue à chaud.</li></ul><ul><li>O trocador de idioma deteta agora o gestor de ecrã ativo com systemctl is-active e reinicia-o diretamente: plasmalogin no Tyson RC1, sddm nas ISOs beta, display-manager.service como último recurso.</li><li>Resolve o wallpaper Breeze no plasmalogin e o crash em cascata do ksplashqml no VirtualBox após uma mudança de idioma a quente.</li></ul><ul><li>Der Sprachumschalter erkennt jetzt den aktiven Display-Manager mit systemctl is-active und startet ihn direkt neu: plasmalogin auf Tyson RC1, sddm auf Beta-ISOs, display-manager.service als letzter Ausweg.</li><li>Behebt das Breeze-Hintergrundbild auf plasmalogin und den ksplashqml-Absturz-Kaskadeneffekt auf VirtualBox nach einem Live-Sprachwechsel.</li></ul><ul><li>Il selettore di lingua ora rileva il display manager attivo con systemctl is-active e lo riavvia direttamente: plasmalogin su Tyson RC1, sddm sulle ISO beta, display-manager.service come ultima risorsa.</li><li>Risolve lo sfondo Breeze su plasmalogin e il crash a cascata di ksplashqml su VirtualBox dopo un cambio di lingua a caldo.</li></ul><ul><li>Переключатель языка теперь определяет активный менеджер экрана через systemctl is-active и перезапускает его напрямую: plasmalogin на Tyson RC1, sddm на бета-ISO, display-manager.service как последний вариант.</li><li>Устраняет фон Breeze на plasmalogin и каскадный сбой ksplashqml на VirtualBox после горячей смены языка.</li></ul><ul><li>Schimbătorul de limbă detectează acum managerul de afișare activ cu systemctl is-active și îl repornește direct: plasmalogin pe Tyson RC1, sddm pe ISO-urile beta, display-manager.service ca ultimă soluție.</li><li>Rezolvă wallpaper-ul Breeze pe plasmalogin și cascada de crash-uri ksplashqml pe VirtualBox după o schimbare de limbă la cald.</li></ul>"
      de: "<p>Korrektur der Erkennung des Display-Managers im Sprachumschalter unter KDE.</p>"
      es: "<p>Corrección de detección del gestor de pantalla en el cambiador de idioma en KDE.</p>"
      fr: "<p>Correction de la détection du gestionnaire d'affichage dans le changeur de langue sous KDE.</p>"
      it: "<p>Correzione del rilevamento del display manager nel selettore di lingua su KDE.</p>"
      pt: "<p>Correção da deteção do gestor de ecrã no trocador de idioma no KDE.</p>"
      ro: "<p>Corectarea detecției managerului de afișare în schimbătorul de limbă pe KDE.</p>"
      ru: "<p>Исправление определения менеджера экрана в переключателе языка для KDE.</p>"
