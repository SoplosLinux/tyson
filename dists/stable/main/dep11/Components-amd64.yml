Type: desktop-application
ID: "org.soplos.kernelinstaller"
Package: "soplos-kernel-installer"
Name:
  C: "Soplos Kernel Installer"
Summary:
  C: "Build and install Linux kernels on Soplos Linux"
  de: "Linux-Kernel auf Soplos Linux kompilieren und installieren"
  es: "Compila e instala kernels de Linux en Soplos Linux"
  fr: "Compilez et installez des noyaux Linux sur Soplos Linux"
  it: "Compila e installa kernel Linux su Soplos Linux"
  pt: "Compile e instale kernels Linux no Soplos Linux"
  ro: "Compilează și instalează kernele Linux pe Soplos Linux"
  ru: "Сборка и установка ядер Linux в Soplos Linux"
Description:
  C: "<p>Soplos Kernel Installer builds your own Linux kernel with an assistant, installs ready-made kernels from Soplos, Debian, XanMod and Liquorix, and sets up Secure Boot step by step.</p><ul><li>An assistant that asks what the computer is for and ends in a recipe you can edit before the build</li><li>Release candidates available, to help Soplos find failures and make patches</li><li>Ready-made kernels of Soplos, Debian, XanMod and Liquorix, with their repositories added for you</li><li>Secure Boot as a guide for GRUB, systemd-boot and Limine: your own key, signed kernels and bootloaders, and a check of the whole chain</li><li>NVIDIA drivers patched for the new kernel before it is installed</li><li>Available in 8 languages (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  de: "<p>Soplos Kernel Installer kompiliert mit einem Assistenten deinen eigenen Linux-Kernel, installiert fertige Kernel von Soplos, Debian, XanMod und Liquorix und richtet Secure Boot Schritt für Schritt ein.</p><ul><li>Ein Assistent, der fragt, wofür der Computer da ist, und in einem Rezept endet, das du vor dem Bauen ändern kannst</li><li>Release-Kandidaten verfügbar, damit Soplos Fehler findet und Patches erstellt</li><li>Fertige Kernel von Soplos, Debian, XanMod und Liquorix, mit ihren Repositories, die für dich hinzugefügt werden</li><li>Secure Boot als Anleitung für GRUB, systemd-boot und Limine: dein eigener Schlüssel, signierte Kernel und Bootloader und eine Prüfung der ganzen Kette</li><li>NVIDIA-Treiber, die vor der Installation für den neuen Kernel gepatcht werden</li><li>In 8 Sprachen verfügbar (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  es: "<p>Soplos Kernel Installer compila tu propio kernel de Linux con un asistente, instala kernels ya preparados de Soplos, Debian, XanMod y Liquorix, y configura Secure Boot paso a paso.</p><ul><li>Un asistente que pregunta para qué es el equipo y termina en una receta que puedes editar antes de compilar</li><li>Versiones candidatas disponibles, para ayudar a Soplos a encontrar fallos y hacer parches</li><li>Kernels ya preparados de Soplos, Debian, XanMod y Liquorix, con sus repositorios añadidos por ti</li><li>Secure Boot como guía para GRUB, systemd-boot y Limine: tu propia clave, kernels y cargadores firmados, y una comprobación de toda la cadena</li><li>Drivers de NVIDIA parcheados para el kernel nuevo antes de instalarlo</li><li>Disponible en 8 idiomas (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  fr: "<p>Soplos Kernel Installer compile votre propre noyau Linux avec un assistant, installe des noyaux prêts à l'emploi de Soplos, Debian, XanMod et Liquorix, et configure Secure Boot pas à pas.</p><ul><li>Un assistant qui demande à quoi sert l'ordinateur et finit par une recette modifiable avant la compilation</li><li>Versions candidates disponibles, pour aider Soplos à trouver des défauts et à faire des correctifs</li><li>Noyaux prêts à l'emploi de Soplos, Debian, XanMod et Liquorix, avec leurs dépôts ajoutés pour vous</li><li>Secure Boot comme guide pour GRUB, systemd-boot et Limine : votre propre clé, noyaux et chargeurs signés, et une vérification de toute la chaîne</li><li>Pilotes NVIDIA corrigés pour le nouveau noyau avant son installation</li><li>Disponible en 8 langues (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  it: "<p>Soplos Kernel Installer compila il tuo kernel Linux con un assistente, installa kernel già pronti di Soplos, Debian, XanMod e Liquorix, e configura Secure Boot passo dopo passo.</p><ul><li>Un assistente che chiede a cosa serve il computer e finisce in una ricetta che puoi modificare prima di compilare</li><li>Release candidate disponibili, per aiutare Soplos a trovare difetti e a fare patch</li><li>Kernel già pronti di Soplos, Debian, XanMod e Liquorix, con i loro repository aggiunti per te</li><li>Secure Boot come guida per GRUB, systemd-boot e Limine: la tua chiave, kernel e bootloader firmati, e un controllo dell'intera catena</li><li>Driver NVIDIA corretti per il nuovo kernel prima di installarlo</li><li>Disponibile in 8 lingue (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  pt: "<p>O Soplos Kernel Installer compila o seu próprio kernel Linux com um assistente, instala kernels já prontos do Soplos, Debian, XanMod e Liquorix, e configura o Secure Boot passo a passo.</p><ul><li>Um assistente que pergunta para que serve o computador e termina numa receita que pode editar antes de compilar</li><li>Versões candidatas disponíveis, para ajudar o Soplos a encontrar falhas e a fazer patches</li><li>Kernels já prontos do Soplos, Debian, XanMod e Liquorix, com os seus repositórios adicionados por si</li><li>Secure Boot como guia para GRUB, systemd-boot e Limine: a sua própria chave, kernels e carregadores assinados, e uma verificação de toda a cadeia</li><li>Drivers da NVIDIA corrigidos para o kernel novo antes de o instalar</li><li>Disponível em 8 idiomas (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  ro: "<p>Soplos Kernel Installer compilează propriul tău kernel Linux cu un asistent, instalează kernele gata făcute de la Soplos, Debian, XanMod și Liquorix și configurează Secure Boot pas cu pas.</p><ul><li>Un asistent care întreabă pentru ce este calculatorul și se termină într-o rețetă pe care o poți edita înainte de compilare</li><li>Versiuni candidate disponibile, pentru a ajuta Soplos să găsească defecte și să facă patch-uri</li><li>Kernele gata făcute de la Soplos, Debian, XanMod și Liquorix, cu depozitele lor adăugate pentru tine</li><li>Secure Boot ca ghid pentru GRUB, systemd-boot și Limine: propria ta cheie, kernele și încărcătoare semnate și o verificare a întregului lanț</li><li>Drivere NVIDIA corectate pentru kernelul nou înainte de a-l instala</li><li>Disponibil în 8 limbi (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  ru: "<p>Soplos Kernel Installer собирает ваше собственное ядро Linux с помощью помощника, устанавливает готовые ядра Soplos, Debian, XanMod и Liquorix и настраивает Secure Boot шаг за шагом.</p><ul><li>Помощник, который спрашивает, для чего нужен компьютер, и заканчивается рецептом, который можно изменить перед сборкой</li><li>Доступны кандидаты в релиз, чтобы помочь Soplos находить ошибки и делать патчи</li><li>Готовые ядра Soplos, Debian, XanMod и Liquorix, репозитории которых добавляются за вас</li><li>Secure Boot в виде руководства для GRUB, systemd-boot и Limine: ваш собственный ключ, подписанные ядра и загрузчики и проверка всей цепочки</li><li>Драйверы NVIDIA, исправленные для нового ядра перед его установкой</li><li>Доступно на 8 языках (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
