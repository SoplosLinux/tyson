        Ramo Tyron — Atualização de metainfo para conformidade AppStream/DEP-11, sem alterações funcionais. Ramo Tyson 1.0.3 (2025-07-15): correções finais de metainfo para visibilidade nos centros de software.
      de: |-
        Tyron-Zweig — Metainfo-Aktualisierung für AppStream/DEP-11-Konformität, keine funktionalen Änderungen. Tyson-Zweig 1.0.3 (2025-07-15): Abschließende Metainfo-Korrekturen für die Sichtbarkeit in Software-Centern.
      it: |-
        Ramo Tyron — Aggiornamento metainfo per conformità AppStream/DEP-11, nessuna modifica funzionale. Ramo Tyson 1.0.3 (2025-07-15): correzioni finali al metainfo per la visibilità nei centri software.
      ru: |-
        Ветка Tyron — Обновление метаинформации для соответствия AppStream/DEP-11, без функциональных изменений. Ветка Tyson 1.0.3 (2025-07-15): окончательные исправления метаинформации для видимости в центрах программ.
      ro: |-
        Ramura Tyron — Actualizare metainfo pentru conformitate AppStream/DEP-11, fără modificări funcționale. Ramura Tyson 1.0.3 (2025-07-15): corecții finale metainfo pentru vizibilitate în centrele de software.
  - version: 1.0.2
    date: '2025-05-05'
    type: stable
    description:
      C: |-
        Tyron branch — Internal strings refactoring: UI strings extracted to strings.py, application ID changed. Tyson branch 1.0.2 (2025-06-24): complete internationalisation with 8 languages and Plasma Discover compatibility.
      es: |-
        Rama Tyron — Refactorización interna de cadenas: cadenas de UI extraídas a strings.py, ID de aplicación cambiado. Rama Tyson 1.0.2 (2025-06-24): internacionalización completa con 8 idiomas y compatibilidad con Plasma Discover.
      fr: |-
        Branche Tyron — Refactorisation interne des chaînes : chaînes UI extraites vers strings.py, ID d'application modifié. Branche Tyson 1.0.2 (2025-06-24) : internationalisation complète avec 8 langues et compatibilité Plasma Discover.
      pt: |-
        Ramo Tyron — Refatoração interna de strings: strings da UI extraídas para strings.py, ID de aplicativo alterado. Ramo Tyson 1.0.2 (2025-06-24): internacionalização completa com 8 idiomas e compatibilidade com Plasma Discover.
      de: |-
        Tyron-Zweig — Interne String-Refaktorierung: UI-Strings nach strings.py extrahiert, Anwendungs-ID geändert. Tyson-Zweig 1.0.2 (2025-06-24): vollständige Internationalisierung mit 8 Sprachen und Plasma Discover-Kompatibilität.
      it: |-
        Ramo Tyron — Refactoring interno delle stringhe: stringhe UI estratte in strings.py, ID applicazione modificato. Ramo Tyson 1.0.2 (2025-06-24): internazionalizzazione completa con 8 lingue e compatibilità Plasma Discover.
      ru: |-
        Ветка Tyron — Рефакторинг внутренних строк: строки UI извлечены в strings.py, изменён идентификатор приложения. Ветка Tyson 1.0.2 (2025-06-24): полная интернационализация с 8 языками и совместимость с Plasma Discover.
      ro: |-
        Ramura Tyron — Refactorizare internă a șirurilor: șiruri UI extrase în strings.py, ID aplicație schimbat. Ramura Tyson 1.0.2 (2025-06-24): internaționalizare completă cu 8 limbi și compatibilitate Plasma Discover.
  - version: 1.0.1
    date: '2025-04-25'
    type: stable
    description:
      C: |-
        Tyron branch — Improved font conversion pipeline, better error handling and UI responsiveness fixes. Tyson branch 1.0.1 (2025-06-15): same improvements ported to the Plasma build.
      es: |-
        Rama Tyron — Mejora del pipeline de conversión de fuentes, mejor gestión de errores y correcciones de respuesta de la interfaz. Rama Tyson 1.0.1 (2025-06-15): las mismas mejoras portadas a la compilación Plasma.
      fr: |-
        Branche Tyron — Amélioration du pipeline de conversion de polices, meilleure gestion des erreurs et corrections de la réactivité de l'interface. Branche Tyson 1.0.1 (2025-06-15) : mêmes améliorations portées sur la compilation Plasma.
      pt: |-
        Ramo Tyron — Pipeline de conversão de fontes aprimorado, melhor tratamento de erros e correções de responsividade da interface. Ramo Tyson 1.0.1 (2025-06-15): mesmas melhorias portadas para a compilação Plasma.
      de: |-
        Tyron-Zweig — Verbesserte Font-Konvertierungs-Pipeline, bessere Fehlerbehandlung und UI-Reaktionsfähigkeitskorrekturen. Tyson-Zweig 1.0.1 (2025-06-15): Gleiche Verbesserungen für den Plasma-Build portiert.
      it: |-
        Ramo Tyron — Pipeline di conversione font migliorata, migliore gestione degli errori e correzioni della reattività dell'interfaccia. Ramo Tyson 1.0.1 (2025-06-15): stessi miglioramenti portati sulla build Plasma.
      ru: |-
        Ветка Tyron — Улучшенный конвейер конвертации шрифтов, улучшенная обработка ошибок и исправления отзывчивости интерфейса. Ветка Tyson 1.0.1 (2025-06-15): те же улучшения портированы на сборку Plasma.
      ro: |-
        Ramura Tyron — Pipeline de conversie fonturi îmbunătățit, gestionare mai bună a erorilor și corecții de reactivitate a interfeței. Ramura Tyson 1.0.1 (2025-06-15): aceleași îmbunătățiri portate pe build-ul Plasma.
  - version: 1.0.0
    date: '2025-04-13'
    type: stable
    description:
      C: |-
        Initial Tyron release — full GTK3 GRUB2 editor with theme management, font conversion, background configuration, boot entry management and advanced kernel parameters. Tyson branch 1.0.0 (2025-05-09): same feature set ported to Plasma 6 + Wayland.
      es: |-
        Lanzamiento inicial de Tyron — editor GTK3 completo para GRUB2 con gestión de temas, conversión de fuentes, configuración de fondo, gestión de entradas de arranque y parámetros avanzados del kernel. Rama Tyson 1.0.0 (2025-05-09): el mismo conjunto de características portado a Plasma 6 + Wayland.
      fr: |-
        Version initiale Tyron — éditeur GTK3 complet pour GRUB2 avec gestion des thèmes, conversion de polices, configuration de fond, gestion des entrées de démarrage et paramètres avancés du noyau. Branche Tyson 1.0.0 (2025-05-09) : même ensemble de fonctionnalités porté sur Plasma 6 + Wayland.
      pt: |-
        Lançamento inicial Tyron — editor GTK3 completo para GRUB2 com gestão de temas, conversão de fontes, configuração de fundo, gestão de entradas de inicialização e parâmetros avançados do kernel. Ramo Tyson 1.0.0 (2025-05-09): mesmo conjunto de recursos portado para Plasma 6 + Wayland.
      de: |-
        Erstveröffentlichung Tyron — vollständiger GTK3-Editor für GRUB2 mit Theme-Verwaltung, Schriftart-Konvertierung, Hintergrundkonfiguration, Boot-Eintragsverwaltung und erweiterten Kernel-Parametern. Tyson-Zweig 1.0.0 (2025-05-09): Gleicher Funktionsumfang auf Plasma 6 + Wayland portiert.
      it: |-
        Versione iniziale Tyron — editor GTK3 completo per GRUB2 con gestione temi, conversione font, configurazione sfondo, gestione voci di avvio e parametri kernel avanzati. Ramo Tyson 1.0.0 (2025-05-09): stesso set di funzionalità portato su Plasma 6 + Wayland.
      ru: |-
        Первоначальный выпуск Tyron — полноценный редактор GTK3 для GRUB2 с управлением темами, конвертацией шрифтов, настройкой фона, управлением загрузочными записями и расширенными параметрами ядра. Ветка Tyson 1.0.0 (2025-05-09): тот же набор функций портирован на Plasma 6 + Wayland.
      ro: |-
        Lansare inițială Tyron — editor GTK3 complet pentru GRUB2 cu gestionarea temelor, conversia fonturilor, configurarea fundalului, gestionarea intrărilor de pornire și parametri kernel avansați. Ramura Tyson 1.0.0 (2025-05-09): același set de funcții portat pe Plasma 6 + Wayland.
