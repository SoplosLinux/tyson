ProjectLicense: GPL-3.0+
Package: soplos-kernel-installer
Name:
  C: Soplos Kernel Installer
  de: Soplos Kernel-Installer
  es: Instalador de Kernel Soplos
  fr: Installateur de Kernel Soplos
  it: Installatore Kernel Soplos
  pt: Instalador de Kernel Soplos
  ro: Instalator Kernel Soplos
  ru: Установщик ядра Soplos
Summary:
  C: Advanced graphical kernel manager for Soplos Linux
  de: Erweiterter grafischer Kernel-Manager für Soplos Linux
  es: Gestor gráfico avanzado de kernels para Soplos Linux
  fr: Gestionnaire graphique avancé de noyaux pour Soplos Linux
  it: Gestore grafico avanzato del kernel per Soplos Linux
  pt: Gerenciador gráfico avançado de kernels para Soplos Linux
  ro: Manager grafic avansat de nuclee pentru Soplos Linux
  ru: Продвинутый графический менеджер ядер для Soplos Linux
Description:
  C: |-
    <p>Soplos Kernel Installer is a comprehensive graphical tool for downloading, patching, compiling and installing custom Linux kernels from kernel.org.
    It provides an intuitive interface for managing kernel versions, patches, and configurations with complete internationalization support for 8 languages.</p>
  de: |-
    <p>Soplos Kernel-Installer ist ein umfassendes grafisches Tool zur Konfiguration und Anpassung des GRUB2-Bootloaders.
    Mit vollständiger Internationalisierungsunterstützung für 8 Sprachen bietet es eine intuitive Benutzeroberfläche für die Verwaltung von Boot-Einstellungen, Themes, Schriftarten und benutzerdefinierten Einträgen.</p>
  es: |-
    <p>Soplos Kernel Installer es una herramienta gráfica integral para descargar, parchear, compilar e instalar kernels Linux personalizados desde kernel.org.
    Con soporte completo de internacionalización para 8 idiomas, proporciona una interfaz intuitiva para gestionar versiones de kernel, parches y configuraciones.</p>
  fr: |-
    <p>Soplos Kernel Installer est un outil graphique complet pour télécharger, patcher, compiler et installer des noyaux Linux personnalisés à partir de kernel.org.
    Avec un support complet d'internationalisation pour 8 langues, il fournit une interface intuitive pour gérer les versions de noyau, les patchs et les configurations.</p>
  it: |-
    <p>Soplos Kernel Installer è uno strumento grafico completo per scaricare, applicare patch, compilare e installare kernel Linux personalizzati da kernel.org.
    Con supporto completo di internazionalizzazione per 8 lingue, fornisce un'interfaccia intuitiva per gestire versioni del kernel, patch e configurazioni.</p>
  pt: |-
    <p>Soplos Kernel Installer é uma ferramenta gráfica abrangente para baixar, aplicar patches, compilar e instalar kernels Linux personalizados a partir do kernel.org.
    Com suporte completo de internacionalização para 8 idiomas, fornece uma interface intuitiva para gerenciar versões de kernel, patches e configurações.</p>
  ro: |-
    <p>Soplos Kernel Installer este un instrument grafic complet pentru descărcarea, aplicarea de patch-uri, compilarea și instalarea nucleelor Linux personalizate de pe kernel.org.
    Cu suport complet de internaționalizare pentru 8 limbi, oferă o interfață intuitivă pentru gestionarea versiunilor de nucleu, patch-urilor și configurațiilor.</p>
  ru: |-
    <p>Soplos Kernel Installer — это комплексный графический инструмент для загрузки, патчинга, компиляции и установки пользовательских ядер Linux с сайта kernel.org.
    С полным поддержкой интернационализации для 8 языков, он предоставляет интуитивный интерфейс для управления версиями ядра, патчами и конфигурациями.</p>
