Releases:
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794873600
    description:
      C: "<p>First stable release.</p>"
  - version: "3.0.0-6-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>The level of the processor used to choose a XanMod kernel and to build a kernel is the one the window shows, read from the dynamic linker. Before, the flags of the processor could give a lower one, as on an Intel N150 in a Proxmox virtual machine.</p>"
  - version: "3.0.0-5-beta"
    type: stable
    unix-timestamp: 1794096000
    description:
      C: "<p>When the compilation of a kernel fails, the message shows the first lines that say what went wrong, and not only the last ones, which are the make of the packages saying that it stopped.</p>"
  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1794096000
    description:
      C: "<p>The patches of a kernel are applied all or none: if one does not apply, the ones applied before come out again and no kernel with some of its patches is built. The BORE patch of firelzrd is found again in the layout its repository has now. A batch shows how long each kernel takes, and the program keeps a history of how long each kernel took to build.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1794096000
    description:
      C: "<p>Kernels with the Rust Binder (6.18 and newer) build also when the Rust of the user has no rust-src, because the Rust of Debian is used. The batch page is in four boxes, a batch is followed in the Build page too, and the output of a build goes down to its last line without a second scroll. Added the panel of what a build costs the computer (time, CPU, memory, disk and temperature), the question about the folder of the builds when a build is cancelled, and Ctrl+Tab to change page.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1794009600
    description:
      C: "<p>On a computer with an NVIDIA graphics card, the package installs a kernel hook that downloads the latest patches of the nvidia-patches project and applies them to the NVIDIA driver sources before DKMS builds the module, so the kernels that arrive from a terminal build it too.</p>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1794009600
    description:
      C: "<p>Installing or updating a kernel of Soplos from the repository, and installing or updating this package, leaves the sources of the NVIDIA driver patched, as the 2.x program did, so the kernels that arrive later from a terminal build the module. Screenshots of the Build, Kernels, Installed and Secure Boot pages.</p>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1793923200
    description:
      C: "<p>First beta of the rewrite of Soplos Kernel Installer, from Python 3 and GTK3 to Tauri 2 with a Rust backend and a Svelte frontend. It has not yet been tested with a complete build on real hardware.</p>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1793923200
    description:
      C: "<p>First alpha: the pages Kernels, Installed and Secure Boot, and the first skeleton of the assistant to build a kernel.</p>"
