Releases:
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794787200
    description:
      C: "<p>First stable release. Every page was tried on a Plasma desktop, the window behavior and the window rules included, and the program comes with its manual page.</p>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1794441600
    description:
      C: "<p>First beta. The Windows group is complete: virtual desktops, window behavior, window rules, desktop effects, KWin scripts and the task switcher. What the pages list can be installed from the store of KDE or from a file, and removed, and the sections of the sidebar fold.</p>"
  - version: "3.0.0-1-alpha"
    type: stable
    unix-timestamp: 1794355200
    description:
      C: "<p>Every wallpaper has its own card with its picture, kept in a small copy so the list scrolls smoothly, and the icon, cursor and GTK themes show what they look like. Applying a global theme asks what to apply, as System Settings does: the appearance, and the layout of the desktop and the panels. The cursor themes that cannot be applied and the GTK themes with no appearance are not offered. The panels have the options of Plasma (alignment, width, offset, opacity) and a dock style, and a new panel can be an empty one. The pages of the Global theme of System Settings that were missing are there: colors, application style, Plasma style, window decorations and sounds. New pages for virtual desktops, desktop effects, KWin scripts and the task switcher, the sections of the sidebar fold, and what is listed can be installed from the store of KDE or from a file, and removed.</p>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1794096000
    description:
      C: "<p>First version. Global themes, wallpapers, icon themes, cursor themes, GTK themes, panels, start-up screen and the login screen of Plasma Login Manager. Not yet tested on a Plasma desktop.</p>"
