      C: "<p>The window follows the light or dark theme of the desktop (Xfce, Plasma and GNOME); the button of the window still lets you choose.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>Packaging and metadata fixes.</p><ul><li>Changelog installed to /usr/share/doc/soplos-webapp-manager/</li><li>AppStream categories and keywords in 8 languages; developer and project group identifiers now org.soplos</li><li>Manual page installed compressed, and an invalid character in it fixed</li><li>Debian copyright declares Lucide (ISC), used for the interface icons</li></ul>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Packaging and documentation standardisation.</p><ul><li>Unix manual page added (soplos-webapp-manager(1))</li><li>Desktop entry and AppStream metainfo translated to 8 languages</li><li>README updated with badges, architecture, shortcuts and build instructions</li></ul>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1790899200
    description:
      C: "<p>First beta of the Tauri-based rewrite of Soplos WebApp Manager.</p><ul><li>New hero banner with the language switcher and the Add/Remove controls</li><li>Keyboard shortcuts for every common action</li><li>Drag and drop a link from the browser to create a WebApp</li><li>Many more browsers detected, including LibreWolf, Zen Browser and Opera</li><li>Automatic fix for a blank window in virtual machines</li><li>Fixed the app freezing when selecting a custom icon</li><li>Fixed favicon download being able to hang indefinitely with no timeout</li><li>New app icon</li></ul>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1790640000
    description:
      C: "<p>First alpha of the Tauri-based rewrite of Soplos WebApp Manager.</p>"
