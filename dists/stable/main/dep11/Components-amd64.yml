      ro: "<p>Utilizarea pkexec pentru autentificare grafică la crearea serviciilor systemd, rezolvând problemele de permisiuni în interfața grafică.</p>"
      ru: "<p>Использование pkexec для графической аутентификации при создании сервисов systemd, устраняя проблемы с разрешениями в GUI.</p>"
