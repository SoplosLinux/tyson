Releases:
  - version: "2.0.0-8"
    type: stable
    unix-timestamp: 1783382400
    description:
      de: "<p>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</p>"
      en: "<p>Build dependency python3-all replaced with python3.</p>"
      es: "<p>Se ha sustituido la dependencia de compilación python3-all por python3.</p>"
      fr: "<p>La dépendance de compilation python3-all a été remplacée par python3.</p>"
      it: "<p>La dipendenza di compilazione python3-all è stata sostituita con python3.</p>"
      pt: "<p>A dependência de compilação python3-all foi substituída por python3.</p>"
      ro: "<p>Dependența de compilare python3-all a fost înlocuită cu python3.</p>"
      ru: "<p>Зависимость сборки python3-all заменена на python3.</p>"
  - version: "2.0.0-7"
    type: stable
    unix-timestamp: 1782000000
    description:
      de: "<p>Behoben: polkit-Abhangigkeiten auf nur polkit reduziert. Veraltete Alternativen policykit-1-gnome und policykit-1 entfernt, die im aktuellen Debian nicht mehr existieren.</p>"
      en: "<p>Fixed: polkit dependency updated to polkitd, the correct package name in current Debian. Removed obsolete policykit-1-gnome, polkit and policykit-1 alternatives.</p>"
      es: "<p>Corregido: dependencias polkit reducidas a solo polkit. Eliminadas las alternativas obsoletas policykit-1-gnome y policykit-1 que ya no existen en Debian actual.</p>"
      fr: "<p>Correction: dependances polkit reduites au seul polkit. Suppression des alternatives obsoletes policykit-1-gnome et policykit-1 qui n'existent plus dans Debian actuel.</p>"
      it: "<p>Corretto: dipendenze polkit ridotte al solo polkit. Rimosse le alternative obsolete policykit-1-gnome e policykit-1 che non esistono piu nel Debian attuale.</p>"
      pt: "<p>Corrigido: dependencias polkit reduzidas apenas a polkit. Removidas as alternativas obsoletas policykit-1-gnome e policykit-1 que ja nao existem no Debian atual.</p>"
      ro: "<p>Corectat: dependentele polkit reduse doar la polkit. Eliminate alternativele obsolete policykit-1-gnome si policykit-1 care nu mai exista in Debian actual.</p>"
      ru: "<p>Исправлено: зависимости polkit сокращены только до polkit. Удалены устаревшие альтернативы policykit-1-gnome и policykit-1, которых больше нет в текущем Debian.</p>"
  - version: "2.0.0-6"
    type: stable
    unix-timestamp: 1781136000
    description:
      de: "<p>Verfeinerter Theme-Auswahlstil: dünnerer 1px-Rahmen, Leuchteffekt entfernt und oranger FlowBoxChild-Hintergrund bei Auswahl behoben.</p>"
      en: "<p>Refined theme selection style: thinner 1px border, removed glow effect, and fixed FlowBoxChild orange background on selection for a cleaner look.</p>"
      es: "<p>Refinado el estilo de selección de temas: borde más fino de 1px, eliminado el efecto de brillo y corregido el fondo naranja del FlowBoxChild al seleccionar, para un aspecto más limpio.</p>"
      fr: "<p>Style de sélection de thème raffiné : bordure plus fine d'1px, suppression de l'effet de lueur et correction du fond orange du FlowBoxChild à la sélection.</p>"
      it: "<p>Stile di selezione tema raffinato: bordo più sottile da 1px, effetto bagliore rimosso e sfondo arancione FlowBoxChild corretto alla selezione.</p>"
      pt: "<p>Estilo de seleção de tema refinado: borda mais fina de 1px, efeito de brilho removido e fundo laranja do FlowBoxChild corrigido na seleção.</p>"
      ro: "<p>Stil de selecție a temei rafinat: chenar mai subțire de 1px, efect de strălucire eliminat și fundal portocaliu FlowBoxChild corectat la selecție.</p>"
      ru: "<p>Улучшен стиль выделения темы: более тонкая рамка 1px, убран эффект свечения, исправлен оранжевый фон FlowBoxChild при выделении.</p>"
  - version: "2.0.0-5"
    type: stable
    unix-timestamp: 1779408000
    description:
      de: "<p>Umfangreiche historische Dokumentation für Legacy 1.x-Zweige (Tyron und Tyson) im CHANGELOG und in der README hinzugefügt. Veraltete AppStream-Metadatenelemente in metainfo.xml bereinigt.</p>"
      en: "<p>Added comprehensive historical documentation for Legacy 1.x branches (Tyron and Tyson) in CHANGELOG and README. Cleaned up obsolete AppStream metadata elements in metainfo.xml.</p>"
      es: "<p>Se ha añadido documentación histórica completa para las ramas Legacy 1.x (Tyron y Tyson) en CHANGELOG y README. Se han limpiado los elementos obsoletos de metainfo.xml para AppStream.</p>"
      fr: "<p>Ajout d'une documentation historique complète pour les branches Legacy 1.x (Tyron et Tyson) dans CHANGELOG et README. Nettoyage des éléments obsolètes de metainfo.xml pour AppStream.</p>"
      it: "<p>Aggiunta documentazione storica completa per i rami Legacy 1.x (Tyron e Tyson) in CHANGELOG e README. Puliti gli elementi di metadati AppStream obsoleti in metainfo.xml.</p>"
      pt: "<p>Adicionada documentação histórica abrangente para os ramos Legacy 1.x (Tyron e Tyson) em CHANGELOG e README. Limpeza de elementos metainfo obsoletos no metainfo.xml.</p>"
      ro: "<p>S-a adăugat o documentație istorică completă pentru ramurile Legacy 1.x (Tyron și Tyson) în CHANGELOG și README. S-au curățat elementele de metadate AppStream învechite în metainfo.xml.</p>"
      ru: "<p>Добавлена полная историческая документация для веток Legacy 1.x (Tyron и Tyson) в CHANGELOG и README. Очищены устаревшие элементы метаданных AppStream в metainfo.xml.</p>"
  - version: "2.0.0-4"
    type: stable
    unix-timestamp: 1779062400
    description:
      de: "<p>Nur-Dokumentations-Release: Versionshistorie auf der Releases-Seite, im CHANGELOG, README und Metainfo korrigiert. Alle Zeitstempel entsprechend der forensischen Prüfung des offiziellen Paketarchivs aktualisiert.</p>"
      en: "<p>Documentation-only release: version history corrected across the release page, CHANGELOG, README and metainfo. All timestamps updated to match the forensic audit of the official package archive.</p>"
      es: "<p>Publicación solo de documentación: historial de versiones corregido en la página de lanzamientos, CHANGELOG, README y metainfo. Todas las fechas actualizadas para coincidir con la auditoría forense del archivo oficial de paquetes.</p>"
      fr: "<p>Version documentation uniquement : historique des versions corrigé dans la page des versions, CHANGELOG, README et metainfo. Toutes les dates mises à jour pour correspondre à l'audit forensique de l'archive officielle des paquets.</p>"
      it: "<p>Versione solo documentazione: cronologia delle versioni corretta nella pagina delle versioni, CHANGELOG, README e metainfo. Tutti i timestamp aggiornati per corrispondere all'audit forense dell'archivio ufficiale dei pacchetti.</p>"
      pt: "<p>Versão apenas de documentação: histórico de versões corrigido na página de lançamentos, CHANGELOG, README e metainfo. Todas as datas atualizadas para corresponder à auditoria forense do arquivo oficial de pacotes.</p>"
      ro: "<p>Lansare doar de documentație: istoricul versiunilor corectat în pagina de lansări, CHANGELOG, README și metainfo. Toate marcajele temporale actualizate pentru a corespunde auditului criminalistic al arhivei oficiale de pachete.</p>"
      ru: "<p>Только документационный выпуск: история версий исправлена на странице релизов, в CHANGELOG, README и metainfo. Все временные метки обновлены в соответствии с криминалистической проверкой официального архива пакетов.</p>"
  - version: "2.0.0-3"
    type: stable
    unix-timestamp: 1778889600
    description:
      de: "<p>Der Text der Statusleiste wurde vereinfacht, um dem modernen Soplos-Standardlayout zu entsprechen.</p>"
      en: "<p>Simplified the footer UI text to match the modern Soplos standard layout.</p>"
      es: "<p>Se ha simplificado el texto de la barra de estado para coincidir con el diseño estándar de Soplos.</p>"
      fr: "<p>Le texte de la barre d'état a été simplifié pour correspondre à la disposition standard moderne de Soplos.</p>"
      it: "<p>Il testo della barra di stato è stato semplificato per corrispondere al layout standard moderno di Soplos.</p>"
      pt: "<p>O texto da barra de status foi simplificado para corresponder ao layout padrão moderno do Soplos.</p>"
      ro: "<p>Textul barei de stare a fost simplificat pentru a se potrivi cu aspectul standard modern Soplos.</p>"
      ru: "<p>Текст строки состояния был упрощен, чтобы соответствовать современному стандартному макету Soplos.</p>"
  - version: "2.0.0-2"
    type: stable
    unix-timestamp: 1776729600
    description:
      de: "<p>Korrektur des Kredit-Panels im Über-Dialog unter KDE: Der Kredit-Bereich wird jetzt mit opakem dunklem Hintergrund dargestellt, anstatt transparent zu sein. App-Symbol auf 48×48 Pixel standardisiert.</p>"
      en: "<p>Fixed About dialog credits panel on KDE: the credits area now displays with an opaque dark background instead of being transparent. App icon standardized to 48×48 pixels.</p>"
      es: "<p>Corregido el panel de créditos del diálogo Acerca de en KDE: el área de créditos ahora se muestra con fondo oscuro opaco en lugar de ser transparente. Icono estandarizado a 48×48 píxeles.</p>"
      fr: "<p>Correction du panneau de crédits du dialogue À propos sous KDE : la zone de crédits s'affiche maintenant avec un fond sombre opaque au lieu d'être transparente. Icône standardisée à 48×48 pixels.</p>"
      it: "<p>Corretto il pannello crediti della finestra Info su KDE: l'area dei crediti ora mostra uno sfondo scuro opaco invece di essere trasparente. Icona standardizzata a 48×48 pixel.</p>"
      pt: "<p>Corrigido o painel de créditos do diálogo Sobre no KDE: a área de créditos agora é exibida com fundo escuro opaco em vez de ser transparente. Ícone padronizado para 48×48 pixels.</p>"
      ro: "<p>Corectat panoul de credite din dialogul Despre pe KDE: zona de credite se afișează acum cu fundal întunecat opac în loc să fie transparentă. Pictogramă standardizată la 48×48 pixeli.</p>"
      ru: "<p>Исправлена панель авторов в диалоге «О программе» в KDE: область авторов теперь отображается с непрозрачным тёмным фоном вместо прозрачного. Значок стандартизирован до 48×48 пикселей.</p>"
  - version: "2.0.0-1"
    type: stable
    unix-timestamp: 1773964800
    description:
      de: "<p>Über-Dialog mit F1 hinzugefügt. HeaderBar-CSS auf GNOME korrigiert, damit CSD-Fenstersteuerelemente nicht mehr von der globalen Schaltflächenregel betroffen sind. Versions-Untertitel aus der HeaderBar entfernt.</p>"
      en: "<p>Added F1 About dialog. Fixed HeaderBar CSS on GNOME so CSD window controls are no longer affected by the global button rule. Removed version subtitle from the HeaderBar.</p>"
      es: "<p>Añadido diálogo Acerca de con F1. Corregido el CSS del HeaderBar en GNOME para que los controles CSD no sean afectados por la regla global de botones. Eliminado el subtítulo de versión del HeaderBar.</p>"
      fr: "<p>Ajout du dialogue À propos avec F1. Correction du CSS HeaderBar sur GNOME pour que les contrôles CSD ne soient plus affectés par la règle globale des boutons. Suppression du sous-titre de version du HeaderBar.</p>"
      it: "<p>Aggiunta finestra Info con F1. Corretto CSS HeaderBar su GNOME in modo che i controlli CSD non siano più influenzati dalla regola globale dei pulsanti. Rimosso il sottotitolo di versione dall'HeaderBar.</p>"
      pt: "<p>Adicionado diálogo Sobre com F1. Corrigido CSS do HeaderBar no GNOME para que os controles CSD não sejam afetados pela regra global de botões. Removido o subtítulo de versão do HeaderBar.</p>"
      ro: "<p>Adăugat dialog Despre cu F1. Corectat CSS HeaderBar pe GNOME pentru ca elementele de control CSD să nu mai fie afectate de regula globală a butoanelor. Eliminat subtitlul versiunii din HeaderBar.</p>"
      ru: "<p>Добавлен диалог «О программе» по F1. Исправлен CSS HeaderBar в GNOME, чтобы элементы управления CSD больше не зависели от глобального правила кнопок. Убран подзаголовок версии из HeaderBar.</p>"
  - version: "2.0.0"
    type: stable
    unix-timestamp: 1773792000
    description:
      C: "<p>Version 2.0.0 - Complete modular architecture refactor with dynamic theme detection (no hardcoded lists), robust installer for nested archives, enhanced progress reporting, and full Wayland support. Includes unified environment sensing, robust KDE dark theme detection, unified single-password prompts for TTY, advanced GNOME and KDE previews (Wayland/TTY), and standard-compliant logging.</p>"
      de: "<p>Version 2.0.0 - Vollständige modulare Refaktorierung mit dynamischer Themenerkennung (keine hardcodierten Listen), robuster Installer für verschachtelte Archive, verbesserte Fortschrittsanzeige und volle Wayland-Unterstützung. Enthält eine einheitliche Umgebungserkennung, robuste KDE-Dark-Theme-Erkennung, einheitliche Passwortabfragen für TTY, erweiterte GNOME- und KDE-Vorschauen (Wayland/TTY) und eine standardkonforme Protokollierung.</p>"
      es: "<p>Versión 2.0.0 - Refactorización modular completa con detección dinámica de temas (sin listas fijas), instalador robusto para archivos anidados, reporte de progreso mejorado y soporte total para Wayland. Incluye detección unificada de entorno, detección robusta del tema oscuro en KDE, prompts de una sola contraseña para TTY, vistas previas avanzadas en GNOME y KDE (Wayland/TTY) y registro de logs estandarizado.</p>"
      fr: "<p>Version 2.0.0 - Refonte modulaire complète avec détection dynamique des thèmes (pas de listes codées en dur), installateur robuste pour les archives imbriquées, rapport de progression amélioré et support Wayland complet. Comprend la détection d'environnement unifiée, une détection robuste du thème sombre KDE, des invites à mot de passe unique pour TTY, des aperçus GNOME et KDE avancés (Wayland/TTY) et des journaux conformes.</p>"
      it: "<p>Versione 2.0.0 - Refactoring modulare completo con rilevamento dinamico dei temi (senza liste fisse), installatore robusto per archivi nidificati, report di avanzamento migliorato e supporto Wayland completo. Include il rilevamento dell'ambiente unificato, il rilevamento robusto del tema scuro KDE, prompt a password singola per TTY, anteprime GNOME e KDE avanzate (Wayland/TTY) e log conformi agli standard.</p>"
      pt: "<p>Versão 2.0.0 - Refatoração modular completa com detecção dinâmica de temas (sem listas fixas), instalador robusto para arquivos aninhados, relatório de progresso aprimorado e suporte total para Wayland. Inclui detecção de ambiente unificada, detecção robusta do tema escuro do KDE, prompts de senha única para TTY, visualizações avançadas do GNOME e KDE (Wayland/TTY) e logs padronizados.</p>"
      ro: "<p>Versiunea 2.0.0 - Refactorizare modulară completă cu detecție dinamică a temelor (fără liste fixe), instalator robust pentru arhive imbricate, raportare îmbunătățită a progresului și suport complet pentru Wayland. Include detecția unificată a mediului, detecția robustă a temei întunecate KDE, solicitări cu o singură parolă pentru TTY, previzualizări GNOME și KDE avansate (Wayland/TTY) și jurnalizare standardizată.</p>"
      ru: "<p>Версия 2.0.0 - Полный модульный рефакторинг с динамическим обнаружением тем (без захардкорженных списков), надежным установщиком для вложенных архивов, улучшенным отображением прогресса и полной поддержкой Wayland. Включает унифицированное обнаружение среды, надежное определение темной темы KDE, единые запросы пароля для TTY, расширенные превью GNOME и KDE (Wayland/TTY) и стандартные логи.</p>"
