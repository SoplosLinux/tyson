Type: desktop-application
ID: "org.soplos.systemservice"
Package: "soplos-system-service"
Name:
  C: "Soplos System Services"
  de: "Soplos Systemdienste"
  es: "Soplos Servicios del sistema"
  fr: "Soplos Services systeme"
  it: "Soplos Servizi di sistema"
  pt: "Soplos Servicos do sistema"
