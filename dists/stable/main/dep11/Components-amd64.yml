    description:
      C: "<p>Ghostty set as default terminal for CHROOT recovery across all three distros.</p><ul><li>Ghostty is now the first-priority terminal in the CHROOT recovery launcher for XFCE (Tyron), KDE (Tyson) and GNOME (Boro), reflecting the new default terminal across all three distros.</li><li>All 8 locale files updated to mention ghostty in the terminal hint error message.</li></ul><ul><li>Ghostty es ahora la terminal de primera prioridad en el lanzador de recuperación CHROOT para XFCE (Tyron), KDE (Tyson) y GNOME (Boro), reflejando la nueva terminal predeterminada en las tres distros.</li><li>Los 8 archivos de idioma actualizados para mencionar ghostty en el mensaje de error de terminal.</li></ul><ul><li>Ghostty est maintenant le terminal prioritaire dans le lanceur de récupération CHROOT pour XFCE (Tyron), KDE (Tyson) et GNOME (Boro), reflétant le nouveau terminal par défaut sur les trois distros.</li><li>Les 8 fichiers de locale mis à jour pour mentionner ghostty dans le message d'erreur de terminal.</li></ul><ul><li>Ghostty é agora o terminal de primeira prioridade no lançador de recuperação CHROOT para XFCE (Tyron), KDE (Tyson) e GNOME (Boro), refletindo o novo terminal padrão nas três distros.</li><li>Os 8 ficheiros de locale atualizados para mencionar ghostty na mensagem de erro de terminal.</li></ul><ul><li>Ghostty ist jetzt das Terminal mit der höchsten Priorität im CHROOT-Wiederherstellungs-Launcher für XFCE (Tyron), KDE (Tyson) und GNOME (Boro), entsprechend dem neuen Standard-Terminal aller drei Distros.</li><li>Alle 8 Locale-Dateien aktualisiert, um ghostty in der Terminal-Fehlermeldung zu erwähnen.</li></ul><ul><li>Ghostty è ora il terminale di prima priorità nel launcher di recupero CHROOT per XFCE (Tyron), KDE (Tyson) e GNOME (Boro), riflettendo il nuovo terminale predefinito su tutte e tre le distros.</li><li>Tutti gli 8 file locale aggiornati per menzionare ghostty nel messaggio di errore del terminale.</li></ul><ul><li>Ghostty теперь является приоритетным терминалом в лаунчере восстановления CHROOT для XFCE (Tyron), KDE (Tyson) и GNOME (Boro), отражая новый терминал по умолчанию во всех трёх дистрибутивах.</li><li>Все 8 файлов локализации обновлены для упоминания ghostty в сообщении об ошибке терминала.</li></ul><ul><li>Ghostty este acum terminalul cu prioritate maximă în lansatorul de recuperare CHROOT pentru XFCE (Tyron), KDE (Tyson) și GNOME (Boro), reflectând noul terminal implicit pe toate cele trei distros.</li><li>Toate cele 8 fișiere locale actualizate pentru a menționa ghostty în mesajul de eroare al terminalului.</li></ul>"
      de: "<p>Ghostty als Standard-Terminal für die CHROOT-Wiederherstellung auf allen drei Distros festgelegt.</p>"
      es: "<p>Ghostty establecido como terminal predeterminada para la recuperación CHROOT en las tres distros.</p>"
      fr: "<p>Ghostty défini comme terminal par défaut pour la récupération CHROOT sur les trois distros.</p>"
      it: "<p>Ghostty impostato come terminale predefinito per il recupero CHROOT su tutte e tre le distros.</p>"
      pt: "<p>Ghostty definido como terminal padrão para a recuperação CHROOT nas três distros.</p>"
      ro: "<p>Ghostty setat ca terminal implicit pentru recuperarea CHROOT pe toate cele trei distros.</p>"
      ru: "<p>Ghostty установлен терминалом по умолчанию для восстановления CHROOT во всех трёх дистрибутивах.</p>"
  - version: "2.0.2-2"
    type: stable
    unix-timestamp: 1782086400
    description:
      C: "<p>Display manager restart fix for KDE: tries plasmalogin before sddm as fallback.</p><ul><li>Language changer now tries plasmalogin first on KDE, then sddm for beta users still on the old display manager.</li></ul><ul><li>El cambiador de idioma ahora intenta plasmalogin primero en KDE, luego sddm para usuarios beta con el gestor de pantalla anterior.</li></ul><ul><li>Le changeur de langue essaie maintenant plasmalogin en premier sous KDE, puis sddm pour les utilisateurs bêta.</li></ul><ul><li>O trocador de idioma agora tenta plasmalogin primeiro no KDE, depois sddm para utilizadores beta.</li></ul><ul><li>Der Sprachwechsler versucht unter KDE jetzt zuerst plasmalogin, dann sddm für Beta-Nutzer.</li></ul><ul><li>Il selettore di lingua ora prova plasmalogin per primo su KDE, poi sddm per gli utenti beta.</li></ul><ul><li>Переключатель языка теперь пробует plasmalogin первым в KDE, затем sddm для бета-пользователей.</li></ul><ul><li>Schimbatorul de limba incearca acum plasmalogin mai intai pe KDE, apoi sddm pentru utilizatorii beta.</li></ul>"
      de: "<p>Korrektur des Display-Manager-Neustarts unter KDE: versucht zuerst plasmalogin, dann sddm als Fallback.</p>"
      es: "<p>Corrección del reinicio del gestor de pantalla en KDE: intenta plasmalogin antes que sddm como alternativa.</p>"
      fr: "<p>Correction du redémarrage du gestionnaire d'affichage sous KDE : essaie plasmalogin avant sddm en repli.</p>"
      it: "<p>Correzione del riavvio del display manager su KDE: prova plasmalogin prima di sddm come fallback.</p>"
      pt: "<p>Correção do reinício do gestor de ecrã no KDE: tenta plasmalogin antes de sddm como alternativa.</p>"
      ro: "<p>Corectarea repornirii managerului de afișare pe KDE: incearca plasmalogin inainte de sddm ca rezerva.</p>"
      ru: "<p>Исправление перезапуска менеджера экрана в KDE: сначала пробует plasmalogin, затем sddm как запасной вариант.</p>"
  - version: "2.0.2"
    type: stable
    unix-timestamp: 1774915200
    description:
      C: "<p>New features, guided rescue operations and interface improvements.</p><ul><li>Fade-in animation on startup.</li><li>Tooltips on all interactive elements.</li><li>Internet connectivity indicator in the status bar (green/red dot, refreshed every 15 s).</li><li>Hardware Info button: shows CPU, RAM and storage.</li><li>GParted button in the main window action bar.</li><li>Guided Rescue Operations window: Reset Password, Repair GRUB (UEFI/BIOS), Update GRUB, Regenerate initramfs, interactive terminal.</li><li>Fixed dark strip in partition selection dialog.</li><li>Removed wrong positional partition auto-assignment fallback.</li><li>All 8 translations updated and compiled.</li></ul><ul><li>Animación de fundido al abrir la ventana.</li><li>Tooltips en todos los elementos interactivos.</li><li>Indicador de conectividad a internet en la barra de estado (punto verde/rojo, actualizado cada 15 s).</li><li>Botón Información de hardware: muestra CPU, RAM y almacenamiento.</li><li>Botón GParted en la barra de acciones de la ventana principal.</li><li>Ventana de Operaciones de Rescate guiadas: Restablecer contraseña, Reparar GRUB (UEFI/BIOS), Actualizar GRUB, Regenerar initramfs, terminal interactiva.</li><li>Corregida la franja oscura en el diálogo de selección de particiones.</li><li>Eliminada la asignación automática de particiones por posición.</li><li>Traducciones en 8 idiomas actualizadas y compiladas.</li></ul><ul><li>Animation de fondu au démarrage.</li><li>Infobulles sur tous les éléments interactifs.</li><li>Indicateur de connectivité internet dans la barre d'état (point vert/rouge, actualisé toutes les 15 s).</li><li>Bouton Informations matérielles : affiche le CPU, la RAM et le stockage.</li><li>Bouton GParted dans la barre d'actions de la fenêtre principale.</li><li>Fenêtre d'Opérations de Secours guidées : Réinitialiser le mot de passe, Réparer GRUB (UEFI/BIOS), Mettre à jour GRUB, Régénérer initramfs, terminal interactif.</li><li>Correction de la bande sombre dans le dialogue de sélection des partitions.</li><li>Suppression de l'affectation automatique des partitions par position.</li><li>Traductions en 8 langues mises à jour et compilées.</li></ul><ul><li>Animação de fade-in no arranque.</li><li>Tooltips em todos os elementos interativos.</li><li>Indicador de conectividade à internet na barra de estado (ponto verde/vermelho, atualizado de 15 em 15 s).</li><li>Botão Informações de hardware: mostra CPU, RAM e armazenamento.</li><li>Botão GParted na barra de ações da janela principal.</li><li>Janela de Operações de Recuperação guiadas: Redefinir palavra-passe, Reparar GRUB (UEFI/BIOS), Atualizar GRUB, Regenerar initramfs, terminal interativo.</li><li>Corrigida a faixa escura no diálogo de seleção de partições.</li><li>Removida a atribuição automática de partições por posição.</li><li>Traduções em 8 idiomas atualizadas e compiladas.</li></ul><ul><li>Einblendanimation beim Start.</li><li>Tooltips auf allen interaktiven Elementen.</li><li>Internetverbindungsanzeige in der Statusleiste (grüner/roter Punkt, alle 15 s aktualisiert).</li><li>Schaltfläche Hardwareinformationen: zeigt CPU, RAM und Speicher.</li><li>GParted-Schaltfläche in der Aktionsleiste des Hauptfensters.</li><li>Fenster für geführte Rettungsoperationen: Passwort zurücksetzen, GRUB reparieren (UEFI/BIOS), GRUB aktualisieren, Initramfs neu generieren, interaktives Terminal.</li><li>Dunkler Streifen im Partitionsauswahl-Dialog behoben.</li><li>Falsche automatische Partitionszuweisung nach Position entfernt.</li><li>Alle 8 Übersetzungen aktualisiert und kompiliert.</li></ul><ul><li>Animazione di dissolvenza all'avvio.</li><li>Tooltip su tutti gli elementi interattivi.</li><li>Indicatore di connettività internet nella barra di stato (punto verde/rosso, aggiornato ogni 15 s).</li><li>Pulsante Informazioni hardware: mostra CPU, RAM e storage.</li><li>Pulsante GParted nella barra delle azioni della finestra principale.</li><li>Finestra Operazioni di Recupero guidate: Reimposta password, Ripara GRUB (UEFI/BIOS), Aggiorna GRUB, Rigenera initramfs, terminale interattivo.</li><li>Corretta la banda scura nel dialogo di selezione delle partizioni.</li><li>Rimossa l'assegnazione automatica delle partizioni per posizione.</li><li>Tutte le 8 traduzioni aggiornate e compilate.</li></ul><ul><li>Анимация появления при запуске.</li><li>Подсказки на всех интерактивных элементах.</li><li>Индикатор подключения к интернету в строке состояния (зелёная/красная точка, обновляется каждые 15 с).</li><li>Кнопка «Сведения об оборудовании»: показывает CPU, ОЗУ и накопители.</li><li>Кнопка GParted на панели действий главного окна.</li><li>Окно пошаговых операций восстановления: сброс пароля, ремонт GRUB (UEFI/BIOS), обновление GRUB, пересборка initramfs, интерактивный терминал.</li><li>Исправлена тёмная полоса в диалоге выбора разделов.</li><li>Удалено автоматическое назначение разделов по позиции.</li><li>Все 8 переводов обновлены и скомпилированы.</li></ul><ul><li>Animație de estompare la pornire.</li><li>Tooltipuri pe toate elementele interactive.</li><li>Indicator de conectivitate la internet în bara de stare (punct verde/roșu, actualizat la 15 s).</li><li>Buton Informații hardware: afișează CPU, RAM și stocare.</li><li>Buton GParted în bara de acțiuni a ferestrei principale.</li><li>Fereastră de Operații de Salvare ghidate: Resetare parolă, Reparare GRUB (UEFI/BIOS), Actualizare GRUB, Regenerare initramfs, terminal interactiv.</li><li>Corectată banda întunecată din dialogul de selectare a partițiilor.</li><li>Eliminată atribuirea automată a partițiilor pe baza poziției.</li><li>Toate cele 8 traduceri actualizate și compilate.</li></ul>"
      de: "<p>Neue Funktionen, geführte Rettungsoperationen und Verbesserungen der Benutzeroberfläche.</p>"
      es: "<p>Nuevas funciones, operaciones de rescate guiadas y mejoras de interfaz.</p>"
      fr: "<p>Nouvelles fonctionnalités, opérations de secours guidées et améliorations de l'interface.</p>"
      it: "<p>Nuove funzionalità, operazioni di recupero guidate e miglioramenti dell'interfaccia.</p>"
      pt: "<p>Novas funcionalidades, operações de recuperação guiadas e melhorias de interface.</p>"
      ro: "<p>Funcții noi, operații de salvare ghidate și îmbunătățiri ale interfeței.</p>"
      ru: "<p>Новые функции, пошаговые операции восстановления и улучшения интерфейса.</p>"
