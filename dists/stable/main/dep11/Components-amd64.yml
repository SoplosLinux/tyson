  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>Applying a theme rebuilds the initramfs of every kernel with update-initramfs, which also copies it to the EFI partition when the system boots with systemd-boot, so the new theme is seen with the three boot loaders of Soplos Linux Installer.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1793750400
    description:
      C: "<p>The screenshots are installed with the package, the application metadata points to the installed launcher, and the manual page is the same in the project and in the package.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>The window no longer has the frame of the system: it is a card with rounded corners and its own minimize, maximize and close buttons.</p>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1793145600
    description:
      C: "<p>New application icon, new hero image and new screenshots, taken with the interface in English.</p>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1792886400
    description:
      C: "<p>First beta of the rewrite of Soplos Plymouth Manager, after the alpha was tested on real hardware.</p>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1792800000
    description:
      C: "<p>First alpha of the rewrite of Soplos Plymouth Manager, from Python 3 and GTK3 to Tauri 2 with a Rust backend and a Svelte frontend. It applies, previews, installs and removes themes for real, with dracut or initramfs-tools, on X11 and Wayland. It has not yet been tested on real hardware.</p>"
