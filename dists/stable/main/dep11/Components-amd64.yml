ID: "org.soplos.reposelector.desktop"
Package: "soplos-repo-selector"
Name:
  C: "Soplos Repo Selector"
  de: "Soplos Repository-Selektor"
  en: "Soplos Repo Selector"
  es: "Selector de Repositorios Soplos"
  fr: "Sélecteur de dépôts Soplos"
  it: "Selettore Repository Soplos"
  pt: "Seletor de Repositórios Soplos"
  ro: "Selector de depozite Soplos"
  ru: "Селектор репозиториев Soplos"
Summary:
  C: "Advanced APT repository manager for Soplos Linux"
  de: "Erweiterte APT-Repository-Verwaltung für Soplos Linux"
  en: "Advanced APT repository manager for Soplos Linux"
  es: "Gestor avanzado de repositorios APT para Soplos Linux"
  fr: "Gestionnaire avancé de dépôts APT pour Soplos Linux"
  it: "Gestore avanzato di repository APT per Soplos Linux"
  pt: "Gerenciador avançado de repositórios APT para Soplos Linux"
  ro: "Manager avansat de depozite APT pentru Soplos Linux"
  ru: "Продвинутый менеджер APT-репозиториев для Soplos Linux"
Description:
  C: "<p>Soplos Repo Selector is a comprehensive repository management tool designed for Soplos Linux. It provides an intuitive graphical interface for managing APT repositories, GPG keys, and system software sources with automatic theme detection and multi-language support.</p><ul><li>Complete APT repository management with modern DEB822 format support</li><li>Automatic fastest mirror detection and speed testing</li><li>GPG key management with import and download capabilities</li><li>Automatic dark/light theme detection for KDE, GNOME and XFCE</li><li>Multi-language support (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Wayland and X11 compatibility with proper session detection</li><li>Predefined repository templates for popular software</li></ul>"
  de: "<p>Soplos Repo Selector ist ein umfassendes Repository-Verwaltungstool für Soplos Linux. Es bietet eine intuitive grafische Benutzeroberfläche für die Verwaltung von APT-Repositories, GPG-Schlüsseln und System-Software-Quellen mit automatischer Theme-Erkennung und mehrsprachiger Unterstützung.</p><ul><li>Vollständige APT-Repository-Verwaltung mit moderner DEB822-Format-Unterstützung</li><li>Automatische Erkennung der schnellsten Spiegel und Geschwindigkeitstests</li><li>GPG-Schlüsselverwaltung mit Import- und Download-Funktionen</li><li>Automatische Erkennung dunkler/heller Themen für KDE, GNOME und XFCE</li><li>Mehrsprachige Unterstützung (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Wayland- und X11-Kompatibilität mit ordnungsgemäßer Sitzungserkennung</li><li>Vordefinierte Repository-Vorlagen für beliebte Software</li></ul>"
  en: "<p>Soplos Repo Selector is a comprehensive repository management tool designed for Soplos Linux. It provides an intuitive graphical interface for managing APT repositories, GPG keys, and system software sources with automatic theme detection and multi-language support.</p>"
  es: "<p>Soplos Repo Selector es una herramienta integral de gestión de repositorios diseñada para Soplos Linux. Proporciona una interfaz gráfica intuitiva para gestionar repositorios APT, claves GPG y fuentes de software del sistema con detección automática de tema y soporte multiidioma.</p><ul><li>Gestión completa de repositorios APT con soporte para formato DEB822 moderno</li><li>Detección automática de mirrors más rápidos y pruebas de velocidad</li><li>Gestión de claves GPG con capacidades de importación y descarga</li><li>Detección automática de tema oscuro/claro para KDE, GNOME y XFCE</li><li>Soporte multiidioma (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Compatibilidad con Wayland y X11 con detección adecuada de sesión</li><li>Plantillas de repositorio predefinidas para software popular</li></ul>"
  fr: "<p>Soplos Repo Selector est un outil complet de gestion de dépôts conçu pour Soplos Linux. Il fournit une interface graphique intuitive pour gérer les dépôts APT, les clés GPG et les sources logicielles du système avec détection automatique de thème et support multilingue.</p><ul><li>Gestion complète des dépôts APT avec support du format DEB822 moderne</li><li>Détection automatique des miroirs les plus rapides et tests de vitesse</li><li>Gestion des clés GPG avec capacités d'importation et de téléchargement</li><li>Détection automatique du thème sombre/clair pour KDE, GNOME et XFCE</li><li>Support multilingue (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Compatibilité Wayland et X11 avec détection de session appropriée</li><li>Modèles de dépôts prédéfinis pour les logiciels populaires</li></ul>"
  it: "<p>Soplos Repo Selector è uno strumento completo di gestione repository progettato per Soplos Linux. Fornisce un'interfaccia grafica intuitiva per gestire repository APT, chiavi GPG e sorgenti software di sistema con rilevamento automatico del tema e supporto multilingue.</p><ul><li>Gestione completa dei repository APT con supporto per il formato DEB822 moderno</li><li>Rilevamento automatico dei mirror più veloci e test di velocità</li><li>Gestione delle chiavi GPG con capacità di importazione e download</li><li>Rilevamento automatico del tema scuro/chiaro per KDE, GNOME e XFCE</li><li>Supporto multilingue (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Compatibilità Wayland e X11 con rilevamento di sessione appropriato</li><li>Modelli di repository predefiniti per software popolari</li></ul>"
  pt: "<p>Soplos Repo Selector é uma ferramenta abrangente de gerenciamento de repositórios projetada para o Soplos Linux. Fornece uma interface gráfica intuitiva para gerenciar repositórios APT, chaves GPG e fontes de software do sistema com detecção automática de tema e suporte multilíngue.</p><ul><li>Gerenciamento completo de repositórios APT com suporte ao formato DEB822 moderno</li><li>Detecção automática de espelhos mais rápidos e testes de velocidade</li><li>Gerenciamento de chaves GPG com capacidades de importação e download</li><li>Detecção automática de tema escuro/claro para KDE, GNOME e XFCE</li><li>Suporte multilíngue (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Compatibilidade com Wayland e X11 com detecção adequada de sessão</li><li>Modelos de repositório predefinidos para software popular</li></ul>"
  ro: "<p>Soplos Repo Selector este un instrument cuprinzător de gestionare a depozitelor proiectat pentru Soplos Linux. Oferă o interfață grafică intuitivă pentru gestionarea depozitelor APT, cheilor GPG și surselor software de sistem cu detectare automată a temei și suport multilingv.</p><ul><li>Gestionarea completă a depozitelor APT cu suport pentru formatul DEB822 modern</li><li>Detectarea automată a oglinzilor cele mai rapide și teste de viteză</li><li>Gestionarea cheilor GPG cu capacități de import și descărcare</li><li>Detectarea automată a temei întunecate/deschise pentru KDE, GNOME și XFCE</li><li>Suport multilingv (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Compatibilitate Wayland și X11 cu detectarea adecvată a sesiunii</li><li>Șabloane de depozit predefinite pentru software popular</li></ul>"
  ru: "<p>Soplos Repo Selector — комплексный инструмент управления репозиториями, разработанный для Soplos Linux. Предоставляет интуитивный графический интерфейс для управления APT-репозиториями, GPG-ключами и источниками программного обеспечения системы с автоматическим обнаружением темы и многоязычной поддержкой.</p><ul><li>Полное управление APT-репозиториями с поддержкой современного формата DEB822</li><li>Автоматическое обнаружение самых быстрых зеркал и тестирование скорости</li><li>Управление GPG-ключами с возможностями импорта и загрузки</li><li>Автоматическое обнаружение тёмной/светлой темы для KDE, GNOME и XFCE</li><li>Многоязычная поддержка (ES, EN, FR, PT, DE, IT, RU, RO)</li><li>Совместимость с Wayland и X11 с правильным обнаружением сеанса</li><li>Предопределённые шаблоны репозиториев для популярного ПО</li></ul>"
