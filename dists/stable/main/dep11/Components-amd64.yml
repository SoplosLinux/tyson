---
Type: desktop-application
ID: "org.soplos.lookmanager"
Package: "soplos-look-manager"
Name:
  C: "Soplos Look Manager"
Summary:
  C: "Themes, wallpapers, icons, panels and login screen of Plasma"
  de: "Themen, Hintergründe, Symbole, Leisten und Anmeldebildschirm von Plasma"
  es: "Temas, fondos, iconos, paneles y pantalla de inicio de sesión de Plasma"
  fr: "Thèmes, fonds d'écran, icônes, panneaux et écran de connexion de Plasma"
  it: "Temi, sfondi, icone, pannelli e schermata di accesso di Plasma"
  pt: "Temas, fundos, ícones, painéis e ecrã de início de sessão do Plasma"
  ro: "Teme, fundaluri, pictograme, panouri și ecranul de autentificare ale Plasma"
  ru: "Темы, обои, значки, панели и экран входа Plasma"
Description:
  C: "<p>Soplos Look Manager changes how Soplos Linux Tyson looks, from one window: the global theme, the wallpaper, the icons, the cursors, the GTK theme, the panels, the start-up screen and the login screen.</p><ul><li>Chooses what is already installed, with a preview, and applies it with the tools of Plasma</li><li>Adds, changes and removes panels</li><li>Changes the picture of the login screen of Plasma Login Manager</li><li>Manages virtual desktops, window behavior and rules, desktop effects, KWin scripts and the task switcher</li><li>Installs from the store of KDE or from a file, and removes what is installed</li></ul>"
  de: "<p>Soplos Look Manager ändert das Aussehen von Soplos Linux Tyson in einem einzigen Fenster: das globale Thema, den Hintergrund, die Symbole, die Zeiger, das GTK-Thema, die Leisten, den Startbildschirm und den Anmeldebildschirm.</p><ul><li>Wählt unter dem bereits Installierten aus, mit Vorschau, und wendet es mit den Werkzeugen von Plasma an</li><li>Fügt Leisten hinzu, ändert und entfernt sie</li><li>Ändert das Bild des Anmeldebildschirms von Plasma Login Manager</li><li>Verwaltet virtuelle Arbeitsflächen, Fensterverhalten und Fensterregeln, Desktop-Effekte, KWin-Skripte und den Aufgabenumschalter</li><li>Installiert aus dem KDE-Store oder aus einer Datei und entfernt Installiertes</li></ul>"
  es: "<p>Soplos Look Manager cambia el aspecto de Soplos Linux Tyson desde una sola ventana: el tema global, el fondo, los iconos, los cursores, el tema GTK, los paneles, la pantalla de arranque y la de inicio de sesión.</p><ul><li>Elige entre lo que ya está instalado, con vista previa, y lo aplica con las herramientas de Plasma</li><li>Añade, cambia y elimina paneles</li><li>Cambia la imagen de la pantalla de inicio de sesión de Plasma Login Manager</li><li>Gestiona escritorios virtuales, comportamiento y reglas de las ventanas, efectos del escritorio, guiones de KWin y el selector de tareas</li><li>Instala desde la tienda de KDE o desde un archivo, y elimina lo instalado</li></ul>"
  fr: "<p>Soplos Look Manager change l'apparence de Soplos Linux Tyson depuis une seule fenêtre : le thème global, le fond d'écran, les icônes, les curseurs, le thème GTK, les panneaux, l'écran de démarrage et l'écran de connexion.</p><ul><li>Choisit parmi ce qui est déjà installé, avec un aperçu, et l'applique avec les outils de Plasma</li><li>Ajoute, modifie et supprime des panneaux</li><li>Change l'image de l'écran de connexion de Plasma Login Manager</li><li>Gère les bureaux virtuels, le comportement et les règles des fenêtres, les effets de bureau, les scripts KWin et le sélecteur de tâches</li><li>Installe depuis la boutique de KDE ou depuis un fichier, et supprime ce qui est installé</li></ul>"
  it: "<p>Soplos Look Manager cambia l'aspetto di Soplos Linux Tyson da un'unica finestra: il tema globale, lo sfondo, le icone, i cursori, il tema GTK, i pannelli, la schermata di avvio e quella di accesso.</p><ul><li>Sceglie tra ciò che è già installato, con anteprima, e lo applica con gli strumenti di Plasma</li><li>Aggiunge, modifica e rimuove pannelli</li><li>Cambia l'immagine della schermata di accesso di Plasma Login Manager</li><li>Gestisce desktop virtuali, comportamento e regole delle finestre, effetti del desktop, script di KWin e il selettore delle attività</li><li>Installa dallo store di KDE o da un file, e rimuove ciò che è installato</li></ul>"
  pt: "<p>O Soplos Look Manager altera o aspeto do Soplos Linux Tyson numa só janela: o tema global, o fundo, os ícones, os cursores, o tema GTK, os painéis, o ecrã de arranque e o de início de sessão.</p><ul><li>Escolhe entre o que já está instalado, com pré-visualização, e aplica-o com as ferramentas do Plasma</li><li>Adiciona, altera e remove painéis</li><li>Altera a imagem do ecrã de início de sessão do Plasma Login Manager</li><li>Gere áreas de trabalho virtuais, comportamento e regras das janelas, efeitos do ambiente de trabalho, scripts do KWin e o seletor de tarefas</li><li>Instala a partir da loja do KDE ou de um ficheiro, e remove o que está instalado</li></ul>"
  ro: "<p>Soplos Look Manager schimbă aspectul Soplos Linux Tyson dintr-o singură fereastră: tema globală, fundalul, pictogramele, cursoarele, tema GTK, panourile, ecranul de pornire și cel de autentificare.</p><ul><li>Alege dintre ce este deja instalat, cu previzualizare, și aplică cu uneltele Plasma</li><li>Adaugă, modifică și elimină panouri</li><li>Schimbă imaginea ecranului de autentificare Plasma Login Manager</li><li>Gestionează desktopuri virtuale, comportamentul și regulile ferestrelor, efecte de desktop, scripturi KWin și selectorul de activități</li><li>Instalează din magazinul KDE sau dintr-un fișier și elimină ce este instalat</li></ul>"
  ru: "<p>Soplos Look Manager меняет внешний вид Soplos Linux Tyson из одного окна: глобальную тему, обои, значки, курсоры, тему GTK, панели, экран запуска и экран входа.</p><ul><li>Выбирает из уже установленного, с предпросмотром, и применяет средствами Plasma</li><li>Добавляет, изменяет и удаляет панели</li><li>Меняет изображение экрана входа Plasma Login Manager</li><li>Управляет виртуальными рабочими столами, поведением и правилами окон, эффектами, скриптами KWin и переключателем задач</li><li>Устанавливает из магазина KDE или из файла и удаляет установленное</li></ul>"
ProjectLicense: "GPL-3.0-or-later"
