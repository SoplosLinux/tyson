Summary:
  C: "Advanced APT repository manager for Soplos Linux"
  de: "Erweiterte APT-Paketquellen-Verwaltung für Soplos Linux"
  en: "Advanced APT repository manager for Soplos Linux"
  es: "Gestor avanzado de repositorios APT para Soplos Linux"
  fr: "Gestionnaire avancé de dépôts APT pour Soplos Linux"
  it: "Gestore avanzato di repository APT per Soplos Linux"
  pt: "Gestor avançado de repositórios APT para o Soplos Linux"
  ro: "Manager avansat de depozite APT pentru Soplos Linux"
  ru: "Расширенный менеджер репозиториев APT для Soplos Linux"
Description:
  C: "<p>Soplos Repo Selector manages APT software repositories for Soplos Linux: enable or disable repositories, modernize legacy .list files to DEB822 .sources, find the fastest mirrors with a real speed test, and manage GPG signing keys.</p>"
  de: "<p>Die Soplos Paketquellen-Auswahl verwaltet APT-Softwarequellen für Soplos Linux: Aktivieren oder Deaktivieren von Paketquellen, Modernisieren alter .list-Dateien in das DEB822 .sources-Format, Ermitteln der schnellsten Spiegelserver und Verwalten von GPG-Signaturschlüsseln.</p>"
  es: "<p>El Selector de Repositorios de Soplos gestiona los repositorios de software APT para Soplos Linux: activar o desactivar repositorios, modernizar archivos .list al formato DEB822 .sources, encontrar los espejos más rápidos con test de velocidad real y gestionar claves de firma GPG.</p>"
  fr: "<p>Le sélecteur de dépôts Soplos gère les dépôts logiciels APT pour Soplos Linux : activer ou désactiver des dépôts, convertir les anciens fichiers .list au format DEB822 .sources, trouver les miroirs les plus rapides et gérer les clés GPG.</p>"
  it: "<p>Il Selettore di Repository di Soplos gestisce i repository software APT per Soplos Linux: attiva o disattiva repository, aggiorna i vecchi file .list al formato DEB822 .sources, trova i mirror più veloci e gestisce le chiavi di firma GPG.</p>"
  pt: "<p>O Seletor de Repositórios do Soplos gere os repositórios de software APT para o Soplos Linux: ativar ou desativar repositórios, modernizar ficheiros .list antigos para o formato DEB822 .sources, encontrar os espelhos mais rápidos e gerir chaves GPG.</p>"
  ro: "<p>Selectorul de depozite Soplos gestionează depozitele de software APT pentru Soplos Linux: activați sau dezactivați depozite, modernizați fișierele .list vechi în format DEB822 .sources, găsiți cele mai rapide oglinzi și gestionați cheile GPG.</p>"
  ru: "<p>Выбор репозиториев Soplos управляет репозиториями программ APT для Soplos Linux: включение и отключение репозиториев, перевод старых файлов .list в формат DEB822 .sources, поиск быстрейших зеркал с тестом скорости и управление ключами подписи GPG.</p>"
