Type: desktop-application
ID: "org.soplos.plymouthmanager"
Package: "soplos-plymouth-manager"
Name:
  C: "Soplos Plymouth Manager"
  de: "Soplos Plymouth-Manager"
  es: "Gestor Plymouth Soplos"
  fr: "Gestionnaire Plymouth Soplos"
  it: "Gestore Plymouth Soplos"
  pt: "Gerenciador Plymouth Soplos"
  ro: "Manager Plymouth Soplos"
  ru: "Менеджер Plymouth Soplos"
Summary:
  C: "Plymouth boot splash theme manager for Soplos Linux"
  de: "Plymouth Boot-Splash Theme Manager für Soplos Linux"
  es: "Gestor de temas de arranque Plymouth para Soplos Linux"
  fr: "Gestionnaire de thèmes de démarrage Plymouth pour Soplos Linux"
  it: "Gestore dei temi di avvio Plymouth per Soplos Linux"
  pt: "Gerenciador de temas de inicialização Plymouth para Soplos Linux"
  ro: "Manager de teme Plymouth pentru Soplos Linux"
  ru: "Менеджер тем загрузочного экрана Plymouth для Soplos Linux"
Description:
  C: "<p>A simple and intuitive Plymouth theme manager that allows you to preview, install, and apply boot splash themes easily. Fully compatible with X11 and Wayland environments.</p>"
  de: "<p>Ein einfacher und intuitiver Plymouth-Theme-Manager, mit dem Sie Boot-Splash-Themes einfach vorschauen, installieren und anwenden können.</p>"
  es: "<p>Un gestor de temas Plymouth simple e intuitivo que te permite previsualizar, instalar y aplicar temas de arranque fácilmente. Totalmente compatible con entornos X11 y Wayland.</p>"
  fr: "<p>Un gestionnaire de thèmes Plymouth simple et intuitif qui vous permet de prévisualiser, installer et appliquer des thèmes de démarrage facilement.</p>"
  it: "<p>Un gestore di temi Plymouth semplice e intuitivo che ti permette di visualizzare, installare e applicare temi di avvio facilmente.</p>"
  pt: "<p>Um gerenciador de temas Plymouth simples e intuitivo que permite visualizar, instalar e aplicar temas de inicialização facilmente.</p>"
  ro: "<p>Un manager de teme Plymouth simplu și intuitiv care vă permite să previzualizați, instalați și aplicați teme de pornire cu ușurință.</p>"
  ru: "<p>Простой и интуитивно понятный менеджер тем Plymouth, который позволяет легко просматривать, устанавливать и применять темы загрузочного экрана.</p>"
