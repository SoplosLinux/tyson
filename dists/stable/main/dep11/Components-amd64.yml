Type: desktop-application
ID: org.soplos.webappmanager
ProjectLicense: GPL-3.0+
Package: soplos-webapp-manager
Name:
  C: WebApp Manager
Summary:
  C: Create and manage isolated Web Applications
  es: Crea y gestiona Aplicaciones Web aisladas
  fr: Créer et gérer des applications Web isolées
  de: Isolierte Webanwendungen erstellen und verwalten
  it: Crea e gestisci applicazioni web isolate
  pt: Criar e gerir aplicações Web isoladas
  ru: Создание и управление изолированными веб-приложениями
  ro: Creați și gestionați aplicații Web izolate
Description:
  C: |-
    <p>Soplos WebApp Manager allows you to run websites as native desktop applications.
    It creates isolated browsing environments (SSBs) to ensure your webapps can't interact
    with the cookies or tabs from your main browsing sessions, increasing productivity and privacy.</p><p>Features:</p>
  es: |-
    <p>Soplos WebApp Manager le permite ejecutar sitios web como aplicaciones de escritorio nativas.
    Crea entornos de navegación aislados (SSBs) para asegurar que sus aplicaciones web no puedan
    interactuar con las cookies o pestañas de sus sesiones de navegación principales, aumentando
    la productividad y la privacidad.</p><p>Características:</p>
  fr: |-
    <p>Soplos WebApp Manager vous permet d'exécuter des sites Web en tant qu'applications de bureau natives.
    Il crée des environnements de navigation isolés (SSB) pour garantir que vos applications Web ne puissent
    pas interagir avec les cookies ou les onglets de vos sessions de navigation principales, augmentant
    ainsi la productivité et la confidentialité.</p><p>Fonctionnalités :</p>
  de: |-
    <p>Soplos WebApp Manager ermöglicht es Ihnen, Websites als native Desktop-Anwendungen auszuführen.
    Er erstellt isolierte Browserumgebungen (SSBs), um sicherzustellen, dass Ihre Web-Apps nicht mit
    den Cookies oder Tabs Ihrer Haupt-Browsersitzungen interagieren können, was die Produktivität
    und den Datenschutz erhöht.</p><p>Funktionen:</p>
  it: |-
    <p>Soplos WebApp Manager ti permette di eseguire siti web come applicazioni desktop native.
    Crea ambienti di navigazione isolati (SSB) per garantire que le tue webapp non possano interagire
    con i cookie o le schede delle tue sessioni di navigazione principali, aumentando la produttività
    e la privacy.</p><p>Caratteristiche:</p>
  pt: |-
    <p>O Soplos WebApp Manager permite executar sites como aplicações de desktop nativas.
    Cria ambientes de navegação isolados (SSBs) para garantir que as suas aplicações Web não possam
    interagir com os cookies ou separadores das suas sessões de navegação principais, aumentando
    a produtividade e a privacidade.</p><p>Características:</p>
  ru: |-
    <p>Soplos WebApp Manager позволяет запускать веб-сайты как нативные настольные приложения.
    Он создает изолированные среды просмотра (SSB), чтобы ваши веб-приложения не могли
    взаимодействовать с файлами cookie или вкладками ваших основных сеансов просмотра,
    повышая производительность и конфиденциальность.</p><p>Возможности:</p>
  ro: |-
    <p>Soplos WebApp Manager vă permite să rulați site-uri web ca aplicații desktop native.
    Acesta creează medii de navigare izolate (SSB) pentru a se asigura că aplicațiile dumneavoastră
    web nu pot interacționa cu modulele cookie sau filele din sesiunile principale de navigare,
    crescând productivitatea și confidențialitatea.</p><p>Caracteristici:</p>
