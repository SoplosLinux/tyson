  - version: 2.0.1
    date: '2026-01-02'
    type: stable
    description:
      en: |-
        Complete speed test rewrite with real TCP latency measurement, larger downloads (2-10 MB), increased parallelism (6 workers) and dynamic real-time progress bars. Sources Generator now detects real system state. Fixed backports file removal when disabled. Fixed translation function error in file manager.
      es: |-
        Reescritura completa del test de velocidad con medición real de latencia TCP, descargas más grandes (2-10 MB), mayor paralelismo (6 workers) y barras de progreso dinámicas en tiempo real. El Generador de Sources ahora detecta el estado real del sistema. Corregida la eliminación del archivo de backports al desactivarlo. Corregido error de función de traducción en el gestor de archivos.
      fr: |-
        Réécriture complète du test de vitesse avec mesure réelle de la latence TCP, téléchargements plus importants (2-10 Mo), parallélisme accru (6 workers) et barres de progression dynamiques en temps réel. Le Générateur de Sources détecte désormais l'état réel du système. Correction de la suppression du fichier backports. Correction de l'erreur de fonction de traduction dans le gestionnaire de fichiers.
      pt: |-
        Reescrita completa do teste de velocidade com medição real de latência TCP, downloads maiores (2-10 MB), maior paralelismo (6 workers) e barras de progresso dinâmicas em tempo real. O Gerador de Sources agora detecta o estado real do sistema. Corrigida a remoção do arquivo de backports ao desativá-lo. Corrigido erro de função de tradução no gerenciador de arquivos.
      de: |-
        Vollständige Neufassung des Geschwindigkeitstests mit echter TCP-Latenzmessung, größeren Downloads (2-10 MB), erhöhtem Parallelismus (6 Worker) und dynamischen Echtzeit-Fortschrittsbalken. Sources Generator erkennt jetzt den echten Systemstatus. Backports-Datei-Entfernung beim Deaktivieren korrigiert. Übersetzungsfunktionsfehler im Dateimanager behoben.
      it: |-
        Riscrittura completa del test di velocità con misurazione reale della latenza TCP, download più grandi (2-10 MB), maggior parallelismo (6 worker) e barre di avanzamento dinamiche in tempo reale. Il Generatore di Sources ora rileva lo stato reale del sistema. Corretta la rimozione del file backports. Corretto errore della funzione di traduzione nel gestore file.
      ru: |-
        Полная переработка теста скорости с реальным измерением задержки TCP, более крупными загрузками (2-10 МБ), увеличенным параллелизмом (6 воркеров) и динамическими индикаторами прогресса в реальном времени. Генератор Sources теперь определяет реальное состояние системы. Исправлено удаление файла backports. Исправлена ошибка функции перевода в файловом менеджере.
      ro: |-
        Rescrierea completă a testului de viteză cu măsurarea reală a latenței TCP, descărcări mai mari (2-10 MB), paralelism crescut (6 workeri) și bare de progres dinamice în timp real. Generatorul Sources detectează acum starea reală a sistemului. Corectată eliminarea fișierului backports. Corectată eroarea funcției de traducere în managerul de fișiere.
      C: |-
        Complete speed test rewrite with real TCP latency measurement, larger downloads (2-10 MB), increased parallelism (6 workers) and dynamic real-time progress bars. Sources Generator now detects real system state. Fixed backports file removal when disabled. Fixed translation function error in file manager.
  - version: 2.0.0
    date: '2025-12-13'
    type: stable
    description:
      en: |-
        Major rewrite with modern, modular architecture for cross-desktop compatibility (GNOME, KDE Plasma, XFCE). Unified branch replacing the former Tyson (KDE) and Tyron (XFCE) separate releases. Includes complete internationalization for 8 languages, CSS-based theming engine, improved GPG key management, enhanced DEB822 format support, mirror speed test integrated into the Sources Generator tab, and full Wayland/X11 compatibility.
      es: |-
        Reescritura mayor con arquitectura moderna y modular para compatibilidad multiescritor (GNOME, KDE Plasma, XFCE). Rama unificada que reemplaza las anteriores versiones separadas Tyson (KDE) y Tyron (XFCE). Incluye internacionalización completa para 8 idiomas, motor de temas CSS, gestión de claves GPG mejorada, mejor soporte DEB822, test de velocidad integrado en la pestaña Generador de Sources y compatibilidad total Wayland/X11.
      fr: |-
        Réécriture majeure avec une architecture moderne et modulaire pour la compatibilité multi-bureau (GNOME, KDE Plasma, XFCE). Branche unifiée remplaçant les anciennes versions séparées Tyson (KDE) et Tyron (XFCE). Comprend une internationalisation complète pour 8 langues, un moteur de thèmes CSS, une gestion améliorée des clés GPG, un meilleur support DEB822, un test de vitesse intégré dans l'onglet Générateur de Sources et une compatibilité totale Wayland/X11.
      pt: |-
        Reescrita maior com arquitetura moderna e modular para compatibilidade multi-desktop (GNOME, KDE Plasma, XFCE). Ramo unificado que substitui as anteriores versões separadas Tyson (KDE) e Tyron (XFCE). Inclui internacionalização completa para 8 idiomas, motor de temas CSS, gestão de chaves GPG melhorada, melhor suporte DEB822, teste de velocidade integrado na aba Gerador de Sources e compatibilidade total Wayland/X11.
      de: |-
        Größere Neufassung mit moderner, modularer Architektur für Desktop-übergreifende Kompatibilität (GNOME, KDE Plasma, XFCE). Einheitlicher Branch, der die früheren separaten Versionen Tyson (KDE) und Tyron (XFCE) ersetzt. Enthält vollständige Internationalisierung für 8 Sprachen, CSS-basierte Theme-Engine, verbesserte GPG-Schlüsselverwaltung, bessere DEB822-Unterstützung, in den Sources-Generator integrierten Geschwindigkeitstest und vollständige Wayland/X11-Kompatibilität.
      it: |-
        Riscrittura maggiore con architettura moderna e modulare per compatibilità multi-desktop (GNOME, KDE Plasma, XFCE). Branch unificato che sostituisce le precedenti versioni separate Tyson (KDE) e Tyron (XFCE). Include internazionalizzazione completa per 8 lingue, motore temi CSS, gestione chiavi GPG migliorata, migliore supporto DEB822, test di velocità integrato nella scheda Generatore di Sources e compatibilità totale Wayland/X11.
      ru: |-
        Крупная переработка с современной модульной архитектурой для кросс-десктопной совместимости (GNOME, KDE Plasma, XFCE). Единая ветка, заменяющая раздельные версии Tyson (KDE) и Tyron (XFCE). Включает полную интернационализацию для 8 языков, CSS-движок тем, улучшенное управление GPG-ключами, расширенную поддержку DEB822, тест скорости зеркал в генераторе Sources и полную совместимость с Wayland/X11.
      ro: |-
        Rescrierea majoră cu arhitectură modernă și modulară pentru compatibilitate multi-desktop (GNOME, KDE Plasma, XFCE). Ramură unificată care înlocuiește versiunile separate anterioare Tyson (KDE) și Tyron (XFCE). Include internaționalizare completă pentru 8 limbi, motor de teme CSS, gestionare îmbunătățită a cheilor GPG, suport DEB822 extins, test de viteză integrat în fila Generator Sources și compatibilitate totală Wayland/X11.
      C: |-
        Major rewrite with modern, modular architecture for cross-desktop compatibility (GNOME, KDE Plasma, XFCE). Unified branch replacing the former Tyson (KDE) and Tyron (XFCE) separate releases. Includes complete internationalization for 8 languages, CSS-based theming engine, improved GPG key management, enhanced DEB822 format support, mirror speed test integrated into the Sources Generator tab, and full Wayland/X11 compatibility.
