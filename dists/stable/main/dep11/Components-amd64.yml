Summary:
  C: "Graphical editor for the GRUB boot loader of Soplos Linux"
  de: "Grafischer Editor für den GRUB-Bootloader von Soplos Linux"
  es: "Editor gráfico del gestor de arranque GRUB de Soplos Linux"
  fr: "Éditeur graphique du chargeur de démarrage GRUB de Soplos Linux"
  it: "Editor grafico del bootloader GRUB di Soplos Linux"
  pt: "Editor gráfico do gestor de arranque GRUB do Soplos Linux"
  ro: "Editor grafic pentru încărcătorul de boot GRUB al Soplos Linux"
  ru: "Графический редактор загрузчика GRUB для Soplos Linux"
Description:
  C: "<p>Soplos GRUB Editor configures the GRUB2 boot loader of Soplos Linux: the default entry and the timeout, the kernel parameters, custom boot entries, themes, backgrounds, colors and fonts. Every change goes through a Polkit-authenticated helper, the window never runs as root, and a copy of the settings can be saved before the first change.</p>"
  de: "<p>Der Soplos GRUB Editor konfiguriert den GRUB2-Bootloader von Soplos Linux: den Standardeintrag und die Wartezeit, die Kernel-Parameter, eigene Booteinträge, Themes, Hintergründe, Farben und Schriften. Jede Änderung läuft über einen per Polkit authentifizierten Helfer, das Fenster läuft nie als root, und vor der ersten Änderung kann eine Kopie der Einstellungen gespeichert werden.</p>"
  es: "<p>El Editor GRUB de Soplos configura el gestor de arranque GRUB2 de Soplos Linux: la entrada por defecto y el tiempo de espera, los parámetros del kernel, entradas de arranque propias, temas, fondos, colores y fuentes. Cada cambio pasa por un ayudante autenticado con Polkit, la ventana nunca se ejecuta como root y se puede guardar una copia de la configuración antes del primer cambio.</p>"
  fr: "<p>L'éditeur GRUB Soplos configure le chargeur de démarrage GRUB2 de Soplos Linux : l'entrée par défaut et le délai, les paramètres du noyau, les entrées de démarrage personnalisées, les thèmes, les fonds, les couleurs et les polices. Chaque modification passe par un assistant authentifié par Polkit, la fenêtre ne s'exécute jamais en root et une copie des réglages peut être enregistrée avant la première modification.</p>"
  it: "<p>L'Editor GRUB di Soplos configura il bootloader GRUB2 di Soplos Linux: la voce predefinita e il timeout, i parametri del kernel, voci di avvio personalizzate, temi, sfondi, colori e font. Ogni modifica passa da un helper autenticato con Polkit, la finestra non gira mai come root e prima della prima modifica si può salvare una copia delle impostazioni.</p>"
  pt: "<p>O Editor GRUB Soplos configura o gestor de arranque GRUB2 do Soplos Linux: a entrada por defeito e o tempo de espera, os parâmetros do kernel, entradas de arranque próprias, temas, fundos, cores e tipos de letra. Cada alteração passa por um auxiliar autenticado com o Polkit, a janela nunca corre como root e pode guardar-se uma cópia das definições antes da primeira alteração.</p>"
  ro: "<p>Editorul GRUB Soplos configurează încărcătorul de boot GRUB2 al Soplos Linux: intrarea implicită și timpul de așteptare, parametrii kernelului, intrări de boot proprii, teme, fundaluri, culori și fonturi. Fiecare modificare trece printr-un ajutor autentificat cu Polkit, fereastra nu rulează niciodată ca root și se poate salva o copie a setărilor înainte de prima modificare.</p>"
  ru: "<p>Редактор GRUB Soplos настраивает загрузчик GRUB2 в Soplos Linux: запись по умолчанию и время ожидания, параметры ядра, собственные пункты загрузки, темы, фоны, цвета и шрифты. Каждое изменение проходит через помощник с аутентификацией Polkit, окно никогда не работает от root, а копию настроек можно сохранить перед первым изменением.</p>"
