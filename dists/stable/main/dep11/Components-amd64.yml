Type: desktop-application
ID: "org.soplos.appimagemanager"
Package: "soplos-appimage-manager"
Name:
  C: "Soplos AppImage Manager"
  de: "Soplos AppImage-Verwaltung"
  en: "Soplos AppImage Manager"
  es: "Gestor de AppImage de Soplos"
  fr: "Gestionnaire d'AppImage de Soplos"
  it: "Gestore AppImage di Soplos"
  pt: "Gestor de AppImage do Soplos"
  ro: "Manager AppImage Soplos"
  ru: "Менеджер AppImage Soplos"
Summary:
  C: "Manage and integrate AppImage applications"
  de: "AppImage-Anwendungen auf dem Desktop verwalten und integrieren"
  en: "Manage and integrate AppImage applications"
  es: "Gestionar e integrar aplicaciones AppImage en el escritorio"
  fr: "Gérer et intégrer les applications AppImage sur le bureau"
  it: "Gestisci e integra le applicazioni AppImage nel desktop"
  pt: "Gerir e integrar aplicações AppImage no ambiente de trabalho"
  ro: "Gestionați și integrați aplicațiile AppImage pe desktop"
  ru: "Управление и интеграция приложений AppImage на рабочий стол"
Description:
  C: "<p>Soplos AppImage Manager integrates AppImage applications into the Soplos Linux desktop. It moves AppImages to ~/AppImages/, extracts their icon and metadata, creates menu entries for them, and checks GitHub, GitLab and Codeberg for updates.</p>"
  de: "<p>Die Soplos AppImage-Verwaltung integriert AppImage-Anwendungen in den Soplos Linux Desktop. Sie verschiebt Dateien nach ~/AppImages/, extrahiert Icons und Metadaten, erstellt Menüeinträge und prüft GitHub, GitLab und Codeberg auf Aktualisierungen.</p>"
  es: "<p>El Gestor de AppImage de Soplos integra aplicaciones AppImage en el escritorio de Soplos Linux. Mueve los paquetes a ~/AppImages/, extrae sus iconos y metadatos, crea accesos en el menú de aplicaciones y comprueba actualizaciones en GitHub, GitLab y Codeberg.</p>"
  fr: "<p>Le gestionnaire d'AppImage de Soplos intègre les applications AppImage sur le bureau Soplos Linux. Il déplace les fichiers vers ~/AppImages/, extrait leurs icônes et métadonnées, crée des entrées de menu et vérifie les mises à jour sur GitHub, GitLab et Codeberg.</p>"
  it: "<p>Il Gestore AppImage di Soplos integra le applicazioni AppImage nel desktop di Soplos Linux. Sposta i file in ~/AppImages/, estrae icone e metadati, crea voci di menu e controlla gli aggiornamenti su GitHub, GitLab e Codeberg.</p>"
  pt: "<p>O Gestor de AppImage do Soplos integra aplicações AppImage no ambiente de trabalho do Soplos Linux. Move os ficheiros para ~/AppImages/, extrai ícones e metadados, cria entradas de menu e verifica atualizações no GitHub, GitLab e Codeberg.</p>"
  ro: "<p>Managerul AppImage Soplos integrează aplicațiile AppImage pe desktopul Soplos Linux. Mută fișierele în ~/AppImages/, extrage pictogramele și metadatele, creează intrări în meniu și verifică actualizările pe GitHub, GitLab și Codeberg.</p>"
  ru: "<p>Менеджер AppImage Soplos интегрирует приложения AppImage в рабочий стол Soplos Linux. Перемещает файлы в ~/AppImages/, извлекает значки и метаданные, создаёт пункты меню и проверяет обновления на GitHub, GitLab и Codeberg.</p>"
