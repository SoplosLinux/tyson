    type: stable
    unix-timestamp: 1789516800
    description:
      de: "<p>GPG-Schlüsselauflösung beim Modernisieren einer .list zu .sources korrigiert: ein generisches Schlüsselwort wie „debian\" konnte vor der eigentlichen Repository-Schlüsseldatei einen nicht verwandten offiziellen Debian-Schlüsselbund treffen und die Signaturprüfung brechen. DEB822-Blöcke mit einem einleitenden Kopfkommentar, die fälschlich als deaktiviert angezeigt wurden, korrigiert. Ein doppeltes vollständiges erneutes Einlesen aller Quelldateien beim Start behoben. GPG-Schlüssellisting, das bei Schlüsselbunden mit nicht UTF-8-kodierten UIDs abbrach, behoben.</p>"
      en: "<p>Fixed GPG key resolution when modernizing a .list to .sources: a generic keyword like \"debian\" could match an unrelated official Debian keyring before the repository's own key file, breaking signature verification. Fixed DEB822 stanzas with a leading header comment being shown as disabled. Fixed a duplicate full re-read of all source files on startup. Fixed GPG key listing aborting on keyrings with non-UTF-8 encoded UIDs.</p>"
      es: "<p>Corregida la resolución de claves GPG al modernizar un .list a .sources: una palabra clave genérica como \"debian\" podía coincidir con un llavero oficial de Debian sin relación antes que con la clave propia del repositorio, rompiendo la verificación de firma. Corregidas las secciones DEB822 con un comentario de cabecera que se mostraban como desactivadas. Corregida una relectura duplicada de todos los archivos de fuentes al iniciar. Corregido el listado de claves GPG que fallaba con llaveros con UID codificados en un formato distinto a UTF-8.</p>"
      fr: "<p>Correction de la résolution des clés GPG lors de la modernisation d'un .list en .sources : un mot-clé générique comme « debian » pouvait correspondre à un trousseau Debian officiel sans rapport avant la propre clé du dépôt, cassant la vérification de signature. Correction des sections DEB822 avec un commentaire d'en-tête affichées comme désactivées. Correction d'une double relecture complète des fichiers de sources au démarrage. Correction du listage des clés GPG qui échouait sur des trousseaux contenant des UID non encodés en UTF-8.</p>"
      it: "<p>Risolta la risoluzione delle chiavi GPG durante la modernizzazione di un .list in .sources: una parola chiave generica come \"debian\" poteva corrispondere a un portachiavi Debian ufficiale non correlato prima della chiave effettiva del repository, interrompendo la verifica della firma. Risolte le sezioni DEB822 con un commento di intestazione mostrate come disattivate. Risolta una doppia rilettura completa di tutti i file sorgente all'avvio. Risolto l'elenco delle chiavi GPG che si interrompeva con portachiavi contenenti UID non codificati in UTF-8.</p>"
      pt: "<p>Corrigida a resolução de chaves GPG ao modernizar um .list para .sources: uma palavra-chave genérica como \"debian\" podia corresponder a um chaveiro oficial do Debian sem relação antes da própria chave do repositório, quebrando a verificação de assinatura. Corrigidas seções DEB822 com um comentário de cabeçalho exibidas como desativadas. Corrigida uma releitura completa duplicada de todos os arquivos de fontes ao iniciar. Corrigida a listagem de chaves GPG que falhava em chaveiros com UIDs não codificados em UTF-8.</p>"
      ro: "<p>Corectată rezolvarea cheilor GPG la modernizarea unui .list în .sources: un cuvânt cheie generic precum „debian” putea coincide cu un inel de chei oficial Debian fără legătură înaintea cheii proprii a depozitului, întrerupând verificarea semnăturii. Corectate blocurile DEB822 cu un comentariu de antet afișate ca dezactivate. Corectată o recitire completă duplicată a tuturor fișierelor sursă la pornire. Corectată listarea cheilor GPG care eșua pe inele de chei cu UID-uri necodate UTF-8.</p>"
      ru: "<p>Исправлено разрешение ключей GPG при модернизации .list в .sources: общее ключевое слово, например «debian», могло совпасть с несвязанной официальной связкой ключей Debian раньше, чем с собственным ключом репозитория, нарушая проверку подписи. Исправлены блоки DEB822 с заголовочным комментарием, ошибочно отображавшиеся как отключённые. Исправлено дублирующее полное перечитывание всех файлов источников при запуске. Исправлен список ключей GPG, прерывавшийся на связках ключей с UID, закодированными не в UTF-8.</p>"
