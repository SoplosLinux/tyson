  - version: 1.0.1-2
    date: '2026-07-20'
    type: stable
    description:
      en: |-
        Added the option to keep the original file and copy it instead of moving it when adding an AppImage, via the file chooser or drag and drop.
      es: |-
        Añadida la opción de conservar el archivo original y copiarlo en vez de moverlo al añadir un AppImage, mediante el selector de archivos o arrastrar y soltar.
      fr: |-
        Ajout de l'option permettant de conserver le fichier original et de le copier au lieu de le déplacer lors de l'ajout d'un AppImage, via le sélecteur de fichiers ou le glisser-déposer.
      pt: |-
        Adicionada a opção de manter o ficheiro original e copiá-lo em vez de o mover ao adicionar um AppImage, através do seletor de ficheiros ou de arrastar e largar.
      de: |-
        Option hinzugefügt, die Originaldatei zu behalten und beim Hinzufügen eines AppImage über die Dateiauswahl oder per Drag-and-Drop zu kopieren statt zu verschieben.
      it: |-
