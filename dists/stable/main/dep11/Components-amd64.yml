  - version: "2.0.2-9"
    type: stable
    unix-timestamp: 1782172800
    description:
      C: "<p>New option in Sources Generator to include source packages (deb-src). Auto-detected from existing system repositories on startup.</p>"
      de: "<p>Neue Option im Quellen-Generator zum Einbeziehen von Quellpaketen (deb-src). Wird beim Start automatisch aus den System-Repositories erkannt.</p>"
      en: "<p>New option in Sources Generator to include source packages (deb-src). Auto-detected from existing system repositories on startup.</p>"
      es: "<p>Nueva opción en el Generador de fuentes para incluir paquetes fuente (deb-src). Se detecta automáticamente a partir de los repositorios del sistema al iniciar.</p>"
      fr: "<p>Nouvelle option dans le Générateur de sources pour inclure les paquets source (deb-src). Détection automatique à partir des dépôts système au démarrage.</p>"
      it: "<p>Nuova opzione nel Generatore di sorgenti per includere i pacchetti sorgente (deb-src). Rilevamento automatico dai repository di sistema all'avvio.</p>"
      pt: "<p>Nova opção no Gerador de fontes para incluir pacotes fonte (deb-src). Detectado automaticamente a partir dos repositórios do sistema ao iniciar.</p>"
      ro: "<p>Opțiune nouă în Generatorul de surse pentru a include pachete sursă (deb-src). Detectat automat din depozitele sistemului la pornire.</p>"
      ru: "<p>Новая опция в генераторе источников для включения пакетов с исходным кодом (deb-src). Автоматически определяется из системных репозиториев при запуске.</p>"
  - version: "2.0.2-8"
    type: stable
    unix-timestamp: 1779148800
    description:
      C: "<p>Documentation-only release: version history corrected across the release page, CHANGELOG and metainfo. All 1.0.x timestamps updated to match the dates extracted from the internal CHANGELOG of each official package.</p>"
      de: "<p>Nur-Dokumentations-Release: Versionshistorie auf der Releases-Seite, im CHANGELOG und Metainfo korrigiert. Alle Zeitstempel der 1.0.x-Serie entsprechend den Daten aus dem internen CHANGELOG jedes offiziellen Pakets aktualisiert.</p>"
      en: "<p>Documentation-only release: version history corrected across the release page, CHANGELOG and metainfo. All 1.0.x timestamps updated to match the dates extracted from the internal CHANGELOG of each official package.</p>"
      es: "<p>Publicación solo de documentación: historial de versiones corregido en la página de lanzamientos, CHANGELOG y metainfo. Todas las fechas de la serie 1.0.x actualizadas para coincidir con las fechas extraídas del CHANGELOG interno de cada paquete oficial.</p>"
      fr: "<p>Version documentation uniquement : historique des versions corrigé dans la page des versions, CHANGELOG et metainfo. Toutes les dates de la série 1.0.x mises à jour pour correspondre aux dates extraites du CHANGELOG interne de chaque paquet officiel.</p>"
      it: "<p>Versione solo documentazione: cronologia delle versioni corretta nella pagina delle versioni, CHANGELOG e metainfo. Tutti i timestamp della serie 1.0.x aggiornati per corrispondere alle date estratte dal CHANGELOG interno di ogni pacchetto ufficiale.</p>"
      pt: "<p>Versão apenas de documentação: histórico de versões corrigido na página de lançamentos, CHANGELOG e metainfo. Todas as datas da série 1.0.x atualizadas para corresponder às datas extraídas do CHANGELOG interno de cada pacote oficial.</p>"
      ro: "<p>Lansare doar de documentație: istoricul versiunilor corectat în pagina de lansări, CHANGELOG și metainfo. Toate marcajele temporale ale seriei 1.0.x actualizate pentru a corespunde datelor extrase din CHANGELOG-ul intern al fiecărui pachet oficial.</p>"
      ru: "<p>Только документационный выпуск: история версий исправлена на странице релизов, в CHANGELOG и metainfo. Все временные метки серии 1.0.x обновлены в соответствии с датами, извлечёнными из внутреннего CHANGELOG каждого официального пакета.</p>"
