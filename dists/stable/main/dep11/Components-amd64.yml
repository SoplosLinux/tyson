Summary:
  C: System cleaner and optimizer for Soplos Linux
  es: Limpiador y optimizador de sistema para Soplos Linux
  fr: Nettoyeur et optimiseur de système pour Soplos Linux
  de: Systemreiniger und Optimierer für Soplos Linux
  pt: Limpador e otimizador de sistema para Soplos Linux
  it: Pulitore e ottimizzatore di sistema per Soplos Linux
