Launchable:
  desktop-id:
    - org.soplos.sys-cleaner.desktop
Url:
  homepage: https://soplos.org
  bugtracker: https://github.com/SoplosLinux/soplos-sys-cleaner/issues
Releases:
  - version: 1.0.3-4
    date: '2026-08-02'
    type: stable
    description:
      C: |-
        Theming release: light/dark detection routed per desktop environment (XFCE, Plasma, GNOME), light theme completed to full parity with the dark one.
      es: |-
        Versión de temas: detección de claro/oscuro enrutada por escritorio (XFCE, Plasma, GNOME), tema claro completado a paridad total con el oscuro.
      fr: |-
        Version thématique : détection clair/sombre routée par environnement de bureau (XFCE, Plasma, GNOME), thème clair complété à parité totale avec le sombre.
      de: |-
        Themen-Version: Hell-/Dunkel-Erkennung je Desktop-Umgebung geroutet (XFCE, Plasma, GNOME), helles Thema auf volle Parität mit dem dunklen gebracht.
      pt: |-
        Versão de temas: deteção de claro/escuro encaminhada por ambiente de trabalho (XFCE, Plasma, GNOME), tema claro completado até à paridade total com o escuro.
      it: |-
        Versione dei temi: rilevamento chiaro/scuro instradato per ambiente desktop (XFCE, Plasma, GNOME), tema chiaro completato alla piena parità con quello scuro.
      ro: |-
        Versiune de teme: detectarea luminos/întunecat rutată pe mediu desktop (XFCE, Plasma, GNOME), tema luminoasă completată la paritate totală cu cea întunecată.
      ru: |-
        Версия оформления: определение светлой/тёмной темы направляется по среде рабочего стола (XFCE, Plasma, GNOME), светлая тема доведена до полного соответствия тёмной.
  - version: 1.0.3-3
    date: '2026-07-22'
    type: stable
    description:
      C: |-
        Bugfix release: reverted the --root Administrator launcher (D-Bus instance conflict), fixed false firmware locks for intel/iwlwifi/nvidia, fixed VirtualBox uninstall feedback.
      es: |-
        Versión de corrección: revertido el lanzador --root de Administrador (conflicto de instancia D-Bus), corregidos los bloqueos falsos de firmware intel/iwlwifi/nvidia, corregido el aviso de desinstalación de VirtualBox.
      fr: |-
        Version corrective : lanceur Administrateur --root annulé (conflit d'instance D-Bus), verrouillages erronés du firmware intel/iwlwifi/nvidia corrigés, retour d'information de désinstallation de VirtualBox corrigé.
      de: |-
        Fehlerbehebungsversion: --root-Administrator-Starter zurückgenommen (D-Bus-Instanzkonflikt), fälschliche Firmware-Sperren für intel/iwlwifi/nvidia behoben, Rückmeldung zur VirtualBox-Deinstallation behoben.
      pt: |-
        Versão de correção: lançador --root de Administrador revertido (conflito de instância D-Bus), bloqueios falsos de firmware intel/iwlwifi/nvidia corrigidos, feedback de desinstalação do VirtualBox corrigido.
      it: |-
        Versione correttiva: launcher Amministratore --root annullato (conflitto di istanza D-Bus), blocchi falsi del firmware intel/iwlwifi/nvidia corretti, feedback di disinstallazione di VirtualBox corretto.
      ro: |-
        Versiune de corectare: lansatorul Administrator --root anulat (conflict de instanță D-Bus), blocările false ale firmware-ului intel/iwlwifi/nvidia remediate, feedback-ul de dezinstalare VirtualBox remediat.
      ru: |-
        Версия с исправлениями: отменён запуск администратора --root (конфликт экземпляров D-Bus), исправлены ложные блокировки прошивки intel/iwlwifi/nvidia, исправлена обратная связь при удалении VirtualBox.
  - version: 1.0.3-2
    date: '2026-07-21'
    type: stable
    description:
      C: |-
        Feature release: --root launch flag with Administrator .desktop launcher, duplicate VM guest package fix, Intel GPU firmware false-positive lock fix.
      es: |-
        Versión con novedades: flag de arranque --root con lanzador .desktop de Administrador, corrección de paquetes de VM duplicados, corrección del bloqueo falso de firmware de GPU Intel.
      fr: |-
        Version avec nouveautés : option de lancement --root avec lanceur .desktop Administrateur, correction des paquets VM dupliqués, correction du verrouillage erroné du firmware GPU Intel.
      de: |-
        Version mit Neuerungen: --root-Startoption mit Administrator-.desktop-Starter, Korrektur doppelter VM-Gastpakete, Korrektur der fälschlichen Intel-GPU-Firmware-Sperre.
      pt: |-
        Versão com novidades: opção de arranque --root com lançador .desktop de Administrador, correção de pacotes de VM duplicados, correção do bloqueio falso do firmware da GPU Intel.
      it: |-
        Versione con novità: opzione di avvio --root con launcher .desktop Amministratore, correzione dei pacchetti VM duplicati, correzione del blocco falso del firmware GPU Intel.
      ro: |-
        Versiune cu noutăți: opțiune de pornire --root cu lansator .desktop Administrator, remedierea pachetelor VM duplicate, remedierea blocării false a firmware-ului GPU Intel.
      ru: |-
        Версия с нововведениями: флаг запуска --root с ярлыком .desktop администратора, исправление дублирующихся пакетов VM, исправление ложной блокировки прошивки Intel GPU.
  - version: 1.0.3-1
    date: '2026-07-21'
    type: stable
    description:
      C: |-
        Bug fix release: NVIDIA firmware/driver purge, virt-viewer false positive, orphaned dracut.conf.d cleanup, full VirtualBox Guest Additions uninstall, temporary firmware warning, unified package/module mapping.
      es: |-
        Versión de correcciones: purga de firmware/driver NVIDIA, falso positivo de virt-viewer, limpieza de dracut.conf.d huérfanos, desinstalación completa de VirtualBox Guest Additions, aviso de firmware temporal, mapeo de paquetes/módulos unificado.
      fr: |-
        Version de corrections : purge du firmware/pilote NVIDIA, faux positif de virt-viewer, nettoyage des dracut.conf.d orphelins, désinstallation complète de VirtualBox Guest Additions, avertissement de firmware temporaire, mapping paquet/module unifié.
      de: |-
        Fehlerbehebungsversion: NVIDIA-Firmware/Treiber-Bereinigung, virt-viewer-Fehlalarm, Bereinigung verwaister dracut.conf.d, vollständige Deinstallation von VirtualBox Guest Additions, Warnung für temporäre Firmware, vereinheitlichtes Paket-Modul-Mapping.
      pt: |-
        Versão de correções: purga de firmware/driver NVIDIA, falso positivo do virt-viewer, limpeza de dracut.conf.d órfãos, desinstalação completa das VirtualBox Guest Additions, aviso de firmware temporário, mapeamento de pacotes/módulos unificado.
      it: |-
        Versione di correzioni: pulizia firmware/driver NVIDIA, falso positivo di virt-viewer, pulizia dei dracut.conf.d orfani, disinstallazione completa delle VirtualBox Guest Additions, avviso di firmware temporaneo, mappatura pacchetto/modulo unificata.
      ro: |-
        Versiune de remedieri: curățarea firmware-ului/driverului NVIDIA, fals pozitiv virt-viewer, curățarea fișierelor dracut.conf.d orfane, dezinstalarea completă a VirtualBox Guest Additions, avertisment de firmware temporar, mapare pachet/modul unificată.
      ru: |-
        Версия исправлений: очистка прошивки/драйвера NVIDIA, ложное срабатывание virt-viewer, очистка осиротевших dracut.conf.d, полное удаление VirtualBox Guest Additions, предупреждение о временной прошивке, унифицированное сопоставление пакетов/модулей.
  - version: 1.0.3
    date: '2026-07-07'
    type: stable
    description:
      C: 'Build dependency update: python3-all replaced with python3.'
      es: 'Actualización de dependencia de compilación: python3-all sustituido por
        python3.'
      fr: 'Mise à jour de la dépendance de compilation : python3-all remplacé par
        python3.'
      de: 'Aktualisierung der Build-Abhängigkeit: python3-all wurde durch python3
        ersetzt.'
      pt: 'Atualização da dependência de compilação: python3-all substituído por python3.'
      it: 'Aggiornamento della dipendenza di compilazione: python3-all sostituito
        con python3.'
      ro: 'Actualizare a dependenței de compilare: python3-all înlocuit cu python3.'
      ru: 'Обновление зависимости сборки: python3-all заменён на python3.'
  - version: 1.0.2-9
    date: '2026-06-29'
    type: stable
    description:
      C: |-
        Security and logic fix: Protected active Soplos kernel DKMS modules (NVIDIA, v4l2loopback) from being incorrectly flagged as orphans.
      es: |-
        Corrección de seguridad y lógica: Protección de los módulos DKMS activos del kernel de Soplos (NVIDIA, v4l2loopback) para evitar que se marquen incorrectamente como huérfanos.
      fr: |-
        Correction de sécurité et de logique : Protection des modules DKMS actifs du noyau Soplos (NVIDIA, v4l2loopback) pour éviter qu'ils ne soient signalés à tort comme orphelins.
      de: |-
        Sicherheits- und Logik-Fix: Schutz aktiver Soplos-Kernel-DKMS-Module (NVIDIA, v4l2loopback) vor fälschlicher Markierung als Waisen.
      pt: |-
        Correção de segurança e lógica: Proteção de módulos DKMS ativos do kernel Soplos (NVIDIA, v4l2loopback) para evitar que sejam marcados incorretamente como órfãos.
      it: |-
        Correzione di sicurezza e logica: Protezione dei moduli DKMS attivi del kernel Soplos (NVIDIA, v4l2loopback) per evitare che vengano erroneamente segnalati come orfani.
      ro: |-
        Remediere de securitate și logică: Protejarea modulelor DKMS active ale nucleului Soplos (NVIDIA, v4l2loopback) pentru a preveni marcarea incorectă a acestora ca fiind orfane.
      ru: |-
        Исправление безопасности и логики: Защита активных DKMS-модулей ядра Soplos (NVIDIA, v4l2loopback) от ошибочной пометки как сирот.
  - version: 1.0.2-8
    date: '2026-06-29'
    type: stable
    description:
      C: |-
        Bug fix release: 10 correctness bugs fixed across the kernel scanner, DKMS orphan detector, APT cache cleaner, hardware detection label, locale size scanner, modprobe detection, and driver removal flow.
      es: |-
        Versión de correcciones: 10 bugs de corrección en el escáner de kernels, detector de huérfanos DKMS, limpiador de caché APT, label de detección de hardware, escáner de tamaño de locales, detección de modprobe y flujo de eliminación de drivers.
      fr: |-
        Version de corrections : 10 bugs de correction dans le scanner de noyaux, le détecteur d'orphelins DKMS, le nettoyeur de cache APT, le label de détection matérielle, le scanner de taille des locales, la détection de modprobe et le flux de suppression des pilotes.
      de: |-
        Fehlerbehebungsversion: 10 Korrektheitsfehler behoben im Kernel-Scanner, DKMS-Waisen-Detektor, APT-Cache-Reiniger, Hardware-Erkennungslabel, Locale-Größen-Scanner, Modprobe-Erkennung und Treiber-Entfernungsablauf.
      pt: |-
        Versão de correções: 10 bugs de correção no scanner de kernels, detector de órfãos DKMS, limpador de cache APT, label de deteção de hardware, scanner de tamanho de locales, deteção de modprobe e fluxo de remoção de drivers.
      it: |-
        Versione di correzioni: 10 bug di correttezza corretti nel scanner dei kernel, rilevatore di orfani DKMS, pulitore della cache APT, etichetta di rilevamento hardware, scanner delle dimensioni delle locale, rilevamento modprobe e flusso di rimozione dei driver.
      ro: |-
        Versiune de remedieri: 10 erori de corectitudine remediate în scannerul de nuclee, detectorul de orfani DKMS, curățătorul cache-ului APT, eticheta de detectare hardware, scannerul de dimensiune locale, detectarea modprobe și fluxul de eliminare a driverelor.
      ru: |-
        Версия исправлений: исправлено 10 ошибок корректности в сканере ядер, детекторе осиротевших DKMS-модулей, очистителе кэша APT, метке обнаружения оборудования, сканере размеров локалей, обнаружении modprobe и потоке удаления драйверов.
  - version: 1.0.2-7
    date: '2026-06-24'
    type: stable
    description:
      C: |-
        Bug fix release: VirtualBox (and other hypervisor) guest service files are no longer shown as orphaned when running inside a virtual machine. Duplicate entries for the same file are also fixed.
      es: |-
        Versión de correcciones: los archivos de servicios guest de VirtualBox (y otros hipervisores) ya no se muestran como huérfanos cuando el sistema corre dentro de una máquina virtual. También se corrigen las entradas duplicadas para el mismo archivo.
      fr: |-
        Version de corrections : les fichiers de services invités VirtualBox (et autres hyperviseurs) ne sont plus affichés comme orphelins lors de l'exécution dans une machine virtuelle. Les entrées en double pour le même fichier sont également corrigées.
      de: |-
        Fehlerbehebungsversion: VirtualBox- (und andere Hypervisor-) Gast-Service-Dateien werden nicht mehr als verwaist angezeigt, wenn das System in einer virtuellen Maschine läuft. Doppelte Einträge für dieselbe Datei werden ebenfalls behoben.
      pt: |-
        Versão de correções: os ficheiros de serviços guest do VirtualBox (e outros hipervisores) já não são mostrados como órfãos quando o sistema corre numa máquina virtual. As entradas duplicadas para o mesmo ficheiro também são corrigidas.
      it: |-
        Versione di correzioni: i file di servizi guest di VirtualBox (e altri hypervisor) non vengono più mostrati come orfani quando il sistema è in esecuzione in una macchina virtuale. Vengono corrette anche le voci duplicate per lo stesso file.
      ro: |-
        Versiune de remedieri: fișierele de servicii guest VirtualBox (și ale altor hipervizoare) nu mai sunt afișate ca orfane când sistemul rulează într-o mașină virtuală. Intrările duplicate pentru același fișier sunt de asemenea remediate.
      ru: |-
        Версия исправлений: файлы гостевых служб VirtualBox (и других гипервизоров) больше не отображаются как осиротевшие при работе внутри виртуальной машины. Также исправлены дублирующиеся записи для одного и того же файла.
  - version: 1.0.2-6
    date: '2026-06-14'
    type: stable
    description:
      C: |-
        Bug fix release: SPICE guest tools (spice-vdagent, spice-webdavd) are no longer shown as removable when running inside a KVM/QEMU virtual machine in virt-manager.
      es: |-
        Versión de correcciones: las herramientas SPICE (spice-vdagent, spice-webdavd) ya no se muestran como eliminables cuando el sistema corre dentro de una máquina virtual KVM/QEMU en virt-manager.
      fr: |-
        Version de corrections : les outils SPICE (spice-vdagent, spice-webdavd) ne sont plus affichés comme supprimables lors de l'exécution dans une machine virtuelle KVM/QEMU dans virt-manager.
      de: |-
        Fehlerbehebungsversion: SPICE-Gast-Tools (spice-vdagent, spice-webdavd) werden nicht mehr als entfernbar angezeigt, wenn das System in einer KVM/QEMU-VM in virt-manager läuft.
      pt: |-
        Versão de correções: as ferramentas SPICE (spice-vdagent, spice-webdavd) já não são mostradas como removíveis quando o sistema corre numa máquina virtual KVM/QEMU no virt-manager.
      it: |-
        Versione di correzioni: gli strumenti SPICE (spice-vdagent, spice-webdavd) non vengono più mostrati come rimovibili quando il sistema è in esecuzione in una macchina virtuale KVM/QEMU in virt-manager.
      ro: |-
        Versiune de remedieri: instrumentele SPICE (spice-vdagent, spice-webdavd) nu mai sunt afișate ca eliminabile când sistemul rulează într-o mașină virtuală KVM/QEMU în virt-manager.
      ru: |-
        Версия исправлений: инструменты SPICE (spice-vdagent, spice-webdavd) больше не отображаются как удаляемые при работе внутри виртуальной машины KVM/QEMU в virt-manager.
  - version: 1.0.2-5
    date: '2026-06-12'
    type: stable
    description:
      C: |-
        Bug fix release: firmware removal is now permanent — the Firmwares tab purges the owning APT package instead of only deleting files, preventing restored firmware on every apt upgrade.
      es: |-
        Versión de correcciones: la eliminación de firmwares ahora es permanente — la pestaña Firmwares purga el paquete APT propietario en lugar de solo borrar archivos, evitando que los firmwares se restauren en cada apt upgrade.
      fr: |-
        Version de corrections : la suppression des micrologiciels est désormais permanente — l'onglet Micrologiciels purge le paquet APT propriétaire au lieu de simplement supprimer les fichiers, évitant la restauration des micrologiciels à chaque apt upgrade.
      de: |-
        Fehlerbehebungsversion: Firmware-Entfernung ist jetzt dauerhaft — der Firmware-Tab löscht das zugehörige APT-Paket statt nur Dateien zu entfernen, was eine Wiederherstellung der Firmware bei jedem apt upgrade verhindert.
      pt: |-
        Versão de correções: a remoção de firmwares é agora permanente — o separador Firmwares purga o pacote APT proprietário em vez de apenas apagar ficheiros, evitando que os firmwares sejam restaurados em cada apt upgrade.
      it: |-
        Versione di correzioni: la rimozione del firmware è ora permanente — la scheda Firmware elimina il pacchetto APT proprietario invece di cancellare solo i file, evitando il ripristino del firmware ad ogni apt upgrade.
      ro: |-
        Versiune de remedieri: eliminarea firmware-ului este acum permanentă — fila Firmware șterge pachetul APT proprietar în loc să elimine doar fișierele, prevenind restaurarea firmware-ului la fiecare apt upgrade.
      ru: |-
        Версия исправлений: удаление прошивок теперь постоянное — вкладка «Прошивки» удаляет пакет APT-владелец вместо простого удаления файлов, предотвращая восстановление прошивок при каждом apt upgrade.
  - version: 1.0.2-4
    date: '2026-06-09'
    type: stable
    description:
      C: |-
        Bug fix release: DKMS orphan detection no longer shows active installed drivers as orphans, and old compiled DKMS versions left after driver upgrades are now correctly detected.
      es: |-
        Versión de correcciones: la detección de módulos DKMS huérfanos ya no muestra como huérfanos los drivers instalados y activos, y las versiones compiladas antiguas que quedan tras actualizar drivers se detectan correctamente.
      fr: |-
        Version de corrections : la détection des modules DKMS orphelins n'affiche plus les pilotes actifs comme orphelins, et les anciennes versions compilées laissées après les mises à jour des pilotes sont correctement détectées.
      de: |-
        Fehlerbehebungsversion: DKMS-Waisenerkennung zeigt aktive Treiber nicht mehr als Waisen an, und alte kompilierte DKMS-Versionen nach Treiberaktualisierungen werden korrekt erkannt.
      pt: |-
        Versão de correções: a deteção de módulos DKMS órfãos já não mostra como órfãos os drivers instalados e ativos, e as versões compiladas antigas após atualizações de drivers são detetadas corretamente.
      it: |-
        Versione di correzioni: il rilevamento dei moduli DKMS orfani non mostra più i driver attivi come orfani, e le vecchie versioni compilate rimaste dopo gli aggiornamenti dei driver vengono rilevate correttamente.
      ro: |-
        Versiune de remedieri: detectarea modulelor DKMS orfane nu mai afișează driverele active ca orfane, iar versiunile compilate vechi rămase după actualizările driverelor sunt detectate corect.
      ru: |-
        Версия исправлений: обнаружение осиротевших DKMS-модулей больше не показывает активные драйверы как осиротевшие, а старые скомпилированные версии после обновления драйверов теперь обнаруживаются корректно.
  - version: 1.0.2-3
    date: '2026-06-04'
    type: stable
    description:
      C: |-
        Bug fix and cleanup release: orphaned DKMS modules, systemd services, X11/XDG autostart files and module references left after driver removal are now detected and cleaned. Fixes VBoxClient boot notifications on systems where VirtualBox guest packages were removed.
      es: |-
        Versión de correcciones y limpieza: módulos DKMS huérfanos, servicios systemd, ficheros de autostart X11/XDG y referencias de módulos que quedan tras desinstalar drivers ahora se detectan y eliminan. Corrige las notificaciones de VBoxClient al arrancar en sistemas donde se eliminaron los paquetes de guest de VirtualBox.
      fr: |-
        Version de corrections et nettoyage : les modules DKMS orphelins, services systemd, fichiers d'autostart X11/XDG et références de modules laissés après la suppression des pilotes sont maintenant détectés et nettoyés. Corrige les notifications VBoxClient au démarrage sur les systèmes où les paquets invités VirtualBox ont été supprimés.
      de: |-
        Fehlerbehebungs- und Bereinigungsversion: verwaiste DKMS-Module, systemd-Dienste, X11/XDG-Autostartdateien und Modulreferenzen nach der Treiberentfernung werden jetzt erkannt und bereinigt. Behebt VBoxClient-Benachrichtigungen beim Start auf Systemen, bei denen VirtualBox-Gast-Pakete entfernt wurden.
      pt: |-
        Versão de correções e limpeza: módulos DKMS órfãos, serviços systemd, ficheiros de autostart X11/XDG e referências de módulos deixados após a remoção de drivers são agora detetados e limpos. Corrige notificações do VBoxClient no arranque em sistemas onde os pacotes guest do VirtualBox foram removidos.
      it: |-
        Versione di correzioni e pulizia: moduli DKMS orfani, servizi systemd, file di autostart X11/XDG e riferimenti a moduli lasciati dopo la rimozione dei driver vengono ora rilevati e puliti. Corregge le notifiche VBoxClient all'avvio sui sistemi in cui i pacchetti guest di VirtualBox sono stati rimossi.
      ro: |-
        Versiune de remedieri și curățare: modulele DKMS orfane, serviciile systemd, fișierele de autostart X11/XDG și referințele la module rămase după eliminarea driverelor sunt acum detectate și curățate. Remediază notificările VBoxClient la pornire pe sistemele unde pachetele guest VirtualBox au fost eliminate.
      ru: |-
        Версия исправлений и очистки: осиротевшие DKMS-модули, службы systemd, файлы автозапуска X11/XDG и ссылки на модули, оставшиеся после удаления драйверов, теперь обнаруживаются и удаляются. Исправляет уведомления VBoxClient при загрузке на системах, где были удалены пакеты гостевых дополнений VirtualBox.
  - version: 1.0.2-2
    date: '2026-05-29'
    type: stable
    description:
      C: |-
        Bug fix and driver detection improvement release: Intel GPU false positive in VMs fixed, VM guest tool packages now managed via systemd-detect-virt, printer and input device driver detection added, progress bar and select-all checkbox state bugs fixed.
      es: |-
        Versión de correcciones y mejoras de detección de drivers: falso positivo de Intel GPU en VMs corregido, paquetes de herramientas de VM guest gestionados ahora via systemd-detect-virt, detección de drivers de impresoras y dispositivos de entrada añadida, bugs de barra de progreso y checkbox "Seleccionar todo" corregidos.
      fr: |-
        Version de corrections et améliorations de détection des pilotes : faux positif du GPU Intel dans les VM corrigé, paquets d'outils VM invités gérés via systemd-detect-virt, détection des pilotes d'imprimantes et de périphériques d'entrée ajoutée, bugs de la barre de progression et de la case à cocher corrigés.
      de: |-
        Fehlerbehebungs- und Treiber-Erkennungsversion: Intel-GPU-Falscherkennung in VMs behoben, VM-Gast-Toolpakete werden jetzt über systemd-detect-virt verwaltet, Drucker- und Eingabegeräte-Treibererkennung hinzugefügt, Fortschrittsbalken- und Auswahlfeld-Fehler behoben.
      pt: |-
        Versão de correções e melhorias de deteção de controladores: falso positivo da GPU Intel em VMs corrigido, pacotes de ferramentas de VM convidada geridos via systemd-detect-virt, deteção de controladores de impressoras e dispositivos de entrada adicionada, bugs da barra de progresso e da caixa de seleção corrigidos.
      it: |-
        Versione di correzioni e miglioramenti del rilevamento dei driver: falso positivo della GPU Intel nelle VM corretto, pacchetti degli strumenti VM ospite ora gestiti tramite systemd-detect-virt, rilevamento dei driver per stampanti e dispositivi di input aggiunto, bug della barra di avanzamento e della casella di selezione corretti.
      ro: |-
        Versiune de remedieri și îmbunătățiri ale detecției driverelor: fals pozitiv GPU Intel în mașini virtuale remediat, pachetele de instrumente VM invitat gestionate acum prin systemd-detect-virt, detectare adăugată pentru drivere de imprimantă și dispozitive de intrare, erori ale barei de progres și casetei de selectare remediate.
      ru: |-
        Версия исправлений и улучшений обнаружения драйверов: исправлен ложноположительный результат GPU Intel в ВМ, пакеты инструментов гостевых ВМ теперь управляются через systemd-detect-virt, добавлено обнаружение драйверов принтеров и устройств ввода, исправлены ошибки прогресс-бара и чекбокса выбора всех элементов.
  - version: 1.0.2-1
    date: '2026-04-17'
    type: stable
    description:
      C: |-
        Bug fix and improvement release: Snap tab redesigned with full uninstall support, improved VM guest detection for all hypervisors, kernel removal now properly regenerates initramfs and updates GRUB, and all apt-get commands replaced with apt.
      es: |-
        Versión de correcciones y mejoras: pestaña Snap rediseñada con desinstalación completa, detección mejorada de VM guest para todos los hipervisores, la eliminación de kernels regenera el initramfs y actualiza GRUB correctamente, y se reemplazó apt-get por apt.
      fr: |-
        Version de corrections et améliorations : onglet Snap repensé avec désinstallation complète, détection améliorée des VM invitées pour tous les hyperviseurs, la suppression de noyaux régénère maintenant l'initramfs et met à jour GRUB, et toutes les commandes apt-get remplacées par apt.
      de: |-
        Fehlerbehebungs- und Verbesserungsversion: Snap-Tab mit vollständiger Deinstallationsunterstützung neu gestaltet, verbesserte Gast-VM-Erkennung für alle Hypervisoren, Kernel-Entfernung generiert jetzt Initramfs neu und aktualisiert GRUB, und alle apt-get-Befehle durch apt ersetzt.
      pt: |-
        Versão de correções e melhorias: separador Snap redesenhado com suporte de desinstalação completa, deteção melhorada de VM convidada para todos os hipervisores, a remoção de kernels agora regenera o initramfs e atualiza o GRUB, e todos os comandos apt-get substituídos por apt.
      it: |-
        Versione di correzioni e miglioramenti: scheda Snap riprogettata con supporto per la disinstallazione completa, rilevamento migliorato della VM ospite per tutti gli hypervisor, la rimozione del kernel ora rigenera l'initramfs e aggiorna GRUB, e tutti i comandi apt-get sostituiti con apt.
      ro: |-
        Versiune de remedieri și îmbunătățiri: fila Snap reproiectată cu suport complet de dezinstalare, detectare îmbunătățită a VM-ului invitat pentru toți hipervizoarele, eliminarea kernelului regenerează acum initramfs și actualizează GRUB, și toate comenzile apt-get înlocuite cu apt.
      ru: |-
        Версия с исправлениями и улучшениями: вкладка Snap переработана с поддержкой полного удаления, улучшенное обнаружение гостевых ВМ для всех гипервизоров, удаление ядра теперь правильно перегенерирует initramfs и обновляет GRUB, все команды apt-get заменены на apt.
  - version: 1.0.2
    date: '2026-03-29'
    type: stable
    description:
      C: |-
        Major feature update: Installed Apps tab, Snap support, firmware sizes, selective APT cache cleanup, auto-scan on launch, GPU/KVM firmware protection and overview improvements.
      es: |-
        Actualización mayor: pestaña de Apps instaladas, soporte Snap, tamaños de firmware, limpieza selectiva de caché APT, escaneo automático al inicio, protección de firmware GPU/KVM y mejoras en el resumen.
      fr: |-
        Mise à jour majeure : onglet Applications installées, support Snap, tailles des firmwares, nettoyage sélectif du cache APT, analyse automatique au démarrage, protection des firmwares GPU/KVM et améliorations de l'aperçu.
      de: |-
        Großes Funktionsupdate: Tab für installierte Apps, Snap-Unterstützung, Firmware-Größen, selektive APT-Cache-Bereinigung, automatischer Scan beim Start, GPU/KVM-Firmware-Schutz und Übersichtsverbesserungen.
      pt: |-
        Atualização maior: separador de Apps instaladas, suporte a Snap, tamanhos de firmware, limpeza seletiva da cache APT, análise automática ao iniciar, proteção de firmware GPU/KVM e melhorias no resumo.
      it: |-
        Aggiornamento importante: scheda App installate, supporto Snap, dimensioni firmware, pulizia selettiva della cache APT, scansione automatica all'avvio, protezione firmware GPU/KVM e miglioramenti alla panoramica.
      ro: |-
        Actualizare majoră: filă Aplicații instalate, suport Snap, dimensiuni firmware, curățare selectivă a cache-ului APT, scanare automată la pornire, protecție firmware GPU/KVM și îmbunătățiri ale rezumatului.
      ru: |-
        Крупное обновление: вкладка установленных приложений, поддержка Snap, размеры прошивок, выборочная очистка кэша APT, автосканирование при запуске, защита прошивок GPU/KVM и улучшения обзора.
  - version: 1.0.1
    date: '2026-03-25'
    type: stable
    description:
      C: Major update introducing Dual-Layer Scanning (User vs Root modes) to eliminate
        password prompts on startup.
      es: |-
        Actualización mayor que introduce el Escaneo de Doble Capa (Usuario vs Root) para eliminar peticiones de contraseña al inicio.
      fr: |-
        Mise à jour majeure introduisant l'Analyse à Double Couche (Utilisateur vs Root) pour éliminer les invites de mot de passe au démarrage.
      de: Wichtiges Update mit Zweischicht-Scan (Benutzer- vs. Root-Modus) zur Vermeidung
        von Passwortabfragen beim Start.
      pt: |-
        Grande atualização introduzindo a Verificação de Dupla Camada (modos de Utilizador vs Root) para eliminar pedidos de palavra-passe no arranque.
      it: |-
        Importante aggiornamento che introduce la Scansione a Doppio Strato (Utente vs Root) per eliminare le richieste di password all'avvio.
      ro: |-
        Actualizare majoră care introduce scanarea pe Două Niveluri (Utilizator vs Root) pentru eliminarea solicitărilor de parolă la pornire.
      ru: |-
        Крупное обновление, представляющее Двухслойное Сканирование (режимы Пользователя и Root) для устранения запросов пароля при запуске.
  - version: 1.0.0-2
    date: '2026-03-20'
    type: stable
    description:
      C: |-
        Fixed About dialog credits panel on KDE: the credits area now displays with an opaque dark background and square corners instead of transparent or rounded-corner artifacts. App icon standardized to 48×48 pixels.
      es: |-
        Corregido el panel de créditos del diálogo Acerca de en KDE: el área de créditos ahora se muestra con fondo oscuro opaco y esquinas rectas en lugar de artefactos transparentes o con esquinas redondeadas. Icono estandarizado a 48×48 píxeles.
      fr: |-
        Correction du panneau de crédits du dialogue À propos sous KDE : la zone de crédits s'affiche maintenant avec un fond sombre opaque et des coins carrés au lieu d'artefacts transparents ou arrondis. Icône standardisée à 48×48 pixels.
      pt: |-
        Corrigido o painel de créditos do diálogo Sobre no KDE: a área de créditos agora é exibida com fundo escuro opaco e cantos retos em vez de artefatos transparentes ou com cantos arredondados. Ícone padronizado para 48×48 pixels.
      de: |-
        Korrektur des Kredit-Panels im Über-Dialog unter KDE: Der Kredit-Bereich wird jetzt mit opakem dunklem Hintergrund und eckigen Ecken dargestellt statt transparenter oder gerundeter Artefakte. App-Symbol auf 48×48 Pixel standardisiert.
      it: |-
        Corretto il pannello crediti della finestra Info su KDE: l'area dei crediti ora mostra uno sfondo scuro opaco e angoli quadrati invece di artefatti trasparenti o con angoli arrotondati. Icona standardizzata a 48×48 pixel.
      ru: |-
        Исправлена панель авторов в диалоге «О программе» в KDE: область авторов теперь отображается с непрозрачным тёмным фоном и прямыми углами вместо прозрачных или скруглённых артефактов. Значок стандартизирован до 48×48 пикселей.
      ro: |-
        Corectat panoul de credite din dialogul Despre pe KDE: zona de credite se afișează acum cu fundal întunecat opac și colțuri drepte în loc de artefacte transparente sau cu colțuri rotunjite. Pictogramă standardizată la 48×48 pixeli.
  - version: 1.0.0-1
    date: '2026-03-20'
    type: stable
    description:
      C: Initial release of Soplos Sys Cleaner.
      es: Lanzamiento inicial de Soplos Sys Cleaner.
      fr: Sortie initiale de Soplos Sys Cleaner.
      de: Erste Version von Soplos Sys Cleaner.
      pt: Lançamento inicial do Soplos Sys Cleaner.
      it: Rilascio iniziale di Soplos Sys Cleaner.
      ro: Versiunea inițială a Soplos Sys Cleaner.
      ru: Первоначальный выпуск Soplos Sys Cleaner.
