  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>The window follows the light or dark theme of the desktop (Xfce, Plasma and GNOME); the button of the sidebar still lets you choose.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>Documentation and packaging fixes.</p><ul><li>Manual page rewritten for the three views (Repositories, Sources Generator and GPG Keys) and installed compressed</li><li>AppStream categories and keywords in 8 languages; developer and project group identifiers now org.soplos; screenshots use web addresses</li><li>Changelog installed to /usr/share/doc/soplos-repo-selector/</li><li>Debian copyright declares Lucide (ISC), used for the interface icons</li></ul>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Full 8-language internationalization across desktop launchers and AppStream metadata.</p><p>Added Unix manual page documentation (soplos-repo-selector.1) installed to /usr/share/man/man1/.</p><p>Updated Debian packaging and application documentation.</p>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1791417600
    description:
      C: "<p>Unused GPG key detection and an updated sidebar icon.</p><ul><li>GPG Keys now flags keys no repository references anymore and that don't belong to any installed package</li><li>Updated sidebar icon</li></ul>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1790985600
    description:
      C: "<p>Full architecture rewrite of Soplos Repo Selector, from Python 3 and GTK3 to Tauri 2 with a Rust backend and a Svelte frontend.</p>"
