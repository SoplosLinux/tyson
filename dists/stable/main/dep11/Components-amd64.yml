Summary:
  C: "Graphical manager for systemd services on Soplos Linux"
  de: "Grafischer Manager fur systemd-Dienste unter Soplos Linux"
  es: "Gestor grafico de servicios systemd para Soplos Linux"
  fr: "Gestionnaire graphique des services systemd pour Soplos Linux"
  it: "Gestore grafico dei servizi systemd per Soplos Linux"
  pt: "Gestor grafico de servicos systemd para Soplos Linux"
  ro: "Manager grafic al serviciilor systemd pentru Soplos Linux"
  ru: "Графический менеджер служб systemd для Soplos Linux"
Description:
  C: "<p>Soplos System Services is a graphical tool for viewing, controlling and monitoring all systemd services on Soplos Linux Boro, Tyron and Tyson. It provides a clean GTK3 tabbed interface with a sortable service list, a scrollable details panel and a log viewer, with start, stop, restart, enable and disable controls that adapt to the current service state. Compatible with GNOME, XFCE and KDE desktop environments, on both X11 and Wayland, with automatic dark and light theme detection. Complete internationalization support for 8 languages.</p>"
  de: "<p>Soplos Systemdienste ist ein grafisches Werkzeug zum Anzeigen, Steuern und Uberwachen aller systemd-Dienste unter Soplos Linux Boro, Tyron und Tyson. Es bietet eine saubere GTK3-Registerkartenoberflache mit einer sortierbaren Dienstliste, einem scrollbaren Detailbereich und einem Protokollbetrachter sowie Steuerelementen zum Starten, Stoppen, Neustarten, Aktivieren und Deaktivieren, die sich dem aktuellen Dienstzustand anpassen. Kompatibel mit GNOME-, XFCE- und KDE-Desktop-Umgebungen, unter X11 und Wayland, mit automatischer Erkennung von dunklen und hellen Themen. Vollstandige Internationalisierungsunterstutzung fur 8 Sprachen.</p>"
  es: "<p>Soplos Servicios del sistema es una herramienta grafica para ver, controlar y monitorizar todos los servicios systemd en Soplos Linux Boro, Tyron y Tyson. Ofrece una interfaz GTK3 limpia con pestanas, una lista de servicios ordenable, un panel de detalles con scroll y un visor de registros, con controles para iniciar, detener, reiniciar, activar y desactivar servicios que se adaptan al estado actual del servicio. Compatible con los entornos de escritorio GNOME, XFCE y KDE, tanto en X11 como en Wayland, con deteccion automatica del tema oscuro o claro. Soporte completo de internacionalizacion para 8 idiomas.</p>"
  fr: "<p>Soplos Services systeme est un outil graphique pour afficher, controler et surveiller tous les services systemd sous Soplos Linux Boro, Tyron et Tyson. Il offre une interface GTK3 propre avec des onglets, une liste de services triable, un panneau de details defilant et un visualiseur de journaux, avec des commandes pour demarrer, arreter, redemarrer, activer et desactiver les services qui s'adaptent a l'etat actuel du service. Compatible avec les environnements de bureau GNOME, XFCE et KDE, sous X11 et Wayland, avec detection automatique du theme sombre ou clair. Support complet de l'internationalisation pour 8 langues.</p>"
  it: "<p>Soplos Servizi di sistema e uno strumento grafico per visualizzare, controllare e monitorare tutti i servizi systemd su Soplos Linux Boro, Tyron e Tyson. Offre un'interfaccia GTK3 pulita a schede con un elenco di servizi ordinabile, un pannello dei dettagli scorrevole e un visualizzatore di log, con controlli per avviare, fermare, riavviare, abilitare e disabilitare i servizi che si adattano allo stato attuale del servizio. Compatibile con gli ambienti desktop GNOME, XFCE e KDE, su X11 e Wayland, con rilevamento automatico del tema scuro o chiaro. Supporto completo all'internazionalizzazione per 8 lingue.</p>"
  pt: "<p>Soplos Servicos do sistema e uma ferramenta grafica para ver, controlar e monitorizar todos os servicos systemd no Soplos Linux Boro, Tyron e Tyson. Oferece uma interface GTK3 limpa com separadores, uma lista de servicos ordenavel, um painel de detalhes com scroll e um visualizador de registos, com controlos para iniciar, parar, reiniciar, ativar e desativar servicos que se adaptam ao estado atual do servico. Compativel com os ambientes de trabalho GNOME, XFCE e KDE, em X11 e Wayland, com detecao automatica do tema escuro ou claro. Suporte completo de internacionalizacao para 8 idiomas.</p>"
  ro: "<p>Soplos Servicii de sistem este un instrument grafic pentru a vizualiza, controla si monitoriza toate serviciile systemd pe Soplos Linux Boro, Tyron si Tyson. Ofera o interfata GTK3 curata cu file, o lista de servicii sortabila, un panou de detalii derulabil si un vizualizator de jurnale, cu controale pentru pornire, oprire, repornire, activare si dezactivare a serviciilor care se adapteaza la starea curenta a serviciului. Compatibil cu mediile de birou GNOME, XFCE si KDE, pe X11 si Wayland, cu detectie automata a temei inchise sau deschise. Suport complet de internationalizare pentru 8 limbi.</p>"
  ru: "<p>Soplos Системные службы — это графический инструмент для просмотра, управления и мониторинга всех служб systemd в Soplos Linux Boro, Tyron и Tyson. Предлагает чистый интерфейс GTK3 с вкладками, сортируемый список служб, прокручиваемую панель сведений и просмотрщик журналов, с кнопками запуска, остановки, перезапуска, включения и отключения, адаптирующимися к текущему состоянию службы. Совместим с рабочими средами GNOME, XFCE и KDE, на X11 и Wayland, с автоматическим определением тёмной или светлой темы. Полная поддержка интернационализации на 8 языков.</p>"
