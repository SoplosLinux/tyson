Summary:
  C: "Create and manage isolated Web Applications"
  de: "Isolierte Web-Applikationen erstellen und verwalten"
  es: "Crea y gestiona aplicaciones web aisladas"
  fr: "Créez et gérez des applications web isolées"
  it: "Crea e gestisci applicazioni web isolate"
  pt: "Crie e gira aplicações web isoladas"
  ro: "Creați și gestionați aplicații web izolate"
  ru: "Создание и управление изолированными веб-приложениями"
Description:
  C: "<p>Soplos WebApp Manager lets you run websites as native desktop applications. It creates isolated browsing profiles (Site Specific Browsers) so a webapp never shares cookies or open tabs with your main browsing session, using whichever browser you already have installed.</p>"
  de: "<p>Soplos WebApp Manager ermöglicht es, Websites als native Desktop-Anwendungen auszuführen. Es erstellt isolierte Browser-Profile (Site Specific Browsers), sodass eine Web-App niemals Cookies oder offene Tabs mit der Hauptbrowser-Sitzung teilt, und verwendet dafür den bereits installierten Browser.</p>"
  es: "<p>Soplos WebApp Manager permite ejecutar sitios web como aplicaciones de escritorio nativas. Crea perfiles de navegación aislados (navegadores específicos del sitio) para que una aplicación web nunca comparta cookies ni pestañas abiertas con tu sesión de navegación principal, usando el navegador que ya tengas instalado.</p>"
  fr: "<p>Soplos WebApp Manager vous permet d'exécuter des sites web comme des applications de bureau natives. Il crée des profils de navigation isolés (navigateurs spécifiques au site) afin qu'une application web ne partage jamais les cookies ni les onglets ouverts avec votre session de navigation principale, en utilisant le navigateur déjà installé.</p>"
  it: "<p>Soplos WebApp Manager consente di eseguire siti web come applicazioni desktop native. Crea profili di navigazione isolati (browser specifici del sito) in modo che una web app non condivida mai cookie o schede aperte con la sessione di navigazione principale, utilizzando il browser già installato.</p>"
  pt: "<p>O Soplos WebApp Manager permite executar sites como aplicações de desktop nativas. Cria perfis de navegação isolados (navegadores específicos do site) para que uma aplicação web nunca partilhe cookies nem separadores abertos com a sessão de navegação principal, usando o navegador que já tem instalado.</p>"
  ro: "<p>Soplos WebApp Manager vă permite să rulați site-uri web ca aplicații desktop native. Creează profiluri de navigare izolate (browsere specifice site-ului) astfel încât o aplicație web să nu partajeze niciodată cookie-uri sau file deschise cu sesiunea principală de navigare, folosind browserul deja instalat.</p>"
  ru: "<p>Soplos WebApp Manager позволяет запускать веб-сайты как нативные настольные приложения. Он создаёт изолированные профили браузера (браузеры для конкретного сайта), чтобы веб-приложение никогда не делило куки или открытые вкладки с основной сессией браузера, используя любой уже установленный браузер.</p>"
