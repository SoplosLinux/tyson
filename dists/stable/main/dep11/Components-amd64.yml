  - version: 2.1.0-3
    date: '2026-06-30'
    type: stable
    description:
      en: |-
        Fixed hybrid graphics: $SUDO_USER was empty under pkexec, writing kwinoutputconfig.json to /root instead of the user home. Fixed Wi-Fi repair UI freeze by moving hardware detection to a background thread. Fixed race condition on driver install (double-click launched multiple pkexec). Fixed Flatpak install missing package-update-indicator. Bazaar now warns about system-level Flathub conflict and cleans up on removal. Recommended tab reorganized: new App Management, Downloads, Hardware and Files categories. Added Transmission, FileZilla, GNOME Commander and Double Commander. Multimedia, Graphics and Office sections reordered by type.
      es: |-
        Corregidos gráficos híbridos: $SUDO_USER estaba vacío bajo pkexec, escribiendo kwinoutputconfig.json en /root en lugar del home del usuario. Corregido congelamiento de UI en reparación Wi-Fi moviendo la detección a un hilo secundario. Corregida condición de carrera en instalación de driver (doble clic lanzaba múltiples pkexec). Corregida instalación de Flatpak sin package-update-indicator. Bazaar ahora advierte sobre el conflicto con Flathub a nivel sistema y limpia al desinstalar. Pestaña Recomendados reorganizada: nuevas categorías Gestión de apps, Descargas, Hardware y Archivos. Añadidos Transmission, FileZilla, GNOME Commander y Double Commander. Secciones Multimedia, Gráficos y Oficina reordenadas por tipo.
      fr: |-
        Correction des graphiques hybrides : $SUDO_USER était vide sous pkexec, écrivant kwinoutputconfig.json dans /root au lieu du dossier personnel. Correction du gel de l'interface lors de la réparation Wi-Fi en déplaçant la détection dans un thread secondaire. Correction de la condition de course lors de l'installation du pilote (double-clic lançait plusieurs pkexec). Correction de l'installation Flatpak sans package-update-indicator. Bazaar avertit désormais du conflit Flathub système et nettoie à la désinstallation. Onglet Recommandés réorganisé : nouvelles catégories Gestion des apps, Téléchargements, Matériel et Fichiers. Ajout de Transmission, FileZilla, GNOME Commander et Double Commander. Sections Multimédia, Graphisme et Bureau réorganisées par type.
      pt: |-
        Corrigidos gráficos híbridos: $SUDO_USER estava vazio sob pkexec, escrevendo kwinoutputconfig.json em /root em vez da pasta pessoal. Corrigido congelamento da interface na reparação Wi-Fi movendo a deteção para uma thread secundária. Corrigida condição de corrida na instalação do driver (duplo clique lançava múltiplos pkexec). Corrigida instalação do Flatpak sem package-update-indicator. Bazaar avisa agora sobre o conflito Flathub a nível de sistema e limpa na desinstalação. Separador Recomendados reorganizado: novas categorias Gestão de apps, Transferências, Hardware e Ficheiros. Adicionados Transmission, FileZilla, GNOME Commander e Double Commander. Secções Multimédia, Gráficos e Escritório reordenadas por tipo.
      de: |-
        Hybridgrafik korrigiert: $SUDO_USER war unter pkexec leer und schrieb kwinoutputconfig.json nach /root statt in das Benutzerverzeichnis. UI-Einfrieren bei WLAN-Reparatur behoben, indem die Erkennung in einen Hintergrundthread verschoben wurde. Race Condition bei Treiberinstallation behoben (Doppelklick startete mehrere pkexec). Flatpak-Installation ohne package-update-indicator korrigiert. Bazaar warnt nun vor dem systemweiten Flathub-Konflikt und bereinigt bei der Deinstallation. Empfehlungen-Tab neu organisiert: neue Kategorien App-Verwaltung, Downloads, Hardware und Dateien. Transmission, FileZilla, GNOME Commander und Double Commander hinzugefügt. Multimedia-, Grafik- und Office-Abschnitte nach Typ neu geordnet.
      it: |-
        Corretti i grafici ibridi: $SUDO_USER era vuoto sotto pkexec, scrivendo kwinoutputconfig.json in /root invece della cartella home. Corretto il blocco dell'interfaccia nella riparazione Wi-Fi spostando il rilevamento in un thread secondario. Corretta la race condition nell'installazione del driver (doppio clic avviava più pkexec). Corretta l'installazione Flatpak senza package-update-indicator. Bazaar ora avverte del conflitto Flathub a livello di sistema e pulisce alla disinstallazione. Scheda Raccomandati riorganizzata: nuove categorie Gestione app, Download, Hardware e File. Aggiunti Transmission, FileZilla, GNOME Commander e Double Commander. Sezioni Multimedia, Grafica e Office riordinate per tipo.
      ru: |-
        Исправлена гибридная графика: $SUDO_USER был пуст под pkexec, что приводило к записи kwinoutputconfig.json в /root вместо домашней папки пользователя. Исправлено зависание интерфейса при восстановлении Wi-Fi путём переноса обнаружения в фоновый поток. Исправлено состояние гонки при установке драйвера (двойной клик запускал несколько pkexec). Исправлена установка Flatpak без package-update-indicator. Bazaar теперь предупреждает о конфликте с системным Flathub и очищает при удалении. Вкладка Рекомендованных реорганизована: новые категории Управление приложениями, Загрузки, Оборудование и Файлы. Добавлены Transmission, FileZilla, GNOME Commander и Double Commander. Разделы Мультимедиа, Графика и Офис переупорядочены по типу.
      ro: |-
        Corectate grafica hibridă: $SUDO_USER era gol sub pkexec, scriind kwinoutputconfig.json în /root în loc de folderul personal. Corectat blocarea interfeței la repararea Wi-Fi prin mutarea detectării într-un fir secundar. Corectată condiția de cursă la instalarea driverului (dublu clic lansa mai multe pkexec). Corectată instalarea Flatpak fără package-update-indicator. Bazaar avertizează acum despre conflictul Flathub la nivel de sistem și curăță la dezinstalare. Fila Recomandate reorganizată: noi categorii Gestionare aplicații, Descărcări, Hardware și Fișiere. Adăugate Transmission, FileZilla, GNOME Commander și Double Commander. Secțiunile Multimedia, Grafică și Birou reordonate pe tip.
      C: |-
        Fixed hybrid graphics: $SUDO_USER was empty under pkexec, writing kwinoutputconfig.json to /root instead of the user home. Fixed Wi-Fi repair UI freeze by moving hardware detection to a background thread. Fixed race condition on driver install (double-click launched multiple pkexec). Fixed Flatpak install missing package-update-indicator. Bazaar now warns about system-level Flathub conflict and cleans up on removal. Recommended tab reorganized: new App Management, Downloads, Hardware and Files categories. Added Transmission, FileZilla, GNOME Commander and Double Commander. Multimedia, Graphics and Office sections reordered by type.
  - version: 2.1.0-2
    date: '2026-06-29'
    type: stable
    description:
      en: |-
        Fixed DKMS residual modules not cleaned before driver install or uninstall, causing "version not newer" conflicts. Fixed escaped-quote corruption in 590/610 repo setup scripts. Fixed ROCm codename detection (removed incorrect bookworm branch; Soplos is Trixie/Forky only).
      es: |-
        Corregida la limpieza de módulos DKMS residuales antes de instalar o desinstalar drivers, que causaba conflictos "version not newer". Corregida la corrupción de comillas en los scripts de configuración del repositorio 590/610. Corregida la detección del codename en ROCm (eliminada la rama bookworm incorrecta; Soplos es solo Trixie/Forky).
      fr: |-
        Correction du nettoyage des modules DKMS résiduels avant installation ou désinstallation du pilote, causant des conflits "version not newer". Correction de la corruption de guillemets dans les scripts de configuration des dépôts 590/610. Correction de la détection du nom de code ROCm (suppression de la branche bookworm incorrecte ; Soplos est uniquement Trixie/Forky).
      pt: |-
        Corrigida a limpeza de módulos DKMS residuais antes de instalar ou desinstalar drivers, causando conflitos "version not newer". Corrigida a corrupção de aspas nos scripts de configuração do repositório 590/610. Corrigida a deteção do codename no ROCm (removido o ramo bookworm incorreto; Soplos é apenas Trixie/Forky).
      de: |-
        Behobene Bereinigung von DKMS-Restmodulen vor der Treiberinstallation oder -deinstallation, die Konflikte "version not newer" verursachte. Behobene Anführungszeichen-Beschädigung in den Repo-Setup-Skripten für 590/610. Behobene ROCm-Codename-Erkennung (falschen bookworm-Zweig entfernt; Soplos ist nur Trixie/Forky).
      it: |-
        Corretta la pulizia dei moduli DKMS residui prima dell'installazione o disinstallazione del driver, che causava conflitti "version not newer". Corrotta la corruzione delle virgolette negli script di configurazione del repository 590/610. Correcto il rilevamento del codename ROCm (rimosso il ramo bookworm errato; Soplos è solo Trixie/Forky).
      ru: |-
        Исправлена очистка остаточных модулей DKMS перед установкой или удалением драйвера, вызывавшая конфликты "version not newer". Исправлено повреждение кавычек в скриптах настройки репозитория 590/610. Исправлено определение кодового имени ROCm (удалена некорректная ветка bookworm; Soplos — только Trixie/Forky).
      ro: |-
        Corectată curățarea modulelor DKMS reziduale înainte de instalarea sau dezinstalarea driverului, care provoca conflicte "version not newer". Corectată coruperea ghilimelelor în scripturile de configurare a depozitului 590/610. Corectată detectarea numelui de cod ROCm (ramura bookworm incorectă eliminată; Soplos este doar Trixie/Forky).
      C: |-
        Fixed DKMS residual modules not cleaned before driver install or uninstall, causing "version not newer" conflicts. Fixed escaped-quote corruption in 590/610 repo setup scripts. Fixed ROCm codename detection (removed incorrect bookworm branch; Soplos is Trixie/Forky only).
