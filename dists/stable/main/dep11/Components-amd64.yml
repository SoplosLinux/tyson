---
Type: desktop-application
ID: "org.soplos.welcomelive"
Package: "soplos-welcome-live"
Name:
  C: "Soplos Welcome Live"
  de: "Willkommen bei Soplos Live"
  es: "Bienvenida a Soplos Live"
  fr: "Bienvenue sur Soplos Live"
  it: "Benvenuto su Soplos Live"
  pt: "Bem-vindo ao Soplos Live"
  ro: "Bun venit la Soplos Live"
  ru: "Добро пожаловать в Soplos Live"
Summary:
  C: "Welcome screen of the Soplos Linux live session"
  de: "Willkommensbildschirm der Soplos-Linux-Live-Sitzung"
  es: "Pantalla de bienvenida de la sesión live de Soplos Linux"
  fr: "Écran de bienvenue de la session live de Soplos Linux"
  it: "Schermata di benvenuto della sessione live di Soplos Linux"
  pt: "Ecrã de boas-vindas da sessão live do Soplos Linux"
  ro: "Ecranul de bun venit al sesiunii live Soplos Linux"
  ru: "Экран приветствия live-сессии Soplos Linux"
Description:
  C: "<p>Soplos Welcome Live is the first thing you see in the Soplos Linux live session. Install Soplos, repair a system you already have without knowing any command, partition disks and change the language and keyboard of the session.</p><ul><li>Works on Xfce (Tyron), Plasma (Tyson) and GNOME (Boro), on X11 and Wayland</li><li>Simple rescue: the computer does not start, a forgotten password, a failed update</li><li>Finds the installed systems by itself, including BTRFS subvolumes</li><li>Language and keyboard change with automatic migration of the user folders</li><li>Available in 8 languages (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  de: "<p>Soplos Welcome Live ist das Erste, was du in der Live-Sitzung von Soplos Linux siehst. Installiere Soplos, repariere ein vorhandenes System ohne einen einzigen Befehl zu kennen, partitioniere Festplatten und ändere Sprache und Tastatur der Sitzung.</p><ul><li>Läuft unter Xfce (Tyron), Plasma (Tyson) und GNOME (Boro), mit X11 und Wayland</li><li>Einfache Rettung: der Computer startet nicht, ein vergessenes Passwort, ein fehlgeschlagenes Update</li><li>Findet installierte Systeme selbst, einschließlich BTRFS-Subvolumes</li><li>Wechsel von Sprache und Tastatur mit automatischer Migration der Benutzerordner</li><li>In 8 Sprachen verfügbar (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  es: "<p>Soplos Welcome Live es lo primero que ves en la sesión live de Soplos Linux. Instala Soplos, repara un sistema que ya tengas sin saber ningún comando, particiona discos y cambia el idioma y el teclado de la sesión.</p><ul><li>Funciona en Xfce (Tyron), Plasma (Tyson) y GNOME (Boro), con X11 y Wayland</li><li>Rescate sencillo: el equipo no arranca, una contraseña olvidada, una actualización fallida</li><li>Encuentra solo los sistemas instalados, incluidos los subvolúmenes BTRFS</li><li>Cambio de idioma y teclado con migración automática de las carpetas del usuario</li><li>Disponible en 8 idiomas (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  fr: "<p>Soplos Welcome Live est la première chose que vous voyez dans la session live de Soplos Linux. Installez Soplos, réparez un système que vous avez déjà sans connaître aucune commande, partitionnez des disques et changez la langue et le clavier de la session.</p><ul><li>Fonctionne sur Xfce (Tyron), Plasma (Tyson) et GNOME (Boro), avec X11 et Wayland</li><li>Secours simple : l'ordinateur ne démarre pas, un mot de passe oublié, une mise à jour qui a échoué</li><li>Trouve tout seul les systèmes installés, sous-volumes BTRFS compris</li><li>Changement de langue et de clavier avec migration automatique des dossiers de l'utilisateur</li><li>Disponible en 8 langues (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  it: "<p>Soplos Welcome Live è la prima cosa che vedi nella sessione live di Soplos Linux. Installa Soplos, ripara un sistema che hai già senza conoscere alcun comando, partiziona i dischi e cambia la lingua e la tastiera della sessione.</p><ul><li>Funziona su Xfce (Tyron), Plasma (Tyson) e GNOME (Boro), con X11 e Wayland</li><li>Ripristino semplice: il computer non si avvia, una password dimenticata, un aggiornamento fallito</li><li>Trova da solo i sistemi installati, compresi i sottovolumi BTRFS</li><li>Cambio di lingua e tastiera con migrazione automatica delle cartelle dell'utente</li><li>Disponibile in 8 lingue (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  pt: "<p>O Soplos Welcome Live é a primeira coisa que vê na sessão live do Soplos Linux. Instale o Soplos, repare um sistema que já tenha sem saber nenhum comando, particione discos e altere o idioma e o teclado da sessão.</p><ul><li>Funciona em Xfce (Tyron), Plasma (Tyson) e GNOME (Boro), com X11 e Wayland</li><li>Resgate simples: o computador não arranca, uma palavra-passe esquecida, uma atualização falhada</li><li>Encontra sozinho os sistemas instalados, incluindo os subvolumes BTRFS</li><li>Alteração do idioma e do teclado com migração automática das pastas do utilizador</li><li>Disponível em 8 idiomas (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  ro: "<p>Soplos Welcome Live este primul lucru pe care îl vezi în sesiunea live Soplos Linux. Instalează Soplos, repară un sistem pe care îl ai deja fără să știi nicio comandă, partiționează discuri și schimbă limba și tastatura sesiunii.</p><ul><li>Funcționează pe Xfce (Tyron), Plasma (Tyson) și GNOME (Boro), cu X11 și Wayland</li><li>Salvare simplă: computerul nu pornește, o parolă uitată, o actualizare eșuată</li><li>Găsește singur sistemele instalate, inclusiv subvolumele BTRFS</li><li>Schimbarea limbii și a tastaturii cu migrarea automată a folderelor utilizatorului</li><li>Disponibil în 8 limbi (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
  ru: "<p>Soplos Welcome Live — первое, что вы видите в live-сессии Soplos Linux. Установите Soplos, почините уже установленную систему, не зная ни одной команды, разметьте диски и измените язык и клавиатуру сессии.</p><ul><li>Работает в Xfce (Tyron), Plasma (Tyson) и GNOME (Boro), с X11 и Wayland</li><li>Простое восстановление: компьютер не запускается, забытый пароль, неудачное обновление</li><li>Сам находит установленные системы, включая подтома BTRFS</li><li>Смена языка и клавиатуры с автоматическим переносом папок пользователя</li><li>Доступно на 8 языках (ES, EN, FR, PT, DE, IT, RU, RO)</li></ul>"
