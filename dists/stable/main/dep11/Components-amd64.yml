  - version: "2.0.0"
    type: stable
    unix-timestamp: 1765065600
    description:
      C: "<p>Major rewrite with modern architecture:</p><ul><li>Complete rewrite matching Soplos Welcome 2.0 architecture</li><li>Universal desktop support: XFCE, KDE Plasma, GNOME</li><li>Complete X11 and Wayland compatibility</li><li>GNU Gettext internationalization (8 languages at 100%)</li><li>Enhanced CHROOT recovery with improved partition detection</li><li>Full BTRFS subvolume support</li></ul><p>Patch (2025-12-08): Fixed application switch styling so widgets render consistently across desktop themes; added focused CSS overrides and prepared updated screenshots for the welcome flow.</p><p>Patch (2025-12-09): Removed KDE bookmark remapping logic from the language changer; the language switcher now deletes ~/.local/share/user-places.xbel before restarting the session so KDE/Dolphin regenerates localized bookmarks. This simplifies behavior in live images and avoids incorrect localized paths.</p><p>Patch (2025-12-09): GNOME / Wayland display improvements: robust GNOME Wayland resolution handling with GDK-first detection and a defensive D-Bus fallback; selects best refresh rate and applies temporary monitor changes suitable for Live ISOs.</p><p>Patch (2025-12-10): Restored legacy Chroot functionality with robust unmount script and exact mount sequencing; implemented cross-DE terminal support (XFCE, Plasma, GNOME) with specific priority lists; restored detailed progress UI and window footer.</p><p>Patch (2025-12-10 - Final): Complete quality review of all translations (ES, EN, DE, FR, PT, IT, RO, RU) ensuring 100% coverage, natural phrasing, and UI conciseness.</p>"
      de: "<p>Patch (2025-12-08): Fehler im Stil der Anwendungsschalter behoben, sodass Widgets in verschiedenen Desktop-Themen konsistent dargestellt werden; gezielte CSS-Overrides hinzugefügt und aktualisierte Screenshots für den Willkommensablauf vorbereitet.</p><p>Patch (2025-12-09): Entfernen der KDE-Lesezeichen-Remapping-Logik im Sprachumschalter; der Umschalter löscht jetzt ~/.local/share/user-places.xbel vor dem Neustart der Sitzung, damit KDE/Dolphin lokalisierte Lesezeichen regeneriert. Dies vereinfacht das Verhalten in Live-Images und vermeidet falsche lokalisierte Pfade.</p><p>Patch (2025-12-09): GNOME / Wayland Verbesserungen: robuster Umgang mit Auflösungen unter GNOME Wayland mit GDK-vorrangiger Erkennung und defensivem D-Bus-Fallback; wählt die beste Bildwiederholrate und wendet temporäre Monitoränderungen an, geeignet für Live-ISOs.</p><p>Patch (2025-12-10): Wiederherstellung der Legacy-Chroot-Funktionalität mit robustem Unmount-Skript und exakter Mount-Sequenz; Implementierung von Cross-DE-Terminal-Unterstützung (XFCE, Plasma, GNOME) mit spezifischen Prioritätslisten; Wiederherstellung der detaillierten Fortschritts-UI und der Fensterfußzeile.</p><p>Patch (2025-12-10 - Final): Vollständige Qualitätsprüfung aller Übersetzungen (ES, EN, DE, FR, PT, IT, RO, RU), Sicherstellung von 100% Abdeckung, natürlicher Formulierung und UI-Prägnanz.</p>"
      es: "<p>Parche (2025-12-08): Corregido el estilo de los interruptores de la aplicación para que los widgets se muestren de forma coherente en todos los temas de escritorio; añadidos overrides CSS focalizados y preparadas capturas actualizadas del flujo de bienvenida.</p><p>Parche (2025-12-09): Eliminada la lógica de remapeo de marcadores de KDE en el cambiador de idioma; el cambiador ahora borra ~/.local/share/user-places.xbel antes de reiniciar la sesión para que KDE/Dolphin regenere marcadores localizados. Esto simplifica el comportamiento en imágenes live y evita rutas localizadas incorrectas.</p><p>Parche (2025-12-09): Mejoras en GNOME / Wayland: manejo robusto de resoluciones en GNOME Wayland con detección prioritaria por GDK y respaldo defensivo vía D-Bus; selecciona la mejor tasa de refresco y aplica cambios temporales de monitor adecuados para ISOs Live.</p><p>Parche (2025-12-10): Restaurada la funcionalidad Chroot legacy con script de desmontaje robusto y secuencia de montaje exacta; implementado soporte de terminal multi-entorno (XFCE, Plasma, GNOME) con listas de prioridad específicas; restaurada la UI de progreso detallada y el pie de página de la ventana.</p><p>Parche (2025-12-10 - Final): Completada la revisión de calidad de todas las traducciones (ES, EN, DE, FR, PT, IT, RO, RU) asegurando cobertura del 100%, fraseo natural y concisión en la interfaz.</p>"
      fr: "<p>Correctif (2025-12-08) : Correction du style des commutateurs de l'application afin que les widgets s'affichent de manière cohérente sur tous les thèmes de bureau ; ajouts d'overrides CSS ciblés et captures d'écran mises à jour préparées pour le flux d'accueil.</p><p>Correctif (2025-12-09) : Suppression de la logique de remappage des favoris KDE dans le changeur de langue ; le changeur supprime désormais ~/.local/share/user-places.xbel avant de redémarrer la session afin que KDE/Dolphin régénère les favoris localisés. Cela simplifie le comportement sur les images live et évite des chemins localisés incorrects.</p><p>Correctif (2025-12-09) : Améliorations GNOME / Wayland : gestion robuste des résolutions sur GNOME Wayland avec détection prioritaire GDK et repli défensif via D-Bus ; sélection de la meilleure fréquence de rafraîchissement et application de changements temporaires d'écran adaptés aux Live ISO.</p><p>Correctif (2025-12-10) : Restauration de la fonctionnalité Chroot héritée avec un script de démontage robuste et une séquence de montage exacte ; prise en charge des terminaux multi-environnements (XFCE, Plasma, GNOME) avec des listes de priorité spécifiques ; restauration de l'interface de progression détaillée et du pied de page de la fenêtre.</p><p>Correctif (2025-12-10 - Final) : Révision complète de la qualité de toutes les traductions (ES, EN, DE, FR, PT, IT, RO, RU) assurant une couverture à 100 %, un phrasé naturel et la concision de l'interface.</p>"
      it: "<p>Patch (2025-12-08): Corretto lo stile degli interruttori dell'applicazione in modo che i widget vengano visualizzati in modo coerente tra i temi del desktop; aggiunti override CSS mirati e preparati screenshot aggiornati per il flusso di benvenuto.</p><p>Patch (2025-12-09): Rimosso il comportamento di remappatura dei segnalibri di KDE nel selettore di lingua; il selettore ora elimina ~/.local/share/user-places.xbel prima di riavviare la sessione in modo che KDE/Dolphin rigeneri i segnalibri localizzati. Questo semplifica il comportamento nelle immagini live ed evita percorsi localizzati errati.</p><p>Patch (2025-12-09): Miglioramenti GNOME / Wayland: gestione robusta delle risoluzioni su GNOME Wayland con rilevamento prioritario GDK e fallback difensivo via D-Bus; seleziona la migliore frequenza di aggiornamento e applica modifiche temporanee del monitor adatte alle Live ISO.</p><p>Patch (2025-12-10): Ripristinata la funzionalità Chroot legacy con script di smontaggio robusto e sequenza di montaggio esatta; implementato il supporto terminale multi-ambiente (XFCE, Plasma, GNOME) con elenchi di priorità specifici; ripristinata l'interfaccia di avanzamento dettagliata e il piè di pagina della finestra.</p><p>Patch (2025-12-10 - Finale): Completata la revisione della qualità di tutte le traduzioni (ES, EN, DE, FR, PT, IT, RO, RU) garantendo copertura al 100%, fraseggio naturale e concisione dell'interfaccia.</p>"
      pt: "<p>Patch (2025-12-08): Corrigido o estilo dos interruptores da aplicação para que os widgets sejam renderizados de forma consistente em todos os temas de ambiente de trabalho; adicionados overrides CSS e preparadas capturas atualizadas do fluxo de boas-vindas.</p><p>Patch (2025-12-09): Removida a lógica de remapeamento de marcadores do KDE no trocador de idioma; o trocador agora elimina ~/.local/share/user-places.xbel antes de reiniciar a sessão para que o KDE/Dolphin regenere marcadores localizados. Isso simplifica o comportamento em imagens live e evita caminhos localizados incorretos.</p><p>Patch (2025-12-09): Melhorias GNOME / Wayland: tratamento robusto de resoluções no GNOME Wayland com deteção prioritária via GDK e fallback defensivo via D-Bus; seleciona a melhor taxa de atualização e aplica alterações temporárias de monitor adequadas para ISOs Live.</p><p>Patch (2025-12-10): Restaurada a funcionalidade Chroot herdada com script de desmontagem robusto e sequência de montagem exata; implementado suporte de terminal multi-ambiente (XFCE, Plasma, GNOME) com listas de prioridade específicas; restaurada a UI de progresso detalhada e o rodapé da janela.</p><p>Patch (2025-12-10 - Final): Concluída a revisão de qualidade de todas as traduções (ES, EN, DE, FR, PT, IT, RO, RU) garantindo cobertura de 100%, fraseado natural e concisão da interface.</p>"
      ro: "<p>Patch (2025-12-08): Corectat stilul comutatoarelor aplicației astfel încât widget-urile să se afișeze în mod consecvent în toate temele desktop; adăugate override-uri CSS focalizate și pregătite capturi de ecran actualizate pentru fluxul de bun venit.</p><p>Patch (2025-12-09): Eliminată logica de remapare a semnelor de carte KDE în schimbătorul de limbă; schimbătorul acum șterge ~/.local/share/user-places.xbel înainte de repornirea sesiunii astfel încât KDE/Dolphin să regenereze semnele localizate. Aceasta simplifică comportamentul în imaginile live și evită căi localizate incorecte.</p><p>Patch (2025-12-09): Îmbunătățiri GNOME / Wayland: gestionare robustă a rezoluțiilor în GNOME Wayland cu detectare prioritară GDK și fallback defensiv via D-Bus; selectează cea mai bună rată de reîmprospătare și aplică modificări temporare ale monitorului, potrivite pentru ISO-uri Live.</p><p>Patch (2025-12-10): Restaurată funcționalitatea Chroot moștenită cu script robust de demontare și secvență exactă de montare; implementat suport terminal multi-mediu (XFCE, Plasma, GNOME) cu liste de prioritate specifice; restaurată interfața de progres detaliată și subsolul ferestrei.</p><p>Patch (2025-12-10 - Final): Finalizată revizuirea calității tuturor traducerilor (ES, EN, DE, FR, PT, IT, RO, RU) asigurând acoperire 100%, formulare naturală și concizie a interfeței.</p>"
      ru: "<p>Патч (2025-12-08): Исправлен стиль переключателей приложения, теперь виджеты отображаются одинаково во всех темах рабочего стола; добавлены целевые CSS-правки и подготовлены обновленные скриншоты приветственного интерфейса.</p><p>Патч (2025-12-09): Удалена логика переназначения закладок KDE в переключателе языка; переключатель теперь удаляет ~/.local/share/user-places.xbel перед перезапуском сессии, чтобы KDE/Dolphin регенерировал локализованные закладки. Это упрощает поведение в live-образах и избегает неверных локализованных путей.</p><p>Патч (2025-12-09): Улучшения GNOME / Wayland: надежная обработка разрешений в GNOME Wayland с приоритетной детекцией через GDK и защитным fallback через D-Bus; выбирает лучшую частоту обновления и применяет временные изменения монитора, подходящие для Live ISO.</p><p>Патч (2025-12-10): Восстановлена устаревшая функциональность Chroot с надежным скриптом размонтирования и точной последовательностью монтирования; реализована поддержка терминалов в разных DE (XFCE, Plasma, GNOME) со специальными списками приоритетов; восстановлен детальный интерфейс прогресса и \"футер\" окна.</p><p>Патч (2025-12-10 - Финал): Завершен полный аудит качества всех переводов (ES, EN, DE, FR, PT, IT, RO, RU), обеспечено 100% покрытие, естественность фраз и лаконичность интерфейса.</p>"
  - version: "1.1.6"
    type: stable
    unix-timestamp: 1764374400
    description:
      C: "<p>Universal disk detection in CHROOT: removed restrictive lsblk filter; detects all types (MMC, NVMe, USB, loop, etc.). Partition parsing switched to JSON with text fallback. Improved BTRFS subvolume detection.</p>"
      de: "<p>Universelle Datenträgererkennung in CHROOT: restriktiver lsblk-Filter entfernt; erkennt alle Typen (MMC, NVMe, USB, loop usw.). Partitionsauswertung auf JSON umgestellt mit Text-Fallback. Verbesserte BTRFS-Subvolume-Erkennung.</p>"
      es: "<p>Detección universal de discos en CHROOT: eliminado el filtro restrictivo de lsblk; detecta todos los tipos (MMC, NVMe, USB, loop, etc.). Análisis de particiones cambiado a JSON con fallback de texto. Mejorada la detección de subvolúmenes BTRFS.</p>"
      fr: "<p>Détection universelle des disques dans CHROOT : filtre lsblk restrictif supprimé ; détecte tous les types (MMC, NVMe, USB, loop, etc.). Analyse des partitions passée en JSON avec repli texte. Amélioration de la détection des sous-volumes BTRFS.</p>"
      it: "<p>Rilevamento universale dei dischi in CHROOT: rimosso il filtro restrittivo di lsblk; rileva tutti i tipi (MMC, NVMe, USB, loop, ecc.). Analisi delle partizioni passata a JSON con fallback testo. Rilevamento subvolumi BTRFS migliorato.</p>"
      pt: "<p>Deteção universal de discos em CHROOT: removido o filtro restritivo do lsblk; deteta todos os tipos (MMC, NVMe, USB, loop, etc.). Análise de partições alterada para JSON com fallback de texto. Melhorada a deteção de subvolumes BTRFS.</p>"
      ro: "<p>Detectare universală a discurilor în CHROOT: eliminat filtrul restrictiv lsblk; detectează toate tipurile (MMC, NVMe, USB, loop etc.). Analiza partițiilor trecută la JSON cu fallback text. Detectare îmbunătățită a subvolumelor BTRFS.</p>"
      ru: "<p>Универсальное обнаружение дисков в CHROOT: убран ограничивающий фильтр lsblk; обнаруживает все типы (MMC, NVMe, USB, loop и др.). Разбор разделов переведён на JSON с текстовым резервом. Улучшено обнаружение подтомов BTRFS.</p>"
