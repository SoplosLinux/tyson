Type: desktop-application
ID: "org.soplos.linuxinstaller"
Package: "soplos-linux-installer"
Name:
  C: "Soplos Linux Installer"
  de: "Soplos Linux Installationsprogramm"
  es: "Instalador de Soplos Linux"
  fr: "Installateur de Soplos Linux"
  it: "Installazione di Soplos Linux"
  pt: "Instalador do Soplos Linux"
  ro: "Programul de instalare Soplos Linux"
  ru: "Установщик Soplos Linux"
Summary:
  C: "Installer of Soplos Linux for Tyron, Tyson and Boro"
  de: "Installationsprogramm von Soplos Linux für Tyron, Tyson und Boro"
  es: "Instalador de Soplos Linux para Tyron, Tyson y Boro"
  fr: "Installateur de Soplos Linux pour Tyron, Tyson et Boro"
  it: "Programma di installazione di Soplos Linux per Tyron, Tyson e Boro"
  pt: "Instalador do Soplos Linux para Tyron, Tyson e Boro"
  ro: "Programul de instalare Soplos Linux pentru Tyron, Tyson și Boro"
  ru: "Установщик Soplos Linux для Tyron, Tyson и Boro"
Description:
  C: "<p>Soplos Linux Installer installs Tyron (Xfce), Tyson (Plasma) and Boro (GNOME) from the live session. It replaces Calamares and can be used with the keyboard only.</p><p>It chooses the boot loader, the kind of installation and the kernel for the processor, prepares the disk before touching it and shows a summary of everything that will be done.</p><ul><li>Boot loader of your choice: GRUB, systemd-boot or Limine on UEFI; GRUB or Limine on BIOS</li><li>Minimal, standard or complete installation, with the Soplos kernel for the processor: stock, BORE + NTsync, Zen, RT or X3D, latest or LTS</li><li>Erase the disk, install alongside another system or partition by hand: btrfs with the @ and @home subvolumes, ext4, xfs, F2FS or JFS, optional encryption and swap</li><li>Partitions of data kept as they are, with exFAT, NTFS or FAT32, mounted with nofail</li><li>The drivers of the hardware are detected and installed during the installation</li><li>A presentation of Soplos Linux while the system is installed</li><li>Usable with the keyboard only: Alt + the underlined letter, Alt+Left and Alt+Right, Alt+1 to Alt+7</li><li>Available in 8 languages (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  de: "<p>Das Soplos Linux Installationsprogramm installiert Tyron (Xfce), Tyson (Plasma) und Boro (GNOME) aus der Live-Sitzung. Es ersetzt Calamares und lässt sich nur mit der Tastatur bedienen.</p><p>Es wählt den Bootloader, die Art der Installation und den Kernel für den Prozessor, bereitet den Datenträger vor, bevor er angefasst wird, und zeigt eine Zusammenfassung von allem, was geschehen wird.</p><ul><li>Bootloader nach Wahl: GRUB, systemd-boot oder Limine auf UEFI; GRUB oder Limine auf BIOS</li><li>Minimale, Standard- oder vollständige Installation, mit dem Soplos-Kernel für den Prozessor: stock, BORE + NTsync, Zen, RT oder X3D, neueste Version oder LTS</li><li>Datenträger löschen, neben einem anderen System installieren oder von Hand partitionieren: btrfs mit den Subvolumes @ und @home, ext4, xfs, F2FS oder JFS, optionale Verschlüsselung und Swap</li><li>Datenpartitionen bleiben, wie sie sind, mit exFAT, NTFS oder FAT32, eingebunden mit nofail</li><li>Die Treiber der Hardware werden erkannt und während der Installation eingerichtet</li><li>Eine Vorstellung von Soplos Linux, während das System installiert wird</li><li>Nur mit der Tastatur bedienbar: Alt + der unterstrichene Buchstabe, Alt+Links und Alt+Rechts, Alt+1 bis Alt+7</li><li>In 8 Sprachen verfügbar (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  es: "<p>El Instalador de Soplos Linux instala Tyron (Xfce), Tyson (Plasma) y Boro (GNOME) desde la sesión Live. Sustituye a Calamares y se puede usar solo con el teclado.</p><p>Elige el cargador de arranque, el tipo de instalación y el kernel para el procesador, prepara el disco antes de tocarlo y muestra un resumen de todo lo que hará.</p><ul><li>Cargador de arranque a elegir: GRUB, systemd-boot o Limine en UEFI; GRUB o Limine en BIOS</li><li>Instalación mínima, estándar o completa, con el kernel Soplos para el procesador: stock, BORE + NTsync, Zen, RT o X3D, última versión o LTS</li><li>Borrar el disco, instalar junto a otro sistema o particionar a mano: btrfs con los subvolúmenes @ y @home, ext4, xfs, F2FS o JFS, cifrado y swap opcionales</li><li>Particiones de datos que se conservan tal cual, con exFAT, NTFS o FAT32, montadas con nofail</li><li>Los controladores del hardware se detectan y se instalan durante la instalación</li><li>Una presentación de Soplos Linux mientras se instala el sistema</li><li>Se puede usar solo con el teclado: Alt + la letra subrayada, Alt+Izquierda y Alt+Derecha, Alt+1 a Alt+7</li><li>Disponible en 8 idiomas (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  fr: "<p>L'installateur de Soplos Linux installe Tyron (Xfce), Tyson (Plasma) et Boro (GNOME) depuis la session live. Il remplace Calamares et peut s'utiliser uniquement au clavier.</p><p>Il choisit le chargeur d'amorçage, le type d'installation et le noyau pour le processeur, prépare le disque avant d'y toucher et affiche un résumé de tout ce qui sera fait.</p><ul><li>Chargeur d'amorçage au choix : GRUB, systemd-boot ou Limine en UEFI ; GRUB ou Limine en BIOS</li><li>Installation minimale, standard ou complète, avec le noyau Soplos pour le processeur : stock, BORE + NTsync, Zen, RT ou X3D, dernière version ou LTS</li><li>Effacer le disque, installer à côté d'un autre système ou partitionner à la main : btrfs avec les sous-volumes @ et @home, ext4, xfs, F2FS ou JFS, chiffrement et swap en option</li><li>Des partitions de données conservées telles quelles, avec exFAT, NTFS ou FAT32, montées avec nofail</li><li>Les pilotes du matériel sont détectés et installés pendant l'installation</li><li>Une présentation de Soplos Linux pendant l'installation du système</li><li>Utilisable uniquement au clavier : Alt + la lettre soulignée, Alt+Gauche et Alt+Droite, Alt+1 à Alt+7</li><li>Disponible en 8 langues (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  it: "<p>Il programma di installazione di Soplos Linux installa Tyron (Xfce), Tyson (Plasma) e Boro (GNOME) dalla sessione live. Sostituisce Calamares e si può usare solo con la tastiera.</p><p>Sceglie il caricatore di avvio, il tipo di installazione e il kernel per il processore, prepara il disco prima di toccarlo e mostra un riepilogo di tutto ciò che verrà fatto.</p><ul><li>Caricatore di avvio a scelta: GRUB, systemd-boot o Limine su UEFI; GRUB o Limine su BIOS</li><li>Installazione minima, standard o completa, con il kernel Soplos per il processore: stock, BORE + NTsync, Zen, RT o X3D, ultima versione o LTS</li><li>Cancellare il disco, installare accanto a un altro sistema o partizionare a mano: btrfs con i sottovolumi @ e @home, ext4, xfs, F2FS o JFS, cifratura e swap opzionali</li><li>Partizioni di dati mantenute così come sono, con exFAT, NTFS o FAT32, montate con nofail</li><li>I driver dell'hardware vengono rilevati e installati durante l'installazione</li><li>Una presentazione di Soplos Linux mentre il sistema viene installato</li><li>Si può usare solo con la tastiera: Alt + la lettera sottolineata, Alt+Sinistra e Alt+Destra, Alt+1 fino a Alt+7</li><li>Disponibile in 8 lingue (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  pt: "<p>O Instalador do Soplos Linux instala o Tyron (Xfce), o Tyson (Plasma) e o Boro (GNOME) a partir da sessão live. Substitui o Calamares e pode ser usado apenas com o teclado.</p><p>Escolhe o carregador de arranque, o tipo de instalação e o kernel para o processador, prepara o disco antes de lhe tocar e mostra um resumo de tudo o que vai ser feito.</p><ul><li>Carregador de arranque à escolha: GRUB, systemd-boot ou Limine em UEFI; GRUB ou Limine em BIOS</li><li>Instalação mínima, padrão ou completa, com o kernel Soplos para o processador: stock, BORE + NTsync, Zen, RT ou X3D, mais recente ou LTS</li><li>Apagar o disco, instalar ao lado de outro sistema ou particionar à mão: btrfs com os subvolumes @ e @home, ext4, xfs, F2FS ou JFS, encriptação e swap opcionais</li><li>Partições de dados mantidas como estão, com exFAT, NTFS ou FAT32, montadas com nofail</li><li>Os controladores do hardware são detetados e instalados durante a instalação</li><li>Uma apresentação do Soplos Linux enquanto o sistema é instalado</li><li>Pode ser usado apenas com o teclado: Alt + a letra sublinhada, Alt+Esquerda e Alt+Direita, Alt+1 a Alt+7</li><li>Disponível em 8 idiomas (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  ro: "<p>Programul de instalare Soplos Linux instalează Tyron (Xfce), Tyson (Plasma) și Boro (GNOME) din sesiunea live. Înlocuiește Calamares și poate fi folosit doar cu tastatura.</p><p>Alege bootloaderul, tipul de instalare și kernelul pentru procesor, pregătește discul înainte de a-l atinge și arată un rezumat al tot ce se va face.</p><ul><li>Bootloader la alegere: GRUB, systemd-boot sau Limine pe UEFI; GRUB sau Limine pe BIOS</li><li>Instalare minimă, standard sau completă, cu kernelul Soplos pentru procesor: stock, BORE + NTsync, Zen, RT sau X3D, cea mai recentă sau LTS</li><li>Șterge discul, instalează lângă alt sistem sau partiționează manual: btrfs cu subvolumele @ și @home, ext4, xfs, F2FS sau JFS, criptare și swap opționale</li><li>Partiții de date păstrate așa cum sunt, cu exFAT, NTFS sau FAT32, montate cu nofail</li><li>Driverele hardware sunt detectate și instalate în timpul instalării</li><li>O prezentare a Soplos Linux în timp ce sistemul este instalat</li><li>Poate fi folosit doar cu tastatura: Alt + litera subliniată, Alt+Stânga și Alt+Dreapta, Alt+1 până la Alt+7</li><li>Disponibil în 8 limbi (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
  ru: "<p>Установщик Soplos Linux ставит Tyron (Xfce), Tyson (Plasma) и Boro (GNOME) из live-сессии. Он заменяет Calamares и работает только с клавиатуры.</p><p>Он выбирает загрузчик, тип установки и ядро для процессора, готовит диск, прежде чем что-то тронуть, и показывает сводку всего, что будет сделано.</p><ul><li>Загрузчик на выбор: GRUB, systemd-boot или Limine на UEFI; GRUB или Limine на BIOS</li><li>Минимальная, стандартная или полная установка, с ядром Soplos для процессора: stock, BORE + NTsync, Zen, RT или X3D, последняя версия или LTS</li><li>Стереть диск, установить рядом с другой системой или разметить вручную: btrfs с подтомами @ и @home, ext4, xfs, F2FS или JFS, необязательные шифрование и swap</li><li>Разделы данных сохраняются как есть, с exFAT, NTFS или FAT32, монтируются с nofail</li><li>Драйверы оборудования определяются и устанавливаются во время установки</li><li>Показывается презентация Soplos Linux, пока идёт установка</li><li>Управление только с клавиатуры: Alt + подчёркнутая буква, Alt+Влево и Alt+Вправо, Alt+1 до Alt+7</li><li>Доступно на 8 языках (ES, EN, FR, PT, DE, IT, RO, RU)</li></ul>"
