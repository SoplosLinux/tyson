  de: "<p>Ein grafisches Tool zur Konfiguration der RGB-Beleuchtung der MSI-Tastatur mit zonenbasierter Farbsteuerung, Intensitätsanpassung und mehreren Beleuchtungsmodi.</p>"
  es: "<p>Una herramienta gráfica para configurar la iluminación RGB de teclados MSI con control de colores por zonas, ajuste de intensidad y múltiples modos de iluminación.</p>"
  fr: "<p>Un outil graphique pour configurer l'éclairage RGB du clavier MSI avec contrôle des couleurs par zone, réglage de l'intensité et plusieurs modes d'éclairage.</p>"
  it: "<p>Uno strumento grafico per configurare l'illuminazione RGB della tastiera MSI con controllo dei colori per zona, regolazione dell'intensità e molteplici modalità di illuminazione.</p>"
  pt: "<p>Uma ferramenta gráfica para configurar a iluminação RGB do teclado MSI com controle de cores por zona, ajuste de intensidade e vários modos de iluminação.</p>"
  ro: "<p>Un instrument grafic pentru configurarea iluminării RGB a tastaturii MSI cu control pe zone, ajustarea intensității și multiple moduri de iluminare.</p>"
  ru: "<p>Графический инструмент для настройки RGB-подсветки клавиатуры MSI с управлением цветом по зонам, регулировкой интенсивности и несколькими режимами подсветки.</p>"
