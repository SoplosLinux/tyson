Releases:
  - version: "2.0.3-1"
    type: stable
    unix-timestamp: 1789516800
    description:
      de: "<p>GPG-Schlüsselauflösung beim Modernisieren einer .list zu .sources korrigiert: ein generisches Schlüsselwort wie „debian\" konnte vor der eigentlichen Repository-Schlüsseldatei einen nicht verwandten offiziellen Debian-Schlüsselbund treffen und die Signaturprüfung brechen. DEB822-Blöcke mit einem einleitenden Kopfkommentar, die fälschlich als deaktiviert angezeigt wurden, korrigiert. Ein doppeltes vollständiges erneutes Einlesen aller Quelldateien beim Start behoben. GPG-Schlüssellisting, das bei Schlüsselbunden mit nicht UTF-8-kodierten UIDs abbrach, behoben.</p>"
      en: "<p>Fixed GPG key resolution when modernizing a .list to .sources: a generic keyword like \"debian\" could match an unrelated official Debian keyring before the repository's own key file, breaking signature verification. Fixed DEB822 stanzas with a leading header comment being shown as disabled. Fixed a duplicate full re-read of all source files on startup. Fixed GPG key listing aborting on keyrings with non-UTF-8 encoded UIDs.</p>"
      es: "<p>Corregida la resolución de claves GPG al modernizar un .list a .sources: una palabra clave genérica como \"debian\" podía coincidir con un llavero oficial de Debian sin relación antes que con la clave propia del repositorio, rompiendo la verificación de firma. Corregidas las secciones DEB822 con un comentario de cabecera que se mostraban como desactivadas. Corregida una relectura duplicada de todos los archivos de fuentes al iniciar. Corregido el listado de claves GPG que fallaba con llaveros con UID codificados en un formato distinto a UTF-8.</p>"
      fr: "<p>Correction de la résolution des clés GPG lors de la modernisation d'un .list en .sources : un mot-clé générique comme « debian » pouvait correspondre à un trousseau Debian officiel sans rapport avant la propre clé du dépôt, cassant la vérification de signature. Correction des sections DEB822 avec un commentaire d'en-tête affichées comme désactivées. Correction d'une double relecture complète des fichiers de sources au démarrage. Correction du listage des clés GPG qui échouait sur des trousseaux contenant des UID non encodés en UTF-8.</p>"
      it: "<p>Risolta la risoluzione delle chiavi GPG durante la modernizzazione di un .list in .sources: una parola chiave generica come \"debian\" poteva corrispondere a un portachiavi Debian ufficiale non correlato prima della chiave effettiva del repository, interrompendo la verifica della firma. Risolte le sezioni DEB822 con un commento di intestazione mostrate come disattivate. Risolta una doppia rilettura completa di tutti i file sorgente all'avvio. Risolto l'elenco delle chiavi GPG che si interrompeva con portachiavi contenenti UID non codificati in UTF-8.</p>"
      pt: "<p>Corrigida a resolução de chaves GPG ao modernizar um .list para .sources: uma palavra-chave genérica como \"debian\" podia corresponder a um chaveiro oficial do Debian sem relação antes da própria chave do repositório, quebrando a verificação de assinatura. Corrigidas seções DEB822 com um comentário de cabeçalho exibidas como desativadas. Corrigida uma releitura completa duplicada de todos os arquivos de fontes ao iniciar. Corrigida a listagem de chaves GPG que falhava em chaveiros com UIDs não codificados em UTF-8.</p>"
      ro: "<p>Corectată rezolvarea cheilor GPG la modernizarea unui .list în .sources: un cuvânt cheie generic precum „debian” putea coincide cu un inel de chei oficial Debian fără legătură înaintea cheii proprii a depozitului, întrerupând verificarea semnăturii. Corectate blocurile DEB822 cu un comentariu de antet afișate ca dezactivate. Corectată o recitire completă duplicată a tuturor fișierelor sursă la pornire. Corectată listarea cheilor GPG care eșua pe inele de chei cu UID-uri necodate UTF-8.</p>"
      ru: "<p>Исправлено разрешение ключей GPG при модернизации .list в .sources: общее ключевое слово, например «debian», могло совпасть с несвязанной официальной связкой ключей Debian раньше, чем с собственным ключом репозитория, нарушая проверку подписи. Исправлены блоки DEB822 с заголовочным комментарием, ошибочно отображавшиеся как отключённые. Исправлено дублирующее полное перечитывание всех файлов источников при запуске. Исправлен список ключей GPG, прерывавшийся на связках ключей с UID, закодированными не в UTF-8.</p>"
  - version: "2.0.3"
    type: stable
    unix-timestamp: 1783382400
    description:
      de: "<p>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</p>"
      en: "<p>Build dependency python3-all replaced with python3.</p>"
      es: "<p>Se ha sustituido la dependencia de compilación python3-all por python3.</p>"
      fr: "<p>La dépendance de compilation python3-all a été remplacée par python3.</p>"
      it: "<p>La dipendenza di compilazione python3-all è stata sostituita con python3.</p>"
      pt: "<p>A dependência de compilação python3-all foi substituída por python3.</p>"
      ro: "<p>Dependența de compilare python3-all a fost înlocuită cu python3.</p>"
      ru: "<p>Зависимость сборки python3-all заменена на python3.</p>"
  - version: "2.0.2-9"
    type: stable
    unix-timestamp: 1782172800
    description:
      C: "<p>New option in Sources Generator to include source packages (deb-src). Auto-detected from existing system repositories on startup.</p>"
      de: "<p>Neue Option im Quellen-Generator zum Einbeziehen von Quellpaketen (deb-src). Wird beim Start automatisch aus den System-Repositories erkannt.</p>"
      en: "<p>New option in Sources Generator to include source packages (deb-src). Auto-detected from existing system repositories on startup.</p>"
      es: "<p>Nueva opción en el Generador de fuentes para incluir paquetes fuente (deb-src). Se detecta automáticamente a partir de los repositorios del sistema al iniciar.</p>"
      fr: "<p>Nouvelle option dans le Générateur de sources pour inclure les paquets source (deb-src). Détection automatique à partir des dépôts système au démarrage.</p>"
      it: "<p>Nuova opzione nel Generatore di sorgenti per includere i pacchetti sorgente (deb-src). Rilevamento automatico dai repository di sistema all'avvio.</p>"
      pt: "<p>Nova opção no Gerador de fontes para incluir pacotes fonte (deb-src). Detectado automaticamente a partir dos repositórios do sistema ao iniciar.</p>"
      ro: "<p>Opțiune nouă în Generatorul de surse pentru a include pachete sursă (deb-src). Detectat automat din depozitele sistemului la pornire.</p>"
      ru: "<p>Новая опция в генераторе источников для включения пакетов с исходным кодом (deb-src). Автоматически определяется из системных репозиториев при запуске.</p>"
  - version: "2.0.2-8"
    type: stable
    unix-timestamp: 1779148800
    description:
      C: "<p>Documentation-only release: version history corrected across the release page, CHANGELOG and metainfo. All 1.0.x timestamps updated to match the dates extracted from the internal CHANGELOG of each official package.</p>"
      de: "<p>Nur-Dokumentations-Release: Versionshistorie auf der Releases-Seite, im CHANGELOG und Metainfo korrigiert. Alle Zeitstempel der 1.0.x-Serie entsprechend den Daten aus dem internen CHANGELOG jedes offiziellen Pakets aktualisiert.</p>"
      en: "<p>Documentation-only release: version history corrected across the release page, CHANGELOG and metainfo. All 1.0.x timestamps updated to match the dates extracted from the internal CHANGELOG of each official package.</p>"
      es: "<p>Publicación solo de documentación: historial de versiones corregido en la página de lanzamientos, CHANGELOG y metainfo. Todas las fechas de la serie 1.0.x actualizadas para coincidir con las fechas extraídas del CHANGELOG interno de cada paquete oficial.</p>"
      fr: "<p>Version documentation uniquement : historique des versions corrigé dans la page des versions, CHANGELOG et metainfo. Toutes les dates de la série 1.0.x mises à jour pour correspondre aux dates extraites du CHANGELOG interne de chaque paquet officiel.</p>"
      it: "<p>Versione solo documentazione: cronologia delle versioni corretta nella pagina delle versioni, CHANGELOG e metainfo. Tutti i timestamp della serie 1.0.x aggiornati per corrispondere alle date estratte dal CHANGELOG interno di ogni pacchetto ufficiale.</p>"
      pt: "<p>Versão apenas de documentação: histórico de versões corrigido na página de lançamentos, CHANGELOG e metainfo. Todas as datas da série 1.0.x atualizadas para corresponder às datas extraídas do CHANGELOG interno de cada pacote oficial.</p>"
      ro: "<p>Lansare doar de documentație: istoricul versiunilor corectat în pagina de lansări, CHANGELOG și metainfo. Toate marcajele temporale ale seriei 1.0.x actualizate pentru a corespunde datelor extrase din CHANGELOG-ul intern al fiecărui pachet oficial.</p>"
      ru: "<p>Только документационный выпуск: история версий исправлена на странице релизов, в CHANGELOG и metainfo. Все временные метки серии 1.0.x обновлены в соответствии с датами, извлечёнными из внутреннего CHANGELOG каждого официального пакета.</p>"
  - version: "2.0.2-7"
    type: stable
    unix-timestamp: 1777507200
    description:
      C: "<p>Simplified the footer UI text to match the modern Soplos standard layout.</p>"
      de: "<p>Der Text der Statusleiste wurde vereinfacht, um dem modernen Soplos-Standardlayout zu entsprechen.</p>"
      en: "<p>Simplified the footer UI text to match the modern Soplos standard layout.</p>"
      es: "<p>Se ha simplificado el texto de la barra de estado para coincidir con el diseño estándar de Soplos.</p>"
      fr: "<p>Le texte de la barre d'état a été simplifié pour correspondre à la disposition standard moderne de Soplos.</p>"
      it: "<p>Il testo della barra di stato è stato semplificato per corrispondere al layout standard moderno di Soplos.</p>"
      pt: "<p>O texto da barra de status foi simplificado para corresponder ao layout padrão moderno do Soplos.</p>"
      ro: "<p>Textul barei de stare a fost simplificat pentru a se potrivi cu aspectul standard modern Soplos.</p>"
      ru: "<p>Текст строки состояния был упрощён, чтобы соответствовать современному стандартному макету Soplos.</p>"
  - version: "2.0.2-6"
    type: stable
    unix-timestamp: 1774310400
    description:
      de: "<p>Aktualisieren-Schaltfläche behoben. Repositories-Tab aktualisiert sich sofort nach der Generierung. Jede Suite erhält nun eine eigene unabhängige .sources-Datei für individuelle Suite-Steuerung.</p>"
      en: "<p>Fixed refresh button always returning stale cached data. Repositories tab now refreshes immediately after generating new sources. Each suite now gets its own independent .sources file for individual toggle control per suite.</p>"
      es: "<p>Corregido el botón de refrescar que devolvía datos cacheados. La pestaña Repositorios ahora se actualiza inmediatamente tras generar fuentes. Cada suite tiene ahora su propio archivo .sources independiente para control individual por suite.</p>"
      fr: "<p>Correction du bouton Actualiser. L'onglet Dépôts se rafraîchit immédiatement après la génération. Chaque suite dispose désormais de son propre fichier .sources indépendant pour un contrôle individuel par suite.</p>"
      it: "<p>Corretto il pulsante Aggiorna. La scheda Archivi si aggiorna immediatamente dopo la generazione. Ogni suite ora ha il proprio file .sources indipendente per il controllo individuale per suite.</p>"
      pt: "<p>Corrigido o botão Atualizar. A aba Repositórios atualiza imediatamente após gerar fontes. Cada suite tem agora o seu próprio ficheiro .sources independente para controlo individual por suite.</p>"
      ro: "<p>Remediat butonul Reîmprospătare. Fila Depozite se actualizează imediat după generare. Fiecare suite are acum propriul fișier .sources independent pentru control individual pe suite.</p>"
      ru: "<p>Исправлена кнопка обновления. Вкладка Репозитории обновляется сразу после генерации. Каждый suite теперь имеет собственный независимый файл .sources для индивидуального управления.</p>"
  - version: "2.0.2-5"
    type: stable
    unix-timestamp: 1773964800
    description:
      de: "<p>Standardisierter Über-Dialog unter XFCE, GNOME und KDE: dunkler Hintergrund, Schaltflächenhöhen und Pill-Button-Stil sind jetzt identisch mit anderen Soplos-Apps. App-Symbol auf 48×48 Pixel standardisiert. Einstellung gtk-application-prefer-dark-theme entfernt, die subtile Farbunterschiede verursachte.</p>"
      en: "<p>Standardized the About dialog across XFCE, GNOME, and KDE: dark background, button heights, and pill button styling are now identical to all other Soplos apps. App icon standardized to 48×48 pixels. Removed gtk-application-prefer-dark-theme setting that caused subtle color differences.</p>"
      es: "<p>Estandarizado el diálogo Acerca de en XFCE, GNOME y KDE: fondo oscuro, alturas de botones y estilo de botones píldora son ahora idénticos a las demás aplicaciones Soplos. Icono de la aplicación estandarizado a 48×48 píxeles. Eliminado el parámetro gtk-application-prefer-dark-theme que causaba diferencias de color sutiles.</p>"
      fr: "<p>Standardisation du dialogue À propos sous XFCE, GNOME et KDE : fond sombre, hauteurs des boutons et style des boutons pilule sont désormais identiques aux autres applications Soplos. Icône standardisée à 48×48 pixels. Suppression du paramètre gtk-application-prefer-dark-theme qui causait de légères différences de couleur.</p>"
      it: "<p>Finestra Info standardizzata su XFCE, GNOME e KDE: sfondo scuro, altezze dei pulsanti e stile dei pulsanti pill sono ora identici alle altre app Soplos. Icona standardizzata a 48×48 pixel. Rimossa l'impostazione gtk-application-prefer-dark-theme che causava differenze di colore.</p>"
      pt: "<p>Padronizado o diálogo Sobre no XFCE, GNOME e KDE: fundo escuro, alturas de botões e estilo de botões pílula são agora idênticos às demais aplicações Soplos. Ícone padronizado para 48×48 pixels. Removida a configuração gtk-application-prefer-dark-theme que causava diferenças de cor sutis.</p>"
      ro: "<p>Dialogul Despre standardizat în XFCE, GNOME și KDE: fundal întunecat, înălțimi ale butoanelor și stilul butoanelor pill sunt acum identice cu alte aplicații Soplos. Pictogramă standardizată la 48×48 pixeli. Eliminată setarea gtk-application-prefer-dark-theme care cauza diferențe de culoare.</p>"
      ru: "<p>Диалог «О программе» стандартизирован в XFCE, GNOME и KDE: тёмный фон, высота кнопок и стиль кнопок-таблеток теперь идентичны другим приложениям Soplos. Значок стандартизирован до 48×48 пикселей. Удалена настройка gtk-application-prefer-dark-theme, вызывавшая незначительные различия цветов.</p>"
  - version: "2.0.2-4"
    type: stable
    unix-timestamp: 1773964800
    description:
      de: "<p>Hinzugefügt: umgekehrte Tab-Navigation Strg+Umschalt+Tab, Über-Dialog mit F1, GNOME-Menü-Über-Aktion und GPG-Schlüsselsuche in allen Standardverzeichnissen. Behoben: HeaderBar-CSS auf GNOME, doppeltes Lesen von Repositories beim Start, nackte except-Klauseln und toter Code entfernt.</p>"
      en: "<p>Added Ctrl+Shift+Tab reverse tab navigation, F1 About dialog, GNOME application menu About action, and GPG key search across all standard directories. Fixed HeaderBar CSS on GNOME, double repository reads on startup, bare except clauses, and removed dead code.</p>"
      es: "<p>Añadida navegación inversa con Ctrl+Shift+Tab, diálogo Acerca de con F1, acción Acerca de del menú GNOME y búsqueda de clave GPG en todos los directorios estándar. Corregido el CSS del HeaderBar en GNOME, la doble lectura de repositorios al inicio, excepciones desnudas y eliminado código muerto.</p>"
      fr: "<p>Ajout de la navigation inverse Ctrl+Shift+Tab, du dialogue À propos avec F1, de l'action À propos du menu GNOME et de la recherche de clé GPG dans tous les répertoires standard. Correction du CSS HeaderBar sur GNOME, des lectures doubles de dépôts au démarrage, des clauses except nues et suppression du code mort.</p>"
      it: "<p>Aggiunta navigazione inversa Ctrl+Shift+Tab, finestra Info con F1, azione Info del menu GNOME e ricerca chiave GPG in tutte le directory standard. Corretti CSS HeaderBar su GNOME, doppia lettura dei repository all'avvio, clausole except nude e rimosso codice morto.</p>"
      pt: "<p>Adicionada navegação inversa Ctrl+Shift+Tab, diálogo Sobre com F1, ação Sobre do menu GNOME e busca de chave GPG em todos os diretórios padrão. Corrigido CSS do HeaderBar no GNOME, leituras duplas de repositórios na inicialização, cláusulas except sem tipo e removido código morto.</p>"
      ro: "<p>Adăugată navigare inversă Ctrl+Shift+Tab, dialog Despre cu F1, acțiunea Despre din meniul GNOME și căutarea cheii GPG în toate directoarele standard. Corectate CSS HeaderBar pe GNOME, citiri duble ale depozitelor la pornire, clauze except goale și eliminat codul mort.</p>"
      ru: "<p>Добавлена обратная навигация Ctrl+Shift+Tab, диалог «О программе» по F1, действие «О программе» в меню GNOME и поиск GPG-ключей во всех стандартных директориях. Исправлены CSS HeaderBar в GNOME, двойное чтение репозиториев при запуске, голые except-клаузулы и удалён мёртвый код.</p>"
  - version: "2.0.2-3"
    type: stable
    unix-timestamp: 1773360000
    description:
      de: "<p>Integrierte Repository-Suche, DEB822-Modernisierung mit automatischen Backups, einheitliche Rechteverwaltung und vollständige manuelle Internationalisierung in 8 Sprachen.</p>"
      en: "<p>Integrated repository search, DEB822 modernization with automatic backups, unified privilege management, and complete manual internationalization across 8 languages.</p>"
      es: "<p>Búsqueda integrada de repositorios, modernización a DEB822 con backups automáticos, gestión unificada de privilegios e internacionalización manual completa en 8 idiomas.</p>"
      fr: "<p>Recherche de dépôts intégrée, modernisation en DEB822 avec sauvegardes automatiques, gestion unifiée des privilèges et internationalisation manuelle complète en 8 langues.</p>"
      it: "<p>Ricerca integrata dei repository, modernizzazione in DEB822 con backup automatici, gestione unificata dei privilegi e internazionalizzazione manuale completa in 8 lingue.</p>"
      pt: "<p>Pesquisa integrada de repositórios, modernização para DEB822 com backups automáticos, gestão unitária de privilégios e internacionalização manual completa em 8 idiomas.</p>"
      ro: "<p>Căutare integrată a depozitelor, modernizare la DEB822 cu copii de rezervă automate, gestionarea unificată a privilegiilor și internaționalizare manuală completă în 8 limbi.</p>"
      ru: "<p>Интегрированный поиск репозиториев, модернизация в DEB822 с автоматическим резервным копированием, унифицированное управление привилегиями и полная ручная интернационализация на 8 языках.</p>"
  - version: "2.0.2-2"
    type: stable
    unix-timestamp: 1773273600
    description:
      de: "<p>Duplizierte Komponenten in DEB822-Quelldateien behoben und die Repository-Listendarstellung verbessert.</p>"
      en: "<p>Fixed duplicated components in DEB822 sources files and improved repository list UI.</p>"
      es: "<p>Corregida la duplicación de componentes en archivos sources DEB822 y mejorada la interfaz de lista de repositorios.</p>"
      fr: "<p>Correction de la duplication des composants dans les fichiers sources DEB822 et amélioration de l'interface de la liste des dépôts.</p>"
      it: "<p>Corretta la duplicazione dei componenti nei file sources DEB822 e migliorata l'interfaccia dell'elenco repository.</p>"
      pt: "<p>Corrigida a duplicação de componentes em arquivos sources DEB822 e melhorada a interface da lista de repositórios.</p>"
      ro: "<p>Corectată duplicarea componentelor în fișierele sources DEB822 și îmbunătățită interfața listei de depozite.</p>"
      ru: "<p>Исправлено дублирование компонентов в файлах sources DEB822 и улучшен интерфейс списка репозиториев.</p>"
  - version: "2.0.2-1"
    type: stable
    unix-timestamp: 1773100800
    description:
      de: "<p>Repository-Erkennung für Spiegel und regionale Repositories korrigiert. Legacy-Parser korrigiert, um auskommentierte Repositories korrekt zu erkennen. pkexec-Aufrufe optimiert, um Passwortabfragen zu reduzieren.</p>"
      en: "<p>Fixed repository detection for mirrors and regional repositories. Fixed legacy parser to correctly detect commented-out repositories. Optimized pkexec calls to reduce password prompts.</p>"
      es: "<p>Corregida la detección de repositorios en mirrors y repositorios regionales. Corregido el parser legado para detectar correctamente repositorios comentados. Optimizadas las llamadas a pkexec para reducir solicitudes de contraseña.</p>"
      fr: "<p>Correction de la détection des dépôts pour les miroirs et dépôts régionaux. Correction du parseur hérité pour détecter correctement les dépôts commentés. Optimisation des appels pkexec pour réduire les demandes de mot de passe.</p>"
      it: "<p>Corretta la rilevazione dei repository per mirror e repository regionali. Corretto il parser legacy per rilevare correttamente i repository commentati. Ottimizzate le chiamate pkexec per ridurre le richieste di password.</p>"
      pt: "<p>Corrigida a detecção de repositórios para espelhos e repositórios regionais. Corrigido o parser legado para detectar corretamente repositórios comentados. Otimizadas as chamadas pkexec para reduzir solicitações de senha.</p>"
      ro: "<p>Corectată detectarea depozitelor pentru oglinzi și depozite regionale. Corectat parserul legacy pentru detectarea corectă a depozitelor comentate. Optimizate apelurile pkexec pentru reducerea solicitărilor de parolă.</p>"
      ru: "<p>Исправлено обнаружение репозиториев для зеркал и региональных репозиториев. Исправлен устаревший парсер для корректного обнаружения закомментированных репозиториев. Оптимизированы вызовы pkexec для уменьшения запросов пароля.</p>"
  - version: "2.0.2"
    type: stable
    unix-timestamp: 1767916800
    description:
      de: "<p>Dokumentations-Release: vollständige Handbuchseite und Debian-Copyright-Datei hinzugefügt.</p>"
      en: "<p>Documentation release: added complete manual page and Debian copyright file.</p>"
      es: "<p>Versión de documentación: añadida página de manual completa y archivo copyright de Debian.</p>"
      fr: "<p>Version de documentation : ajout de la page de manuel complète et du fichier copyright Debian.</p>"
      it: "<p>Rilascio documentazione: aggiunta pagina di manuale completa e file copyright Debian.</p>"
      pt: "<p>Versão de documentação: adicionada página de manual completa e arquivo copyright Debian.</p>"
      ro: "<p>Versiune documentație: adăugată pagina de manual completă și fișierul copyright Debian.</p>"
      ru: "<p>Релиз документации: добавлена полная страница руководства и файл авторских прав Debian.</p>"
  - version: "2.0.1"
    type: stable
    unix-timestamp: 1767312000
    description:
      de: "<p>Vollständige Neufassung des Geschwindigkeitstests mit echter TCP-Latenzmessung, größeren Downloads (2-10 MB), erhöhtem Parallelismus (6 Worker) und dynamischen Echtzeit-Fortschrittsbalken. Sources Generator erkennt jetzt den echten Systemstatus. Backports-Datei-Entfernung beim Deaktivieren korrigiert. Übersetzungsfunktionsfehler im Dateimanager behoben.</p>"
      en: "<p>Complete speed test rewrite with real TCP latency measurement, larger downloads (2-10 MB), increased parallelism (6 workers) and dynamic real-time progress bars. Sources Generator now detects real system state. Fixed backports file removal when disabled. Fixed translation function error in file manager.</p>"
      es: "<p>Reescritura completa del test de velocidad con medición real de latencia TCP, descargas más grandes (2-10 MB), mayor paralelismo (6 workers) y barras de progreso dinámicas en tiempo real. El Generador de Sources ahora detecta el estado real del sistema. Corregida la eliminación del archivo de backports al desactivarlo. Corregido error de función de traducción en el gestor de archivos.</p>"
      fr: "<p>Réécriture complète du test de vitesse avec mesure réelle de la latence TCP, téléchargements plus importants (2-10 Mo), parallélisme accru (6 workers) et barres de progression dynamiques en temps réel. Le Générateur de Sources détecte désormais l'état réel du système. Correction de la suppression du fichier backports. Correction de l'erreur de fonction de traduction dans le gestionnaire de fichiers.</p>"
      it: "<p>Riscrittura completa del test di velocità con misurazione reale della latenza TCP, download più grandi (2-10 MB), maggior parallelismo (6 worker) e barre di avanzamento dinamiche in tempo reale. Il Generatore di Sources ora rileva lo stato reale del sistema. Corretta la rimozione del file backports. Corretto errore della funzione di traduzione nel gestore file.</p>"
      pt: "<p>Reescrita completa do teste de velocidade com medição real de latência TCP, downloads maiores (2-10 MB), maior paralelismo (6 workers) e barras de progresso dinâmicas em tempo real. O Gerador de Sources agora detecta o estado real do sistema. Corrigida a remoção do arquivo de backports ao desativá-lo. Corrigido erro de função de tradução no gerenciador de arquivos.</p>"
      ro: "<p>Rescrierea completă a testului de viteză cu măsurarea reală a latenței TCP, descărcări mai mari (2-10 MB), paralelism crescut (6 workeri) și bare de progres dinamice în timp real. Generatorul Sources detectează acum starea reală a sistemului. Corectată eliminarea fișierului backports. Corectată eroarea funcției de traducere în managerul de fișiere.</p>"
      ru: "<p>Полная переработка теста скорости с реальным измерением задержки TCP, более крупными загрузками (2-10 МБ), увеличенным параллелизмом (6 воркеров) и динамическими индикаторами прогресса в реальном времени. Генератор Sources теперь определяет реальное состояние системы. Исправлено удаление файла backports. Исправлена ошибка функции перевода в файловом менеджере.</p>"
  - version: "2.0.0"
    type: stable
    unix-timestamp: 1765584000
    description:
      de: "<p>Größere Neufassung mit moderner, modularer Architektur für Desktop-übergreifende Kompatibilität (GNOME, KDE Plasma, XFCE). Einheitlicher Branch, der die früheren separaten Versionen Tyson (KDE) und Tyron (XFCE) ersetzt. Enthält vollständige Internationalisierung für 8 Sprachen, CSS-basierte Theme-Engine, verbesserte GPG-Schlüsselverwaltung, bessere DEB822-Unterstützung, in den Sources-Generator integrierten Geschwindigkeitstest und vollständige Wayland/X11-Kompatibilität.</p>"
      en: "<p>Major rewrite with modern, modular architecture for cross-desktop compatibility (GNOME, KDE Plasma, XFCE). Unified branch replacing the former Tyson (KDE) and Tyron (XFCE) separate releases. Includes complete internationalization for 8 languages, CSS-based theming engine, improved GPG key management, enhanced DEB822 format support, mirror speed test integrated into the Sources Generator tab, and full Wayland/X11 compatibility.</p>"
      es: "<p>Reescritura mayor con arquitectura moderna y modular para compatibilidad multiescritor (GNOME, KDE Plasma, XFCE). Rama unificada que reemplaza las anteriores versiones separadas Tyson (KDE) y Tyron (XFCE). Incluye internacionalización completa para 8 idiomas, motor de temas CSS, gestión de claves GPG mejorada, mejor soporte DEB822, test de velocidad integrado en la pestaña Generador de Sources y compatibilidad total Wayland/X11.</p>"
      fr: "<p>Réécriture majeure avec une architecture moderne et modulaire pour la compatibilité multi-bureau (GNOME, KDE Plasma, XFCE). Branche unifiée remplaçant les anciennes versions séparées Tyson (KDE) et Tyron (XFCE). Comprend une internationalisation complète pour 8 langues, un moteur de thèmes CSS, une gestion améliorée des clés GPG, un meilleur support DEB822, un test de vitesse intégré dans l'onglet Générateur de Sources et une compatibilité totale Wayland/X11.</p>"
      it: "<p>Riscrittura maggiore con architettura moderna e modulare per compatibilità multi-desktop (GNOME, KDE Plasma, XFCE). Branch unificato che sostituisce le precedenti versioni separate Tyson (KDE) e Tyron (XFCE). Include internazionalizzazione completa per 8 lingue, motore temi CSS, gestione chiavi GPG migliorata, migliore supporto DEB822, test di velocità integrato nella scheda Generatore di Sources e compatibilità totale Wayland/X11.</p>"
      pt: "<p>Reescrita maior com arquitetura moderna e modular para compatibilidade multi-desktop (GNOME, KDE Plasma, XFCE). Ramo unificado que substitui as anteriores versões separadas Tyson (KDE) e Tyron (XFCE). Inclui internacionalização completa para 8 idiomas, motor de temas CSS, gestão de chaves GPG melhorada, melhor suporte DEB822, teste de velocidade integrado na aba Gerador de Sources e compatibilidade total Wayland/X11.</p>"
      ro: "<p>Rescrierea majoră cu arhitectură modernă și modulară pentru compatibilitate multi-desktop (GNOME, KDE Plasma, XFCE). Ramură unificată care înlocuiește versiunile separate anterioare Tyson (KDE) și Tyron (XFCE). Include internaționalizare completă pentru 8 limbi, motor de teme CSS, gestionare îmbunătățită a cheilor GPG, suport DEB822 extins, test de viteză integrat în fila Generator Sources și compatibilitate totală Wayland/X11.</p>"
      ru: "<p>Крупная переработка с современной модульной архитектурой для кросс-десктопной совместимости (GNOME, KDE Plasma, XFCE). Единая ветка, заменяющая раздельные версии Tyson (KDE) и Tyron (XFCE). Включает полную интернационализацию для 8 языков, CSS-движок тем, улучшенное управление GPG-ключами, расширенную поддержку DEB822, тест скорости зеркал в генераторе Sources и полную совместимость с Wayland/X11.</p>"
