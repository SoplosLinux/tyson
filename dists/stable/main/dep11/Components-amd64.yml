Type: desktop-application
ID: "org.soplos.store"
Package: "soplos-store"
Name:
  C: "Soplos Store"
  de: "Soplos Store"
  en: "Soplos Store"
  es: "Soplos Store"
  fr: "Soplos Store"
  it: "Soplos Store"
  pt: "Soplos Store"
