Description:
  C: |-
    <p>A graphical tool to configure MSI keyboard RGB lighting with zone-based color control, intensity adjustment and multiple lighting modes.</p>
  es: |-
    <p>Una herramienta gráfica para configurar la iluminación RGB de teclados MSI con control de colores por zonas, ajuste de intensidad y múltiples modos de iluminación.</p>
  fr: |-
    <p>Un outil graphique pour configurer l'éclairage RGB du clavier MSI avec contrôle des couleurs par zone, réglage de l'intensité et plusieurs modes d'éclairage.</p>
  pt: |-
    <p>Uma ferramenta gráfica para configurar a iluminação RGB do teclado MSI com controle de cores por zona, ajuste de intensidade e vários modos de iluminação.</p>
  de: |-
    <p>Ein grafisches Tool zur Konfiguration der RGB-Beleuchtung der MSI-Tastatur mit zonenbasierter Farbsteuerung, Intensitätsanpassung und mehreren Beleuchtungsmodi.</p>
  it: |-
    <p>Uno strumento grafico per configurare l'illuminazione RGB della tastiera MSI con controllo dei colori per zona, regolazione dell'intensità e molteplici modalità di illuminazione.</p>
  ru: |-
    <p>Графический инструмент для настройки RGB-подсветки клавиатуры MSI с управлением цветом по зонам, регулировкой интенсивности и несколькими режимами подсветки.</p>
  ro: |-
    <p>Un instrument grafic pentru configurarea iluminării RGB a tastaturii MSI cu control pe zone, ajustarea intensității și multiple moduri de iluminare.</p>
