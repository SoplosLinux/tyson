  - version: "1.0.2-9"
    type: stable
    unix-timestamp: 1782691200
    description:
      C: "<p>Security and logic fix: Protected active Soplos kernel DKMS modules (NVIDIA, v4l2loopback) from being incorrectly flagged as orphans.</p><ul><li>Fixed: DKMS orphan scanner incorrectly handled Soplos kernel versions causing false positives</li></ul>"
      de: "<p>Sicherheits- und Logik-Fix: Schutz aktiver Soplos-Kernel-DKMS-Module (NVIDIA, v4l2loopback) vor fälschlicher Markierung als Waisen.</p><ul><li>Behoben: Der DKMS-Waisen-Scanner behandelte Soplos-Kernel-Versionen falsch, was zu falschen Positiven führte</li></ul>"
      es: "<p>Corrección de seguridad y lógica: Protección de los módulos DKMS activos del kernel de Soplos (NVIDIA, v4l2loopback) para evitar que se marquen incorrectamente como huérfanos.</p><ul><li>Corregido: el escáner de huérfanos DKMS manejaba incorrectamente las versiones del kernel de Soplos causando falsos positivos</li></ul>"
      fr: "<p>Correction de sécurité et de logique : Protection des modules DKMS actifs du noyau Soplos (NVIDIA, v4l2loopback) pour éviter qu'ils ne soient signalés à tort comme orphelins.</p><ul><li>Corrigé : le scanner d'orphelins DKMS gérait mal les versions du noyau Soplos, causant des faux positifs</li></ul>"
      it: "<p>Correzione di sicurezza e logica: Protezione dei moduli DKMS attivi del kernel Soplos (NVIDIA, v4l2loopback) per evitare che vengano erroneamente segnalati come orfani.</p><ul><li>Corretto: lo scanner degli orfani DKMS gestiva in modo errato le versioni del kernel Soplos causando falsi positivi</li></ul>"
      pt: "<p>Correção de segurança e lógica: Proteção de módulos DKMS ativos do kernel Soplos (NVIDIA, v4l2loopback) para evitar que sejam marcados incorretamente como órfãos.</p><ul><li>Corrigido: o scanner de órfãos DKMS lidava incorretamente com versões do kernel Soplos, causando falsos positivos</li></ul>"
      ro: "<p>Remediere de securitate și logică: Protejarea modulelor DKMS active ale nucleului Soplos (NVIDIA, v4l2loopback) pentru a preveni marcarea incorectă a acestora ca fiind orfane.</p><ul><li>Remediat: scanerul de orfani DKMS a tratat incorect versiunile de nucleu Soplos, cauzând rezultate fals pozitive</li></ul>"
      ru: "<p>Исправление безопасности и логики: Защита активных DKMS-модулей ядра Soplos (NVIDIA, v4l2loopback) от ошибочной пометки как сирот.</p><ul><li>Исправлено: сканер осиротевших модулей DKMS неправильно обрабатывал версии ядра Soplos, вызывая ложные срабатывания</li></ul>"
  - version: "1.0.2-8"
    type: stable
    unix-timestamp: 1782691200
    description:
      C: "<p>Bug fix release: 10 correctness bugs fixed across the kernel scanner, DKMS orphan detector, APT cache cleaner, hardware detection label, locale size scanner, modprobe detection, and driver removal flow.</p><ul><li>Fixed: kernel active detection used substring match — old kernel could be marked as active and protected from removal</li><li>Fixed: _clean_file in root_helper mishandled commented module lines — orphaned comments not removed, valid comments incorrectly deleted</li><li>Fixed: clean_module_refs and apt_autoremove dispatched concurrently to root_helper, causing JSON protocol corruption on the stdin/stdout pipe</li><li>Fixed: hardware detection label included non-GPU PCI vendors (e.g. virtio devices on KVM hosts shown as QEMU/KVM GPU)</li><li>Fixed: VM guest type (VirtualBox, VMware, Hyper-V etc.) was never shown in the Detected hardware label</li><li>Fixed: locale sizes reported as 0 KB when du returned exit code 1 on partial read errors — locales disappeared from the cleanup list</li><li>Fixed: DKMS orphan scanner only checked the running kernel — compiled modules for other installed kernels were never detected</li><li>Fixed: apt_purge was dispatched after a failed DKMS cleanup step, leaving the system with purged packages but an outdated initrd. Also fixed: rebuild_initrd is now True when APT packages follow a successful DKMS step</li><li>Fixed: module name detection in modprobe.d used plain substring — 'wl' matched inside 'brcmwl', potentially deleting valid config files. Now uses word-boundary regex</li><li>Fixed: service/autostart files flagged as orphaned when a co-owning package was still installed — vboxadd.service appeared as orphan when virtualbox-guest-utils was removed but virtualbox-guest-dkms was still present, causing DKMS to keep compiling vboxguest</li><li>Fixed: CPU temperature always showed 20°C on boards where thermal_zone0 maps to acpitz (a stub driver). The overview panel now searches /sys/class/hwmon/ prioritizing k10temp (AMD Tctl), then coretemp (Intel Package/Core 0), then other common drivers, falling back to acpitz/thermal_zone only as a last resort</li></ul>"
      de: "<p>Fehlerbehebungsversion: 10 Korrektheitsfehler behoben im Kernel-Scanner, DKMS-Waisen-Detektor, APT-Cache-Reiniger, Hardware-Erkennungslabel, Locale-Größen-Scanner, Modprobe-Erkennung und Treiber-Entfernungsablauf.</p><ul><li>Behoben: Kernel-Aktiverkennung verwendete Teilstring-Vergleich — ein alter Kernel konnte als aktiv markiert und vor der Entfernung geschützt werden</li><li>Behoben: _clean_file in root_helper behandelte kommentierte Modulzeilen falsch — verwaiste Kommentare wurden nicht entfernt, gültige Kommentare fälschlicherweise gelöscht</li><li>Behoben: clean_module_refs und apt_autoremove wurden gleichzeitig an root_helper gesendet, was zu JSON-Protokollkorruption auf dem stdin/stdout-Pipe führte</li><li>Behoben: Hardware-Erkennungslabel enthielt Nicht-GPU-PCI-Anbieter (z. B. Virtio-Geräte auf KVM-Hosts als QEMU/KVM-GPU angezeigt)</li><li>Behoben: VM-Gast-Typ (VirtualBox, VMware, Hyper-V usw.) wurde nie im Label \"Erkannte Hardware\" angezeigt</li><li>Behoben: Locale-Größen wurden als 0 KB gemeldet, wenn du Code 1 bei partiellen Lesefehlern zurückgab — Locales verschwanden aus der Bereinigungsliste</li><li>Behoben: DKMS-Waisen-Scanner prüfte nur den laufenden Kernel — kompilierte Module für andere installierte Kernel wurden nie erkannt</li><li>Behoben: apt_purge wurde nach einem fehlgeschlagenen DKMS-Schritt ausgeführt, was das System mit entfernten Paketen aber veraltetem initrd zurückließ. Auch behoben: rebuild_initrd ist jetzt True, wenn APT-Pakete einem erfolgreichen DKMS-Schritt folgen</li><li>Behoben: Modul-Erkennung in modprobe.d verwendete einfache Teilstring-Suche — 'wl' traf in 'brcmwl', konnte gültige Konfigurationsdateien löschen. Jetzt mit Wortgrenze-Regex</li><li>Behoben: Service/Autostart-Dateien als verwaist markiert, wenn ein mitbesitzendes Paket noch installiert war — vboxadd.service erschien als verwaist wenn virtualbox-guest-utils entfernt aber virtualbox-guest-dkms noch vorhanden war, sodass DKMS vboxguest weiter kompilierte</li><li>Behoben: CPU-Temperatur zeigte immer 20°C auf Boards, bei denen thermal_zone0 auf acpitz (einen Stub-Treiber) abbildet. Das Übersichtspanel sucht jetzt in /sys/class/hwmon/ und priorisiert k10temp (AMD Tctl), dann coretemp (Intel Package/Core 0), dann andere gängige Treiber, und verwendet acpitz/thermal_zone nur als letzten Ausweg</li></ul>"
      es: "<p>Versión de correcciones: 10 bugs de corrección en el escáner de kernels, detector de huérfanos DKMS, limpiador de caché APT, label de detección de hardware, escáner de tamaño de locales, detección de modprobe y flujo de eliminación de drivers.</p><ul><li>Corregido: la detección del kernel activo usaba comparación por subcadena — un kernel antiguo podía marcarse como activo y protegerse de la eliminación</li><li>Corregido: _clean_file en root_helper manejaba mal las líneas de módulos comentadas — los comentarios huérfanos no se eliminaban y los comentarios válidos se borraban incorrectamente</li><li>Corregido: clean_module_refs y apt_autoremove se enviaban concurrentemente al root_helper, causando corrupción del protocolo JSON en el pipe stdin/stdout</li><li>Corregido: el label de detección de hardware incluía vendors PCI que no son GPU (p. ej. dispositivos virtio en hosts KVM mostrados como GPU QEMU/KVM)</li><li>Corregido: el tipo de VM guest (VirtualBox, VMware, Hyper-V, etc.) nunca se mostraba en el label Hardware detectado</li><li>Corregido: los tamaños de locale se reportaban como 0 KB cuando du devolvía código 1 por errores parciales de lectura — las locales desaparecían de la lista de limpieza</li><li>Corregido: el scanner de módulos DKMS huérfanos solo comprobaba el kernel activo — los módulos compilados para otros kernels instalados nunca se detectaban</li><li>Corregido: apt_purge se ejecutaba tras un paso DKMS fallido, dejando el sistema con paquetes eliminados pero initrd obsoleto. También corregido: rebuild_initrd es ahora True cuando los paquetes APT siguen a un paso DKMS exitoso</li><li>Corregido: la detección de módulos en modprobe.d usaba subcadena pura — 'wl' coincidía dentro de 'brcmwl', pudiendo borrar archivos de configuración válidos. Ahora usa regex de límite de palabra</li><li>Corregido: archivos de servicio/autostart marcados como huérfanos cuando un paquete co-propietario seguía instalado — vboxadd.service aparecía como huérfano cuando virtualbox-guest-utils se eliminaba pero virtualbox-guest-dkms seguía presente, haciendo que DKMS siguiera compilando vboxguest</li><li>Corregido: la temperatura de CPU siempre mostraba 20°C en placas donde thermal_zone0 mapea a acpitz (un driver stub). El panel de resumen ahora busca en /sys/class/hwmon/ priorizando k10temp (AMD Tctl), luego coretemp (Intel Package/Core 0), luego otros drivers comunes, usando acpitz/thermal_zone solo como último recurso</li></ul>"
      fr: "<p>Version de corrections : 10 bugs de correction dans le scanner de noyaux, le détecteur d'orphelins DKMS, le nettoyeur de cache APT, le label de détection matérielle, le scanner de taille des locales, la détection de modprobe et le flux de suppression des pilotes.</p><ul><li>Corrigé : la détection du noyau actif utilisait une correspondance par sous-chaîne — un ancien noyau pouvait être marqué comme actif et protégé contre la suppression</li><li>Corrigé : _clean_file dans root_helper gérait mal les lignes de modules commentées — les commentaires orphelins n'étaient pas supprimés et les commentaires valides étaient incorrectement effacés</li><li>Corrigé : clean_module_refs et apt_autoremove étaient envoyés simultanément au root_helper, causant une corruption du protocole JSON sur le pipe stdin/stdout</li><li>Corrigé : l'étiquette de détection matérielle incluait des vendeurs PCI non-GPU (ex. dispositifs virtio sur hôtes KVM affichés comme GPU QEMU/KVM)</li><li>Corrigé : le type de VM invitée (VirtualBox, VMware, Hyper-V, etc.) n'était jamais affiché dans l'étiquette Matériel détecté</li><li>Corrigé : les tailles des locales étaient rapportées comme 0 Ko quand du retournait le code 1 pour des erreurs de lecture partielles — les locales disparaissaient de la liste de nettoyage</li><li>Corrigé : le scanner de modules DKMS orphelins ne vérifiait que le noyau actif — les modules compilés pour d'autres noyaux installés n'étaient jamais détectés</li><li>Corrigé : apt_purge était exécuté après un échec de l'étape DKMS, laissant le système avec des paquets supprimés mais un initrd obsolète. Aussi corrigé : rebuild_initrd est maintenant True quand des paquets APT suivent une étape DKMS réussie</li><li>Corrigé : la détection des modules dans modprobe.d utilisait une sous-chaîne — 'wl' correspondait dans 'brcmwl', pouvant supprimer des fichiers de configuration valides. Utilise maintenant une regex de limite de mot</li><li>Corrigé : fichiers de service/autostart marqués comme orphelins quand un paquet co-propriétaire était encore installé — vboxadd.service apparaissait comme orphelin quand virtualbox-guest-utils était supprimé mais virtualbox-guest-dkms était encore présent, causant la recompilation de vboxguest par DKMS</li><li>Corrigé : la température CPU affichait toujours 20°C sur les cartes où thermal_zone0 mappe sur acpitz (un pilote stub). Le panneau de résumé recherche maintenant dans /sys/class/hwmon/ en priorisant k10temp (AMD Tctl), puis coretemp (Intel Package/Core 0), puis d'autres pilotes courants, en utilisant acpitz/thermal_zone uniquement en dernier recours</li></ul>"
      it: "<p>Versione di correzioni: 10 bug di correttezza corretti nel scanner dei kernel, rilevatore di orfani DKMS, pulitore della cache APT, etichetta di rilevamento hardware, scanner delle dimensioni delle locale, rilevamento modprobe e flusso di rimozione dei driver.</p><ul><li>Corretto: il rilevamento del kernel attivo usava la corrispondenza per sottostringa — un kernel vecchio poteva essere contrassegnato come attivo e protetto dalla rimozione</li><li>Corretto: _clean_file in root_helper gestiva male le righe di moduli commentate — i commenti orfani non venivano rimossi e i commenti validi venivano eliminati erroneamente</li><li>Corretto: clean_module_refs e apt_autoremove venivano inviati contemporaneamente a root_helper, causando corruzione del protocollo JSON sulla pipe stdin/stdout</li><li>Corretto: l'etichetta di rilevamento hardware includeva vendor PCI non-GPU (es. dispositivi virtio su host KVM mostrati come GPU QEMU/KVM)</li><li>Corretto: il tipo di VM ospite (VirtualBox, VMware, Hyper-V, ecc.) non veniva mai mostrato nell'etichetta Hardware rilevato</li><li>Corretto: le dimensioni delle locale venivano riportate come 0 KB quando du restituiva codice 1 per errori di lettura parziali — le locale sparivano dall'elenco di pulizia</li><li>Corretto: lo scanner di moduli DKMS orfani controllava solo il kernel in esecuzione — i moduli compilati per altri kernel installati non venivano mai rilevati</li><li>Corretto: apt_purge veniva eseguito dopo un passo DKMS fallito, lasciando il sistema con pacchetti rimossi ma initrd obsoleto. Anche corretto: rebuild_initrd è ora True quando i pacchetti APT seguono un passo DKMS riuscito</li><li>Corretto: il rilevamento dei moduli in modprobe.d usava ricerca per sottostringa — 'wl' corrispondeva all'interno di 'brcmwl', potendo eliminare file di configurazione validi. Ora usa regex con limite di parola</li><li>Corretto: file di servizio/autostart contrassegnati come orfani quando un pacchetto co-proprietario era ancora installato — vboxadd.service appariva come orfano quando virtualbox-guest-utils veniva rimosso ma virtualbox-guest-dkms era ancora presente, facendo sì che DKMS continuasse a compilare vboxguest</li><li>Corretto: la temperatura della CPU mostrava sempre 20°C sulle schede dove thermal_zone0 mappa su acpitz (un driver stub). Il pannello di riepilogo cerca ora in /sys/class/hwmon/ dando priorità a k10temp (AMD Tctl), poi coretemp (Intel Package/Core 0), poi altri driver comuni, usando acpitz/thermal_zone solo come ultima risorsa</li></ul>"
      pt: "<p>Versão de correções: 10 bugs de correção no scanner de kernels, detector de órfãos DKMS, limpador de cache APT, label de deteção de hardware, scanner de tamanho de locales, deteção de modprobe e fluxo de remoção de drivers.</p><ul><li>Corrigido: a deteção do kernel ativo usava comparação por subcadeia — um kernel antigo podia ser marcado como ativo e protegido da remoção</li><li>Corrigido: _clean_file em root_helper tratava mal as linhas de módulos comentadas — comentários órfãos não eram removidos e comentários válidos eram incorretamente apagados</li><li>Corrigido: clean_module_refs e apt_autoremove eram enviados concorrentemente para o root_helper, causando corrupção do protocolo JSON no pipe stdin/stdout</li><li>Corrigido: o label de deteção de hardware incluía vendors PCI não-GPU (ex. dispositivos virtio em hosts KVM mostrados como GPU QEMU/KVM)</li><li>Corrigido: o tipo de VM convidada (VirtualBox, VMware, Hyper-V, etc.) nunca era mostrado no label Hardware detetado</li><li>Corrigido: os tamanhos de locale eram reportados como 0 KB quando du retornava código 1 por erros de leitura parciais — as locales desapareciam da lista de limpeza</li><li>Corrigido: o scanner de módulos DKMS órfãos só verificava o kernel ativo — módulos compilados para outros kernels instalados nunca eram detetados</li><li>Corrigido: apt_purge era executado após um passo DKMS falhado, deixando o sistema com pacotes removidos mas initrd desatualizado. Também corrigido: rebuild_initrd é agora True quando pacotes APT seguem um passo DKMS bem-sucedido</li><li>Corrigido: a deteção de módulos em modprobe.d usava subcadeia pura — 'wl' coincidia dentro de 'brcmwl', podendo apagar ficheiros de configuração válidos. Usa agora regex de limite de palavra</li><li>Corrigido: ficheiros de serviço/autostart marcados como órfãos quando um pacote co-proprietário ainda estava instalado — vboxadd.service aparecia como órfão quando virtualbox-guest-utils era removido mas virtualbox-guest-dkms ainda estava presente, fazendo o DKMS continuar a compilar vboxguest</li><li>Corrigido: a temperatura da CPU mostrava sempre 20°C em placas onde thermal_zone0 mapeia para acpitz (um driver stub). O painel de resumo procura agora em /sys/class/hwmon/ priorizando k10temp (AMD Tctl), depois coretemp (Intel Package/Core 0), depois outros drivers comuns, usando acpitz/thermal_zone apenas como último recurso</li></ul>"
      ro: "<p>Versiune de remedieri: 10 erori de corectitudine remediate în scannerul de nuclee, detectorul de orfani DKMS, curățătorul cache-ului APT, eticheta de detectare hardware, scannerul de dimensiune locale, detectarea modprobe și fluxul de eliminare a driverelor.</p><ul><li>Rezolvat: detectarea kernelului activ folosea potrivire prin subșir — un nucleu vechi putea fi marcat ca activ și protejat de eliminare</li><li>Rezolvat: _clean_file în root_helper trata incorect liniile de module comentate — comentariile orfane nu erau eliminate și comentariile valide erau șterse incorect</li><li>Rezolvat: clean_module_refs și apt_autoremove erau trimise concurent la root_helper, cauzând coruperea protocolului JSON pe pipe-ul stdin/stdout</li><li>Rezolvat: eticheta de detectare hardware includea vendori PCI non-GPU (ex. dispozitive virtio pe gazde KVM afișate ca GPU QEMU/KVM)</li><li>Rezolvat: tipul de VM invitat (VirtualBox, VMware, Hyper-V etc.) nu era niciodată afișat în eticheta Hardware detectat</li><li>Rezolvat: dimensiunile locale erau raportate ca 0 KB când du returna codul 1 pentru erori de citire parțiale — localele dispăreau din lista de curățare</li><li>Rezolvat: scannerul de module DKMS orfane verifica doar nucleul activ — modulele compilate pentru alte nuclee instalate nu erau niciodată detectate</li><li>Rezolvat: apt_purge era executat după un pas DKMS eșuat, lăsând sistemul cu pachete eliminate dar initrd învechit. De asemenea rezolvat: rebuild_initrd este acum True când pachetele APT urmează un pas DKMS reușit</li><li>Rezolvat: detectarea modulelor în modprobe.d folosea subșir simplu — 'wl' se potrivea în 'brcmwl', putând șterge fișiere de configurare valide. Acum folosește regex cu limită de cuvânt</li><li>Rezolvat: fișierele de serviciu/autostart marcate ca orfane când un pachet co-proprietar era încă instalat — vboxadd.service apărea ca orfan când virtualbox-guest-utils era eliminat dar virtualbox-guest-dkms era încă prezent, făcând DKMS să continue să compileze vboxguest</li><li>Rezolvat: temperatura CPU afișa întotdeauna 20°C pe plăcile unde thermal_zone0 mapează la acpitz (un driver stub). Panoul de rezumat caută acum în /sys/class/hwmon/ prioritizând k10temp (AMD Tctl), apoi coretemp (Intel Package/Core 0), apoi alți drivere comune, folosind acpitz/thermal_zone doar ca ultimă soluție</li></ul>"
      ru: "<p>Версия исправлений: исправлено 10 ошибок корректности в сканере ядер, детекторе осиротевших DKMS-модулей, очистителе кэша APT, метке обнаружения оборудования, сканере размеров локалей, обнаружении modprobe и потоке удаления драйверов.</p><ul><li>Исправлено: обнаружение активного ядра использовало поиск подстроки — старое ядро могло быть помечено как активное и защищено от удаления</li><li>Исправлено: _clean_file в root_helper неправильно обрабатывал закомментированные строки модулей — осиротевшие комментарии не удалялись, а действительные комментарии ошибочно удалялись</li><li>Исправлено: clean_module_refs и apt_autoremove отправлялись в root_helper одновременно, вызывая повреждение протокола JSON в пайпе stdin/stdout</li><li>Исправлено: метка обнаружения оборудования включала PCI-вендоры не-GPU (напр. устройства virtio на KVM-хостах отображались как GPU QEMU/KVM)</li><li>Исправлено: тип гостевой ВМ (VirtualBox, VMware, Hyper-V и др.) никогда не отображался в метке «Обнаруженное оборудование»</li><li>Исправлено: размеры локалей сообщались как 0 КБ когда du возвращал код 1 при частичных ошибках чтения — локали исчезали из списка очистки</li><li>Исправлено: сканер осиротевших DKMS-модулей проверял только работающее ядро — скомпилированные модули для других установленных ядер никогда не обнаруживались</li><li>Исправлено: apt_purge выполнялся после неудачного шага DKMS, оставляя систему с удалёнными пакетами но устаревшим initrd. Также исправлено: rebuild_initrd теперь True когда пакеты APT следуют за успешным шагом DKMS</li><li>Исправлено: обнаружение модулей в modprobe.d использовало простой поиск подстроки — 'wl' совпадал внутри 'brcmwl', что могло удалять действительные файлы конфигурации. Теперь использует regex с границей слова</li><li>Исправлено: файлы служб/автозапуска помечались как осиротевшие когда совладелец-пакет был ещё установлен — vboxadd.service появлялся как осиротевший когда virtualbox-guest-utils удалялся но virtualbox-guest-dkms ещё присутствовал, из-за чего DKMS продолжал компилировать vboxguest</li><li>Исправлено: температура ЦП всегда показывала 20°C на платах где thermal_zone0 указывает на acpitz (заглушка-драйвер). Панель обзора теперь ищет в /sys/class/hwmon/ с приоритетом k10temp (AMD Tctl), затем coretemp (Intel Package/Core 0), затем другие распространённые драйверы, используя acpitz/thermal_zone только в крайнем случае</li></ul>"
  - version: "1.0.2-7"
    type: stable
    unix-timestamp: 1782259200
    description:
      C: "<p>Bug fix release: VirtualBox (and other hypervisor) guest service files are no longer shown as orphaned when running inside a virtual machine. Duplicate entries for the same file are also fixed.</p><ul><li>Fixed: VirtualBox guest service files (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) shown as orphaned when running inside VirtualBox — orphan detector now receives vm_guest_type from systemd-detect-virt and protects all files belonging to the current guest platform (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Fixed: 98vboxadd-xclient appeared twice in the orphaned list — /etc/X11/Xsession.d/98vboxadd-xclient was listed in both virtualbox-guest-x11 and virtualbox-guest-utils entries; added path deduplication so each file is reported at most once</li></ul>"
      de: "<p>Fehlerbehebungsversion: VirtualBox- (und andere Hypervisor-) Gast-Service-Dateien werden nicht mehr als verwaist angezeigt, wenn das System in einer virtuellen Maschine läuft. Doppelte Einträge für dieselbe Datei werden ebenfalls behoben.</p><ul><li>Behoben: VirtualBox-Gast-Servicedateien (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) wurden als verwaist angezeigt, wenn das System in VirtualBox lief — der Waisen-Detektor empfängt jetzt vm_guest_type von systemd-detect-virt und schützt alle Dateien der aktuellen Gast-Plattform (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Behoben: 98vboxadd-xclient erschien zweimal in der Waisenliste — /etc/X11/Xsession.d/98vboxadd-xclient war in den Einträgen für virtualbox-guest-x11 und virtualbox-guest-utils aufgeführt; Pfad-Deduplizierung hinzugefügt, damit jede Datei höchstens einmal gemeldet wird</li></ul>"
      es: "<p>Versión de correcciones: los archivos de servicios guest de VirtualBox (y otros hipervisores) ya no se muestran como huérfanos cuando el sistema corre dentro de una máquina virtual. También se corrigen las entradas duplicadas para el mismo archivo.</p><ul><li>Corregido: los archivos de servicios guest de VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) se mostraban como huérfanos al correr dentro de VirtualBox — el detector de huérfanos ahora recibe vm_guest_type de systemd-detect-virt y protege todos los archivos de la plataforma guest actual (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Corregido: 98vboxadd-xclient aparecía dos veces en la lista de huérfanos — /etc/X11/Xsession.d/98vboxadd-xclient estaba en las entradas de virtualbox-guest-x11 y virtualbox-guest-utils; añadida deduplicación por path para que cada archivo aparezca como máximo una vez</li></ul>"
      fr: "<p>Version de corrections : les fichiers de services invités VirtualBox (et autres hyperviseurs) ne sont plus affichés comme orphelins lors de l'exécution dans une machine virtuelle. Les entrées en double pour le même fichier sont également corrigées.</p><ul><li>Corrigé : les fichiers de services invités VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) s'affichaient comme orphelins lors de l'exécution dans VirtualBox — le détecteur d'orphelins reçoit maintenant vm_guest_type de systemd-detect-virt et protège tous les fichiers de la plateforme invitée actuelle (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Corrigé : 98vboxadd-xclient apparaissait deux fois dans la liste des orphelins — /etc/X11/Xsession.d/98vboxadd-xclient était listé dans les entrées de virtualbox-guest-x11 et virtualbox-guest-utils ; déduplication par chemin ajoutée pour que chaque fichier n'apparaisse qu'une fois</li></ul>"
      it: "<p>Versione di correzioni: i file di servizi guest di VirtualBox (e altri hypervisor) non vengono più mostrati come orfani quando il sistema è in esecuzione in una macchina virtuale. Vengono corrette anche le voci duplicate per lo stesso file.</p><ul><li>Corretto: i file di servizi guest di VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) venivano mostrati come orfani quando il sistema era in esecuzione in VirtualBox — il rilevatore di orfani riceve ora vm_guest_type da systemd-detect-virt e protegge tutti i file della piattaforma guest corrente (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Corretto: 98vboxadd-xclient appariva due volte nell'elenco degli orfani — /etc/X11/Xsession.d/98vboxadd-xclient era elencato nelle voci di virtualbox-guest-x11 e virtualbox-guest-utils; aggiunta deduplicazione per percorso affinché ogni file venga segnalato al massimo una volta</li></ul>"
      pt: "<p>Versão de correções: os ficheiros de serviços guest do VirtualBox (e outros hipervisores) já não são mostrados como órfãos quando o sistema corre numa máquina virtual. As entradas duplicadas para o mesmo ficheiro também são corrigidas.</p><ul><li>Corrigido: os ficheiros de serviços guest do VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) eram mostrados como órfãos ao correr dentro do VirtualBox — o detector de órfãos recebe agora vm_guest_type do systemd-detect-virt e protege todos os ficheiros da plataforma guest atual (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Corrigido: 98vboxadd-xclient aparecia duas vezes na lista de órfãos — /etc/X11/Xsession.d/98vboxadd-xclient estava listado nas entradas de virtualbox-guest-x11 e virtualbox-guest-utils; adicionada deduplicação por path para que cada ficheiro apareça no máximo uma vez</li></ul>"
      ro: "<p>Versiune de remedieri: fișierele de servicii guest VirtualBox (și ale altor hipervizoare) nu mai sunt afișate ca orfane când sistemul rulează într-o mașină virtuală. Intrările duplicate pentru același fișier sunt de asemenea remediate.</p><ul><li>Rezolvat: fișierele de servicii guest VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) erau afișate ca orfane când sistemul rula în VirtualBox — detectorul de orfane primește acum vm_guest_type de la systemd-detect-virt și protejează toate fișierele platformei guest curente (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Rezolvat: 98vboxadd-xclient apărea de două ori în lista de orfane — /etc/X11/Xsession.d/98vboxadd-xclient era listat atât în intrările virtualbox-guest-x11 cât și virtualbox-guest-utils; adăugată deduplicare după cale pentru ca fiecare fișier să fie raportat cel mult o dată</li></ul>"
      ru: "<p>Версия исправлений: файлы гостевых служб VirtualBox (и других гипервизоров) больше не отображаются как осиротевшие при работе внутри виртуальной машины. Также исправлены дублирующиеся записи для одного и того же файла.</p><ul><li>Исправлено: файлы гостевых служб VirtualBox (vboxadd.service, 98vboxadd-xclient, vboxclient.desktop) отображались как осиротевшие при работе внутри VirtualBox — детектор осиротевших файлов теперь получает vm_guest_type от systemd-detect-virt и защищает все файлы текущей гостевой платформы (oracle/VirtualBox, vmware, microsoft/Hyper-V, kvm/qemu)</li><li>Исправлено: 98vboxadd-xclient появлялся дважды в списке осиротевших файлов — /etc/X11/Xsession.d/98vboxadd-xclient был перечислен в записях и virtualbox-guest-x11, и virtualbox-guest-utils; добавлена дедупликация по пути, чтобы каждый файл сообщался не более одного раза</li></ul>"
  - version: "1.0.2-6"
    type: stable
    unix-timestamp: 1781395200
    description:
      C: "<p>Bug fix release: SPICE guest tools (spice-vdagent, spice-webdavd) are no longer shown as removable when running inside a KVM/QEMU virtual machine in virt-manager.</p><ul><li>Fixed: spice-vdagent and spice-webdavd shown as removable in KVM/QEMU VMs — VM_GUEST_PACKAGES had separate kvm and qemu entries with identical package lists; detecting kvm only protected the kvm entry while qemu caused the same packages to appear removable. Detecting kvm now also protects qemu packages and vice versa</li></ul>"
      de: "<p>Fehlerbehebungsversion: SPICE-Gast-Tools (spice-vdagent, spice-webdavd) werden nicht mehr als entfernbar angezeigt, wenn das System in einer KVM/QEMU-VM in virt-manager läuft.</p><ul><li>Behoben: spice-vdagent und spice-webdavd wurden in KVM/QEMU-VMs als entfernbar angezeigt — VM_GUEST_PACKAGES hatte separate kvm- und qemu-Einträge mit identischen Paketen; die Erkennung von kvm schützte nur den kvm-Eintrag, während qemu dieselben Pakete als entfernbar anzeigte. Die Erkennung von kvm schützt jetzt auch qemu-Pakete und umgekehrt</li></ul>"
      es: "<p>Versión de correcciones: las herramientas SPICE (spice-vdagent, spice-webdavd) ya no se muestran como eliminables cuando el sistema corre dentro de una máquina virtual KVM/QEMU en virt-manager.</p><ul><li>Corregido: spice-vdagent y spice-webdavd se mostraban como eliminables en VMs KVM/QEMU — VM_GUEST_PACKAGES tenía entradas separadas kvm y qemu con los mismos paquetes; detectar kvm solo protegía la entrada kvm mientras que qemu hacía que los mismos paquetes aparecieran como eliminables. Detectar kvm ahora también protege los paquetes de qemu y viceversa</li></ul>"
      fr: "<p>Version de corrections : les outils SPICE (spice-vdagent, spice-webdavd) ne sont plus affichés comme supprimables lors de l'exécution dans une machine virtuelle KVM/QEMU dans virt-manager.</p><ul><li>Corrigé : spice-vdagent et spice-webdavd s'affichaient comme supprimables dans les VM KVM/QEMU — VM_GUEST_PACKAGES avait des entrées kvm et qemu séparées avec les mêmes paquets ; détecter kvm ne protégeait que l'entrée kvm tandis que qemu faisait apparaître les mêmes paquets comme supprimables. Détecter kvm protège maintenant aussi les paquets qemu et vice versa</li></ul>"
      it: "<p>Versione di correzioni: gli strumenti SPICE (spice-vdagent, spice-webdavd) non vengono più mostrati come rimovibili quando il sistema è in esecuzione in una macchina virtuale KVM/QEMU in virt-manager.</p><ul><li>Corretto: spice-vdagent e spice-webdavd venivano mostrati come rimovibili nelle VM KVM/QEMU — VM_GUEST_PACKAGES aveva voci separate kvm e qemu con gli stessi pacchetti; rilevare kvm proteggeva solo la voce kvm mentre qemu faceva apparire gli stessi pacchetti come rimovibili. Rilevare kvm ora protegge anche i pacchetti qemu e viceversa</li></ul>"
      pt: "<p>Versão de correções: as ferramentas SPICE (spice-vdagent, spice-webdavd) já não são mostradas como removíveis quando o sistema corre numa máquina virtual KVM/QEMU no virt-manager.</p><ul><li>Corrigido: spice-vdagent e spice-webdavd eram mostrados como removíveis em VMs KVM/QEMU — VM_GUEST_PACKAGES tinha entradas separadas kvm e qemu com os mesmos pacotes; detetar kvm só protegia a entrada kvm enquanto qemu fazia os mesmos pacotes aparecer como removíveis. Detetar kvm agora também protege os pacotes qemu e vice-versa</li></ul>"
      ro: "<p>Versiune de remedieri: instrumentele SPICE (spice-vdagent, spice-webdavd) nu mai sunt afișate ca eliminabile când sistemul rulează într-o mașină virtuală KVM/QEMU în virt-manager.</p><ul><li>Rezolvat: spice-vdagent și spice-webdavd erau afișate ca eliminabile în VM-urile KVM/QEMU — VM_GUEST_PACKAGES avea intrări separate kvm și qemu cu aceleași pachete; detectarea kvm proteja doar intrarea kvm în timp ce qemu făcea ca aceleași pachete să apară ca eliminabile. Detectarea kvm protejează acum și pachetele qemu și invers</li></ul>"
      ru: "<p>Версия исправлений: инструменты SPICE (spice-vdagent, spice-webdavd) больше не отображаются как удаляемые при работе внутри виртуальной машины KVM/QEMU в virt-manager.</p><ul><li>Исправлено: spice-vdagent и spice-webdavd отображались как удаляемые в ВМ KVM/QEMU — VM_GUEST_PACKAGES имел отдельные записи kvm и qemu с одинаковыми пакетами; обнаружение kvm защищало только запись kvm, тогда как qemu делал те же пакеты удаляемыми. Теперь обнаружение kvm также защищает пакеты qemu и наоборот</li></ul>"
  - version: "1.0.2-5"
    type: stable
    unix-timestamp: 1781222400
    description:
      C: "<p>Bug fix release: firmware removal is now permanent — the Firmwares tab purges the owning APT package instead of only deleting files, preventing restored firmware on every apt upgrade.</p><ul><li>Fixed: firmware removal was not permanent — files were restored on every apt upgrade because the owning packages (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi, etc.) were never removed. The action now runs apt purge for the owning package when all its firmware directories are selected for removal. Generic bundles (firmware-linux-nonfree, firmware-misc-nonfree) are not purged as they contain firmware for many unrelated hardware families</li></ul>"
      de: "<p>Fehlerbehebungsversion: Firmware-Entfernung ist jetzt dauerhaft — der Firmware-Tab löscht das zugehörige APT-Paket statt nur Dateien zu entfernen, was eine Wiederherstellung der Firmware bei jedem apt upgrade verhindert.</p><ul><li>Behoben: Firmware-Entfernung war nicht dauerhaft — Dateien wurden bei jedem apt upgrade wiederhergestellt, da die Eigentümerpakete (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi usw.) nie entfernt wurden. Die Aktion führt jetzt apt purge für das Eigentümerpaket aus, wenn alle seine Firmware-Verzeichnisse zur Entfernung ausgewählt werden. Generische Pakete (firmware-linux-nonfree, firmware-misc-nonfree) werden nicht gelöscht, da sie Firmware für viele verschiedene Hardware-Typen enthalten</li></ul>"
      es: "<p>Versión de correcciones: la eliminación de firmwares ahora es permanente — la pestaña Firmwares purga el paquete APT propietario en lugar de solo borrar archivos, evitando que los firmwares se restauren en cada apt upgrade.</p><ul><li>Corregido: la eliminación de firmwares no era permanente — los archivos se restauraban en cada apt upgrade porque los paquetes propietarios (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi, etc.) nunca se eliminaban. La acción ahora ejecuta apt purge del paquete propietario cuando todos sus directorios de firmware se seleccionan para eliminar. Los bundles genéricos (firmware-linux-nonfree, firmware-misc-nonfree) no se purgan ya que contienen firmware para muchos tipos de hardware</li></ul>"
      fr: "<p>Version de corrections : la suppression des micrologiciels est désormais permanente — l'onglet Micrologiciels purge le paquet APT propriétaire au lieu de simplement supprimer les fichiers, évitant la restauration des micrologiciels à chaque apt upgrade.</p><ul><li>Corrigé : la suppression des micrologiciels n'était pas permanente — les fichiers étaient restaurés à chaque apt upgrade car les paquets propriétaires (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi, etc.) n'étaient jamais supprimés. L'action exécute maintenant apt purge du paquet propriétaire quand tous ses répertoires sont sélectionnés. Les bundles génériques (firmware-linux-nonfree, firmware-misc-nonfree) ne sont pas purgés car ils contiennent des micrologiciels pour de nombreux types de matériel</li></ul>"
      it: "<p>Versione di correzioni: la rimozione del firmware è ora permanente — la scheda Firmware elimina il pacchetto APT proprietario invece di cancellare solo i file, evitando il ripristino del firmware ad ogni apt upgrade.</p><ul><li>Corretto: la rimozione del firmware non era permanente — i file venivano ripristinati ad ogni apt upgrade poiché i pacchetti proprietari (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi, ecc.) non venivano mai rimossi. L'azione ora esegue apt purge del pacchetto proprietario quando tutte le sue directory firmware sono selezionate. I bundle generici (firmware-linux-nonfree, firmware-misc-nonfree) non vengono purgati poiché contengono firmware per molti tipi di hardware</li></ul>"
      pt: "<p>Versão de correções: a remoção de firmwares é agora permanente — o separador Firmwares purga o pacote APT proprietário em vez de apenas apagar ficheiros, evitando que os firmwares sejam restaurados em cada apt upgrade.</p><ul><li>Corrigido: a remoção de firmwares não era permanente — os ficheiros eram restaurados em cada apt upgrade porque os pacotes proprietários (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi, etc.) nunca eram removidos. A ação executa agora apt purge do pacote proprietário quando todos os seus diretórios de firmware são selecionados. Os bundles genéricos (firmware-linux-nonfree, firmware-misc-nonfree) não são purgados pois contêm firmware para muitos tipos de hardware</li></ul>"
      ro: "<p>Versiune de remedieri: eliminarea firmware-ului este acum permanentă — fila Firmware șterge pachetul APT proprietar în loc să elimine doar fișierele, prevenind restaurarea firmware-ului la fiecare apt upgrade.</p><ul><li>Rezolvat: eliminarea firmware-ului nu era permanentă — fișierele erau restaurate la fiecare apt upgrade deoarece pachetele proprietare (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi etc.) nu erau niciodată eliminate. Acțiunea execută acum apt purge pentru pachetul proprietar când toate directoarele sale de firmware sunt selectate. Bundle-urile generice (firmware-linux-nonfree, firmware-misc-nonfree) nu sunt șterse deoarece conțin firmware pentru multe tipuri de hardware</li></ul>"
      ru: "<p>Версия исправлений: удаление прошивок теперь постоянное — вкладка «Прошивки» удаляет пакет APT-владелец вместо простого удаления файлов, предотвращая восстановление прошивок при каждом apt upgrade.</p><ul><li>Исправлено: удаление прошивок не было постоянным — файлы восстанавливались при каждом apt upgrade, поскольку пакеты-владельцы (firmware-realtek, firmware-amd-graphics, firmware-iwlwifi и др.) никогда не удалялись. Теперь действие выполняет apt purge пакета-владельца, когда все его директории прошивок выбраны для удаления. Универсальные пакеты (firmware-linux-nonfree, firmware-misc-nonfree) не удаляются, так как содержат прошивки для многих типов оборудования</li></ul>"
  - version: "1.0.2-4"
    type: stable
    unix-timestamp: 1780963200
    description:
      C: "<p>Bug fix release: DKMS orphan detection no longer shows active installed drivers as orphans, and old compiled DKMS versions left after driver upgrades are now correctly detected.</p><ul><li>Fixed: DKMS orphan detector was showing active installed NVIDIA (and other) drivers as orphans — the DKMS directory name (e.g. nvidia) did not match the package name tried (nvidia-dkms). Added DKMS_MODULE_PACKAGES mapping covering NVIDIA, VirtualBox guest, Broadcom, ZFS, v4l2loopback and other known mismatches</li><li>Fixed: DKMS orphan detector was not detecting old compiled versions left after a driver upgrade (e.g. nvidia 580.126.20 lingering after upgrade to 580.159.04) — now checks /usr/src/module-version/ presence and compares installed package version</li></ul>"
      de: "<p>Fehlerbehebungsversion: DKMS-Waisenerkennung zeigt aktive Treiber nicht mehr als Waisen an, und alte kompilierte DKMS-Versionen nach Treiberaktualisierungen werden korrekt erkannt.</p><ul><li>Behoben: DKMS-Detektor zeigte aktive NVIDIA-Treiber als Waisen — DKMS-Verzeichnisname (z. B. nvidia) stimmte nicht mit Paketnamen (nvidia-dkms) überein</li><li>Behoben: Detektor erkannte keine alten kompilierten Versionen nach Treiber-Upgrade (z. B. nvidia 580.126.20 nach Upgrade auf 580.159.04)</li></ul>"
      es: "<p>Versión de correcciones: la detección de módulos DKMS huérfanos ya no muestra como huérfanos los drivers instalados y activos, y las versiones compiladas antiguas que quedan tras actualizar drivers se detectan correctamente.</p><ul><li>Corregido: el detector de módulos DKMS huérfanos mostraba los drivers NVIDIA (y otros) instalados y activos como huérfanos — el nombre del directorio DKMS (p. ej. nvidia) no coincidía con el nombre de paquete buscado (nvidia-dkms)</li><li>Corregido: el detector no encontraba versiones compiladas antiguas que quedan tras actualizar el driver (p. ej. nvidia 580.126.20 al actualizar a 580.159.04)</li></ul>"
      fr: "<p>Version de corrections : la détection des modules DKMS orphelins n'affiche plus les pilotes actifs comme orphelins, et les anciennes versions compilées laissées après les mises à jour des pilotes sont correctement détectées.</p><ul><li>Corrigé : le détecteur DKMS affichait les pilotes NVIDIA actifs comme orphelins — le nom du répertoire DKMS (ex. nvidia) ne correspondait pas au nom du paquet (nvidia-dkms)</li><li>Corrigé : le détecteur ne trouvait pas les anciennes versions compilées après mise à jour d'un pilote (ex. nvidia 580.126.20 après mise à jour vers 580.159.04)</li></ul>"
      it: "<p>Versione di correzioni: il rilevamento dei moduli DKMS orfani non mostra più i driver attivi come orfani, e le vecchie versioni compilate rimaste dopo gli aggiornamenti dei driver vengono rilevate correttamente.</p><ul><li>Corretto: il rilevatore DKMS mostrava i driver NVIDIA attivi come orfani — il nome della directory DKMS (es. nvidia) non corrispondeva al nome del pacchetto (nvidia-dkms)</li><li>Corretto: il rilevatore non trovava le versioni compilate vecchie dopo un aggiornamento del driver (es. nvidia 580.126.20 dopo aggiornamento a 580.159.04)</li></ul>"
      pt: "<p>Versão de correções: a deteção de módulos DKMS órfãos já não mostra como órfãos os drivers instalados e ativos, e as versões compiladas antigas após atualizações de drivers são detetadas corretamente.</p><ul><li>Corrigido: o detetor DKMS mostrava os drivers NVIDIA ativos como órfãos — o nome do diretório DKMS (ex. nvidia) não coincidia com o nome do pacote (nvidia-dkms)</li><li>Corrigido: o detetor não encontrava versões compiladas antigas após atualizar o driver (ex. nvidia 580.126.20 ao atualizar para 580.159.04)</li></ul>"
      ro: "<p>Versiune de remedieri: detectarea modulelor DKMS orfane nu mai afișează driverele active ca orfane, iar versiunile compilate vechi rămase după actualizările driverelor sunt detectate corect.</p><ul><li>Rezolvat: detectorul DKMS afișa driverele NVIDIA active ca orfane — numele directorului DKMS (ex. nvidia) nu corespundea cu numele pachetului (nvidia-dkms)</li><li>Rezolvat: detectorul nu găsea versiunile vechi compilate după actualizarea unui driver (ex. nvidia 580.126.20 după actualizarea la 580.159.04)</li></ul>"
      ru: "<p>Версия исправлений: обнаружение осиротевших DKMS-модулей больше не показывает активные драйверы как осиротевшие, а старые скомпилированные версии после обновления драйверов теперь обнаруживаются корректно.</p><ul><li>Исправлено: детектор DKMS отображал активные драйверы NVIDIA как осиротевшие — имя директории DKMS (напр. nvidia) не совпадало с именем пакета (nvidia-dkms)</li><li>Исправлено: детектор не находил старые скомпилированные версии после обновления драйвера (напр. nvidia 580.126.20 после обновления до 580.159.04)</li></ul>"
  - version: "1.0.2-3"
    type: stable
    unix-timestamp: 1780531200
    description:
      C: "<p>Bug fix and cleanup release: orphaned DKMS modules, systemd services, X11/XDG autostart files and module references left after driver removal are now detected and cleaned. Fixes VBoxClient boot notifications on systems where VirtualBox guest packages were removed.</p><ul><li>Added: orphaned DKMS module detection in Drivers tab — compiled .ko files in /var/lib/dkms/ with no installed source package, removed via dkms remove + dracut -f</li><li>Added: orphaned reference scanner covering /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, systemd unit files, and X11/XDG autostart files — shown in APT Cache orphaned packages section</li><li>Added: automatic cleanup of module references after driver removal before dracut -f (covers VirtualBox, VMware, Broadcom, Hyper-V)</li><li>Fixed: VBoxClient boot notifications after removing virtualbox-guest-x11 — caused by orphaned /etc/X11/Xsession.d/98vboxadd-xclient and /etc/xdg/autostart/vboxclient.desktop</li><li>Fixed: full coverage for VMware (vmtoolsd.service, vmware-vmblock-fuse.service, vmware-user.desktop, 70vmware-user), NVIDIA (nvidia-persistenced.service, nvidia-hibernate/resume/suspend.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf, wl.conf) and Hyper-V daemon services</li><li>Fixed: users who removed drivers before this release can clean up leftover references from APT Cache — Orphaned packages without reinstalling anything</li></ul>"
      de: "<p>Fehlerbehebungs- und Bereinigungsversion: verwaiste DKMS-Module, systemd-Dienste, X11/XDG-Autostartdateien und Modulreferenzen nach der Treiberentfernung werden jetzt erkannt und bereinigt. Behebt VBoxClient-Benachrichtigungen beim Start auf Systemen, bei denen VirtualBox-Gast-Pakete entfernt wurden.</p><ul><li>Hinzugefügt: Erkennung verwaister DKMS-Module im Treiber-Tab — kompilierte .ko-Dateien in /var/lib/dkms/ ohne installiertes Quellpaket, entfernt über dkms remove + dracut -f</li><li>Hinzugefügt: Scanner für verwaiste Referenzen in /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, systemd-Einheiten und X11/XDG-Autostartdateien</li><li>Hinzugefügt: automatische Bereinigung von Modulreferenzen nach Treiberentfernung vor dracut -f</li><li>Behoben: VBoxClient-Benachrichtigungen nach Entfernung von virtualbox-guest-x11 — verursacht durch verwaiste /etc/X11/Xsession.d/98vboxadd-xclient und /etc/xdg/autostart/vboxclient.desktop</li><li>Behoben: vollständige Abdeckung für VMware, NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) und Hyper-V</li><li>Behoben: Benutzer, die Treiber vor diesem Release entfernt haben, können Referenzen über APT-Cache — Verwaiste Pakete bereinigen</li></ul>"
      es: "<p>Versión de correcciones y limpieza: módulos DKMS huérfanos, servicios systemd, ficheros de autostart X11/XDG y referencias de módulos que quedan tras desinstalar drivers ahora se detectan y eliminan. Corrige las notificaciones de VBoxClient al arrancar en sistemas donde se eliminaron los paquetes de guest de VirtualBox.</p><ul><li>Añadido: detección de módulos DKMS huérfanos en la pestaña Drivers — archivos .ko compilados en /var/lib/dkms/ sin paquete fuente instalado, eliminados con dkms remove + dracut -f</li><li>Añadido: escáner de referencias huérfanas en /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, servicios systemd y ficheros de autostart X11/XDG — mostrados en la sección de paquetes huérfanos del Caché APT</li><li>Añadido: limpieza automática de referencias de módulos tras eliminar drivers antes de dracut -f (cubre VirtualBox, VMware, Broadcom, Hyper-V)</li><li>Corregido: notificaciones de VBoxClient al arrancar tras eliminar virtualbox-guest-x11 — causadas por /etc/X11/Xsession.d/98vboxadd-xclient y /etc/xdg/autostart/vboxclient.desktop huérfanos</li><li>Corregido: cobertura completa para VMware (vmtoolsd.service, vmware-vmblock-fuse.service, vmware-user.desktop), NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) e Hyper-V</li><li>Corregido: los usuarios que eliminaron drivers antes de esta versión pueden limpiar las referencias desde Caché APT — Paquetes huérfanos sin reinstalar nada</li></ul>"
      fr: "<p>Version de corrections et nettoyage : les modules DKMS orphelins, services systemd, fichiers d'autostart X11/XDG et références de modules laissés après la suppression des pilotes sont maintenant détectés et nettoyés. Corrige les notifications VBoxClient au démarrage sur les systèmes où les paquets invités VirtualBox ont été supprimés.</p><ul><li>Ajouté : détection des modules DKMS orphelins dans l'onglet Pilotes — fichiers .ko compilés dans /var/lib/dkms/ sans paquet source installé, supprimés via dkms remove + dracut -f</li><li>Ajouté : scanner de références orphelines dans /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, unités systemd et fichiers d'autostart X11/XDG — affichés dans la section paquets orphelins du Cache APT</li><li>Ajouté : nettoyage automatique des références de modules après suppression des pilotes avant dracut -f</li><li>Corrigé : notifications VBoxClient au démarrage après suppression de virtualbox-guest-x11 — causées par /etc/X11/Xsession.d/98vboxadd-xclient et /etc/xdg/autostart/vboxclient.desktop orphelins</li><li>Corrigé : le même nettoyage s'applique aux fichiers autostart de VMware et aux services Hyper-V</li><li>Corrigé : les utilisateurs ayant supprimé des pilotes avant cette version peuvent nettoyer les références depuis Cache APT — Paquets orphelins</li></ul>"
      it: "<p>Versione di correzioni e pulizia: moduli DKMS orfani, servizi systemd, file di autostart X11/XDG e riferimenti a moduli lasciati dopo la rimozione dei driver vengono ora rilevati e puliti. Corregge le notifiche VBoxClient all'avvio sui sistemi in cui i pacchetti guest di VirtualBox sono stati rimossi.</p><ul><li>Aggiunto: rilevamento moduli DKMS orfani nella scheda Driver — file .ko compilati in /var/lib/dkms/ senza pacchetto sorgente installato, rimossi con dkms remove + dracut -f</li><li>Aggiunto: scanner di riferimenti orfani in /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, unità systemd e file di autostart X11/XDG</li><li>Aggiunto: pulizia automatica dei riferimenti ai moduli dopo la rimozione dei driver prima di dracut -f</li><li>Corretto: notifiche VBoxClient all'avvio dopo la rimozione di virtualbox-guest-x11 — causate da /etc/X11/Xsession.d/98vboxadd-xclient e /etc/xdg/autostart/vboxclient.desktop orfani</li><li>Corretto: copertura completa per VMware, NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) e Hyper-V</li><li>Corretto: gli utenti che hanno rimosso i driver prima di questa versione possono pulire i riferimenti da Cache APT — Pacchetti orfani</li></ul>"
      pt: "<p>Versão de correções e limpeza: módulos DKMS órfãos, serviços systemd, ficheiros de autostart X11/XDG e referências de módulos deixados após a remoção de drivers são agora detetados e limpos. Corrige notificações do VBoxClient no arranque em sistemas onde os pacotes guest do VirtualBox foram removidos.</p><ul><li>Adicionado: deteção de módulos DKMS órfãos no separador Drivers — ficheiros .ko compilados em /var/lib/dkms/ sem pacote fonte instalado, removidos com dkms remove + dracut -f</li><li>Adicionado: scanner de referências órfãs em /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, unidades systemd e ficheiros de autostart X11/XDG</li><li>Adicionado: limpeza automática de referências de módulos após remoção de drivers antes de dracut -f</li><li>Corrigido: notificações do VBoxClient no arranque após remover virtualbox-guest-x11 — causadas por /etc/X11/Xsession.d/98vboxadd-xclient e /etc/xdg/autostart/vboxclient.desktop órfãos</li><li>Corrigido: cobertura completa para VMware, NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) e Hyper-V</li><li>Corrigido: utilizadores que removeram drivers antes desta versão podem limpar referências em Cache APT — Pacotes órfãos</li></ul>"
      ro: "<p>Versiune de remedieri și curățare: modulele DKMS orfane, serviciile systemd, fișierele de autostart X11/XDG și referințele la module rămase după eliminarea driverelor sunt acum detectate și curățate. Remediază notificările VBoxClient la pornire pe sistemele unde pachetele guest VirtualBox au fost eliminate.</p><ul><li>Adăugat: detectare module DKMS orfane în fila Drivere — fișiere .ko compilate în /var/lib/dkms/ fără pachet sursă instalat, eliminate cu dkms remove + dracut -f</li><li>Adăugat: scanner de referințe orfane în /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, unități systemd și fișiere de autostart X11/XDG</li><li>Adăugat: curățare automată a referințelor la module după eliminarea driverelor înainte de dracut -f</li><li>Rezolvat: notificări VBoxClient la pornire după eliminarea virtualbox-guest-x11 — cauzate de /etc/X11/Xsession.d/98vboxadd-xclient și /etc/xdg/autostart/vboxclient.desktop orfane</li><li>Rezolvat: acoperire completă pentru VMware, NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) și Hyper-V</li><li>Rezolvat: utilizatorii care au eliminat drivere înainte de această versiune pot curăța referințele din Cache APT — Pachete orfane</li></ul>"
      ru: "<p>Версия исправлений и очистки: осиротевшие DKMS-модули, службы systemd, файлы автозапуска X11/XDG и ссылки на модули, оставшиеся после удаления драйверов, теперь обнаруживаются и удаляются. Исправляет уведомления VBoxClient при загрузке на системах, где были удалены пакеты гостевых дополнений VirtualBox.</p><ul><li>Добавлено: обнаружение осиротевших DKMS-модулей во вкладке «Драйверы» — скомпилированные .ko-файлы в /var/lib/dkms/ без установленного исходного пакета, удаляются через dkms remove + dracut -f</li><li>Добавлено: сканер осиротевших ссылок в /etc/modules, /etc/modules-load.d/, /etc/modprobe.d/, юнитах systemd и файлах автозапуска X11/XDG</li><li>Добавлено: автоматическая очистка ссылок на модули после удаления драйверов перед dracut -f</li><li>Исправлено: уведомления VBoxClient при загрузке после удаления virtualbox-guest-x11 — вызваны осиротевшими /etc/X11/Xsession.d/98vboxadd-xclient и /etc/xdg/autostart/vboxclient.desktop</li><li>Исправлено: полное покрытие для VMware, NVIDIA (nvidia-persistenced.service, modprobe.d/nvidia-blacklist-nouveau.conf), Broadcom (modprobe.d/blacklist-bcm43.conf) и Hyper-V</li><li>Исправлено: пользователи, удалившие драйверы до этого выпуска, могут очистить ссылки через Кэш APT — Осиротевшие пакеты</li></ul>"
  - version: "1.0.2-2"
    type: stable
    unix-timestamp: 1780012800
    description:
      C: "<p>Bug fix and driver detection improvement release: Intel GPU false positive in VMs fixed, VM guest tool packages now managed via systemd-detect-virt, printer and input device driver detection added, progress bar and select-all checkbox state bugs fixed.</p><ul><li>Fixed: Intel GPU packages no longer protected by chipset-only Intel devices in VMs (new lspci -n class 03xx check)</li><li>Fixed: VM guest tool packages now managed via systemd-detect-virt, not PCI vendor — resolves VirtualBox VMSVGA false positive</li><li>Fixed: root_helper.py was not updated with gpu_pci_vendors/vm_guest_type — all Drivers tab fixes now apply in production</li><li>Fixed: dracut_fw_dirs now exported from root_helper, firmware protection set correctly rebuilt client-side</li><li>Fixed: progress bar no longer shows 100% during indeterminate operations</li><li>Fixed: \"Select all\" checkbox now resets after cleanup completes in all tabs</li><li>Added: Broadcom proprietary WiFi driver packages (PCI 14e4)</li><li>Added: Wacom tablet driver packages (USB 056a)</li><li>Added: Printer driver packages for HP, Epson, Canon, Brother, Samsung, Kyocera (USB vendor detection)</li><li>Added: Full VM guest tools coverage — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      de: "<p>Fehlerbehebungs- und Treiber-Erkennungsversion: Intel-GPU-Falscherkennung in VMs behoben, VM-Gast-Toolpakete werden jetzt über systemd-detect-virt verwaltet, Drucker- und Eingabegeräte-Treibererkennung hinzugefügt, Fortschrittsbalken- und Auswahlfeld-Fehler behoben.</p><ul><li>Behoben: Intel-GPU-Pakete werden nicht mehr durch reine Chipsatz-Intel-Geräte in VMs geschützt (neue PCI-Klasse-03xx-Prüfung via lspci -n)</li><li>Behoben: VM-Gast-Tool-Pakete werden jetzt über systemd-detect-virt verwaltet, nicht über PCI-Vendor — behebt VirtualBox-VMSVGA-Falscherkennung</li><li>Behoben: root_helper.py war nicht mit gpu_pci_vendors/vm_guest_type aktualisiert — alle Korrekturen im Treiber-Tab greifen jetzt in der Produktion</li><li>Behoben: dracut_fw_dirs wird jetzt aus root_helper exportiert, der Firmware-Schutz-Set wird clientseitig korrekt neu aufgebaut</li><li>Behoben: Fortschrittsbalken zeigt bei unbestimmten Vorgängen nicht mehr 100% an</li><li>Behoben: Das Kontrollkästchen \"Alle auswählen\" wird nach Abschluss der Bereinigung in allen Tabs zurückgesetzt</li><li>Hinzugefügt: Broadcom proprietäre WLAN-Treiberpakete (PCI 14e4)</li><li>Hinzugefügt: Wacom-Tablet-Treiberpakete (USB 056a)</li><li>Hinzugefügt: Druckertreiberpakete für HP, Epson, Canon, Brother, Samsung, Kyocera (USB-Vendor-Erkennung)</li><li>Hinzugefügt: vollständige VM-Gast-Tool-Abdeckung — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      es: "<p>Versión de correcciones y mejoras de detección de drivers: falso positivo de Intel GPU en VMs corregido, paquetes de herramientas de VM guest gestionados ahora via systemd-detect-virt, detección de drivers de impresoras y dispositivos de entrada añadida, bugs de barra de progreso y checkbox \"Seleccionar todo\" corregidos.</p><ul><li>Corregido: los paquetes de GPU Intel ya no quedan protegidos por dispositivos de chipset Intel en máquinas virtuales (nueva comprobación de clase PCI 03xx con lspci -n)</li><li>Corregido: los paquetes de herramientas de VM guest ahora se gestionan via systemd-detect-virt, no por vendor PCI — resuelve el falso positivo de VirtualBox con VMSVGA</li><li>Corregido: root_helper.py no estaba actualizado con gpu_pci_vendors/vm_guest_type — todas las correcciones de la pestaña Drivers ahora se aplican en producción</li><li>Corregido: dracut_fw_dirs ahora se exporta desde root_helper, el protection set de firmwares se reconstruye correctamente en el cliente</li><li>Corregido: la barra de progreso ya no muestra 100% durante operaciones indeterminadas</li><li>Corregido: el checkbox \"Seleccionar todo\" ahora se desmarca al completar la limpieza en todas las pestañas</li><li>Añadido: paquetes de driver WiFi Broadcom propietario (PCI 14e4)</li><li>Añadido: paquetes de driver para tabletas Wacom (USB 056a)</li><li>Añadido: paquetes de driver de impresoras para HP, Epson, Canon, Brother, Samsung, Kyocera (detección por vendor USB)</li><li>Añadido: cobertura completa de herramientas de VM guest — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      fr: "<p>Version de corrections et améliorations de détection des pilotes : faux positif du GPU Intel dans les VM corrigé, paquets d'outils VM invités gérés via systemd-detect-virt, détection des pilotes d'imprimantes et de périphériques d'entrée ajoutée, bugs de la barre de progression et de la case à cocher corrigés.</p><ul><li>Corrigé : les paquets GPU Intel ne sont plus protégés par des périphériques de chipset Intel dans les VM (nouvelle vérification de classe PCI 03xx via lspci -n)</li><li>Corrigé : les paquets d'outils VM invités sont désormais gérés via systemd-detect-virt, pas par le vendeur PCI — résout le faux positif VirtualBox avec VMSVGA</li><li>Corrigé : root_helper.py n'était pas mis à jour avec gpu_pci_vendors/vm_guest_type — toutes les corrections de l'onglet Pilotes s'appliquent maintenant en production</li><li>Corrigé : dracut_fw_dirs est maintenant exporté depuis root_helper, l'ensemble de protection des firmwares est correctement reconstruit côté client</li><li>Corrigé : la barre de progression n'affiche plus 100% pendant les opérations indéterminées</li><li>Corrigé : la case \"Tout sélectionner\" se décoche maintenant à la fin du nettoyage dans tous les onglets</li><li>Ajouté : paquets de pilotes WiFi Broadcom propriétaires (PCI 14e4)</li><li>Ajouté : paquets de pilotes pour tablettes Wacom (USB 056a)</li><li>Ajouté : paquets de pilotes d'imprimantes pour HP, Epson, Canon, Brother, Samsung, Kyocera (détection par vendeur USB)</li><li>Ajouté : couverture complète des outils VM invités — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      it: "<p>Versione di correzioni e miglioramenti del rilevamento dei driver: falso positivo della GPU Intel nelle VM corretto, pacchetti degli strumenti VM ospite ora gestiti tramite systemd-detect-virt, rilevamento dei driver per stampanti e dispositivi di input aggiunto, bug della barra di avanzamento e della casella di selezione corretti.</p><ul><li>Corretto: i pacchetti GPU Intel non sono più protetti da dispositivi chipset Intel nelle VM (nuovo controllo classe PCI 03xx via lspci -n)</li><li>Corretto: i pacchetti degli strumenti VM ospite sono ora gestiti tramite systemd-detect-virt, non dal vendor PCI — risolve il falso positivo di VirtualBox con VMSVGA</li><li>Corretto: root_helper.py non era aggiornato con gpu_pci_vendors/vm_guest_type — tutte le correzioni della scheda Driver si applicano ora in produzione</li><li>Corretto: dracut_fw_dirs viene ora esportato da root_helper, il set di protezione firmware viene ricostruito correttamente lato client</li><li>Corretto: la barra di avanzamento non mostra più 100% durante le operazioni indeterminate</li><li>Corretto: la casella \"Seleziona tutto\" si deseleziona al completamento della pulizia in tutte le schede</li><li>Aggiunto: pacchetti driver WiFi Broadcom proprietari (PCI 14e4)</li><li>Aggiunto: pacchetti driver per tablet Wacom (USB 056a)</li><li>Aggiunto: pacchetti driver stampanti per HP, Epson, Canon, Brother, Samsung, Kyocera (rilevamento per vendor USB)</li><li>Aggiunto: copertura completa degli strumenti VM ospite — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      pt: "<p>Versão de correções e melhorias de deteção de controladores: falso positivo da GPU Intel em VMs corrigido, pacotes de ferramentas de VM convidada geridos via systemd-detect-virt, deteção de controladores de impressoras e dispositivos de entrada adicionada, bugs da barra de progresso e da caixa de seleção corrigidos.</p><ul><li>Corrigido: os pacotes GPU Intel já não ficam protegidos por dispositivos de chipset Intel em VMs (nova verificação de classe PCI 03xx via lspci -n)</li><li>Corrigido: os pacotes de ferramentas de VM convidada são agora geridos via systemd-detect-virt, não por vendor PCI — resolve o falso positivo do VirtualBox com VMSVGA</li><li>Corrigido: root_helper.py não estava atualizado com gpu_pci_vendors/vm_guest_type — todas as correções da aba Drivers aplicam-se agora em produção</li><li>Corrigido: dracut_fw_dirs é agora exportado a partir do root_helper, o conjunto de proteção de firmwares é reconstruído corretamente no cliente</li><li>Corrigido: a barra de progresso já não mostra 100% durante operações indeterminadas</li><li>Corrigido: a caixa \"Selecionar tudo\" é agora desmarcada ao concluir a limpeza em todos os separadores</li><li>Adicionado: pacotes de driver WiFi Broadcom proprietário (PCI 14e4)</li><li>Adicionado: pacotes de driver para tablets Wacom (USB 056a)</li><li>Adicionado: pacotes de driver de impressoras para HP, Epson, Canon, Brother, Samsung, Kyocera (deteção por vendor USB)</li><li>Adicionado: cobertura completa de ferramentas de VM convidada — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      ro: "<p>Versiune de remedieri și îmbunătățiri ale detecției driverelor: fals pozitiv GPU Intel în mașini virtuale remediat, pachetele de instrumente VM invitat gestionate acum prin systemd-detect-virt, detectare adăugată pentru drivere de imprimantă și dispozitive de intrare, erori ale barei de progres și casetei de selectare remediate.</p><ul><li>Rezolvat: pachetele GPU Intel nu mai sunt protejate de dispozitivele chipset Intel în VM-uri (nouă verificare clasă PCI 03xx via lspci -n)</li><li>Rezolvat: pachetele de instrumente VM invitat sunt acum gestionate prin systemd-detect-virt, nu prin vendor PCI — rezolvă fals pozitivul VirtualBox cu VMSVGA</li><li>Rezolvat: root_helper.py nu era actualizat cu gpu_pci_vendors/vm_guest_type — toate corecțiile filei Drivere se aplică acum în producție</li><li>Rezolvat: dracut_fw_dirs este acum exportat din root_helper, setul de protecție firmware este reconstruit corect pe client</li><li>Rezolvat: bara de progres nu mai afișează 100% în timpul operațiunilor nedeterminate</li><li>Rezolvat: caseta \"Selectează tot\" se debifează acum la finalizarea curățării în toate filele</li><li>Adăugat: pachete driver WiFi Broadcom proprietar (PCI 14e4)</li><li>Adăugat: pachete driver pentru tablete Wacom (USB 056a)</li><li>Adăugat: pachete driver imprimante pentru HP, Epson, Canon, Brother, Samsung, Kyocera (detecție după vendor USB)</li><li>Adăugat: acoperire completă instrumente VM invitat — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
      ru: "<p>Версия исправлений и улучшений обнаружения драйверов: исправлен ложноположительный результат GPU Intel в ВМ, пакеты инструментов гостевых ВМ теперь управляются через systemd-detect-virt, добавлено обнаружение драйверов принтеров и устройств ввода, исправлены ошибки прогресс-бара и чекбокса выбора всех элементов.</p><ul><li>Исправлено: пакеты GPU Intel больше не защищаются из-за устройств чипсета Intel в ВМ (новая проверка класса PCI 03xx через lspci -n)</li><li>Исправлено: пакеты инструментов гостевых ВМ теперь управляются через systemd-detect-virt, а не по PCI-вендору — устраняет ложноположительный результат VirtualBox с VMSVGA</li><li>Исправлено: root_helper.py не был обновлён с gpu_pci_vendors/vm_guest_type — все исправления вкладки «Драйверы» теперь применяются в production</li><li>Исправлено: dracut_fw_dirs теперь экспортируется из root_helper, набор защиты прошивок корректно пересоздаётся на стороне клиента</li><li>Исправлено: прогресс-бар больше не показывает 100% во время неопределённых операций</li><li>Исправлено: чекбокс «Выбрать всё» теперь сбрасывается после завершения очистки во всех вкладках</li><li>Добавлено: пакеты проприетарного WiFi-драйвера Broadcom (PCI 14e4)</li><li>Добавлено: пакеты драйвера для планшетов Wacom (USB 056a)</li><li>Добавлено: пакеты драйверов принтеров для HP, Epson, Canon, Brother, Samsung, Kyocera (определение по USB-вендору)</li><li>Добавлено: полное покрытие инструментов гостевых ВМ — VirtualBox, VMware, KVM/QEMU (SPICE), Hyper-V, Xen</li></ul>"
  - version: "1.0.2-1"
    type: stable
    unix-timestamp: 1776384000
    description:
      C: "<p>Bug fix and improvement release: Snap tab redesigned with full uninstall support, improved VM guest detection for all hypervisors, kernel removal now properly regenerates initramfs and updates GRUB, and all apt-get commands replaced with apt.</p><ul><li>Snap tab redesigned: two sections (installed snaps with --purge uninstall + old revisions), matching Flatpak tab design</li><li>VM guest detection via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels and more</li><li>Added Red Hat/Virtio PCI vendor 1af4 to hardware map for QEMU/KVM guest recognition</li><li>Fixed: kernel removal now runs dracut -f and update-grub after apt purge</li><li>Fixed: all apt-get replaced with apt throughout the root helper</li><li>Fixed: 27 untranslated strings added to all 8 language dictionaries</li></ul>"
      de: "<p>Fehlerbehebungs- und Verbesserungsversion: Snap-Tab mit vollständiger Deinstallationsunterstützung neu gestaltet, verbesserte Gast-VM-Erkennung für alle Hypervisoren, Kernel-Entfernung generiert jetzt Initramfs neu und aktualisiert GRUB, und alle apt-get-Befehle durch apt ersetzt.</p><ul><li>Snap-Tab neu gestaltet: zwei Bereiche (installierte Snaps mit --purge-Deinstallation + alte Revisionen), passend zum Flatpak-Tab</li><li>Gast-VM-Erkennung via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels und mehr</li><li>Red Hat/Virtio PCI-Anbieter 1af4 zur Hardware-Karte für QEMU/KVM-Gast-Erkennung hinzugefügt</li><li>Behoben: Kernel-Entfernung führt jetzt dracut -f und update-grub nach apt purge aus</li><li>Behoben: apt-get durch apt im gesamten Root-Helper ersetzt</li><li>Behoben: 27 nicht übersetzte Zeichenketten zu allen 8 Sprachwörterbüchern hinzugefügt</li></ul>"
      es: "<p>Versión de correcciones y mejoras: pestaña Snap rediseñada con desinstalación completa, detección mejorada de VM guest para todos los hipervisores, la eliminación de kernels regenera el initramfs y actualiza GRUB correctamente, y se reemplazó apt-get por apt.</p><ul><li>Pestaña Snap rediseñada: dos secciones (snaps instalados con desinstalación --purge + revisiones antiguas), igual que Flatpak</li><li>Detección de VM guest via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels y más</li><li>Añadido vendor PCI Red Hat/Virtio 1af4 al mapa de hardware para reconocer guests QEMU/KVM</li><li>Corregido: la eliminación de kernels ahora ejecuta dracut -f y update-grub tras apt purge</li><li>Corregido: apt-get reemplazado por apt en todo el helper de root</li><li>Corregido: 27 strings sin traducir añadidos a los 8 diccionarios de idioma</li></ul>"
      fr: "<p>Version de corrections et améliorations : onglet Snap repensé avec désinstallation complète, détection améliorée des VM invitées pour tous les hyperviseurs, la suppression de noyaux régénère maintenant l'initramfs et met à jour GRUB, et toutes les commandes apt-get remplacées par apt.</p><ul><li>Onglet Snap repensé : deux sections (snaps installés avec désinstallation --purge + anciennes révisions), identique à l'onglet Flatpak</li><li>Détection VM invitée via systemd-detect-virt : KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels et plus</li><li>Ajout du vendeur PCI Red Hat/Virtio 1af4 à la carte matérielle pour la reconnaissance des invités QEMU/KVM</li><li>Corrigé : la suppression du noyau exécute maintenant dracut -f et update-grub après apt purge</li><li>Corrigé : apt-get remplacé par apt dans tout le helper root</li><li>Corrigé : 27 chaînes non traduites ajoutées aux 8 dictionnaires de langues</li></ul>"
      it: "<p>Versione di correzioni e miglioramenti: scheda Snap riprogettata con supporto per la disinstallazione completa, rilevamento migliorato della VM ospite per tutti gli hypervisor, la rimozione del kernel ora rigenera l'initramfs e aggiorna GRUB, e tutti i comandi apt-get sostituiti con apt.</p><ul><li>Scheda Snap riprogettata: due sezioni (snap installati con disinstallazione --purge + vecchie revisioni), uguale alla scheda Flatpak</li><li>Rilevamento VM ospite via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels e altro</li><li>Aggiunto fornitore PCI Red Hat/Virtio 1af4 alla mappa hardware per il riconoscimento degli ospiti QEMU/KVM</li><li>Corretto: la rimozione del kernel esegue ora dracut -f e update-grub dopo apt purge</li><li>Corretto: apt-get sostituito con apt in tutto l'helper root</li><li>Corretto: 27 stringhe non tradotte aggiunte a tutti gli 8 dizionari delle lingue</li></ul>"
      pt: "<p>Versão de correções e melhorias: separador Snap redesenhado com suporte de desinstalação completa, deteção melhorada de VM convidada para todos os hipervisores, a remoção de kernels agora regenera o initramfs e atualiza o GRUB, e todos os comandos apt-get substituídos por apt.</p><ul><li>Separador Snap redesenhado: duas secções (snaps instalados com desinstalação --purge + revisões antigas), igual ao separador Flatpak</li><li>Deteção de VM convidada via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels e mais</li><li>Adicionado fornecedor PCI Red Hat/Virtio 1af4 ao mapa de hardware para reconhecimento de convidados QEMU/KVM</li><li>Corrigido: a remoção do kernel agora executa dracut -f e update-grub após apt purge</li><li>Corrigido: apt-get substituído por apt em todo o helper root</li><li>Corrigido: 27 strings não traduzidas adicionadas aos 8 dicionários de idiomas</li></ul>"
      ro: "<p>Versiune de remedieri și îmbunătățiri: fila Snap reproiectată cu suport complet de dezinstalare, detectare îmbunătățită a VM-ului invitat pentru toți hipervizoarele, eliminarea kernelului regenerează acum initramfs și actualizează GRUB, și toate comenzile apt-get înlocuite cu apt.</p><ul><li>Fila Snap reproiectată: două secțiuni (snap-uri instalate cu dezinstalare --purge + revizii vechi), similar cu fila Flatpak</li><li>Detectarea VM invitat via systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels și altele</li><li>Adăugat furnizor PCI Red Hat/Virtio 1af4 la harta hardware pentru recunoașterea oaspeților QEMU/KVM</li><li>Rezolvat: eliminarea kernelului execută acum dracut -f și update-grub după apt purge</li><li>Rezolvat: apt-get înlocuit cu apt în tot helperul root</li><li>Rezolvat: 27 de șiruri netraduse adăugate la toate cele 8 dicționare de limbi</li></ul>"
      ru: "<p>Версия с исправлениями и улучшениями: вкладка Snap переработана с поддержкой полного удаления, улучшенное обнаружение гостевых ВМ для всех гипервизоров, удаление ядра теперь правильно перегенерирует initramfs и обновляет GRUB, все команды apt-get заменены на apt.</p><ul><li>Вкладка Snap переработана: два раздела (установленные snaps с удалением --purge + старые ревизии), аналогично вкладке Flatpak</li><li>Обнаружение гостевой ВМ через systemd-detect-virt: KVM, QEMU, VMware, VirtualBox, Hyper-V, Xen, Parallels и другие</li><li>Добавлен PCI-вендор Red Hat/Virtio 1af4 в карту оборудования для распознавания гостей QEMU/KVM</li><li>Исправлено: удаление ядра теперь выполняет dracut -f и update-grub после apt purge</li><li>Исправлено: apt-get заменён на apt во всём root helper</li><li>Исправлено: 27 непереведённых строк добавлено во все 8 языковых словарей</li></ul>"
  - version: "1.0.2"
    type: stable
    unix-timestamp: 1774742400
    description:
      C: "<p>Major feature update: Installed Apps tab, Snap support, firmware sizes, selective APT cache cleanup, auto-scan on launch, GPU/KVM firmware protection and overview improvements.</p><ul><li>Added Installed Apps tab with search and selective uninstall</li><li>Added Snap old revisions tab in user mode, consistent with Flatpak</li><li>Firmware families now show disk usage in the Firmwares tab</li><li>APT Cache tab now lists individual .deb files for selective removal</li><li>User-mode scan starts automatically on launch</li><li>Fixed AMD/GPU and KVM/VMware/VirtualBox firmware and driver protection</li><li>Overview cards now follow tab order in both user and root modes</li><li>Added Select all docs button in Languages tab</li><li>Fixed: Flatpak tab redesigned with two sections — installed apps and unused runtimes</li><li>Fixed: Flatpak sizes now read actual disk usage; previously always showed 0 B</li><li>Fixed: Flatpak unused runtime detection now delegates to flatpak's own logic</li><li>Fixed: Firmware and kernel packages no longer appear in the Installed Apps tab</li><li>Fixed: Progress bar no longer stuck at 100% after scan completion</li></ul>"
      de: "<p>Großes Funktionsupdate: Tab für installierte Apps, Snap-Unterstützung, Firmware-Größen, selektive APT-Cache-Bereinigung, automatischer Scan beim Start, GPU/KVM-Firmware-Schutz und Übersichtsverbesserungen.</p><ul><li>Tab für installierte Apps mit Suche und selektiver Deinstallation hinzugefügt</li><li>Tab für alte Snap-Revisionen im Benutzermodus hinzugefügt, konsistent mit Flatpak</li><li>Firmware-Familien zeigen jetzt ihre Festplattennutzung im Firmwares-Tab</li><li>APT-Cache-Tab listet jetzt einzelne .deb-Dateien zur selektiven Löschung auf</li><li>Der Benutzermodus-Scan startet beim Start automatisch</li><li>Firmware- und Treiberschutz für AMD/GPU und KVM/VMware/VirtualBox korrigiert</li><li>Übersichtskarten folgen jetzt der Tab-Reihenfolge im Benutzer- und Root-Modus</li><li>Schaltfläche zur Auswahl aller Dokumentation im Sprachen-Tab hinzugefügt</li><li>Behoben: Flatpak-Tab neu gestaltet mit zwei Bereichen — installierte Apps und ungenutzte Runtimes</li><li>Behoben: Flatpak-Größen zeigen jetzt echte Festplattennutzung; zuvor immer 0 B angezeigt</li><li>Behoben: Erkennung ungenutzter Runtimes delegiert an flatpaks eigene Logik</li><li>Behoben: Firmware- und Kernel-Pakete erscheinen nicht mehr im Tab Installierte Apps</li><li>Behoben: Fortschrittsbalken bleibt nach dem Scan nicht mehr bei 100% stehen</li></ul>"
      es: "<p>Actualización mayor: pestaña de Apps instaladas, soporte Snap, tamaños de firmware, limpieza selectiva de caché APT, escaneo automático al inicio, protección de firmware GPU/KVM y mejoras en el resumen.</p><ul><li>Añadida pestaña de Apps instaladas con búsqueda y desinstalación selectiva</li><li>Añadida pestaña de revisiones antiguas de Snap en modo usuario, coherente con Flatpak</li><li>Las familias de firmware ahora muestran su uso de disco en la pestaña Firmwares</li><li>La pestaña Caché APT ahora lista los archivos .deb individuales para eliminación selectiva</li><li>El escaneo en modo usuario ahora se inicia automáticamente al abrir la aplicación</li><li>Corregida la protección de firmware y drivers de AMD/GPU y KVM/VMware/VirtualBox</li><li>Las tarjetas del resumen ahora siguen el orden de las pestañas en modo usuario y root</li><li>Añadido botón de seleccionar toda la documentación en la pestaña de Idiomas</li><li>Corregido: la pestaña Flatpak rediseñada con dos secciones — apps instaladas y runtimes sin uso</li><li>Corregido: los tamaños en Flatpak ahora muestran el uso real de disco; antes mostraban 0 B</li><li>Corregido: la detección de runtimes sin uso delega en la lógica interna de flatpak</li><li>Corregido: los paquetes de firmware y kernel ya no aparecen en la pestaña Apps instaladas</li><li>Corregido: la barra de progreso ya no se queda fija al 100% tras el escaneo</li></ul>"
      fr: "<p>Mise à jour majeure : onglet Applications installées, support Snap, tailles des firmwares, nettoyage sélectif du cache APT, analyse automatique au démarrage, protection des firmwares GPU/KVM et améliorations de l'aperçu.</p><ul><li>Ajout d'un onglet Applications installées avec recherche et désinstallation sélective</li><li>Ajout d'un onglet révisions Snap anciennes en mode utilisateur, cohérent avec Flatpak</li><li>Les familles de firmware affichent désormais leur espace disque dans l'onglet Firmwares</li><li>L'onglet Cache APT liste maintenant les fichiers .deb individuels pour une suppression sélective</li><li>L'analyse en mode utilisateur démarre automatiquement au lancement</li><li>Correction de la protection des firmwares et pilotes AMD/GPU et KVM/VMware/VirtualBox</li><li>Les cartes de l'aperçu suivent désormais l'ordre des onglets en mode utilisateur et root</li><li>Ajout d'un bouton pour sélectionner toute la documentation dans l'onglet Langues</li><li>Corrigé : onglet Flatpak repensé avec deux sections — apps installées et runtimes inutilisés</li><li>Corrigé : les tailles Flatpak affichent désormais l'espace disque réel ; auparavant toujours 0 o</li><li>Corrigé : la détection des runtimes inutilisés délègue à la logique interne de flatpak</li><li>Corrigé : les paquets firmware et kernel n'apparaissent plus dans l'onglet Apps installées</li><li>Corrigé : la barre de progression ne reste plus bloquée à 100 % après l'analyse</li></ul>"
      it: "<p>Aggiornamento importante: scheda App installate, supporto Snap, dimensioni firmware, pulizia selettiva della cache APT, scansione automatica all'avvio, protezione firmware GPU/KVM e miglioramenti alla panoramica.</p><ul><li>Aggiunta scheda App installate con ricerca e disinstallazione selettiva</li><li>Aggiunta scheda revisioni Snap precedenti in modalità utente, coerente con Flatpak</li><li>Le famiglie di firmware mostrano ora l'utilizzo del disco nella scheda Firmware</li><li>La scheda Cache APT elenca ora i singoli file .deb per la rimozione selettiva</li><li>La scansione in modalità utente si avvia automaticamente all'apertura</li><li>Corretta la protezione di firmware e driver AMD/GPU e KVM/VMware/VirtualBox</li><li>Le schede del riepilogo seguono ora l'ordine delle schede in modalità utente e root</li><li>Aggiunto pulsante per selezionare tutta la documentazione nella scheda Lingue</li><li>Corretto: scheda Flatpak riprogettata con due sezioni — app installate e runtime non utilizzati</li><li>Corretto: le dimensioni Flatpak mostrano ora l'uso reale del disco; prima mostravano sempre 0 B</li><li>Corretto: il rilevamento dei runtime non utilizzati delega alla logica interna di flatpak</li><li>Corretto: i pacchetti firmware e kernel non appaiono più nella scheda App installate</li><li>Corretto: la barra di avanzamento non rimane più bloccata al 100% dopo la scansione</li></ul>"
      pt: "<p>Atualização maior: separador de Apps instaladas, suporte a Snap, tamanhos de firmware, limpeza seletiva da cache APT, análise automática ao iniciar, proteção de firmware GPU/KVM e melhorias no resumo.</p><ul><li>Adicionado separador de Apps instaladas com pesquisa e desinstalação seletiva</li><li>Adicionado separador de revisões antigas do Snap no modo utilizador, coerente com o Flatpak</li><li>As famílias de firmware mostram agora o uso de disco no separador Firmwares</li><li>O separador Cache APT lista agora ficheiros .deb individuais para remoção seletiva</li><li>A análise em modo utilizador inicia automaticamente ao abrir a aplicação</li><li>Corrigida a proteção de firmware e drivers AMD/GPU e KVM/VMware/VirtualBox</li><li>Os cartões do resumo seguem agora a ordem dos separadores nos modos utilizador e root</li><li>Adicionado botão para selecionar toda a documentação no separador de Idiomas</li><li>Corrigido: separador Flatpak redesenhado com duas secções — apps instaladas e runtimes não utilizados</li><li>Corrigido: os tamanhos Flatpak mostram agora o uso real de disco; antes mostravam sempre 0 B</li><li>Corrigido: a deteção de runtimes não utilizados delega na lógica interna do flatpak</li><li>Corrigido: pacotes de firmware e kernel já não aparecem no separador Apps instaladas</li><li>Corrigido: a barra de progresso já não fica presa a 100% após a análise</li></ul>"
      ro: "<p>Actualizare majoră: filă Aplicații instalate, suport Snap, dimensiuni firmware, curățare selectivă a cache-ului APT, scanare automată la pornire, protecție firmware GPU/KVM și îmbunătățiri ale rezumatului.</p><ul><li>Adăugat tab Aplicații instalate cu căutare și dezinstalare selectivă</li><li>Adăugat tab cu revizii vechi Snap în modul utilizator, consistent cu Flatpak</li><li>Familiile de firmware afișează acum utilizarea discului în fila Firmware</li><li>Fila Cache APT listează acum fișierele .deb individuale pentru ștergere selectivă</li><li>Scanarea în modul utilizator pornește automat la lansare</li><li>Corectată protecția firmware și driverelor AMD/GPU și KVM/VMware/VirtualBox</li><li>Cardurile din rezumat urmează acum ordinea filelor în modurile utilizator și root</li><li>Adăugat buton pentru selectarea întregii documentații în fila Limbi</li><li>Rezolvat: fila Flatpak reproiectată cu două secțiuni — aplicații instalate și runtime-uri neutilizate</li><li>Rezolvat: dimensiunile Flatpak afișează acum utilizarea reală a discului; anterior afișau întotdeauna 0 B</li><li>Rezolvat: detectarea runtime-urilor neutilizate deleagă la logica internă a flatpak</li><li>Rezolvat: pachetele firmware și kernel nu mai apar în fila Aplicații instalate</li><li>Rezolvat: bara de progres nu mai rămâne blocată la 100% după scanare</li></ul>"
      ru: "<p>Крупное обновление: вкладка установленных приложений, поддержка Snap, размеры прошивок, выборочная очистка кэша APT, автосканирование при запуске, защита прошивок GPU/KVM и улучшения обзора.</p><ul><li>Добавлена вкладка установленных приложений с поиском и выборочным удалением</li><li>Добавлена вкладка старых ревизий Snap в режиме пользователя, аналогично Flatpak</li><li>Семейства прошивок теперь отображают занимаемое место на диске во вкладке Прошивки</li><li>Вкладка кэша APT теперь перечисляет отдельные файлы .deb для выборочного удаления</li><li>Сканирование в режиме пользователя запускается автоматически при открытии</li><li>Исправлена защита прошивок и драйверов AMD/GPU и KVM/VMware/VirtualBox</li><li>Карточки обзора теперь следуют порядку вкладок в режимах пользователя и root</li><li>Добавлена кнопка выбора всей документации во вкладке Языки</li><li>Исправлено: вкладка Flatpak переработана с двумя разделами — установленные приложения и неиспользуемые среды</li><li>Исправлено: размеры Flatpak теперь отображают реальное использование диска; ранее всегда показывали 0 Б</li><li>Исправлено: обнаружение неиспользуемых сред делегировано внутренней логике flatpak</li><li>Исправлено: пакеты прошивок и ядер больше не появляются во вкладке Установленные приложения</li><li>Исправлено: индикатор выполнения больше не застревает на 100% после сканирования</li></ul>"
  - version: "1.0.1"
    type: stable
    unix-timestamp: 1774396800
    description:
      C: "<p>Major update introducing Dual-Layer Scanning (User vs Root modes) to eliminate password prompts on startup.</p><ul><li>Added Flatpak unused runtimes cleaning</li><li>Added specific User Cache and Trash cleanup tabs working without root privileges</li><li>Dynamic UI tabs that reveal critical system features only after explicit root authorization</li><li>Fixed repeated pkexec password prompts when refreshing UI after cleanup tasks</li><li>Fixed Kernels tab appearing empty due to data mapping errors</li></ul>"
      de: "<p>Wichtiges Update mit Zweischicht-Scan (Benutzer- vs. Root-Modus) zur Vermeidung von Passwortabfragen beim Start.</p><ul><li>Bereinigung ungenutzter Flatpak-Runtimes hinzugefügt</li><li>Spezifische Tabs für Benutzer-Cache und Papierkorb hinzugefügt, die ohne Root-Rechte funktionieren</li><li>Dynamische UI-Tabs, die kritische Systemfunktionen erst nach expliziter Root-Autorisierung anzeigen</li><li>Wiederholte Passwortabfragen nach der UI-Aktualisierung behoben</li><li>Leerer Kernel-Tab aufgrund von Datenzuordnungsfehlern behoben</li></ul>"
      es: "<p>Actualización mayor que introduce el Escaneo de Doble Capa (Usuario vs Root) para eliminar peticiones de contraseña al inicio.</p><ul><li>Añadida limpieza de runtimes Flatpak sin uso</li><li>Añadidas pestañas específicas de Caché de Usuario y Papelera que funcionan sin privilegios de administrador</li><li>Pestañas de interfaz dinámicas que revelan funciones críticas del sistema solo tras autorización root explícita</li><li>Corregidas las peticiones repetidas de contraseña (pkexec) al refrescar la interfaz tras la limpieza</li><li>Corregida la pestaña de Kernels que aparecía vacía debido a errores de mapeo de datos</li></ul>"
      fr: "<p>Mise à jour majeure introduisant l'Analyse à Double Couche (Utilisateur vs Root) pour éliminer les invites de mot de passe au démarrage.</p><ul><li>Ajout du nettoyage des environnements d'exécution Flatpak inutilisés</li><li>Ajout d'onglets spécifiques pour le nettoyage du cache utilisateur et de la corbeille fonctionnant sans privilèges administration</li><li>Onglets d'interface dynamiques révélant les fonctions système critiques uniquement après autorisation root explicite</li><li>Correction des invites de mot de passe répétées lors de l'actualisation de l'interface après nettoyage</li><li>Correction de l'onglet Noyaux apparaissant vide en raison d'erreurs de mappage de données</li></ul>"
      it: "<p>Importante aggiornamento che introduce la Scansione a Doppio Strato (Utente vs Root) per eliminare le richieste di password all'avvio.</p><ul><li>Aggiunta pulizia dei runtime Flatpak non utilizzati</li><li>Aggiunte schede specifiche per la pulizia della Cache Utente e del Cestino funzionanti senza privilegi di root</li><li>Schede dinamiche che rivelano funzionalità critiche del sistema solo dopo l'autorizzazione esplicita di root</li><li>Corrette le richieste ripetute di password durante l'aggiornamento dell'interfaccia dopo la pulizia</li><li>Corretta la scheda Kernel che appariva vuota a causa di errori di mappatura dei dati</li></ul>"
      pt: "<p>Grande atualização introduzindo a Verificação de Dupla Camada (modos de Utilizador vs Root) para eliminar pedidos de palavra-passe no arranque.</p><ul><li>Adicionada limpeza de runtimes Flatpak não utilizados</li><li>Adicionadas abas específicas para limpeza de Cache de Utilizador e Lixeira a funcionar sem privilégios de administrador</li><li>Abas dinâmicas que revelam funcionalidades críticas do sistema apenas após autorização explícita de root</li><li>Corrigidos pedidos repetidos de palavra-passe ao atualizar a interface após as tarefas de limpeza</li><li>Corrigida a aba Kernels que aparecia vazia devido a erros de mapeamento de dados</li></ul>"
      ro: "<p>Actualizare majoră care introduce scanarea pe Două Niveluri (Utilizator vs Root) pentru eliminarea solicitărilor de parolă la pornire.</p><ul><li>Curățare Flatpak pentru a elimina formatele neutilizate</li><li>File specifice pentru curățarea memoriei Cache a utilizatorului și a Coșului de gunoi, care funcționează fără privilegii de root</li><li>File dinamice care dezvăluie funcționalități critice ale sistemului doar după autorizare root explicită</li><li>Corectate solicitările repetate de parolă la actualizarea interfeței după curățare</li><li>Fila Nucleelor (Kernels) apărea goală din cauza unor erori de mapare a datelor – rezolvat</li></ul>"
      ru: "<p>Крупное обновление, представляющее Двухслойное Сканирование (режимы Пользователя и Root) для устранения запросов пароля при запуске.</p><ul><li>Добавлена очистка неиспользуемых сред выполнения Flatpak</li><li>Добавлены вкладки очистки кэша пользователя и корзины, работающие без прав root</li><li>Динамические вкладки интерфейса, отображающие системные функции только после явной авторизации root</li><li>Исправлены повторяющиеся запросы пароля при обновлении интерфейса после задач очистки</li><li>Исправлена вкладка \"Ядра\", отображавшаяся пустой из-за ошибок сопоставления данных</li></ul>"
  - version: "1.0.0-2"
    type: stable
    unix-timestamp: 1773964800
    description:
      C: "<p>Fixed About dialog credits panel on KDE: the credits area now displays with an opaque dark background and square corners instead of transparent or rounded-corner artifacts. App icon standardized to 48×48 pixels.</p>"
      de: "<p>Korrektur des Kredit-Panels im Über-Dialog unter KDE: Der Kredit-Bereich wird jetzt mit opakem dunklem Hintergrund und eckigen Ecken dargestellt statt transparenter oder gerundeter Artefakte. App-Symbol auf 48×48 Pixel standardisiert.</p>"
      es: "<p>Corregido el panel de créditos del diálogo Acerca de en KDE: el área de créditos ahora se muestra con fondo oscuro opaco y esquinas rectas en lugar de artefactos transparentes o con esquinas redondeadas. Icono estandarizado a 48×48 píxeles.</p>"
      fr: "<p>Correction du panneau de crédits du dialogue À propos sous KDE : la zone de crédits s'affiche maintenant avec un fond sombre opaque et des coins carrés au lieu d'artefacts transparents ou arrondis. Icône standardisée à 48×48 pixels.</p>"
      it: "<p>Corretto il pannello crediti della finestra Info su KDE: l'area dei crediti ora mostra uno sfondo scuro opaco e angoli quadrati invece di artefatti trasparenti o con angoli arrotondati. Icona standardizzata a 48×48 pixel.</p>"
      pt: "<p>Corrigido o painel de créditos do diálogo Sobre no KDE: a área de créditos agora é exibida com fundo escuro opaco e cantos retos em vez de artefatos transparentes ou com cantos arredondados. Ícone padronizado para 48×48 pixels.</p>"
      ro: "<p>Corectat panoul de credite din dialogul Despre pe KDE: zona de credite se afișează acum cu fundal întunecat opac și colțuri drepte în loc de artefacte transparente sau cu colțuri rotunjite. Pictogramă standardizată la 48×48 pixeli.</p>"
      ru: "<p>Исправлена панель авторов в диалоге «О программе» в KDE: область авторов теперь отображается с непрозрачным тёмным фоном и прямыми углами вместо прозрачных или скруглённых артефактов. Значок стандартизирован до 48×48 пикселей.</p>"
  - version: "1.0.0-1"
    type: stable
    unix-timestamp: 1773964800
    description:
      C: "<p>Initial release of Soplos Sys Cleaner.</p><ul><li>Advanced GPU drivers and firmware cleanup tailored for Soplos Linux</li><li>Old kernel removal with direct initramfs integration (dracut.conf.d/soplos.conf)</li><li>System cache and temporary files cleaning</li><li>Recursive __pycache__ cleaning support</li><li>New intelligent cleanup tab for locales and translations</li><li>Professional HeaderBar matching WebApp Manager</li><li>Extended hardware monitoring (Temperature, GPU, Disk)</li><li>Native UI fitting the Soplos v2.0 standard across all desktop environments</li><li>Available in 8 languages</li><li>Added keyboard shortcuts: Ctrl+W to close, Ctrl+R to rescan, Ctrl+1–7 for tab navigation</li><li>Scan icon in Overview tab enlarged to 128px for better visibility</li><li>Fixed: action buttons now re-enable after failed or cancelled operations</li><li>Fixed: progress bar now closes after kernel cleanup completes</li><li>Fixed: translatable strings in GPU Drivers and Firmware tabs corrected to English</li><li>Fixed: socket files and symlinks excluded from Temp Files scanner</li><li>Fixed: temp file deletion uses pkexec fallback for root-owned files</li><li>Fixed: APT Cache scanner now includes package lists size</li><li>Fixed: Languages tab uses lazy loading to prevent post-scan UI freeze</li><li>Fixed: system usage metrics timer moved to background thread</li><li>Improved: fmt_size() consolidated in utils/constants.py, eliminating duplication across 6 files</li><li>Improved: duplicate constants and unused functions removed</li><li>Improved: Overview card strings fully translatable in all 8 languages</li><li>Added Ctrl+Tab / Ctrl+Shift+Tab shortcuts to cycle between tabs</li><li>Added F1 shortcut to open the About dialog</li><li>Fixed: GNOME HeaderBar now displays with correct dark background</li><li>Fixed: GNOME CSD window controls no longer affected by global button CSS</li></ul>"
      de: "<p>Erste Version von Soplos Sys Cleaner.</p><ul><li>Erweiterte Bereinigung von GPU-Treibern und Firmware, maßgeschneidert für Soplos Linux</li><li>Entfernung alter Kernel mit direkter initramfs-Integration (dracut.conf.d/soplos.conf)</li><li>Bereinigung von System-Cache und temporären Dateien</li><li>Unterstützung für rekursive __pycache__-Bereinigung</li><li>Neue intelligente Registerkarte zur Bereinigung von Gebietsschemata und Übersetzungen</li><li>Professionelle HeaderBar passend zum WebApp Manager</li><li>Erweiterte Hardware-Überwachung (Temperatur, GPU, Festplatte)</li><li>Native Benutzeroberfläche nach dem Soplos v2.0-Standard in allen Desktop-Umgebungen</li><li>Verfügbar in 8 Sprachen</li><li>Tastaturkürzel hinzugefügt: Strg+W zum Schließen, Strg+R zum erneuten Scannen, Strg+1–7 zur Tab-Navigation</li><li>Scan-Symbol auf der Übersicht-Registerkarte auf 128px vergrößert für bessere Sichtbarkeit</li><li>Behoben: Aktionsschaltflächen werden nach fehlgeschlagenen oder abgebrochenen Vorgängen wieder aktiviert</li><li>Behoben: Die Fortschrittsleiste schließt sich nach abgeschlossener Kernel-Bereinigung</li><li>Behoben: Übersetzbare Zeichenfolgen in GPU-Treiber- und Firmware-Registerkarten auf Englisch korrigiert</li><li>Behoben: Socket-Dateien und Symlinks vom Temp-Scanner ausgeschlossen</li><li>Behoben: Temp-Löschung nutzt pkexec-Fallback für Root-Dateien</li><li>Behoben: APT-Cache-Scanner enthält jetzt die Größe der Paketlisten</li><li>Behoben: Sprachen-Registerkarte verwendet Lazy Loading zur Vermeidung von UI-Hänger nach dem Scan</li><li>Behoben: Systemmetriken in Hintergrund-Thread verschoben</li><li>Verbessert: fmt_size() in utils/constants.py konsolidiert, Duplizierung in 6 Dateien beseitigt</li><li>Verbessert: Doppelte Konstanten und ungenutzte Funktionen entfernt</li><li>Verbessert: Übersichtskarten-Strings in allen 8 Sprachen vollständig übersetzbar</li><li>Tastaturkürzel Strg+Tab / Strg+Umschalt+Tab zum Wechseln zwischen Registerkarten hinzugefügt</li><li>Tastaturkürzel F1 zum Öffnen des Über-Dialogs hinzugefügt</li><li>Behoben: Die HeaderBar unter GNOME zeigt jetzt den korrekten dunklen Hintergrund</li><li>Behoben: GNOME-CSD-Steuerelemente werden nicht mehr durch das globale Button-CSS beeinflusst</li></ul>"
      es: "<p>Lanzamiento inicial de Soplos Sys Cleaner.</p><ul><li>Limpieza avanzada de drivers GPU y firmware adaptada para Soplos Linux</li><li>Eliminación de kernels antiguos con integración directa en initramfs (dracut.conf.d/soplos.conf)</li><li>Limpieza de caché del sistema y archivos temporales</li><li>Soporte para limpieza recursiva de __pycache__</li><li>Nueva pestaña de limpieza inteligente para locales y traducciones</li><li>HeaderBar profesional a juego con WebApp Manager</li><li>Monitoreo de hardware extendido (Temperatura, GPU, Disco)</li><li>Interfaz nativa adaptada al estándar v2.0 de Soplos en todos los entornos de escritorio</li><li>Disponible en 8 idiomas</li><li>Atajos de teclado añadidos: Ctrl+W para cerrar, Ctrl+R para reescanear, Ctrl+1–7 para navegar entre pestañas</li><li>Icono de escaneo en la pestaña General ampliado a 128px para mayor visibilidad</li><li>Corregido: los botones de acción se reactivan tras operaciones fallidas o canceladas</li><li>Corregido: la barra de progreso se cierra tras completar la limpieza de kernels</li><li>Corregido: textos traducibles en las pestañas de Drivers GPU y Firmware corregidos a inglés</li><li>Corregido: archivos de socket y enlaces simbólicos excluidos del escáner de archivos temporales</li><li>Corregido: eliminación de temporales usa pkexec para archivos de root</li><li>Corregido: la caché APT ahora incluye el tamaño de las listas de paquetes</li><li>Corregido: pestaña Idiomas usa carga diferida para evitar el freeze post-escaneo</li><li>Corregido: métricas del sistema movidas a hilo en segundo plano</li><li>Mejorado: fmt_size() consolidada en utils/constants.py, eliminando duplicación en 6 archivos</li><li>Mejorado: constantes duplicadas y funciones sin uso eliminadas</li><li>Mejorado: cadenas de las tarjetas del Resumen totalmente traducibles en los 8 idiomas</li><li>Añadidos atajos Ctrl+Tab / Ctrl+Shift+Tab para cambiar de pestaña</li><li>Añadido atajo F1 para abrir el diálogo Acerca de</li><li>Corregido: el HeaderBar en GNOME ahora muestra el fondo oscuro correcto</li><li>Corregido: los controles CSD de GNOME ya no se ven afectados por el CSS global de botones</li></ul>"
      fr: "<p>Sortie initiale de Soplos Sys Cleaner.</p><ul><li>Nettoyage avancé des pilotes GPU et micrologiciels adapté pour Soplos Linux</li><li>Suppression d'anciens noyaux avec intégration directe dans initramfs (dracut.conf.d/soplos.conf)</li><li>Nettoyage du cache système et des fichiers temporaires</li><li>Support de nettoyage récursif __pycache__</li><li>Nouvel onglet de nettoyage intelligent des locales et des traductions</li><li>HeaderBar professionnelle assortie à WebApp Manager</li><li>Surveillance matérielle étendue (Température, GPU, Disque)</li><li>Interface utilisateur native adaptée à la norme Soplos v2.0 dans tous les environnements de bureau</li><li>Disponible en 8 langues</li><li>Raccourcis clavier ajoutés : Ctrl+W pour fermer, Ctrl+R pour relancer l'analyse, Ctrl+1–7 pour naviguer entre les onglets</li><li>Icône d'analyse dans l'onglet Aperçu agrandie à 128px pour une meilleure visibilité</li><li>Corrigé : les boutons d'action se réactivent après des opérations échouées ou annulées</li><li>Corrigé : la barre de progression se ferme après la fin du nettoyage du noyau</li><li>Corrigé : les chaînes traduisibles dans les onglets Pilotes GPU et Micrologiciel corrigées en anglais</li><li>Corrigé : fichiers socket et liens symboliques exclus du scanner de fichiers temporaires</li><li>Corrigé : suppression des temporaires utilise pkexec pour les fichiers root</li><li>Corrigé : le cache APT inclut désormais la taille des listes de paquets</li><li>Corrigé : l'onglet Langues utilise le chargement différé pour éviter le gel post-analyse</li><li>Corrigé : métriques système déplacées dans un thread d'arrière-plan</li><li>Amélioré : fmt_size() consolidée dans utils/constants.py, supprimant la duplication dans 6 fichiers</li><li>Amélioré : constantes dupliquées et fonctions inutilisées supprimées</li><li>Amélioré : chaînes des cartes de la vue d'ensemble entièrement traduisibles dans les 8 langues</li><li>Ajout des raccourcis Ctrl+Tab / Ctrl+Shift+Tab pour naviguer entre les onglets</li><li>Ajout du raccourci F1 pour ouvrir la boîte de dialogue À propos</li><li>Corrigé : la HeaderBar sous GNOME affiche désormais le fond sombre correct</li><li>Corrigé : les contrôles CSD de GNOME ne sont plus affectés par le CSS global des boutons</li></ul>"
      it: "<p>Rilascio iniziale di Soplos Sys Cleaner.</p><ul><li>Pulizia avanzata di driver GPU e firmware adattata per Soplos Linux</li><li>Rimozione di vecchi kernel con integrazione diretta in initramfs (dracut.conf.d/soplos.conf)</li><li>Pulizia della cache di sistema e dei file temporanei</li><li>Supporto per la pulizia ricorsiva di __pycache__</li><li>Nuova scheda di pulizia intelligente per impostazioni locali e traduzioni</li><li>HeaderBar professionale abbinata a WebApp Manager</li><li>Monitoraggio hardware esteso (Temperatura, GPU, Disco)</li><li>Interfaccia nativa adattata allo standard v2.0 di Soplos in tutti gli ambienti desktop</li><li>Disponibile in 8 lingue</li><li>Scorciatoie da tastiera aggiunte: Ctrl+W per chiudere, Ctrl+R per ripetere la scansione, Ctrl+1–7 per navigare tra le schede</li><li>Icona di scansione nella scheda Panoramica ingrandita a 128px per una migliore visibilità</li><li>Corretto: i pulsanti di azione si riattivano dopo operazioni non riuscite o annullate</li><li>Corretto: la barra di avanzamento si chiude al termine della pulizia del kernel</li><li>Corretto: le stringhe traducibili nelle schede Driver GPU e Firmware corrette in inglese</li><li>Corretto: file socket e link simbolici esclusi dallo scanner dei file temporanei</li><li>Corretto: eliminazione temporanei usa pkexec per file di root</li><li>Corretto: cache APT include ora la dimensione delle liste pacchetti</li><li>Corretto: scheda Lingue usa caricamento lazy per evitare freeze post-scansione</li><li>Corretto: metriche di sistema spostate in thread in background</li><li>Migliorato: fmt_size() consolidata in utils/constants.py, eliminando la duplicazione in 6 file</li><li>Migliorato: costanti duplicate e funzioni inutilizzate rimosse</li><li>Migliorato: stringhe delle schede panoramica completamente traducibili in tutte le 8 lingue</li><li>Aggiunte scorciatoie Ctrl+Tab / Ctrl+Shift+Tab per navigare tra le schede</li><li>Aggiunta scorciatoia F1 per aprire la finestra Info</li><li>Corretto: la HeaderBar su GNOME ora mostra lo sfondo scuro corretto</li><li>Corretto: i controlli CSD di GNOME non sono più influenzati dal CSS globale dei pulsanti</li></ul>"
      pt: "<p>Lançamento inicial do Soplos Sys Cleaner.</p><ul><li>Limpeza avançada de drivers GPU e firmware adaptada para o Soplos Linux</li><li>Remoção de kernels antigos com integração direta no initramfs (dracut.conf.d/soplos.conf)</li><li>Limpeza de cache do sistema e ficheiros temporários</li><li>Suporte para limpeza recursiva de __pycache__</li><li>Nova aba de limpeza inteligente para idiomas e traduções</li><li>HeaderBar profissional combinando com o WebApp Manager</li><li>Monitoramento de hardware estendido (Temperatura, GPU, Disco)</li><li>Interface nativa adaptada ao padrão v2.0 do Soplos em todos os ambientes de trabalho</li><li>Disponível em 8 idiomas</li><li>Atalhos de teclado adicionados: Ctrl+W para fechar, Ctrl+R para reescanear, Ctrl+1–7 para navegar entre separadores</li><li>Ícone de análise no separador Visão Geral aumentado para 128px para maior visibilidade</li><li>Corrigido: os botões de ação voltam a ficar ativos após operações falhadas ou canceladas</li><li>Corrigido: a barra de progresso fecha após a conclusão da limpeza de kernels</li><li>Corrigido: textos traduzíveis nos separadores Drivers GPU e Firmware corrigidos para inglês</li><li>Corrigido: ficheiros socket e links simbólicos excluídos do scanner de ficheiros temporários</li><li>Corrigido: eliminação de temporários usa pkexec para ficheiros root</li><li>Corrigido: cache APT inclui agora o tamanho das listas de pacotes</li><li>Corrigido: separador Idiomas usa carregamento diferido para evitar freeze pós-análise</li><li>Corrigido: métricas do sistema movidas para thread em segundo plano</li><li>Melhorado: fmt_size() consolidada em utils/constants.py, eliminando duplicação em 6 ficheiros</li><li>Melhorado: constantes duplicadas e funções sem uso removidas</li><li>Melhorado: strings dos cartões da visão geral totalmente traduzíveis nos 8 idiomas</li><li>Adicionados atalhos Ctrl+Tab / Ctrl+Shift+Tab para navegar entre separadores</li><li>Adicionado atalho F1 para abrir o diálogo Sobre</li><li>Corrigido: a HeaderBar no GNOME apresenta agora o fundo escuro correto</li><li>Corrigido: os controlos CSD do GNOME já não são afetados pelo CSS global de botões</li></ul>"
      ro: "<p>Versiunea inițială a Soplos Sys Cleaner.</p><ul><li>Curățare avansată a driverelor GPU și a firmware-ului adaptată pentru Soplos Linux</li><li>Eliminarea kernel-urilor vechi cu integrare directă în initramfs (dracut.conf.d/soplos.conf)</li><li>Curățarea cache-ului sistemului și a fișierelor temporare</li><li>Suport pentru curățarea recursivă __pycache__</li><li>Filă nouă de curățare inteligentă pentru localizări și traduceri</li><li>HeaderBar profesional asortat cu WebApp Manager</li><li>Monitorizare hardware extinsă (Temperatură, GPU, Disc)</li><li>Interfață nativă adaptată la standardul v2.0 Soplos în toate mediile desktop</li><li>Disponibil în 8 limbi</li><li>Comenzi rapide adăugate: Ctrl+W pentru închidere, Ctrl+R pentru rescanare, Ctrl+1–7 pentru navigarea între file</li><li>Pictograma de scanare din fila Prezentare generală mărită la 128px pentru o mai bună vizibilitate</li><li>Rezolvat: butoanele de acțiune se reactivează după operațiuni eșuate sau anulate</li><li>Rezolvat: bara de progres se închide după finalizarea curățării kernel-ului</li><li>Rezolvat: șirurile traductibile din filele Drivere GPU și Firmware corectate în engleză</li><li>Rezolvat: fișierele socket și legăturile simbolice excluse din scanerul de fișiere temporare</li><li>Rezolvat: ștergerea temporarelor folosește pkexec pentru fișierele root</li><li>Rezolvat: cache-ul APT include acum dimensiunea listelor de pachete</li><li>Rezolvat: fila Limbi folosește încărcare leneșă pentru a preveni înghețarea după scanare</li><li>Rezolvat: metricile sistemului mutate într-un fir de fundal</li><li>Îmbunătățit: fmt_size() consolidată în utils/constants.py, eliminând duplicarea în 6 fișiere</li><li>Îmbunătățit: constante duplicate și funcții neutilizate eliminate</li><li>Îmbunătățit: șirurile cardurilor din prezentarea generală complet traductibile în toate cele 8 limbi</li><li>Adăugate comenzi rapide Ctrl+Tab / Ctrl+Shift+Tab pentru navigarea între file</li><li>Adăugată comanda rapidă F1 pentru deschiderea dialogului Despre</li><li>Rezolvat: HeaderBar-ul în GNOME afișează acum fundalul întunecat corect</li><li>Rezolvat: controalele CSD GNOME nu mai sunt afectate de CSS-ul global al butoanelor</li></ul>"
      ru: "<p>Первоначальный выпуск Soplos Sys Cleaner.</p><ul><li>Расширенная очистка драйверов GPU и прошивок, адаптированная для Soplos Linux</li><li>Удаление старых ядер с прямой интеграцией в initramfs (dracut.conf.d/soplos.conf)</li><li>Очистка системного кэша и временных файлов</li><li>Рекурсивная очистка __pycache__</li><li>Новая вкладка интеллектуальной очистки локалей и переводов</li><li>Профессиональный заголовок (HeaderBar), как в WebApp Manager</li><li>Расширенный мониторинг оборудования (Температура, GPU, Диск)</li><li>Нативный интерфейс по стандарту Soplos v2.0 для всех рабочих сред</li><li>Доступно на 8 языках</li><li>Добавлены сочетания клавиш: Ctrl+W — закрыть, Ctrl+R — повторить сканирование, Ctrl+1–7 — навигация по вкладкам</li><li>Значок сканирования на вкладке «Обзор» увеличен до 128px для лучшей видимости</li><li>Исправлено: кнопки действий снова активируются после неудачных или отменённых операций</li><li>Исправлено: полоса прогресса закрывается после завершения очистки ядер</li><li>Исправлено: переводимые строки во вкладках «Драйверы GPU» и «Прошивки» исправлены на английский</li><li>Исправлено: файлы сокетов и символические ссылки исключены из сканера временных файлов</li><li>Исправлено: удаление временных файлов использует pkexec для файлов root</li><li>Исправлено: сканер кэша APT теперь учитывает размер списков пакетов</li><li>Исправлено: вкладка «Языки» использует отложенную загрузку для предотвращения зависания после сканирования</li><li>Исправлено: метрики системы перенесены в фоновый поток</li><li>Улучшено: fmt_size() вынесена в utils/constants.py, устранено дублирование в 6 файлах</li><li>Улучшено: удалены дублирующиеся константы и неиспользуемые функции</li><li>Улучшено: строки карточек обзора полностью переводимы на все 8 языков</li><li>Добавлены сочетания клавиш Ctrl+Tab / Ctrl+Shift+Tab для переключения между вкладками</li><li>Добавлено сочетание F1 для открытия диалога «О программе»</li><li>Исправлено: HeaderBar в GNOME теперь отображает правильный тёмный фон</li><li>Исправлено: элементы управления CSD GNOME больше не затронуты глобальным CSS кнопок</li></ul>"
