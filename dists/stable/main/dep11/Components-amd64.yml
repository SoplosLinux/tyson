Type: desktop-application
ID: "org.soplos.systemservice"
Package: "soplos-system-service"
Name:
  C: "Soplos System Service"
  de: "Soplos System Service"
  es: "Soplos System Service"
  fr: "Soplos System Service"
  it: "Soplos System Service"
  pt: "Soplos System Service"
  ro: "Soplos System Service"
  ru: "Soplos System Service"
Summary:
  C: "Systemd service manager for Soplos Linux"
  de: "Systemd-Dienstverwaltung für Soplos Linux"
  es: "Gestor de servicios systemd para Soplos Linux"
  fr: "Gestionnaire de services systemd pour Soplos Linux"
  it: "Gestore dei servizi systemd per Soplos Linux"
  pt: "Gestor de serviços systemd para Soplos Linux"
  ro: "Manager de servicii systemd pentru Soplos Linux"
  ru: "Менеджер служб systemd для Soplos Linux"
Description:
  C: "<p>Soplos System Service shows what the systemd services of the computer are doing and lets you control them: start, stop, restart, enable and disable services and timers, read the system and per-service logs, see how long the system takes to boot and what slows it down, and get suggestions about what this computer does not need. Every change is recorded in a history and can be undone. A diagnosis page tells what is broken, based on what systemd and the package system report, and repairs it with apt, dpkg or systemctl after showing what will change.</p>"
  de: "<p>Soplos System Service zeigt den Zustand der systemd-Dienste des Computers und erlaubt deren Steuerung: Starten, Stoppen, Neustarten, Aktivieren und Deaktivieren von Diensten und Timern, Lesen der System- und Dienstprotokolle, Anzeigen der Bootdauer und was sie verlangsamt, sowie Vorschläge, was dieser Computer nicht benötigt. Jede Änderung wird im Verlauf gespeichert und kann rückgängig gemacht werden. Eine Diagnoseseite zeigt, was defekt ist, und repariert es mit apt, dpkg oder systemctl.</p>"
  es: "<p>Soplos System Service muestra el estado de los servicios systemd del equipo y permite controlarlos: iniciar, detener, reiniciar, habilitar y deshabilitar servicios y temporizadores, leer el registro del sistema y de cada servicio, ver cuánto tarda el arranque y qué lo ralentiza, y obtener sugerencias sobre lo que este equipo no necesita. Cada cambio queda registrado en el historial y puede deshacerse. Una página de diagnóstico indica qué está roto, basándose en lo que informan systemd y el sistema de paquetes, y lo repara con apt, dpkg o systemctl mostrando primero qué cambiará.</p>"
  fr: "<p>Soplos System Service affiche l'état des services systemd de l'ordinateur et permet de les contrôler : démarrer, arrêter, redémarrer, activer et désactiver les services et minuteries, lire les journaux du système et par service, voir la durée du démarrage et ce qui le ralentit, et obtenir des suggestions sur ce dont cet ordinateur n'a pas besoin. Chaque modification est enregistrée dans un historique et peut être annulée. Une page de diagnostic indique ce qui est cassé et le répare avec apt, dpkg ou systemctl après avoir montré ce qui changera.</p>"
  it: "<p>Soplos System Service mostra lo stato dei servizi systemd del computer e consente di controllarli: avviare, fermare, riavviare, abilitare e disabilitare servizi e timer, leggere i log di sistema e per servizio, vedere quanto impiega l'avvio e cosa lo rallenta, e ottenere suggerimenti su ciò di cui questo computer non ha bisogno. Ogni modifica viene registrata nella cronologia e può essere annullata. Una pagina di diagnosi indica cosa è rotto e lo ripara con apt, dpkg o systemctl mostrando prima cosa cambierà.</p>"
  pt: "<p>Soplos System Service mostra o estado dos serviços systemd do computador e permite controlá-los: iniciar, parar, reiniciar, ativar e desativar serviços e temporizadores, ler os registos do sistema e por serviço, ver quanto tempo demora o arranque e o que o atrasa, e obter sugestões sobre o que este computador não precisa. Cada alteração fica registada no histórico e pode ser desfeita. Uma página de diagnóstico indica o que está avariado e repara-o com apt, dpkg ou systemctl mostrando primeiro o que vai mudar.</p>"
  ro: "<p>Soplos System Service arată starea serviciilor systemd ale computerului și permite controlul lor: pornire, oprire, repornire, activare și dezactivare a serviciilor și timerelor, citirea jurnalelor de sistem și per serviciu, vizualizarea duratei de pornire și a cauzelor întârzierii, și sugestii despre ce nu are nevoie acest computer. Fiecare modificare este înregistrată în istoric și poate fi anulată. O pagină de diagnostic arată ce este defect și îl repară cu apt, dpkg sau systemctl după ce arată ce se va schimba.</p>"
  ru: "<p>Soplos System Service показывает состояние служб systemd компьютера и позволяет управлять ими: запускать, останавливать, перезапускать, включать и отключать службы и таймеры, читать системные журналы и журналы отдельных служб, видеть время загрузки и что её замедляет, а также получать рекомендации о том, что этому компьютеру не нужно. Каждое изменение записывается в историю и может быть отменено. Страница диагностики показывает, что сломано, и исправляет это с помощью apt, dpkg или systemctl, предварительно показывая, что изменится.</p>"
