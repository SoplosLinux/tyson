        Added F1 About dialog. Fixed HeaderBar CSS on GNOME so CSD window controls are no longer affected by the global button rule. Removed version subtitle from the HeaderBar.
      es: |-
        Añadido diálogo Acerca de con F1. Corregido el CSS del HeaderBar en GNOME para que los controles CSD no sean afectados por la regla global de botones. Eliminado el subtítulo de versión del HeaderBar.
      fr: |-
        Ajout du dialogue À propos avec F1. Correction du CSS HeaderBar sur GNOME pour que les contrôles CSD ne soient plus affectés par la règle globale des boutons. Suppression du sous-titre de version du HeaderBar.
      pt: |-
        Adicionado diálogo Sobre com F1. Corrigido CSS do HeaderBar no GNOME para que os controles CSD não sejam afetados pela regra global de botões. Removido o subtítulo de versão do HeaderBar.
      de: |-
        Über-Dialog mit F1 hinzugefügt. HeaderBar-CSS auf GNOME korrigiert, damit CSD-Fenstersteuerelemente nicht mehr von der globalen Schaltflächenregel betroffen sind. Versions-Untertitel aus der HeaderBar entfernt.
      it: |-
        Aggiunta finestra Info con F1. Corretto CSS HeaderBar su GNOME in modo che i controlli CSD non siano più influenzati dalla regola globale dei pulsanti. Rimosso il sottotitolo di versione dall'HeaderBar.
      ru: |-
        Добавлен диалог «О программе» по F1. Исправлен CSS HeaderBar в GNOME, чтобы элементы управления CSD больше не зависели от глобального правила кнопок. Убран подзаголовок версии из HeaderBar.
      ro: |-
        Adăugat dialog Despre cu F1. Corectat CSS HeaderBar pe GNOME pentru ca elementele de control CSD să nu mai fie afectate de regula globală a butoanelor. Eliminat subtitlul versiunii din HeaderBar.
      C: |-
        Added F1 About dialog. Fixed HeaderBar CSS on GNOME so CSD window controls are no longer affected by the global button rule. Removed version subtitle from the HeaderBar.
  - version: 2.0.0
    date: '2026-03-18'
    type: stable
    description:
      C: |-
        Version 2.0.0 - Complete modular architecture refactor with dynamic theme detection (no hardcoded lists), robust installer for nested archives, enhanced progress reporting, and full Wayland support. Includes unified environment sensing, robust KDE dark theme detection, unified single-password prompts for TTY, advanced GNOME and KDE previews (Wayland/TTY), and standard-compliant logging.
      es: |-
        Versión 2.0.0 - Refactorización modular completa con detección dinámica de temas (sin listas fijas), instalador robusto para archivos anidados, reporte de progreso mejorado y soporte total para Wayland. Incluye detección unificada de entorno, detección robusta del tema oscuro en KDE, prompts de una sola contraseña para TTY, vistas previas avanzadas en GNOME y KDE (Wayland/TTY) y registro de logs estandarizado.
      fr: |-
        Version 2.0.0 - Refonte modulaire complète avec détection dynamique des thèmes (pas de listes codées en dur), installateur robuste pour les archives imbriquées, rapport de progression amélioré et support Wayland complet. Comprend la détection d'environnement unifiée, une détection robuste du thème sombre KDE, des invites à mot de passe unique pour TTY, des aperçus GNOME et KDE avancés (Wayland/TTY) et des journaux conformes.
      pt: |-
        Versão 2.0.0 - Refatoração modular completa com detecção dinâmica de temas (sem listas fixas), instalador robusto para arquivos aninhados, relatório de progresso aprimorado e suporte total para Wayland. Inclui detecção de ambiente unificada, detecção robusta do tema escuro do KDE, prompts de senha única para TTY, visualizações avançadas do GNOME e KDE (Wayland/TTY) e logs padronizados.
      de: |-
        Version 2.0.0 - Vollständige modulare Refaktorierung mit dynamischer Themenerkennung (keine hardcodierten Listen), robuster Installer für verschachtelte Archive, verbesserte Fortschrittsanzeige und volle Wayland-Unterstützung. Enthält eine einheitliche Umgebungserkennung, robuste KDE-Dark-Theme-Erkennung, einheitliche Passwortabfragen für TTY, erweiterte GNOME- und KDE-Vorschauen (Wayland/TTY) und eine standardkonforme Protokollierung.
      it: |-
        Versione 2.0.0 - Refactoring modulare completo con rilevamento dinamico dei temi (senza liste fisse), installatore robusto per archivi nidificati, report di avanzamento migliorato e supporto Wayland completo. Include il rilevamento dell'ambiente unificato, il rilevamento robusto del tema scuro KDE, prompt a password singola per TTY, anteprime GNOME e KDE avanzate (Wayland/TTY) e log conformi agli standard.
      ru: |-
        Версия 2.0.0 - Полный модульный рефакторинг с динамическим обнаружением тем (без захардкорженных списков), надежным установщиком для вложенных архивов, улучшенным отображением прогресса и полной поддержкой Wayland. Включает унифицированное обнаружение среды, надежное определение темной темы KDE, единые запросы пароля для TTY, расширенные превью GNOME и KDE (Wayland/TTY) и стандартные логи.
      ro: |-
        Versiunea 2.0.0 - Refactorizare modulară completă cu detecție dinamică a temelor (fără liste fixe), instalator robust pentru arhive imbricate, raportare îmbunătățită a progresului și suport complet pentru Wayland. Include detecția unificată a mediului, detecția robustă a temei întunecate KDE, solicitări cu o singură parolă pentru TTY, previzualizări GNOME și KDE avansate (Wayland/TTY) și jurnalizare standardizată.
