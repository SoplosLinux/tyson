Releases:
  - version: 2.0.2-8
    date: '2026-08-01'
    type: stable
    description:
      en: |-
        New "Default Boot Mode" selector lets you choose between a fixed entry, the last installed kernel or the last booted kernel. Applying changes in General settings no longer pins the boot entry to the current kernel, which prevented newly installed kernels from ever being booted.
      es: |-
        El nuevo selector "Modo de arranque predeterminado" permite elegir entre una entrada fija, el último kernel instalado o el último kernel arrancado. Aplicar cambios en la configuración general ya no fija la entrada de arranque al kernel actual, lo que impedía que se arrancara nunca un kernel recién instalado.
      fr: |-
        Le nouveau sélecteur « Mode de démarrage par défaut » permet de choisir entre une entrée fixe, le dernier noyau installé ou le dernier noyau démarré. L'application des modifications dans les paramètres généraux ne fige plus l'entrée de démarrage sur le noyau actuel, ce qui empêchait tout noyau nouvellement installé d'être démarré.
      pt: |-
        O novo seletor "Modo de Arranque Padrão" permite escolher entre uma entrada fixa, o último kernel instalado ou o último kernel arrancado. Aplicar alterações nas definições gerais já não fixa a entrada de arranque no kernel atual, o que impedia que um kernel recém-instalado fosse arrancado.
      de: |-
        Die neue Auswahl „Standard-Boot-Modus“ erlaubt die Wahl zwischen einem festen Eintrag, dem zuletzt installierten Kernel oder dem zuletzt gestarteten Kernel. Das Anwenden von Änderungen in den allgemeinen Einstellungen legt den Boot-Eintrag nicht mehr auf den aktuellen Kernel fest, wodurch ein neu installierter Kernel nie gestartet wurde.
      it: |-
        Il nuovo selettore "Modalità di avvio predefinita" permette di scegliere tra una voce fissa, l'ultimo kernel installato o l'ultimo kernel avviato. Applicare le modifiche nelle impostazioni generali non fissa più la voce di avvio sul kernel attuale, il che impediva l'avvio di qualsiasi kernel appena installato.
      ru: |-
        Новый селектор «Режим загрузки по умолчанию» позволяет выбрать фиксированную запись, последнее установленное ядро или последнее загруженное ядро. Применение изменений в общих настройках больше не закрепляет загрузочную запись за текущим ядром, из-за чего только что установленное ядро никогда не загружалось.
      ro: |-
        Noul selector „Mod de boot implicit” permite alegerea între o intrare fixă, ultimul kernel instalat sau ultimul kernel pornit. Aplicarea modificărilor în setările generale nu mai fixează intrarea de pornire pe kernelul curent, ceea ce împiedica pornirea oricărui kernel nou instalat.
      C: |-
        New "Default Boot Mode" selector lets you choose between a fixed entry, the last installed kernel or the last booted kernel. Applying changes in General settings no longer pins the boot entry to the current kernel, which prevented newly installed kernels from ever being booted.
  - version: 2.0.2-7
    date: '2026-07-29'
    type: stable
    description:
      en: |-
        Screen resolution is no longer saved using its translated label, custom boot entries can now be enabled, disabled and deleted, and the launcher wrapper registers the window under the same identifier as the desktop file.
      es: |-
        La resolución de pantalla ya no se guarda con su etiqueta traducida, las entradas de arranque personalizadas ahora se pueden activar, desactivar y eliminar, y el lanzador registra la ventana con el mismo identificador que el archivo de escritorio.
      fr: |-
        La résolution d'écran n'est plus enregistrée avec son libellé traduit, les entrées de démarrage personnalisées peuvent maintenant être activées, désactivées et supprimées, et le lanceur enregistre la fenêtre sous le même identifiant que le fichier de bureau.
      pt: |-
        A resolução de ecrã já não é guardada com o seu rótulo traduzido, as entradas de arranque personalizadas podem agora ser ativadas, desativadas e eliminadas, e o lançador regista a janela com o mesmo identificador do ficheiro de ambiente de trabalho.
      de: |-
        Die Bildschirmauflösung wird nicht mehr mit ihrer übersetzten Bezeichnung gespeichert, benutzerdefinierte Boot-Einträge können jetzt aktiviert, deaktiviert und gelöscht werden, und der Starter registriert das Fenster unter derselben Kennung wie die Desktop-Datei.
      it: |-
        La risoluzione dello schermo non viene più salvata con la sua etichetta tradotta, le voci di avvio personalizzate ora possono essere attivate, disattivate ed eliminate, e il lanciatore registra la finestra con lo stesso identificatore del file desktop.
      ru: |-
        Разрешение экрана больше не сохраняется с переведённой подписью, пользовательские загрузочные записи теперь можно включать, отключать и удалять, а лаунчер регистрирует окно с тем же идентификатором, что и файл рабочего стола.
      ro: |-
        Rezoluția ecranului nu mai este salvată cu eticheta sa tradusă, intrările de pornire personalizate pot fi acum activate, dezactivate și șterse, iar lansatorul înregistrează fereastra cu același identificator ca fișierul desktop.
      C: |-
        Screen resolution is no longer saved using its translated label, custom boot entries can now be enabled, disabled and deleted, and the launcher wrapper registers the window under the same identifier as the desktop file.
  - version: 2.0.2-6
    date: '2026-07-23'
    type: stable
    description:
      en: |-
        Boot Entries tab now works for real: memtest entries can be disabled or removed, custom entries can be added, and duplicate/mislabeled entries were fixed.
      es: |-
        La pestaña de Entradas de arranque ahora funciona de verdad: las entradas de memtest se pueden desactivar o eliminar, se pueden añadir entradas personalizadas, y se corrigieron entradas duplicadas o mal etiquetadas.
      fr: |-
        L'onglet Entrées de démarrage fonctionne enfin réellement : les entrées memtest peuvent être désactivées ou supprimées, des entrées personnalisées peuvent être ajoutées, et les entrées dupliquées ou mal étiquetées ont été corrigées.
      pt: |-
        A aba Entradas de arranque agora funciona de verdade: as entradas de memtest podem ser desativadas ou removidas, entradas personalizadas podem ser adicionadas, e entradas duplicadas ou mal rotuladas foram corrigidas.
      de: |-
        Der Tab „Boot-Einträge" funktioniert jetzt wirklich: Memtest-Einträge können deaktiviert oder entfernt werden, benutzerdefinierte Einträge können hinzugefügt werden, und doppelte oder falsch beschriftete Einträge wurden behoben.
      it: |-
        La scheda Voci di avvio ora funziona davvero: le voci memtest possono essere disattivate o rimosse, si possono aggiungere voci personalizzate, e sono state corrette voci duplicate o etichettate male.
      ru: |-
        Вкладка загрузочных записей теперь действительно работает: записи memtest можно отключать или удалять, можно добавлять пользовательские записи, исправлены дублирующиеся или неверно подписанные записи.
      ro: |-
