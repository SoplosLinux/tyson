Releases:
  - version: "1.0.0-5"
    type: stable
    unix-timestamp: 1783382400
    description:
      de: "<p>Die Build-Abhängigkeit python3-all wurde durch python3 ersetzt.</p>"
      en: "<p>Build dependency python3-all replaced with python3.</p>"
      es: "<p>Se ha sustituido la dependencia de compilación python3-all por python3.</p>"
      fr: "<p>La dépendance de compilation python3-all a été remplacée par python3.</p>"
      it: "<p>La dipendenza di compilazione python3-all è stata sostituita con python3.</p>"
      pt: "<p>A dependência de compilação python3-all foi substituída por python3.</p>"
      ro: "<p>Dependența de compilare python3-all a fost înlocuită cu python3.</p>"
      ru: "<p>Зависимость сборки python3-all заменена на python3.</p>"
  - version: "1.0.0-4"
    type: stable
    unix-timestamp: 1777507200
    description:
      C: "<p>Simplified the footer UI text to match the modern Soplos standard layout. Added icon persistence and fixed theme support.</p><ul><li>WebApp icons are now saved permanently in the local data folder instead of the cache folder.</li><li>The application now correctly respects the system's light or dark GTK theme preference.</li></ul>"
      de: "<p>Der Text der Statusleiste wurde vereinfacht. Symbolpersistenz hinzugefügt und Unterstützung für helles/dunkles Systemdesign korrigiert.</p><ul><li>WebApp-Symbole werden nun dauerhaft im lokalen Datenordner anstatt im Cache gespeichert.</li><li>Die Anwendung respektiert nun korrekt die Systemeinstellung für ein helles oder dunkles GTK-Design.</li></ul>"
      en: "<p>Simplified the footer UI text to match the modern Soplos standard layout. Added icon persistence and fixed theme support.</p>"
      es: "<p>Se ha simplificado el texto de la barra de estado. Añadida persistencia de iconos y soporte corregido para el tema claro/oscuro del sistema.</p><ul><li>Los iconos de las WebApps se guardan de forma permanente en la carpeta local de datos en lugar de la caché.</li><li>La aplicación ahora respeta correctamente la preferencia del tema GTK claro u oscuro del sistema.</li></ul>"
      fr: "<p>Le texte de la barre d'état a été simplifié. Ajout de la persistance des icônes et correction de la prise en charge du thème clair/sombre du système.</p><ul><li>Les icônes WebApp sont désormais enregistrées de manière permanente dans le dossier de données local au lieu du cache.</li><li>L'application respecte désormais correctement la préférence de thème clair ou sombre du système.</li></ul>"
      it: "<p>Il testo della barra di stato è stato semplificato. Aggiunta la persistenza delle icone e corretto il supporto per il tema chiaro/scuro del sistema.</p><ul><li>Le icone delle WebApp vengono ora salvate in modo permanente nella cartella dati locale anziché nella cache.</li><li>L'applicazione ora rispetta correttamente la preferenza per il tema GTK chiaro o scuro del sistema.</li></ul>"
      pt: "<p>O texto da barra de status foi simplificado. Adicionada persistência de ícones e suporte corrigido para o tema claro/escuro do sistema.</p><ul><li>Os ícones dos WebApps agora são salvos permanentemente na pasta de dados local em vez do cache.</li><li>O aplicativo agora respeita corretamente a preferência do tema claro ou escuro do sistema.</li></ul>"
      ro: "<p>Textul barei de stare a fost simplificat. S-a adăugat persistența pictogramelor și s-a corectat suportul pentru tema deschisă/închisă a sistemului.</p><ul><li>Pictogramele WebApp sunt acum salvate permanent în folderul de date local în loc de memoria cache.</li><li>Aplicația respectă acum în mod corect preferința de temă deschisă sau închisă a sistemului.</li></ul>"
      ru: "<p>Текст строки состояния был упрощен. Добавлено сохранение значков и исправлена поддержка светлой/темной темы системы.</p><ul><li>Значки WebApp теперь сохраняются постоянно в локальной папке данных, а не в кеше.</li><li>Теперь приложение корректно учитывает системные настройки светлой или темной темы GTK.</li></ul>"
  - version: "1.0.0-3"
    type: stable
    unix-timestamp: 1774137600
    description:
      C: "<p>Fixed background color inconsistency in the main window.</p>"
      de: "<p>Inkonsistenz der Hintergrundfarbe im Hauptfenster behoben.</p>"
      es: "<p>Corregida la inconsistencia del color de fondo en la ventana principal.</p>"
      fr: "<p>Correction de l'incohérence de couleur de fond dans la fenêtre principale.</p>"
      it: "<p>Corretta l'incongruenza del colore di sfondo nella finestra principale.</p>"
      pt: "<p>Corrigida a inconsistência da cor de fundo na janela principal.</p>"
      ro: "<p>Corectată inconsistența culorii de fundal în fereastra principală.</p>"
      ru: "<p>Исправлена несоответствие цвета фона в главном окне.</p>"
  - version: "1.0.0-2"
    type: stable
    unix-timestamp: 1774051200
    description:
      C: "<p>About dialog added with F1 shortcut and GNOME application menu action.</p>"
      de: "<p>Über-Dialog hinzugefügt mit F1-Tastenkürzel und GNOME-Anwendungsmenü-Aktion.</p>"
      es: "<p>Diálogo Acerca de añadido con atajo F1 y acción en el menú de aplicación GNOME.</p>"
      fr: "<p>Dialogue À propos ajouté avec raccourci F1 et action dans le menu application GNOME.</p>"
      it: "<p>Finestra di dialogo Informazioni aggiunta con scorciatoia F1 e azione nel menu applicazione GNOME.</p>"
      pt: "<p>Diálogo Sobre adicionado com atalho F1 e ação no menu de aplicação GNOME.</p>"
      ro: "<p>Dialog Despre adăugat cu scurtătură F1 și acțiune în meniul aplicației GNOME.</p>"
      ru: "<p>Добавлен диалог «О программе» с горячей клавишей F1 и действием в меню приложения GNOME.</p>"
  - version: "1.0.0-1"
    type: stable
    unix-timestamp: 1773100800
    description:
      C: "<p>Standardized Soplos UI with official footer and environment detection. Added Incognito mode and expanded browser flags help.</p><ul><li>Official Soplos footer with system info and app version.</li><li>Real-time desktop environment and display protocol detection.</li><li>Incognito mode support for isolated private sessions.</li><li>Enhanced browser flags help dialog with key parameters guide.</li></ul>"
      de: "<p>Standardisierte Soplos-Benutzeroberfläche mit offizieller Fußzeile und Umgebungserkennung. Inkognito-Modus hinzugefügt und erweiterte Hilfe für Browser-Parameter.</p><ul><li>Offizielle Soplos-Fußzeile mit Systeminfo und App-Version.</li><li>Echtzeit-Erkennung von Desktop-Umgebung und Display-Protokoll.</li><li>Unterstützung des Inkognito-Modus für isolierte private Sitzungen.</li><li>Verbesserter Hilfe-Dialog für Browser-Parameter mit Leitfaden für Schlüsselparameter.</li></ul>"
      es: "<p>UI de Soplos estandarizada con footer oficial y detección de entorno. Añadido modo incógnito y ayuda de parámetros de navegación ampliada.</p><ul><li>Footer oficial de Soplos con info del sistema y versión de la app.</li><li>Detección en tiempo real del escritorio y protocolo de pantalla.</li><li>Soporte para modo incógnito en sesiones privadas aisladas.</li><li>Diálogo de ayuda de parámetros de navegador mejorado con guía de parámetros clave.</li></ul>"
      fr: "<p>Interface Soplos standardisée avec footer officiel et détection d'environnement. Ajout du mode incognito et aide aux paramètres de navigation étendue.</p><ul><li>Footer officiel de Soplos avec info système et version de l'application.</li><li>Détection en temps réel de l'environnement de bureau et du protocole d'affichage.</li><li>Prise en charge du mode incognito pour les sessions privées isolées.</li><li>Dialogue d'aide aux paramètres du navigateur amélioré avec guide des paramètres clés.</li></ul>"
      it: "<p>Interfaccia Soplos standardizzata con footer ufficiale e rilevamento dell'ambiente. Aggiunta modalità in incognito e guida ai parametri del browser espansa.</p><ul><li>Footer ufficiale di Soplos con info di sistema e versione dell'app.</li><li>Rilevamento in tempo reale dell'ambiente desktop e del protocollo di visualizzazione.</li><li>Supporto per la modalità in incognito per sessioni private isolate.</li><li>Finestra di aiuto ai parametri del browser migliorata con guida ai parametri chiave.</li></ul>"
      pt: "<p>Interface Soplos padronizada com rodapé oficial e deteção de ambiente. Adicionado modo de navegação anônima e ajuda de parâmetros de navegador expandida.</p><ul><li>Rodapé oficial da Soplos com info do sistema e versão da aplicação.</li><li>Deteção em tempo real de ambiente de desktop e protocolo de exibição.</li><li>Suporte para modo de navegação anônima para sessões privadas isoladas.</li><li>Diálogo de ajuda de parâmetros de navegador aprimorado com guia de parâmetros principais.</li></ul>"
      ro: "<p>Interfață Soplos standardizată cu subsol oficial și detectarea mediului. S-a adăugat modul incognito și ajutor extins pentru parametrii browserului.</p><ul><li>Subsol oficial Soplos cu informații despre sistem și versiunea aplicației.</li><li>Detectarea în timp real a mediului de desktop și a protocolului de afișare.</li><li>Suport pentru modul incognito pentru sesiuni private izolate.</li><li>Dialog de ajutor pentru parametrii browserului îmbunătățit cu ghid de parametri cheie.</li></ul>"
      ru: "<p>Стандартизированный интерфейс Soplos с официальным футером и определением окружения. Добавлен режим инкогнито и расширенная справка по параметрам браузера.</p><ul><li>Официальный футер Soplos с информацией о системе и версии приложения.</li><li>Определение окружения рабочего стола и протокола отображения в реальном времени.</li><li>Поддержка режима инкогнито для изолированных приватных сессий.</li><li>Улучшенный диалог справки по параметрам браузера с руководством по ключевым параметрам.</li></ul>"
  - version: "1.0.0"
    type: stable
    unix-timestamp: 1772582400
    description:
      C: "<p>Initial release with advanced management features.</p><ul><li>Full WebApp editing (Name, URL, Icon, Browser, and Navbar).</li><li>Extra browser parameters support (e.g. --start-maximized, --kiosk).</li><li>KDE Plasma 6 Wayland and XFCE icon mapping fixes.</li><li>Auto favicon loading and GTK3 native integration.</li></ul>"
      de: "<p>Erste Veröffentlichung mit erweiterten Verwaltungsfunktionen.</p><ul><li>Vollständige WebApp-Bearbeitung (Name, URL, Symbol, Browser und Leiste).</li><li>Zusätzliche Browser-Parameter (z.B. --start-maximized, --kiosk).</li><li>Fehlerbehebungen bei der Symbol-Zuordnung für KDE Plasma 6 Wayland und XFCE.</li><li>Automatisches Laden von Favicons und native GTK3-Integration.</li></ul>"
      es: "<p>Lanzamiento inicial con funciones de gestión avanzadas.</p><ul><li>Edición completa de WebApps (Nombre, URL, Icono, Navegador y Barra).</li><li>Soporte para parámetros extra del navegador (ej. --start-maximized, --kiosk).</li><li>Correcciones de mapeo de iconos para KDE Plasma 6 Wayland y XFCE.</li><li>Carga automática de favicons e integración nativa con GTK3.</li></ul>"
      fr: "<p>Sortie initiale avec des fonctions de gestion avancées.</p><ul><li>Édition complète des WebApps (Nom, URL, Icône, Navigateur et Barre).</li><li>Paramètres supplémentaires du navigateur (ex. --start-maximized, --kiosk).</li><li>Corrections du mappage des icônes pour KDE Plasma 6 Wayland et XFCE.</li><li>Chargement automatique des favicons et intégration native GTK3.</li></ul>"
      it: "<p>Versione iniziale con funzioni di gestione avanzate.</p><ul><li>Modifica completa delle WebApp (Nome, URL, Icona, Browser e Barra).</li><li>Supporto per parametri aggiuntivi del browser (es. --start-maximized, --kiosk).</li><li>Correzioni della mappatura delle icone per KDE Plasma 6 Wayland e XFCE.</li><li>Caricamento automatico delle favicon e integrazione nativa GTK3.</li></ul>"
      pt: "<p>Lançamento inicial com recursos avançados de gerenciamento.</p><ul><li>Edição completa de WebApps (Nome, URL, Ícone, Navegador e Barra).</li><li>Suporte para parâmetros extras do navegador (ex. --start-maximized, --kiosk).</li><li>Correções de mapeamento de ícones para KDE Plasma 6 Wayland e XFCE.</li><li>Carregamento automático de favicons e integração nativa GTK3.</li></ul>"
      ro: "<p>Lansare inițială cu funcții de gestionare avansate.</p><ul><li>Editare completă a aplicațiilor Web (Nume, URL, Pictogramă, Browser și Bară).</li><li>Suport pentru parametri suplimentari ai browserului (de ex. --start-maximized, --kiosk).</li><li>Corecții de mapare a pictogramelor pentru KDE Plasma 6 Wayland și XFCE.</li><li>Încărcarea automată a faviconurilor și integrarea nativă GTK3.</li></ul>"
      ru: "<p>Первый выпуск с расширенными функциями управления.</p><ul><li>Полное редактирование веб-приложений (имя, URL, значок, браузер и панель).</li><li>Поддержка дополнительных параметров браузера (напр. --start-maximized, --kiosk).</li><li>Исправления сопоставления значков для KDE Plasma 6 Wayland и XFCE.</li><li>Автоматическая загрузка фавиконов и нативная интеграция с GTK3.</li></ul>"
