Type: desktop-application
ID: "org.soplos.gamingpanel"
Package: "soplos-gaming-panel"
Name:
  C: "Soplos Gaming Panel"
Summary:
  C: "Live gaming companion for Soplos Linux"
Description:
  C: "<p>Soplos Gaming Panel is the visual surface of the machine while a game runs: it controls GameMode, reads and writes the configuration of MangoHud, watches the use of the processor, the graphics card, the memory, the temperatures, the fans and the voltages, and opens the games that are already installed, both from the menu of the desktop and from Steam.</p><p>A small overlay can be drawn over the game, with the cells the player ticks: frames per second, frametime, use and temperature of the processor and the graphics card, watts, clocks, VRAM, memory and network.</p><p>The tools it controls are the ones that Soplos Welcome installs in its Gaming Center. The panel does not install them again: it offers the same installation as a fallback when they are missing.</p>"
