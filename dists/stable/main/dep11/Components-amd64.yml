Releases:
  - version: 2.1.1-9
    date: '2026-08-04'
    type: stable
    description:
      en: |-
        Added Kudu, an all-in-one maintenance suite, to the Security tab, and Zed code editor to Development. BleachBit no longer shows "Recommended" — Soplos Sys Cleaner is the recommended cleaner.
      es: |-
        Añadidos Kudu, una suite de mantenimiento todo en uno, a la pestaña Seguridad, y el editor de código Zed a Desarrollo. BleachBit ya no muestra "Recomendado" — Soplos Sys Cleaner es el limpiador recomendado.
      fr: |-
        Ajout de Kudu, une suite de maintenance tout-en-un, à l'onglet Sécurité, et de l'éditeur de code Zed à Développement. BleachBit n'affiche plus « Recommandé » — Soplos Sys Cleaner est le nettoyeur recommandé.
      pt: |-
        Adicionados o Kudu, um pacote de manutenção tudo-em-um, ao separador Segurança, e o editor de código Zed a Desenvolvimento. O BleachBit deixou de mostrar "Recomendado" — o Soplos Sys Cleaner é o limpador recomendado.
      de: |-
        Kudu, eine All-in-one-Wartungssuite, wurde dem Tab „Sicherheit" hinzugefügt, sowie der Code-Editor Zed zu „Entwicklung". BleachBit zeigt nicht mehr „Empfohlen" an — Soplos Sys Cleaner ist der empfohlene Reiniger.
      it: |-
        Aggiunto Kudu, una suite di manutenzione tutto-in-uno, alla scheda Sicurezza, e l'editor di codice Zed a Sviluppo. BleachBit non mostra più "Consigliato" — Soplos Sys Cleaner è il pulitore consigliato.
      ru: |-
        В раздел «Безопасность» добавлен Kudu — универсальный набор для обслуживания системы, а в «Разработка» — редактор кода Zed. BleachBit больше не отмечен как «Рекомендуется» — рекомендуемым очистителем является Soplos Sys Cleaner.
      ro: |-
        Adaugat Kudu, o suita de intretinere all-in-one, in fila Securitate, si editorul de cod Zed in Dezvoltare. BleachBit nu mai afiseaza "Recomandat" — Soplos Sys Cleaner este curatatorul recomandat.
      C: |-
        Added Kudu, an all-in-one maintenance suite, to the Security tab, and Zed code editor to Development. BleachBit no longer shows "Recommended" — Soplos Sys Cleaner is the recommended cleaner.
  - version: 2.1.1-8
    date: '2026-08-03'
    type: stable
    description:
      en: |-
        Fixed NVIDIA driver detection for professional and laptop GPUs: Quadro, Tesla and RTX A-series cards were read as the chip codename and ended up on the wrong branch, and the 610 and 590 buttons were greyed out on cards that support them. The GT 750M and unrecognised cards no longer get a branch that cannot build. Nouveau and the AMD stack are now detected correctly on Wayland, and the Nouveau button offers to remove the NVIDIA drivers instead of doing nothing. The CUDA 12 installer no longer leaves an unverified repository enabled.
      es: |-
        Corregida la detección del driver NVIDIA en GPUs profesionales y de portátil: las Quadro, Tesla y RTX A-series se leían como el nombre en clave del chip y acababan en la rama equivocada, y los botones 610 y 590 salían deshabilitados en tarjetas que sí los soportan. La GT 750M y las tarjetas no reconocidas ya no reciben una rama que no puede compilar. Nouveau y el stack de AMD se detectan ahora correctamente en Wayland, y el botón de Nouveau ofrece eliminar los drivers NVIDIA en lugar de no hacer nada. El instalador de CUDA 12 ya no deja un repositorio sin verificar habilitado.
      fr: |-
        Correction de la détection du pilote NVIDIA pour les GPU professionnels et de portable : les cartes Quadro, Tesla et RTX A-series étaient lues comme le nom de code de la puce et se retrouvaient sur la mauvaise branche, et les boutons 610 et 590 étaient grisés sur des cartes qui les prennent en charge. La GT 750M et les cartes non reconnues ne reçoivent plus une branche impossible à compiler. Nouveau et la pile AMD sont désormais détectés correctement sous Wayland, et le bouton Nouveau propose de supprimer les pilotes NVIDIA au lieu de ne rien faire. L'installateur CUDA 12 ne laisse plus un dépôt non vérifié activé.
      pt: |-
        Corrigida a deteção do controlador NVIDIA em GPUs profissionais e de portátil: as placas Quadro, Tesla e RTX A-series eram lidas como o nome de código do chip e acabavam no ramo errado, e os botões 610 e 590 apareciam desativados em placas que os suportam. A GT 750M e as placas não reconhecidas deixam de receber um ramo que não consegue compilar. O nouveau e a pilha AMD são agora detetados corretamente em Wayland, e o botão Nouveau propõe remover os controladores NVIDIA em vez de não fazer nada. O instalador do CUDA 12 já não deixa um repositório não verificado ativo.
      de: |-
        Behoben: Die NVIDIA-Treibererkennung bei professionellen und Laptop-GPUs. Quadro-, Tesla- und RTX-A-Karten wurden als Chip-Codename gelesen und landeten im falschen Zweig, und die Schaltflächen 610 und 590 waren bei Karten ausgegraut, die sie unterstützen. Die GT 750M und unbekannte Karten erhalten keinen Zweig mehr, der nicht gebaut werden kann. Nouveau und der AMD-Stack werden unter Wayland nun korrekt erkannt, und die Nouveau-Schaltfläche bietet an, die NVIDIA-Treiber zu entfernen, statt nichts zu tun. Der CUDA-12-Installer lässt kein unverifiziertes Repository mehr aktiviert.
      it: |-
        Corretto il rilevamento del driver NVIDIA su GPU professionali e da portatile: le schede Quadro, Tesla e RTX A-series venivano lette come nome in codice del chip e finivano nel ramo sbagliato, e i pulsanti 610 e 590 risultavano disattivati su schede che li supportano. La GT 750M e le schede non riconosciute non ricevono più un ramo che non può essere compilato. Nouveau e lo stack AMD vengono ora rilevati correttamente su Wayland, e il pulsante Nouveau propone di rimuovere i driver NVIDIA invece di non fare nulla. L'installer di CUDA 12 non lascia più attivo un repository non verificato.
      ru: |-
        Исправлено определение драйвера NVIDIA для профессиональных и ноутбучных видеокарт: карты Quadro, Tesla и RTX A-серии считывались как кодовое имя чипа и попадали не в ту ветку, а кнопки 610 и 590 были недоступны на картах, которые их поддерживают. GT 750M и нераспознанные карты больше не получают ветку, которую невозможно собрать. Nouveau и стек AMD теперь корректно определяются в Wayland, а кнопка Nouveau предлагает удалить драйверы NVIDIA вместо бездействия. Установщик CUDA 12 больше не оставляет включённым непроверенный репозиторий.
      ro: |-
        Corectata detectarea driverului NVIDIA pentru GPU-uri profesionale si de laptop: placile Quadro, Tesla si RTX A-series erau citite ca nume de cod al cipului si ajungeau pe ramura gresita, iar butoanele 610 si 590 apareau dezactivate pe placi care le suporta. GT 750M si placile nerecunoscute nu mai primesc o ramura care nu poate fi compilata. Nouveau si stiva AMD sunt acum detectate corect pe Wayland, iar butonul Nouveau propune eliminarea driverelor NVIDIA in loc sa nu faca nimic. Instalatorul CUDA 12 nu mai lasa activ un depozit neverificat.
      C: |-
        Fixed NVIDIA driver detection for professional and laptop GPUs: Quadro, Tesla and RTX A-series cards were read as the chip codename and ended up on the wrong branch, and the 610 and 590 buttons were greyed out on cards that support them. The GT 750M and unrecognised cards no longer get a branch that cannot build. Nouveau and the AMD stack are now detected correctly on Wayland, and the Nouveau button offers to remove the NVIDIA drivers instead of doing nothing. The CUDA 12 installer no longer leaves an unverified repository enabled.
  - version: 2.1.1-7
    date: '2026-07-27'
    type: stable
    description:
      en: |-
        Removed dead cleanup code in the PRIME Render Offload script for a file no longer written anywhere in the project. Added ART, a RAW photo editor, to the Recommended tab.
      es: |-
        Eliminado código de limpieza muerto en el script de PRIME Render Offload para un archivo que ya no escribe ninguna parte del proyecto. Añadido ART, un editor de fotos RAW, a la pestaña Recomendado.
      fr: |-
        Suppression d'un code de nettoyage mort dans le script PRIME Render Offload pour un fichier que plus rien dans le projet n'écrit. Ajout d'ART, un éditeur de photos RAW, à l'onglet Recommandé.
      pt: |-
        Removido código de limpeza morto no script PRIME Render Offload para um ficheiro que já não é escrito por nada no projeto. Adicionado o ART, um editor de fotos RAW, ao separador Recomendado.
      de: |-
        Toten Bereinigungscode im PRIME-Render-Offload-Skript für eine Datei entfernt, die von nichts im Projekt mehr geschrieben wird. ART, ein RAW-Fotoeditor, wurde dem Tab „Empfohlen" hinzugefügt.
      it: |-
        Rimosso codice di pulizia morto nello script PRIME Render Offload per un file che nel progetto non viene più scritto da nulla. Aggiunto ART, un editor di foto RAW, alla scheda Consigliati.
      ru: |-
        Удалён неработающий код очистки в скрипте PRIME Render Offload для файла, который в проекте больше нигде не создаётся. В раздел «Рекомендуемое» добавлен ART, редактор RAW-фото.
      ro: |-
        Eliminat codul de curatare mort din scriptul PRIME Render Offload pentru un fisier pe care nimic din proiect nu il mai scrie. Adaugat ART, un editor de fotografii RAW, in fila Recomandat.
      C: |-
        Removed dead cleanup code in the PRIME Render Offload script for a file no longer written anywhere in the project. Added ART, a RAW photo editor, to the Recommended tab.
  - version: 2.1.1-6
    date: '2026-07-27'
    type: stable
    description:
      en: |-
        Fixed installing an NVIDIA driver leaving the system with no graphics driver at all: the kernel build tree is now verified before installing and the process stops if DKMS cannot build the module. The compatibility patch for Soplos 7.x kernels is now applied by Welcome too, and the NVIDIA repository is removed after installing. Turing and newer now recommend the 610 branch.
      es: |-
        Corregido que instalar un driver NVIDIA pudiera dejar el sistema sin ningún driver gráfico: ahora se verifica el árbol de compilación del kernel antes de instalar y el proceso se detiene si DKMS no puede construir el módulo. El parche de compatibilidad para los kernels Soplos 7.x ya se aplica también desde Welcome, y el repositorio de NVIDIA se retira tras la instalación. Turing y posteriores pasan a recomendar la rama 610.
      fr: |-
        Corrigé le fait que l'installation d'un pilote NVIDIA pouvait laisser le système sans aucun pilote graphique : l'arborescence de compilation du noyau est désormais vérifiée avant l'installation et le processus s'arrête si DKMS ne peut pas compiler le module. Le correctif de compatibilité pour les noyaux Soplos 7.x est maintenant appliqué aussi par Welcome, et le dépôt NVIDIA est supprimé après l'installation. Turing et plus récent recommandent désormais la branche 610.
      pt: |-
        Corrigido o facto de instalar um controlador NVIDIA poder deixar o sistema sem qualquer controlador gráfico: a árvore de compilação do kernel é agora verificada antes de instalar e o processo para se o DKMS não conseguir compilar o módulo. O patch de compatibilidade para os kernels Soplos 7.x passa a ser aplicado também pelo Welcome, e o repositório NVIDIA é removido após a instalação. Turing e posteriores passam a recomendar o ramo 610.
      de: |-
        Behoben: Die Installation eines NVIDIA-Treibers konnte das System ohne jeden Grafiktreiber zurücklassen. Der Kernel-Build-Baum wird nun vor der Installation geprüft und der Vorgang bricht ab, wenn DKMS das Modul nicht bauen kann. Der Kompatibilitäts-Patch für Soplos-7.x-Kernel wird jetzt auch von Welcome angewendet, und das NVIDIA-Repository wird nach der Installation entfernt. Turing und neuer empfehlen nun den Zweig 610.
      it: |-
        Corretto il fatto che l'installazione di un driver NVIDIA potesse lasciare il sistema senza alcun driver grafico: l'albero di compilazione del kernel viene ora verificato prima di installare e il processo si interrompe se DKMS non riesce a compilare il modulo. La patch di compatibilità per i kernel Soplos 7.x viene ora applicata anche da Welcome, e il repository NVIDIA viene rimosso dopo l'installazione. Turing e successive raccomandano ora il ramo 610.
      ru: |-
        Исправлено: установка драйвера NVIDIA могла оставить систему вообще без графического драйвера. Теперь перед установкой проверяется дерево сборки ядра, и процесс останавливается, если DKMS не может собрать модуль. Патч совместимости для ядер Soplos 7.x теперь применяется и в Welcome, а репозиторий NVIDIA удаляется после установки. Для Turing и новее теперь рекомендуется ветка 610.
      ro: |-
        Corectat faptul ca instalarea unui driver NVIDIA putea lasa sistemul fara niciun driver grafic: arborele de compilare al kernelului este acum verificat inainte de instalare, iar procesul se opreste daca DKMS nu poate compila modulul. Patch-ul de compatibilitate pentru kernelurile Soplos 7.x se aplica acum si din Welcome, iar depozitul NVIDIA este eliminat dupa instalare. Turing si mai nou recomanda acum ramura 610.
      C: |-
        Fixed installing an NVIDIA driver leaving the system with no graphics driver at all: the kernel build tree is now verified before installing and the process stops if DKMS cannot build the module. The compatibility patch for Soplos 7.x kernels is now applied by Welcome too, and the NVIDIA repository is removed after installing. Turing and newer now recommend the 610 branch.
  - version: 2.1.1-5
    date: '2026-07-27'
    type: stable
    description:
      en: |-
        Fixed NVIDIA 590/610 installation failing due to a conflicting package combination; they now install open kernel modules correctly. Fixed the app silently reporting success even when an install script actually failed.
      es: |-
        Corregido el fallo de instalación de NVIDIA 590/610 causado por una combinación de paquetes en conflicto; ahora instalan correctamente los módulos de kernel abiertos. Corregido que la aplicación reportara éxito aunque el script de instalación fallara realmente.
      fr: |-
        Correction de l'échec d'installation de NVIDIA 590/610 causé par une combinaison de paquets en conflit ; ils installent désormais correctement les modules de noyau ouverts. Correction du signalement erroné de succès par l'application alors que le script d'installation avait réellement échoué.
      pt: |-
        Corrigida a falha de instalação do NVIDIA 590/610 causada por uma combinação de pacotes em conflito; agora instalam corretamente os módulos de kernel abertos. Corrigido o facto de a aplicação reportar sucesso mesmo quando o script de instalação falhava.
      de: |-
        Behoben: Die Installation von NVIDIA 590/610 schlug wegen einer widersprüchlichen Paketkombination fehl; sie installieren nun korrekt die offenen Kernel-Module. Behoben, dass die App fälschlich Erfolg meldete, obwohl das Installationsskript tatsächlich fehlgeschlagen war.
      it: |-
        Corretto il fallimento dell'installazione di NVIDIA 590/610 causato da una combinazione di pacchetti in conflitto; ora installano correttamente i moduli del kernel aperti. Corretto il fatto che l'app segnalasse un successo anche quando lo script di installazione falliva realmente.
      ru: |-
        Исправлен сбой установки NVIDIA 590/610, вызванный конфликтующей комбинацией пакетов; теперь корректно устанавливаются открытые модули ядра. Исправлено ложное сообщение об успехе, даже если скрипт установки на самом деле завершался с ошибкой.
      ro: |-
