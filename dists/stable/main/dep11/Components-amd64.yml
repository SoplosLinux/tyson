Releases:
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794873600
    description:
      C: "<p>First stable release.</p>"
  - version: "3.0.1-2-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>After cleaning drivers or firmware, the initramfs of every kernel is rebuilt with update-initramfs, which also copies it to the EFI partition when the system boots with systemd-boot. Before, only the running kernel was rebuilt.</p>"
  - version: "3.0.1-1-beta"
    type: stable
    unix-timestamp: 1794441600
    description:
      C: "<p>Program leftovers lists only the folders whose program the system proves is gone: the data of a Flatpak or a snap that is not installed, and a folder with exactly the name of a removed package when nothing installed has that name. Nothing is guessed any more, and nothing comes selected. The tracker service of 3.0.1-beta is removed, and upgrading deletes the file it kept. Orphaned packages no longer offers the package that holds the signing key of a repository that is still configured. The scrollbar of the sidebar no longer covers its rows, and the About dialog shows the full package version.</p>"
  - version: "3.0.1-beta"
    type: stable
    unix-timestamp: 1794441600
    description:
      C: "<p>New page, Program leftovers: the folders that uninstalled programs left in the home folder, found by working out which program made each of them and whether it is still installed. What is cleaned goes to the Trash. A small service records which program creates each folder.</p>"
  - version: "3.0.0-9-beta"
    type: stable
    unix-timestamp: 1793750400
    description:
      C: "<p>The button that cleans the selection stays fixed at the bottom of the window, and the manual page describes the Snapshots and Disk space pages.</p>"
  - version: "3.0.0-8-beta"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>The window no longer has the frame of the system: it is a card with rounded corners and its own minimize, maximize and close buttons.</p>"
  - version: "3.0.0-7-beta"
    type: stable
    unix-timestamp: 1793145600
    description:
      C: "<p>New application icon, new hero image and new screenshots, taken with the interface in English.</p>"
  - version: "3.0.0-6-beta"
    type: stable
    unix-timestamp: 1792886400
    description:
      C: "<p>Snapshots: the list is read when the page opens, with a single password. Timeshift snapshots in BTRFS mode now show their size when the BTRFS quotas are on, and a dash instead of 0 B when the size cannot be told.</p>"
  - version: "3.0.0-5-beta"
    type: stable
    unix-timestamp: 1792800000
    description:
      C: "<p>New Disk space page, in a new Analysis group: where the space goes, folder by folder, for your user or the whole system, with the option to read as administrator. It only shows; nothing is deleted from there.</p><p>Documentation: every package folder under /usr/share/doc is listed, whatever its size, so the user chooses what goes. Before, only the ones over 1 MB were.</p><p>Long paths no longer widen the table past the window.</p>"
  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>New Snapshots category: lists, deletes and makes the restore points of Timeshift (rsync and BTRFS) and Snapper, always keeping the newest one of each.</p><p>The window follows the light or dark theme of the desktop (Xfce, Plasma and GNOME), and the button of the sidebar still lets you choose.</p><p>Wider sidebar whose scroll bar no longer sits on the figures, and the type errors of the project fixed.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Full 8-language internationalization across desktop launchers and AppStream metadata.</p><p>Added Unix manual page documentation (soplos-sys-cleaner.1) installed to /usr/share/man/man1/.</p><p>Updated Debian packaging and application documentation.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1791936000
    description:
      C: "<p>Orphaned packages, every kind of installed app in one list with a reinstall script, animated health rings, and alerts that reach GNOME.</p><ul><li>New Orphaned packages page, with a dry run before removing</li><li>New Residual configuration page, to purge packages that were removed but left their configuration</li><li>Installed apps now lists APT, Flatpak, Snap and AppImage apps, and exports a script that installs them again after a format</li><li>APT package cache listed file by file</li><li>The health rings and the weekly chart animate from zero to their values</li><li>Search box with a clear button, and a toolbar that stays in place while scrolling</li><li>Alerts and the test notification are shown on GNOME</li><li>Footer of the basic program with desktop, display protocol and version</li><li>The Languages page lists the protected languages again on systems cleaned with localepurge</li><li>The storage card no longer lists installed snaps as disks</li><li>The keyboard shortcuts keep working after the About dialog (F1) has been opened</li><li>Login screens, boot loaders and base packages are never purged, and the login screen link and the GRUB defaults are restored if a cleanup removes them</li><li>Turning the alerts off clears their settings</li><li>The user cache cleanup no longer deletes folders with live state, such as the input method socket</li></ul>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1791590400
    description:
      C: "<p>A basic program for a one-click standard cleanup, new kernels, drivers, firmware, languages and documentation pages, a safer privileged helper and a richer history.</p><ul><li>New basic program with a health ring and a single standard cleanup, next to the advanced one in the same package</li><li>New Kernels, Drivers, Firmware, Languages and Documentation pages, with risk labels and a dry run before removing packages</li><li>Privileged operations are now named and validated again as root, with one password prompt per batch</li><li>Search and sortable columns on every page, and an export of the installed apps list</li><li>Journal retention by time or by size</li><li>History receipts with kind, duration, command and result, and CSV export</li><li>Optional alerts by time or by size, chosen by the user; notification only, never cleans by itself</li><li>Keyboard shortcuts</li></ul>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1791590400
    description:
      C: "<p>First version of Soplos Sys Cleaner on Tauri 2, with a Rust backend and a Svelte frontend, replacing the Python 3 and GTK3 application.</p>"
