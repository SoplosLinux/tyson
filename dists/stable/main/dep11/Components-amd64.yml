Description:
  C: "<p>Soplos Welcome Live 2.0 provides a comprehensive welcome experience for Soplos Linux Live Environment. Built with the same modular architecture as Soplos Welcome 2.0, it offers universal desktop compatibility and professional system recovery tools.</p><ul><li>Universal desktop support: XFCE (Tyron), KDE Plasma (Tyson), GNOME (Boro)</li><li>Complete X11 and Wayland compatibility</li><li>Calamares installer integration</li><li>Advanced CHROOT recovery system with intelligent partition detection</li><li>Full BTRFS support including subvolume detection and mounting</li><li>GParted integration for professional disk management</li><li>Complete internationalization with 8 languages</li><li>GNU Gettext professional translation system</li></ul>"
  es: "<p>Soplos Welcome Live 2.0 proporciona una experiencia de bienvenida completa para el entorno Live de Soplos Linux. Construida con la misma arquitectura modular que Soplos Welcome 2.0, ofrece compatibilidad universal con escritorios y herramientas profesionales de recuperación del sistema.</p>"
  fr: "<p>Soplos Welcome Live 2.0 offre une expérience de bienvenue complète pour l'environnement Live de Soplos Linux. Construite avec la même architecture modulaire que Soplos Welcome 2.0, elle offre une compatibilité universelle avec les bureaux et des outils professionnels de récupération système.</p>"
