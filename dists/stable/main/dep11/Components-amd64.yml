  - version: "1.1.2"
    type: stable
    unix-timestamp: 1753574400
    description:
      C: "<p>Advanced partition and BTRFS subvolume detection in CHROOT. Full /home mounting support as partition or BTRFS subvolume. Universal disk detection for all hardware and VM types.</p>"
      de: "<p>Erweiterte Partitions- und BTRFS-Subvolume-Erkennung in CHROOT. Vollständige /home-Einbindungsunterstützung als Partition oder BTRFS-Subvolume. Universelle Datenträgererkennung für alle Hardware- und VM-Typen.</p>"
      es: "<p>Detección avanzada de particiones y subvolúmenes BTRFS en CHROOT. Soporte completo de montaje de /home como partición o subvolumen BTRFS. Detección universal de discos para todo tipo de hardware y VMs.</p>"
      fr: "<p>Détection avancée des partitions et des sous-volumes BTRFS dans CHROOT. Prise en charge complète du montage de /home en tant que partition ou sous-volume BTRFS. Détection universelle des disques pour tous les matériels et VM.</p>"
      it: "<p>Rilevamento avanzato di partizioni e subvolumi BTRFS in CHROOT. Supporto completo al montaggio di /home come partizione o subvolume BTRFS. Rilevamento universale dei dischi per tutti i tipi di hardware e VM.</p>"
      pt: "<p>Deteção avançada de partições e subvolumes BTRFS em CHROOT. Suporte completo de montagem de /home como partição ou subvolume BTRFS. Deteção universal de discos para todo o hardware e VMs.</p>"
      ro: "<p>Detectare avansată a partițiilor și subvolumelor BTRFS în CHROOT. Suport complet pentru montarea /home ca partiție sau subvolum BTRFS. Detectare universală a discurilor pentru orice hardware și VM.</p>"
      ru: "<p>Расширенное обнаружение разделов и подтомов BTRFS в CHROOT. Полная поддержка монтирования /home как раздела или подтома BTRFS. Универсальное обнаружение дисков для любого оборудования и VM.</p>"
