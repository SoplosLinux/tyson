Releases:
  - version: 1.0.1-8
    date: '2026-07-28'
    type: stable
    description:
      C: |-
        Fixed the NVIDIA DKMS patch being silently skipped on the open kernel modules, the ones used by Turing and newer GPUs. It is now applied to both source layouts and only when the driver actually needs it.
      es: |-
        Corregido que el parche DKMS de NVIDIA se saltara en silencio los módulos de kernel abiertos, que son los que usan las GPU Turing y posteriores. Ahora se aplica a las dos disposiciones de fuentes y solo cuando el driver lo necesita.
      fr: |-
        Correction du correctif DKMS NVIDIA ignoré silencieusement sur les modules de noyau ouverts, ceux utilisés par les GPU Turing et plus récents. Il est désormais appliqué aux deux arborescences de sources et uniquement lorsque le pilote en a besoin.
      de: |-
        Behoben: Der NVIDIA-DKMS-Patch wurde bei den offenen Kernel-Modulen stillschweigend übersprungen, also genau bei Turing-GPUs und neuer. Er wird nun auf beide Quellstrukturen angewendet und nur dann, wenn der Treiber ihn benötigt.
      pt: |-
        Corrigido o patch DKMS da NVIDIA ser ignorado em silêncio nos módulos de kernel abertos, que são os usados pelas GPU Turing e posteriores. Passa a ser aplicado às duas disposições de código e apenas quando o controlador precisa dele.
      it: |-
        Corretto il fatto che la patch DKMS di NVIDIA venisse saltata in silenzio sui moduli del kernel aperti, quelli usati dalle GPU Turing e successive. Ora viene applicata a entrambe le strutture dei sorgenti e solo quando il driver ne ha bisogno.
      ro: |-
        Corectat faptul ca patch-ul DKMS NVIDIA era omis in tacere pentru modulele de kernel deschise, cele folosite de placile Turing si mai noi. Acum se aplica ambelor structuri de surse si doar cand driverul are nevoie de el.
      ru: |-
        Исправлено: патч DKMS для NVIDIA молча пропускался для открытых модулей ядра, которые используются на Turing и новее. Теперь он применяется к обеим структурам исходников и только когда драйверу это действительно нужно.
  - version: 1.0.1-7
    date: '2026-07-26'
    type: stable
    description:
      C: |-
        Added a core count selector for compilation and profile/version filters in the Soplos Kernels tab, plus two related UI fixes.
      es: |-
        Añadido un selector de núcleos para la compilación y filtros de perfil/versión en la pestaña Kernels Soplos, más dos correcciones de interfaz relacionadas.
      fr: |-
        Ajout d'un sélecteur de cœurs pour la compilation et de filtres profil/version dans l'onglet Noyaux Soplos, plus deux corrections d'interface associées.
      de: |-
        Kernauswahl für die Kompilierung sowie Profil-/Versionsfilter im Tab Soplos-Kernel hinzugefügt, plus zwei zugehörige Oberflächenkorrekturen.
      pt: |-
        Adicionado um seletor de núcleos para a compilação e filtros de perfil/versão no separador Kernels Soplos, mais duas correções de interface relacionadas.
      it: |-
        Aggiunto un selettore di core per la compilazione e filtri profilo/versione nella scheda Kernel Soplos, più due correzioni dell'interfaccia correlate.
      ro: |-
        Adaugat un selector de nuclee pentru compilare si filtre de profil/versiune in tab-ul Kernels Soplos, plus doua corectii de interfata asociate.
      ru: |-
        Добавлен выбор количества ядер для компиляции и фильтры профиля/версии на вкладке Ядра Soplos, а также два связанных исправления интерфейса.
  - version: 1.0.1-6
    date: '2026-07-26'
    type: stable
    description:
      C: |-
        Fixed BORE/Zen patch source fallback, fixed Zen's alternate scheduler never actually building, and added Soplos-maintained fallback patches for point releases upstream hasn't caught up with yet.
      es: |-
        Corregido el sistema de fuentes alternativas de parches BORE/Zen, corregido que el scheduler alternativo de Zen nunca llegaba a compilarse, y añadidos parches de respaldo mantenidos por Soplos para versiones que upstream aún no soporta.
      fr: |-
        Correction du système de sources de secours pour les patchs BORE/Zen, correction du planificateur alternatif de Zen qui n'était en fait jamais compilé, et ajout de patchs de secours maintenus par Soplos pour les versions que l'amont n'a pas encore rattrapées.
      de: |-
        Fallback-System für BORE/Zen-Patch-Quellen behoben, behoben dass Zens alternativer Scheduler nie tatsächlich gebaut wurde, und von Soplos gepflegte Fallback-Patches für Point-Releases hinzugefügt, die Upstream noch nicht unterstützt.
      pt: |-
        Corrigido o sistema de fontes alternativas de patches BORE/Zen, corrigido o facto de o escalonador alternativo do Zen nunca chegar a ser compilado, e adicionados patches de reserva mantidos pela Soplos para versões que o upstream ainda não suporta.
      it: |-
        Corretto il sistema di fonti alternative per le patch BORE/Zen, corretto il fatto che lo scheduler alternativo di Zen non veniva mai effettivamente compilato, e aggiunte patch di riserva mantenute da Soplos per le versioni non ancora supportate dall'upstream.
      ro: |-
        Corectat sistemul de surse alternative pentru patch-urile BORE/Zen, corectat faptul ca schedulerul alternativ al Zen nu se compila niciodata cu adevarat, si adaugate patch-uri de rezerva mentinute de Soplos pentru versiunile pe care upstream nu le suporta inca.
      ru: |-
        Исправлена система резервных источников патчей BORE/Zen, исправлено то, что альтернативный планировщик Zen на деле никогда не собирался, и добавлены резервные патчи, поддерживаемые Soplos, для версий, которые апстрим пока не поддерживает.
  - version: 1.0.1-5
    date: '2026-07-22'
    type: stable
    description:
      C: |-
        Changed the "Which kernel is right for my hardware?" popup: it now also shows the detected CPU model, GPU, and total RAM alongside the supported x86-64 architecture level.
      es: |-
        Cambiada la ventana «¿Qué kernel es el adecuado para mi hardware?»: ahora también muestra el modelo de CPU detectado, la GPU y la RAM total junto al nivel de arquitectura x86-64 soportado.
      fr: |-
        Modification de la fenêtre « Quel noyau convient à mon matériel ? » : elle affiche désormais aussi le modèle de CPU détecté, le GPU et la RAM totale en plus du niveau d'architecture x86-64 pris en charge.
      de: |-
        Fenster „Welcher Kernel ist der richtige für meine Hardware?“ geändert: Es zeigt jetzt zusätzlich zum unterstützten x86-64-Architekturlevel auch das erkannte CPU-Modell, die GPU und den gesamten RAM an.
      pt: |-
        Alterada a janela «Qual kernel é adequado para o meu hardware?»: agora também mostra o modelo de CPU detetado, a GPU e a RAM total, além do nível de arquitetura x86-64 suportado.
      it: |-
        Modificata la finestra «Quale kernel è adatto al mio hardware?»: ora mostra anche il modello di CPU rilevato, la GPU e la RAM totale insieme al livello di architettura x86-64 supportato.
      ro: |-
        Modificată fereastra „Ce kernel este potrivit pentru hardware-ul meu?”: acum afișează și modelul de CPU detectat, GPU-ul și RAM-ul total, pe lângă nivelul de arhitectură x86-64 acceptat.
      ru: |-
        Изменено окно «Какое ядро подходит для моего оборудования?»: теперь оно также показывает определённую модель процессора, видеокарту и общий объём ОЗУ наряду с поддерживаемым уровнем архитектуры x86-64.
  - version: 1.0.1-4
    date: '2026-07-20'
    type: stable
    description:
      C: |-
        Changed the "Which kernel is right for my hardware?" button: it no longer opens the wiki — it now detects the highest x86-64 architecture level (v1–v4) your CPU actually supports and shows it directly in the app.
      es: |-
        Cambiado el botón «¿Qué kernel es el adecuado para mi hardware?»: ya no abre la wiki — ahora detecta el nivel de arquitectura x86-64 más alto (v1–v4) que soporta realmente tu CPU y lo muestra directamente en la aplicación.
      fr: |-
        Modification du bouton « Quel noyau convient à mon matériel ? » : il n'ouvre plus le wiki — il détecte désormais le niveau d'architecture x86-64 le plus élevé (v1–v4) réellement pris en charge par votre CPU et l'affiche directement dans l'application.
      de: |-
        Schaltfläche „Welcher Kernel ist der richtige für meine Hardware?“ geändert: Sie öffnet nicht mehr das Wiki — sie erkennt jetzt die höchste x86-64-Architekturstufe (v1–v4), die deine CPU tatsächlich unterstützt, und zeigt sie direkt in der App an.
      pt: |-
        Alterado o botão «Qual kernel é adequado para o meu hardware?»: já não abre a wiki — agora deteta o nível de arquitetura x86-64 mais alto (v1–v4) que o seu CPU realmente suporta e mostra-o diretamente na aplicação.
      it: |-
        Modificato il pulsante «Quale kernel è adatto al mio hardware?»: non apre più la wiki — ora rileva il livello di architettura x86-64 più alto (v1–v4) effettivamente supportato dalla tua CPU e lo mostra direttamente nell'app.
      ro: |-
        Modificat butonul „Ce kernel este potrivit pentru hardware-ul meu?”: nu mai deschide wiki-ul — acum detectează cel mai înalt nivel de arhitectură x86-64 (v1–v4) acceptat efectiv de CPU-ul tău și îl afișează direct în aplicație.
      ru: |-
        Изменена кнопка «Какое ядро подходит для моего оборудования?»: она больше не открывает вики — теперь она определяет максимальный уровень архитектуры x86-64 (v1–v4), реально поддерживаемый вашим процессором, и показывает его прямо в приложении.
  - version: 1.0.1-3
    date: '2026-07-20'
    type: stable
    description:
      C: Fixed selecting X3D possibly leaving an incompatible patch checked, breaking
        the build.
      es: Corregido que al seleccionar X3D pudiera quedar marcado un parche incompatible,
        rompiendo la compilación.
      fr: 'Correction : sélectionner X3D pouvait laisser un patch incompatible coché,
        cassant la compilation.'
      de: 'Behoben: Die Auswahl von X3D konnte einen inkompatiblen Patch aktiviert
        lassen und den Build beschädigen.'
      pt: 'Corrigido: selecionar X3D podia deixar um patch incompatível marcado, quebrando
        a compilação.'
      it: 'Corretto: selezionare X3D poteva lasciare selezionata una patch incompatibile,
        rompendo la build.'
      ro: 'Corectat: selectarea X3D putea lasa bifat un patch incompatibil, stricand
        compilarea.'
      ru: 'Исправлено: при выборе X3D мог оставаться отмеченным несовместимый патч,
        что ломало сборку.'
  - version: 1.0.1-2
    date: '2026-07-18'
    type: stable
    description:
      C: Fixed a build-breaking configuration bug and improved gaming hardware support.
      es: Corregido un fallo de compilación en la configuración base y mejorado el
        soporte de hardware gaming.
      fr: Correction d'un bug de configuration bloquant la compilation et amélioration
        du support matériel gaming.
      de: Ein build-blockierender Konfigurationsfehler wurde behoben und die Unterstützung
        für Gaming-Hardware verbessert.
      pt: Corrigido um erro de configuração que bloqueava a compilação e melhorado
        o suporte a hardware gaming.
      it: Corretto un bug di configurazione che bloccava la build e migliorato il
        supporto hardware gaming.
      ro: Corectata o eroare de configurare care bloca compilarea si imbunatatit suportul
        pentru hardware de gaming.
      ru: Исправлена ошибка конфигурации, блокировавшая сборку, и улучшена поддержка
        игрового оборудования.
  - version: 1.0.1-1
    date: '2026-07-16'
    type: stable
    description:
      C: Fixed Soplos Kernels tab not detecting march-level package variants and showing
        incorrect display names for them.
      es: |-
        Corregida la pestaña Kernels Soplos que no detectaba las variantes de paquete por nivel march y mostraba nombres incorrectos.
      fr: |-
        Correction de l'onglet Noyaux Soplos qui ne détectait pas les variantes de paquets par niveau march et affichait des noms incorrects.
      de: 'Behoben: Tab Soplos-Kernel erkannte March-Level-Paketvarianten nicht und
        zeigte falsche Anzeigenamen.'
      pt: |-
        Corrigido o separador Kernels Soplos que não detetava as variantes de pacote por nível march e mostrava nomes incorretos.
      it: Corretto il tab Kernel Soplos che non rilevava le varianti di pacchetto
        per livello march e mostrava nomi errati.
      ro: Corectat fila Kerneluri Soplos care nu detecta variantele de pachete dupa
        nivelul march si afisa nume incorecte.
      ru: |-
        Исправлена вкладка «Ядра Soplos»: теперь корректно определяет варианты пакетов по уровню march и отображает правильные названия.
  - version: 1.0.1
    date: '2026-07-16'
    type: stable
    description:
      C: |-
        Added x86-64 microarchitecture level selector in Stock mode, original X3D VCache scheduler patch for AMD Ryzen X3D processors, auto-generated kernel name in Stock mode, and a wiki info button in the Soplos Kernels tab.
      es: |-
        Añadido selector de nivel de arquitectura x86-64 en modo Stock, parche original del planificador X3D VCache para procesadores AMD Ryzen X3D, nombre de kernel autogenerado en modo Stock y botón de información wiki en la pestaña Kernels Soplos.
      fr: |-
        Ajout d'un sélecteur de niveau d'architecture x86-64 en mode Stock, d'un patch planificateur X3D VCache original pour les processeurs AMD Ryzen X3D, d'un nom de noyau généré automatiquement en mode Stock et d'un bouton d'information wiki dans l'onglet Noyaux Soplos.
      de: |-
        Hinzugefügt: x86-64-Architekturebene-Auswahl im Stock-Modus, originaler X3D-VCache-Scheduler-Patch für AMD-Ryzen-X3D-Prozessoren, automatisch generierter Kernel-Name im Stock-Modus und Wiki-Informationsschaltfläche im Tab Soplos-Kernel.
      pt: |-
        Adicionado seletor de nível de arquitetura x86-64 no modo Stock, patch original do escalonador X3D VCache para processadores AMD Ryzen X3D, nome de kernel gerado automaticamente no modo Stock e botão de informação wiki no separador Kernels Soplos.
      it: |-
        Aggiunto selettore del livello di architettura x86-64 in modalità Stock, patch originale dello scheduler X3D VCache per processori AMD Ryzen X3D, nome del kernel generato automaticamente in modalità Stock e pulsante informazioni wiki nella scheda Kernel Soplos.
      ro: |-
        Adaugat selector de nivel de arhitectura x86-64 in modul Stock, patch original de planificator X3D VCache pentru procesoare AMD Ryzen X3D, nume de kernel generat automat in modul Stock si buton de informatii wiki in fila Kerneluri Soplos.
      ru: |-
        Добавлены: выбор уровня архитектуры x86-64 в режиме Stock, оригинальный патч планировщика X3D VCache для процессоров AMD Ryzen X3D, автогенерация имени ядра в режиме Stock и кнопка информации о вики во вкладке «Ядра Soplos».
  - version: 1.0.0-4
    date: '2026-06-02'
    type: stable
    description:
      C: |-
        Fixed NVIDIA DKMS build failures when installing pre-built Soplos kernels on systems with NVIDIA drivers. The VMA compatibility patch is now applied before installation in the Soplos Kernels tab.
      es: |-
        Corregidos los fallos de compilación DKMS de NVIDIA al instalar kernels Soplos precompilados en sistemas con controladores NVIDIA. El parche de compatibilidad VMA ahora se aplica antes de la instalación en la pestaña Kernels Soplos.
      fr: |-
        Correction des échecs de compilation DKMS NVIDIA lors de l'installation de noyaux Soplos précompilés sur des systèmes avec des pilotes NVIDIA. Le patch de compatibilité VMA est maintenant appliqué avant l'installation dans l'onglet Noyaux Soplos.
      de: |-
        Behoben: NVIDIA DKMS-Build-Fehler beim Installieren vorkompilierter Soplos-Kernel auf Systemen mit NVIDIA-Treibern. Der VMA-Kompatibilitätspatch wird jetzt vor der Installation im Tab Soplos-Kernel angewendet.
      pt: |-
        Corrigidas falhas de compilação DKMS da NVIDIA ao instalar kernels Soplos pré-compilados em sistemas com controladores NVIDIA. O patch de compatibilidade VMA agora é aplicado antes da instalação no separador Kernels Soplos.
      it: |-
        Corretti i guasti di compilazione DKMS NVIDIA durante l'installazione di kernel Soplos precompilati su sistemi con driver NVIDIA. Il patch di compatibilità VMA viene ora applicato prima dell'installazione nella scheda Kernel Soplos.
      ro: |-
        Corectate erorile de compilare DKMS NVIDIA la instalarea kernelurilor Soplos precompilate pe sisteme cu drivere NVIDIA. Patch-ul de compatibilitate VMA este acum aplicat inainte de instalare in fila Kerneluri Soplos.
      ru: |-
        Исправлены сбои компиляции DKMS NVIDIA при установке предсобранных ядер Soplos на системах с драйверами NVIDIA. Патч совместимости VMA теперь применяется перед установкой во вкладке Ядра Soplos.
  - version: 1.0.0-3
    date: '2026-06-02'
    type: stable
    description:
      C: |-
        Fixed the Update button appearing incorrectly after updating a kernel, when the old vmlinuz was still present in /boot before reboot.
      es: |-
        Corregido el botón Actualizar que aparecía incorrectamente tras actualizar un kernel, cuando el vmlinuz antiguo aún estaba en /boot antes de reiniciar.
      fr: |-
        Correction du bouton Mettre à jour qui apparaissait incorrectement après la mise à jour d'un noyau, lorsque l'ancien vmlinuz était encore présent dans /boot avant le redémarrage.
      de: |-
        Behoben: Schaltfläche Aktualisieren erschien nach einem Kernel-Update fälschlicherweise, wenn der alte vmlinuz noch vor dem Neustart in /boot vorhanden war.
      pt: |-
        Corrigido o botão Atualizar que aparecia incorretamente após atualizar um kernel, quando o vmlinuz antigo ainda estava presente em /boot antes de reiniciar.
      it: |-
        Corretto il pulsante Aggiorna che appariva erroneamente dopo l'aggiornamento di un kernel, quando il vecchio vmlinuz era ancora presente in /boot prima del riavvio.
      ro: |-
        Corectat butonul Actualizare care aparea incorect dupa actualizarea unui kernel, cand vechiul vmlinuz era inca prezent in /boot inainte de repornire.
      ru: |-
        Исправлена кнопка «Обновить», появлявшаяся ошибочно после обновления ядра, когда старый vmlinuz ещё присутствовал в /boot до перезагрузки.
  - version: 1.0.0-2
    date: '2026-06-02'
    type: stable
    description:
      C: |-
        Fixed the Update button not appearing in the Soplos Kernels tab when a newer version was available, fixed stale package data after actions, and fixed apt-cache output parsing on non-English systems.
      es: |-
        Corregido el botón Actualizar que no aparecía en la pestaña Kernels Soplos cuando había una versión más reciente disponible, corregidos los datos desactualizados tras acciones, y corregido el análisis de la salida de apt-cache en sistemas no ingleses.
      fr: |-
        Correction du bouton Mettre à jour absent dans l'onglet Noyaux Soplos, correction des données obsolètes après actions, et correction de l'analyse de la sortie apt-cache sur les systèmes non anglophones.
      de: |-
        Behoben: Schaltfläche Aktualisieren fehlte im Tab Soplos-Kernel; veraltete Paketdaten nach Aktionen; apt-cache-Ausgabe auf nicht-englischen Systemen wurde nicht korrekt ausgewertet.
      pt: |-
        Corrigido o botão Atualizar ausente na aba Kernels Soplos, corrigidos dados desatualizados após ações, e corrigida a análise da saída do apt-cache em sistemas não ingleses.
      it: |-
        Corretto il pulsante Aggiorna assente nella scheda Kernel Soplos, corretti dati non aggiornati dopo le azioni, e corretta l'analisi dell'output di apt-cache su sistemi non in inglese.
      ro: |-
        Corectat butonul Actualizare absent in fila Kerneluri Soplos, corectate datele expirate dupa actiuni si corectata analiza rezultatelor apt-cache pe sisteme non-engleze.
      ru: |-
        Исправлена отсутствующая кнопка «Обновить» во вкладке Ядра Soplos, устаревшие данные после действий и разбор вывода apt-cache на не-английских системах.
  - version: 1.0.0-1
    date: '2026-06-02'
    type: stable
    description:
      C: |-
        Added a "Remove repository" button in the Soplos Kernels tab to remove the repository source and its GPG key without affecting already installed kernels.
      es: |-
        Se ha añadido un botón "Eliminar repositorio" en la pestaña Soplos Kernels para eliminar la fuente del repositorio y su clave GPG sin afectar a los kernels ya instalados.
      fr: |-
        Ajout d'un bouton « Supprimer le dépôt » dans l'onglet Soplos Kernels pour supprimer la source du dépôt et sa clé GPG sans affecter les noyaux déjà installés.
      de: |-
        Schaltfläche „Repository entfernen" im Tab Soplos Kernels hinzugefügt — entfernt die Repository-Quelle und den GPG-Schlüssel, ohne bereits installierte Kernel zu beeinflussen.
      pt: |-
        Adicionado um botão "Remover repositório" no separador Soplos Kernels para remover a fonte do repositório e a sua chave GPG sem afetar os kernels já instalados.
      it: |-
        Aggiunto il pulsante "Rimuovi repository" nella scheda Soplos Kernels per rimuovere la sorgente del repository e la sua chiave GPG senza influire sui kernel già installati.
      ro: |-
        Adăugat butonul „Elimină depozitul" în fila Soplos Kernels pentru a elimina sursa depozitului și cheia GPG fără a afecta kernelurile deja instalate.
      ru: |-
        Добавлена кнопка «Удалить репозиторий» во вкладке Soplos Kernels для удаления источника репозитория и его GPG-ключа без затрагивания уже установленных ядер.
  - version: 1.0.0
    date: '2026-04-05'
    type: stable
    description:
      C: |-
        Initial release of Soplos Kernel Installer with comprehensive kernel management features including PREEMPT_RT integration, source reuse, and Secure Boot support.
      es: |-
        Lanzamiento inicial del Instalador de Kernel Soplos con funciones completas de gestión de kernels, incluyendo integración de PREEMPT_RT, reutilización de código fuente y soporte para Secure Boot.
      fr: |-
        Sortie initiale de l'Installateur de Kernel Soplos avec des fonctionnalités complètes de gestion des noyaux, y compris l'intégration de PREEMPT_RT, la réutilisation du code source et le support Secure Boot.
      de: |-
        Erstveröffentlichung des Soplos Kernel-Installers mit umfassenden Kernel-Verwaltungsfunktionen, einschließlich PREEMPT_RT-Integration, Quellcode-Wiederverwendung und Secure Boot-Unterstützung.
      pt: |-
        Lançamento inicial do Instalador de Kernel Soplos com recursos abrangentes de gerenciamento de kernel, incluindo integração PREEMPT_RT, reutilização de código-fonte e suporte a Secure Boot.
      it: |-
        Rilascio iniziale dell'Installatore Kernel Soplos con funzionalità complete di gestione del kernel, inclusa l'integrazione PREEMPT_RT, il riutilizzo del sorgente e il supporto Secure Boot.
      ro: |-
        Versiunea inițială a Instalatorului de Kernel Soplos cu funcții complete de gestionare a nucleelor, inclusiv integrarea PREEMPT_RT, reutilizarea sursei și suportul Secure Boot.
      ru: |-
        Первоначальный выпуск Установщика ядра Soplos с комплексными функциями управления ядрами, включая интеграцию PREEMPT_RT, повторное использование исходного кода и поддержку Secure Boot.
