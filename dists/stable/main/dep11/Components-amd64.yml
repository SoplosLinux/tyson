        Aggiunti Brave Origin, Opera e Zen Browser alla scheda Raccomandati. Corretto il rilevamento dei driver NVIDIA: NVIDIA 550 non viene più mostrato come installato quando il 580 è attivo, e i sistemi AMD non mostrano più falsi positivi NVIDIA causati da pacchetti residui.
      ru: |-
        Добавлены Brave Origin, Opera и Zen Browser во вкладку Рекомендованных. Исправлено определение драйверов NVIDIA: NVIDIA 550 больше не отображается как установленный при активном 580, а системы AMD больше не показывают ложные отметки NVIDIA из-за остаточных пакетов.
      ro: |-
        Adăugate Brave Origin, Opera și Zen Browser în fila Recomandate. Corectată detectarea driverelor NVIDIA: NVIDIA 550 nu mai apare instalat când 580 este activ, iar sistemele AMD nu mai afișează fals pozitive NVIDIA cauzate de pachete reziduale.
      C: |-
        Added Brave Origin, Opera and Zen Browser to the Recommended tab. Fixed NVIDIA driver detection: NVIDIA 550 no longer shows as installed when 580 is active, and AMD systems no longer show false NVIDIA driver checkmarks caused by leftover packages.
