Releases:
  - version: 1.0.2-1
    date: '2026-04-17'
    type: stable
    description:
      C: |-
        Bug fix and improvement release: Snap tab redesigned with full uninstall support, improved VM guest detection for all hypervisors, kernel removal now properly regenerates initramfs and updates GRUB, and all apt-get commands replaced with apt.
      es: |-
        Versión de correcciones y mejoras: pestaña Snap rediseñada con desinstalación completa, detección mejorada de VM guest para todos los hipervisores, la eliminación de kernels regenera el initramfs y actualiza GRUB correctamente, y se reemplazó apt-get por apt.
      fr: |-
        Version de corrections et améliorations : onglet Snap repensé avec désinstallation complète, détection améliorée des VM invitées pour tous les hyperviseurs, la suppression de noyaux régénère maintenant l'initramfs et met à jour GRUB, et toutes les commandes apt-get remplacées par apt.
      de: |-
        Fehlerbehebungs- und Verbesserungsversion: Snap-Tab mit vollständiger Deinstallationsunterstützung neu gestaltet, verbesserte Gast-VM-Erkennung für alle Hypervisoren, Kernel-Entfernung generiert jetzt Initramfs neu und aktualisiert GRUB, und alle apt-get-Befehle durch apt ersetzt.
      pt: |-
        Versão de correções e melhorias: separador Snap redesenhado com suporte de desinstalação completa, deteção melhorada de VM convidada para todos os hipervisores, a remoção de kernels agora regenera o initramfs e atualiza o GRUB, e todos os comandos apt-get substituídos por apt.
      it: |-
        Versione di correzioni e miglioramenti: scheda Snap riprogettata con supporto per la disinstallazione completa, rilevamento migliorato della VM ospite per tutti gli hypervisor, la rimozione del kernel ora rigenera l'initramfs e aggiorna GRUB, e tutti i comandi apt-get sostituiti con apt.
      ro: |-
        Versiune de remedieri și îmbunătățiri: fila Snap reproiectată cu suport complet de dezinstalare, detectare îmbunătățită a VM-ului invitat pentru toți hipervizoarele, eliminarea kernelului regenerează acum initramfs și actualizează GRUB, și toate comenzile apt-get înlocuite cu apt.
      ru: |-
        Версия с исправлениями и улучшениями: вкладка Snap переработана с поддержкой полного удаления, улучшенное обнаружение гостевых ВМ для всех гипервизоров, удаление ядра теперь правильно перегенерирует initramfs и обновляет GRUB, все команды apt-get заменены на apt.
  - version: 1.0.2
    date: '2026-03-29'
    type: stable
    description:
      C: |-
        Major feature update: Installed Apps tab, Snap support, firmware sizes, selective APT cache cleanup, auto-scan on launch, GPU/KVM firmware protection and overview improvements.
      es: |-
        Actualización mayor: pestaña de Apps instaladas, soporte Snap, tamaños de firmware, limpieza selectiva de caché APT, escaneo automático al inicio, protección de firmware GPU/KVM y mejoras en el resumen.
      fr: |-
        Mise à jour majeure : onglet Applications installées, support Snap, tailles des firmwares, nettoyage sélectif du cache APT, analyse automatique au démarrage, protection des firmwares GPU/KVM et améliorations de l'aperçu.
      de: |-
        Großes Funktionsupdate: Tab für installierte Apps, Snap-Unterstützung, Firmware-Größen, selektive APT-Cache-Bereinigung, automatischer Scan beim Start, GPU/KVM-Firmware-Schutz und Übersichtsverbesserungen.
      pt: |-
        Atualização maior: separador de Apps instaladas, suporte a Snap, tamanhos de firmware, limpeza seletiva da cache APT, análise automática ao iniciar, proteção de firmware GPU/KVM e melhorias no resumo.
      it: |-
        Aggiornamento importante: scheda App installate, supporto Snap, dimensioni firmware, pulizia selettiva della cache APT, scansione automatica all'avvio, protezione firmware GPU/KVM e miglioramenti alla panoramica.
      ro: |-
        Actualizare majoră: filă Aplicații instalate, suport Snap, dimensiuni firmware, curățare selectivă a cache-ului APT, scanare automată la pornire, protecție firmware GPU/KVM și îmbunătățiri ale rezumatului.
      ru: |-
        Крупное обновление: вкладка установленных приложений, поддержка Snap, размеры прошивок, выборочная очистка кэша APT, автосканирование при запуске, защита прошивок GPU/KVM и улучшения обзора.
  - version: 1.0.1
    date: '2026-03-25'
    type: stable
    description:
      C: Major update introducing Dual-Layer Scanning (User vs Root modes) to eliminate
        password prompts on startup.
      es: |-
        Actualización mayor que introduce el Escaneo de Doble Capa (Usuario vs Root) para eliminar peticiones de contraseña al inicio.
      fr: |-
        Mise à jour majeure introduisant l'Analyse à Double Couche (Utilisateur vs Root) pour éliminer les invites de mot de passe au démarrage.
      de: Wichtiges Update mit Zweischicht-Scan (Benutzer- vs. Root-Modus) zur Vermeidung
        von Passwortabfragen beim Start.
      pt: |-
        Grande atualização introduzindo a Verificação de Dupla Camada (modos de Utilizador vs Root) para eliminar pedidos de palavra-passe no arranque.
      it: |-
        Importante aggiornamento che introduce la Scansione a Doppio Strato (Utente vs Root) per eliminare le richieste di password all'avvio.
      ro: |-
        Actualizare majoră care introduce scanarea pe Două Niveluri (Utilizator vs Root) pentru eliminarea solicitărilor de parolă la pornire.
      ru: |-
        Крупное обновление, представляющее Двухслойное Сканирование (режимы Пользователя и Root) для устранения запросов пароля при запуске.
  - version: 1.0.0-2
    date: '2026-03-20'
    type: stable
    description:
      C: |-
        Fixed About dialog credits panel on KDE: the credits area now displays with an opaque dark background and square corners instead of transparent or rounded-corner artifacts. App icon standardized to 48×48 pixels.
      es: |-
        Corregido el panel de créditos del diálogo Acerca de en KDE: el área de créditos ahora se muestra con fondo oscuro opaco y esquinas rectas en lugar de artefactos transparentes o con esquinas redondeadas. Icono estandarizado a 48×48 píxeles.
      fr: |-
        Correction du panneau de crédits du dialogue À propos sous KDE : la zone de crédits s'affiche maintenant avec un fond sombre opaque et des coins carrés au lieu d'artefacts transparents ou arrondis. Icône standardisée à 48×48 pixels.
      pt: |-
        Corrigido o painel de créditos do diálogo Sobre no KDE: a área de créditos agora é exibida com fundo escuro opaco e cantos retos em vez de artefatos transparentes ou com cantos arredondados. Ícone padronizado para 48×48 pixels.
      de: |-
        Korrektur des Kredit-Panels im Über-Dialog unter KDE: Der Kredit-Bereich wird jetzt mit opakem dunklem Hintergrund und eckigen Ecken dargestellt statt transparenter oder gerundeter Artefakte. App-Symbol auf 48×48 Pixel standardisiert.
      it: |-
        Corretto il pannello crediti della finestra Info su KDE: l'area dei crediti ora mostra uno sfondo scuro opaco e angoli quadrati invece di artefatti trasparenti o con angoli arrotondati. Icona standardizzata a 48×48 pixel.
      ru: |-
        Исправлена панель авторов в диалоге «О программе» в KDE: область авторов теперь отображается с непрозрачным тёмным фоном и прямыми углами вместо прозрачных или скруглённых артефактов. Значок стандартизирован до 48×48 пикселей.
      ro: |-
        Corectat panoul de credite din dialogul Despre pe KDE: zona de credite se afișează acum cu fundal întunecat opac și colțuri drepte în loc de artefacte transparente sau cu colțuri rotunjite. Pictogramă standardizată la 48×48 pixeli.
  - version: 1.0.0-1
    date: '2026-03-20'
    type: stable
    description:
      C: Initial release of Soplos Sys Cleaner.
      es: Lanzamiento inicial de Soplos Sys Cleaner.
      fr: Sortie initiale de Soplos Sys Cleaner.
      de: Erste Version von Soplos Sys Cleaner.
      pt: Lançamento inicial do Soplos Sys Cleaner.
      it: Rilascio iniziale di Soplos Sys Cleaner.
