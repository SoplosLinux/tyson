Releases:
  - version: "3.0.0"
    type: stable
    unix-timestamp: 1794787200
    description:
      C: "<p>First stable release. An installed application can be opened from its page in the store, with the new Open button next to Uninstall.</p>"
  - version: "3.0.1-5-beta"
    type: stable
    unix-timestamp: 1794614400
    description:
      C: "<p>The NVIDIA drivers work with the three boot loaders of Soplos Linux Installer, GRUB, Limine and systemd-boot. The NVIDIA 620 branch replaces 590 and 610, and the GTX 1650 and 1660 get it instead of nouveau.</p>"
  - version: "3.0.1-4-beta"
    type: stable
    unix-timestamp: 1794441600
    description:
      C: "<p>Removing LibreOffice from Installed apps removes the whole suite, and not only its metapackage, which left the rest installed.</p>"
  - version: "3.0.1-3-beta"
    type: stable
    unix-timestamp: 1793750400
    description:
      C: "<p>New 2-in-1 laptops page in Drivers, no more web engine menu on right click, and a revised manual page.</p>"
  - version: "3.0.1-2-beta"
    type: stable
    unix-timestamp: 1793232000
    description:
      C: "<p>The window no longer has the frame of the system: it is a card with rounded corners and its own minimize, maximize and close buttons.</p>"
  - version: "3.0.1-1-beta"
    type: stable
    unix-timestamp: 1793145600
    description:
      C: "<p>New application icon, new hero image and new screenshots, taken with the interface in English.</p>"
  - version: "3.0.1-beta"
    type: stable
    unix-timestamp: 1793145600
    description:
      C: "<p>Updates held back by apt because of their dependencies are no longer listed, and a package that needs a renamed library replaced is now shown, with what goes out and what comes in, and can be installed.</p><p>Each update button has its own progress line, read from what apt reports for that package, and the bar with the actions stays at the top of a long list.</p><p>The home page and the banners now take apps from every source you have, APT, Flatpak and Snap, and nothing from Flathub or the Snap Store when that source is not installed.</p><p>New switches in Settings to show or hide Flatpak, Snap and AppImage, the Featured, Popular and Trending sections, and the Drivers section.</p><p>The Flatpak install scope is only asked when Flathub is set up for both the user and the system; with only one of them, the app is installed there without asking.</p>"
  - version: "3.0.0-9-beta"
    type: stable
    unix-timestamp: 1792800000
    description:
      C: "<p>Settings flows into two columns on a wide window and the page of a package file uses the whole width, so a maximized window is no longer left half empty.</p>"
  - version: "3.0.0-8-beta"
    type: stable
    unix-timestamp: 1792800000
    description:
      C: "<p>Updates: the button of each app says what is happening (Preparing, Downloading, Installing) and a thin bar under its row shows how far it is, also for \"Update all\". Apps waiting for their turn say so, and the button no longer goes back to \"Update\" before the page says everything is up to date.</p><p>Drivers: new \"Apple Mac\" section in the Laptops page, with mbpfan and the FaceTime HD camera driver (a community project, experimental).</p>"
  - version: "3.0.0-7-beta"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>The window follows the light or dark theme of the desktop (Xfce, Plasma and GNOME), with an Appearance setting to choose Automatic, Light or Dark.</p><p>One output log for everything an update runs, with a fixed height and its own scroll, instead of losing the output of the first job when the next one starts.</p><p>Drivers: international pages for Epson, Brother and Canon, and Wacom unified in a single card.</p>"
  - version: "3.0.0-6-beta"
    type: stable
    unix-timestamp: 1792713600
    description:
      C: "<p>Drivers: every maker now points to its official page for Linux, checked one by one, in the language of the visitor's country.</p><p>Links to drivers kept by the community, such as AVerMedia, Parblo and ASUS, are marked as such on their card.</p><p>New: Slimbook, Ralink, and Scarlett for Focusrite audio interfaces. Official logos for the makers and tools of every page.</p><p>Makers that have no Linux driver were removed from the pages.</p>"
  - version: "3.0.0-5-beta"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>Drivers now has all fifteen categories: graphics, printers, scanners, graphics tablets, labels, capture cards, gaming peripherals, Wi-Fi and Bluetooth, laptops, pro audio, network, fingerprint readers, UPS, RGB and cooling, and virtual machines, each with the official logo of its makers and tools.</p><p>More graphics tools: ROCm for AMD, oneAPI and compute for Intel, and the CUDA Toolkit, installed from their official repositories.</p><p>The Updates page now looks for real every time it opens, and the background check refreshes the package lists first, so the notification and the list agree.</p><p>The Categories page uses the same cards as Drivers.</p>"
  - version: "3.0.0-4-beta"
    type: stable
    unix-timestamp: 1792627200
    description:
      C: "<p>New Drivers page: category cards, with graphics ready first. Your graphics card in a hero that moves through NVIDIA, AMD, Intel and virtual machine tools, with a section per brand.</p><p>NVIDIA branches with the kernel 7.x patches, CUDA Toolkit, AMD ROCm from Debian, and Intel compute, oneVPL and oneAPI stacks from their official repositories.</p><p>AppImage updates through Soplos AppImage Manager, and a single stored result shared by the Updates page and the tray notifier.</p><p>Firmware updates switch in Settings, with a time limit so an unreachable LVFS cannot hold the checks.</p>"
  - version: "3.0.0-3-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Direct update check on Updates tab mount with permanent top header and unified layout.</p><p>Full two-way synchronization between Store settings and systemd user timer (soplos-store-updates.timer).</p><p>Hourly update check option added across Settings and systemd timer integration.</p><p>Corrected JobAction types in TypeScript to support firmware LVFS testing channels.</p>"
  - version: "3.0.0-2-beta"
    type: stable
    unix-timestamp: 1792368000
    description:
      C: "<p>Unified updates view with streamlined states, removing layout duplication and jumpiness.</p><p>Stabilized batch uninstall in Installed tab with dedicated selection mode and card tap selection.</p><p>Full 8-language internationalization across desktop launchers and AppStream metadata.</p><p>Complete documentation with manual page (soplos-store.1) and 9-screenshot application showcase.</p>"
  - version: "3.0.0-1-beta"
    type: stable
    unix-timestamp: 1792281600
    description:
      C: "<p>Passwordless APT refresh via Polkit, 1-minute startup timer, and reliable notifications across Xfce, Plasma, and GNOME.</p><p>Multi-selection checkboxes and batch uninstallation in Installed tab across mixed package sources.</p><p>Full AppImage support: discovery in Installed tab and direct installation of .AppImage files into ~/AppImages with desktop integration.</p><p>Unified LibreOffice suite display and robust desktop file discovery for installed GUI applications.</p>"
  - version: "3.0.0-beta"
    type: stable
    unix-timestamp: 1792195200
    description:
      C: "<p>Renamed from Soplos Software Center to Soplos Store.</p><p>Firmware updates through fwupd, subcategories, a fuller app page and a systemd timer for the update checks.</p>"
  - version: "3.0.0-alpha"
    type: stable
    unix-timestamp: 1792108800
    description:
      C: "<p>First release of Soplos Store, built with Tauri 2, a Rust backend and a Svelte frontend.</p><p>Explore carousels, a catalog built from Debian's AppStream metadata, Flathub and the Snap Store with ratings from ODRS, search, categories, install, uninstall and update for APT, Flatpak and Snap, an update notifier and settings.</p>"
ContentRating:
  oars-1.1: {}
